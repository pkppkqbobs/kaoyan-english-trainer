</style></head><body><aside class="notice" role="note" style="max-width:860px;margin:16px auto;padding:12px"><strong>真题来源订正</strong><p>2011 Text 2 第29题正确答案为A。此前B答案及据此给你的错误诊断已撤回；你的首次选项未记录，不补算对错。本轮的观点/事实题仍可练习，但不能用孤立句规则排除原文另有行为证据的推断。</p><p>2011 Part B 顺序为G→B→D→E→A→C→F。G→B需合看人物引入与主题展开；B→D需结合通识课程设计困难、回指和固定E段。His、Menand或humanities重复本身不能证明唯一相邻；平行判断与结尾信号也应放回全篇核对。</p></aside><main id="app"></main><p style="max-width:900px;margin:auto;padding:0 20px"><a href="./article-reviews.html">历史文章复盘</a></p><noscript>请启用浏览器JavaScript后做题。</noscript>
<script>window.REVIEW_DATA={"date": "2026-10-12", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2012 英语一 Part B（7选5） · 本篇问题 2 题 + 历史弱项 6 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-10-12-2012-partb", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本篇复盘结果只有在你点击“提交结果到 GitHub”并在 GitHub 再点 Submit new issue 后，才会进入后续间隔复习。", "questions": [{"id": "process-stage-bridge-warning-b", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 55, "target": "单次发现 vs 跨来源确认", "skill": "过程终点与条件的角色识别", "q": "A driver first reports cracks on a bridge, but the warning is not issued to the whole region until engineers compare photographs, inspect the structure, and confirm the hazard. What is required for the initial report to become an official warning?", "o": ["A more vivid description from the first driver.", "Agreement that the first driver deserves public credit.", "Public enthusiasm for an alarming photograph.", "Independent assessment and confirmation of the reported danger."], "a": 3, "exp": {"trans": "司机最先报告桥面裂缝，但直到工程师比对照片、检查结构并确认危险，地区警报才正式发布。", "structure": "A driver + reports + cracks引入起点；the warning + is not issued ... until engineers compare, inspect, and confirm，用not...until表示形成正式警报的必要过程。", "other": "crack 裂缝；structure 结构；hazard 危险；issue a warning 发布警报。", "meaning": "个人首次报告不等于正式被认可；由多个步骤进行独立评估并确认，才使主张具有可推广的效力。注意题目问required而非who noticed it first。", "rest": "报告更生动不能替代核验；给报告人荣誉不是警报成立条件；公众情绪不能替代工程检查。"}, "context_id": "context:process-stage-bridge-warning-b"}, {"id": "point-waiting", "family": "point", "introduced": "2026-09-29", "target": "point / there is no point in doing", "skill": "point 熟词生义", "q": "With the last bus already gone, there was no point in waiting at the stop.\npoint 在这里最接近：", "o": ["联合会", "尖端", "分数", "意义、用处"], "a": 3, "exp": {"trans": "末班车已经开走了，继续在车站等也没有意义。", "structure": "主干：there was no point in waiting at the stop，是there be存在句。With the last bus already gone补充原因背景。简单句The last bus was already gone → 去掉was，用with + 名词 + 状态补语压缩。", "other": "last bus 末班车；already 已经；be gone 已经离开、不在了；bus stop 公交站。", "meaning": "there is no point in doing sth：做某事没有意义；point不是物理位置上的点。", "rest": "联合会常用federation/association，与句意无关。尖端可用the point of a needle，必须是具体物体的尖端。分数可说score three points，但这里不是计分语境。"}, "context_id": "context:point-waiting"}, {"id": "sentence-link-soil-sensor-a", "family": "paragraph-order-anaphora", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "话题相同不等于双向衔接", "skill": "回指 + 承上启下", "q": "前文：Local farmers and engineers spent three years designing a sensor that could measure soil moisture, temperature and rainfall.\n【空缺】\n后文：Today this linked network lets dozens of villages compare conditions in real time.\n哪一句最适合填入？", "o": ["A photo-sharing app lets farmers combine pictures and short videos into attractive posts.", "They then connected the sensors to a shared network that automatically exchanged readings.", "Rainfall is usually lower in the eastern villages than in the western ones.", "Some local farmers prefer older methods of recording the weather."], "a": 1, "exp": {"trans": "前文介绍农民和工程师共同开发传感器；正确衔接句说明他们随后把传感器接入共享网络；后文再说这个联网系统让许多村庄实时比较天气条件。", "structure": "前文Local farmers and engineers是复数施动者；正确句They回指这群人，the sensors回指前面的sensor，a shared network引出后文this linked network。", "other": "soil moisture 土壤湿度；sensor 传感器；reading 测量读数；in real time 实时。", "meaning": "至少核对两侧：前文的人和物在候选句中有没有明确承接？候选句又是否为后文this linked network提供来源？泛泛谈某种应用的主题关联比这种双向回指弱。", "rest": "照片分享应用也属于农业数字技术，但没有承接开发传感器的人，也不能解释this linked network；降雨分布和传统记录方式均缺少双向承接链。"}, "context_id": "context:sentence-link-soil-sensor-a"}, {"id": "example-farmers-support-trial-b", "family": "example-claim-scope", "introduced": "2026-10-11", "published_on": "2026-10-11", "budget": 60, "target": "例子同样可以说明支持改革", "skill": "不能靠团体行动推固定结论", "q": "An article argues that locally organized groups can sometimes help an unpopular policy get started. It describes a farmers' cooperative that trained volunteers and persuaded members to test a water-saving system, helping the trial begin on schedule. What is the role of this example?", "o": ["It proves every member had opposed water conservation before joining.", "It shows cooperatives necessarily control the national government.", "It establishes that all unpopular policies eventually succeed.", "It supports the claim that organized groups can facilitate policy implementation."], "a": 3, "exp": {"trans": "文章认为地方组织有时能帮助不受欢迎的政策启动，随后举农民合作社培训志愿者、推动成员试用节水系统，使试验按时开展的例子。这个例子是在支持‘团体也能帮助政策落实’。", "structure": "An article argues + that从句是主张；It describes...引出实例；helping the trial begin是实例中的实际结果。", "other": "cooperative 合作社；facilitate 促进；implementation 落实；trial 试行。", "meaning": "例子支持的结论可以是促进改革，也可以是阻碍改革，取决于前后文。不要机械地把‘团体动员’与‘妨碍改革’绑定。", "rest": "成员加入前态度没有交代；合作社对国家政府的控制与本文无关；一次成功试行不能保证所有政策最终成功。"}, "context_id": "context:example-farmers-support-trial-b"}, {"id": "with-bread-cooling", "family": "with", "introduced": null, "budget": 60, "target": "with + 名词 + 分词", "skill": "with + 名词 + 后置成分", "q": "The bakery opened at six, with warm bread cooling on the counter.\nwith 后面的结构主要起什么作用？", "o": ["补充开门时伴随的状态", "引出老板的直接引语", "说明开门的唯一目的", "充当opened的直接宾语"], "a": 0, "exp": {"trans": "面包店六点开门，当时温热的面包正在柜台上晾凉。", "structure": "主干：The bakery（主语）+ opened（不及物谓语）+ at six（时间状语）。原始简单句Warm bread was cooling on the counter → 去掉was，用with引出：with warm bread cooling on the counter。warm bread是with结构的逻辑主语，cooling是与之构成主动关系的现在分词。", "other": "bakery 面包店；cool 晾凉、变凉；counter 柜台；warm 温热的。", "meaning": "with复合结构可以补充主句发生时的伴随状态；它不是新的独立主句。", "rest": "直接引语通常由say等动词引出，此处没有任何说话行为。目的常用to do或in order to，原句只描写伴随状态。opened在本句是不及物用法，with短语不是其直接宾语。"}, "context_id": "with-simultaneous-ing"}, {"id": "sentence-link-museum-experiment-b", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 65, "target": "单向展示→反向参与→后文设问", "skill": "双向篇章钩子", "q": "前文：At the old science museum, visitors watched a machine demonstrate each experiment. The most demanding thing they could do was press the Start button.\n【空缺】\n后文：What counts as taking part in an experiment? Visitors must be able to change a variable and compare the results.\n哪一句最适合？", "o": ["The museum's historical building has been repaired many times.", "The simple controls made the demonstrations easier for young children to watch.", "Every machine had a colorful label describing its inventor.", "A redesigned exhibition could reverse this passive arrangement by inviting visitors to conduct their own tests."], "a": 3, "exp": {"trans": "旧科技馆由机器单向演示，观众几乎只能按开始按钮。正确句引出新展览如何扭转这种被动观看，让观众亲自试验；后文再问什么才是真正参与实验。", "structure": "前文visitors watched与could do ... press Start显示参与程度极低；正确句reverse this passive arrangement回指前文整体模式，conduct their own tests引出后文taking part in an experiment和change a variable。", "other": "demanding 费力的/要求高的；demonstration 演示；variable 变量；conduct a test 进行试验。", "meaning": "最有力的证据是双向：反转被动的安排承接前文，主动测试又引出后文讨论。‘最难任务只是按按钮’在语境中揭示参与不足，不是对设备的夸赞。", "rest": "场馆维修、标签介绍、控制简单都不能完成被动到主动的论证转折；即使表面上与展览有关，也不构成后文提问的直接来源。"}, "context_id": "context:sentence-link-museum-experiment-b"}, {"id": "viewpoint-diet-b", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "孤立建议 / 量词范围", "skill": "区分规范与事实，结合完整证据", "q": "The article states: “The old rule of thumb was that athletes should avoid strength training during the season.” What can you safely conclude?", "o": ["No athlete ever lifted weights during the season.", "There was once a general recommendation against in-season strength training.", "Strength training was banned by every sports federation.", "Athletes who trained during the season were always injured."], "a": 1, "exp": {"trans": "文章说：“过去的经验法则认为，运动员赛季期间应避免力量训练。”可以确认曾存在这种一般建议；句子没有说明建议来自哪一群人，也没有统计谁实际遵守。", "structure": "主干：The old rule of thumb + was + that从句。that athletes should avoid...说明规则/建议内容。should表达规范性判断，而不是历史行为统计。", "other": "rule of thumb 经验法则；athlete 运动员；strength training 力量训练；in-season 赛季期间的。", "meaning": "本题只给出一条观念或建议，不能据此推出所有人都遵守；若完整文章另有实际行为证据，仍可以作相应行为推断。2011年第29题的A不能被这条孤立句原则排除。", "rest": "No athlete ever把建议扩大成所有运动员的实际行为；every sports federation加入全部协会的禁令；always injured把风险判断改成必然受伤。一般建议的改写保持了原文范围，没有擅自补出教练这一主体。"}, "source_diagnosis": {"exam": "2011-english1", "question": 29, "status": "withdrawn", "reason": "旧的29题B答案及据此推断用户错误的诊断已撤回；本题保留为独立的证据范围练习。"}, "context_id": "context:viewpoint-diet-b"}, {"id": "scope-role-device-study-b", "family": "scope-role-match", "introduced": "2026-10-07", "published_on": "2026-10-07", "budget": 55, "target": "并列信息 / 主语对象", "skill": "正确选项可对应并列句一侧", "q": "A critic writes: “The study gives a detailed history of the device but offers little investigation of the failures reported in cold weather.” Two sentences later: “The device’s clearest flaw is that its battery loses capacity after repeated freezing.” What does the study fail to do?", "o": ["provide any historical background", "investigate the cold-weather failures sufficiently", "prevent the battery from losing capacity", "make the device work indefinitely in freezing conditions"], "a": 1, "exp": {"trans": "评论者说研究对设备历史讲得很详细，但对寒冷天气中的故障调查不足。后面说设备本身最明显的缺陷是反复结冰后电池容量下降。题目问study，因此答案是调查不足。", "structure": "but连接两个对study的评价：history详细，failure investigation不足；后句The device’s clearest flaw把主语切到device。", "other": "capacity 容量；freezing 冰冻环境；investigation 调查；critic 评论者。", "meaning": "并列句里一半信息就可以被题目抽出来做同义替换。不要因为答案没同时复述history和failure两侧就排除。", "rest": "“provide any historical background”与detailed history相反；要求study去prevent battery loss或让device indefinitely work in freezing conditions，都是把研究报告与设备本身的职责混在一起。"}, "context_id": "context:scope-role-device-study-b"}], "retry": {"process-stage-role": [{"id": "process-stage-shelter-approval-a", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 55, "target": "个人估计 vs 集体验证", "skill": "区分主张起点和取得认可所需条件", "q": "An analyst estimates that the city has room for 4,000 people in emergency shelters. Officials will use this figure for evacuation plans only after independent teams verify the counts and agree on a common estimate. What makes the figure suitable for official planning?", "o": ["The analyst's personal familiarity with the shelters.", "Verification and agreement across independent teams.", "The public release of a large numerical estimate.", "The analyst's decision to avoid revising the original number."], "a": 1, "exp": {"trans": "一位分析员估计城市应急避难所可容纳4000人；只有独立团队核查数据并就统一估计达成一致，政府才会在疏散计划中采用这一数字。", "structure": "An analyst + estimates + that从句提出最初主张；Officials + will use + this figure ... only after ...，only after指出主张转化为官方依据所需的条件。", "other": "emergency shelter 应急避难所；evacuation 疏散；estimate 估计；verify 核验。", "meaning": "题干问的是让一项初步主张获得认可所需要的机制。个人估计是起点，独立团队核查与达成一致是条件；不能因为看到analyst就选个人经验。", "rest": "个人熟悉情况只能解释估计如何产生；数字公开和规模大都不能自动证明可靠；拒绝修订反而与核查机制相冲突。"}, "context_id": "context:process-stage-shelter-approval-a"}], "point": [{"id": "legacy-miss-point", "source": "today", "skill": "miss the point / point", "target": "miss the point / point", "q": "The committee spent twenty minutes arguing about the font on the warning sign, while the real issue was whether the bridge was safe. They were clearly ___.", "o": ["missing the point", "making a point", "reaching the point", "pointing out"], "a": 0, "diag": {"1": "make a point 常表示“提出观点/特意强调”，这里强调的是没抓住真正问题。", "2": "reach the point 需要具体语境，如 reach the point where...，不能表达“没抓住重点”。", "3": "point out 通常后接宾语，表示“指出”；这里既不合结构也不合语义。"}, "exp": {"trans": "委员会花了二十分钟争论警示牌的字体，而真正的问题是这座桥是否安全。他们显然没有抓住重点。", "structure": "第一句：The committee（主语）+ spent（谓语）+ twenty minutes（宾语）；arguing...说明时间花在何事上。while连接对比；whether the bridge was safe作表语从句。第二句：They（主语）+ were missing（现在进行时谓语）+ the point（宾语）。", "other": "committee 委员会；warning sign 警示牌；issue 问题/争议点；safe 安全的。", "meaning": "miss the point = 没抓住重点、没理解关键。point 在这里是“要点/关键”，不是“节点”。", "rest": "make a point = 提出/强调观点；reach the point = 达到某个阶段/程度；point out = 指出某事。只有 missing the point（没抓住重点）符合他们纠结字体却忽视桥梁安全的语境。"}, "family": "point", "introduced": "2026-09-29", "budget": 35, "context_id": "surface-detail-miss-point"}, {"id": "point-joke", "family": "point", "introduced": "2026-09-29", "target": "miss the point", "skill": "miss the point / point", "q": "Even after I explained the joke twice, my brother still missed the point.\nmissed the point 在这里表示什么？", "o": ["仍然怀念以前的笑话", "仍然没明白笑话的关键", "忘记了一个标点符号", "没赶上兄弟聚会"], "a": 1, "exp": {"trans": "即使我把这个笑话解释了两遍，我弟弟仍然没有明白其中的关键。", "structure": "主句：my brother（主语）+ missed（谓语）+ the point（宾语）。after从句：I + explained + the joke；twice修饰explained。even强调即便已经解释过，结果仍如此。", "other": "joke 笑话；twice 两次；still 仍然；explain 解释。", "meaning": "miss the point整体表示没领会关键、没明白意思，不能把miss机械地译成怀念。", "rest": "miss sb可表示想念某人，但miss the point不是这一义项。标点符号一般是punctuation mark，不是这里的point。miss a meeting可表示错过聚会，但原句没有meeting；brother是主语，不是被错过的活动。"}, "context_id": "context:point-joke"}, {"id": "point-timetable-argument", "family": "point", "introduced": "2026-09-29", "published_on": "2026-10-05", "budget": 35, "target": "have a point", "skill": "miss the point / point", "q": "“Residents have a point: the evening bus reaches the station after the last train has left.” What does have a point convey?", "o": ["居民的意见有道理，时刻表提供了理由。", "居民已经同意公交运营方的安排。", "公交晚到导致火车晚点。", "居民指出了一个新的候车地点。"], "a": 0, "exp": {"trans": "“居民说得有道理：晚班公交抵达车站时，末班火车已经离开了。”问题问have a point表达什么。", "structure": "Residents是主语，have是谓语，a point是宾语。冒号后的the evening bus + reaches + the station给出理由；after从句的has left表示火车先已离开。", "other": "resident 居民；station 车站；the last train 末班火车；timetable 时刻表。", "meaning": "have a point表示某人的意见有道理或值得考虑。这里肯定的是意见所据的理由，不是找到一个地点；与miss the point不同，这次是抓到了有效理由。", "rest": "“同意运营方”加入了原文没有的立场，且解释的是时刻衔接不便。“导致火车晚点”倒置了时间信息：火车已走，并未晚点。“新的候车地点”把抽象的意见或道理误当具体地点。"}, "context_id": "context:point-timetable-argument"}], "paragraph-order-anaphora": [{"id": "paragraph-order-anaphora-course-a", "family": "paragraph-order-anaphora", "introduced": "2026-10-04", "target": "段首回指 / such courses", "skill": "排序题回指链", "budget": 55, "q": "前一段结尾：Several departments agree that first-year students need a common research course, but they cannot agree on what the course should include.\n下面哪一段最适合紧接其后？", "o": ["One reason such a course is hard to design is that each department defines research differently.", "Professor Li published her first article in 2008 and later moved abroad.", "Meanwhile, graduate salaries have risen in several unrelated industries.", "The university library was renovated before the new president arrived."], "a": 0, "exp": {"trans": "前文说多个院系同意开设共同研究课程，却无法就课程内容达成一致。最自然的下一段是：这种课程之所以难设计，一个原因是各院系对“研究”的定义不同。", "structure": "前段核心名词是a common research course / the course。正确后段以such a course回指这个已经出现的课程，再用One reason解释前文的困难。这里such不是凭空引入新对象。", "other": "department 院系；first-year student 大一学生；define 定义；include 包含。", "meaning": "such a course需结合前文课程对象、无法就内容达成一致与后文原因解释来判断；有回指不等于必然紧邻，还需核对其他候选和篇章位置。", "rest": "Professor Li引入新人物，没有承接course；graduate salaries换话题；library renovation也没有任何回指或因果连接。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-anaphora-course-a"}, {"id": "paragraph-order-anaphora-separation-b", "family": "paragraph-order-anaphora", "introduced": "2026-10-04", "target": "this separation / 先行关系核对", "skill": "排序题指代衔接", "budget": 55, "q": "前一段：The warehouse stores chilled goods in one area and dry goods in another to keep them separate.\n哪一句最自然地承接这一安排？", "o": ["This separation also helps staff choose the right storage conditions.", "These teachers were born in several different countries.", "Such salaries are difficult to compare across cities.", "That book was translated into three languages."], "a": 0, "exp": {"trans": "前文说仓库把冷藏货物和干货分区存放。最自然的衔接是：这种分开存放也有助于员工选择合适的储存条件。", "structure": "The warehouse + stores + chilled goods / dry goods，两个地点与keep them separate明确建立分离关系。This separation把这个关系名词化并回指，also再补充该安排的作用。", "other": "warehouse 仓库；chilled 冷藏的；dry goods 干货；storage conditions 储存条件。", "meaning": "在给定候选中，this separation有明确先行关系，另外几个指示词没有相应对象。这是本题的充分比较证据；不能推广成所有排序题都有唯一代词连接。", "rest": "These teachers需要前文先出现teachers；Such salaries需要先出现salary；That book需要先出现某本书，三者在给定前文中都没有先行对象。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-anaphora-separation-b"}, {"id": "paragraph-anaphora-map-representatives", "family": "paragraph-order-anaphora", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 55, "target": "段落回指 / 竞争先行项", "skill": "排序题回指链", "q": "段P：The coordinators sent a draft map to the two resident representatives. The other residents received a short notice. Neither coordinator could attend the meeting.\n段Q：They brought their copies of the draft map to the meeting and proposed changes.\nQ中的They最合理地指谁？", "o": ["The representatives: they received the draft map, and the coordinators were absent.", "The other residents: they are the latest group mentioned before the coordinators.", "The coordinators: they had sent the map, so they must have presented it.", "The representatives and coordinators together: both groups worked on the plan."], "a": 0, "exp": {"trans": "协调员把地图草稿发给两名居民代表，其他居民只收到简短通知；两名协调员都不能参会。下一段说他们带着各自的地图草稿参会并提出修改。They最合理地指居民代表。", "structure": "P中The coordinators + sent + a draft map + to the representatives。The other residents + received + a notice。Neither coordinator + could attend为否定事实。Q的They + brought + their copies并与proposed并列，地图副本和参会事实共同锁定代表。", "other": "coordinator 协调员；representative 代表；draft map 地图草稿；propose changes 提出修改。", "meaning": "这里不能只按最近的复数名词选先行项。要联合“谁收到地图”“谁能参会”判断；同一主题的协调员并不因此与They相同。", "rest": "The other residents只收到notice，未建立其地图副本；The coordinators虽然发送地图，却明确不能到场，must have presented偷换了行为；两组一起参会与Neither coordinator could attend矛盾。"}, "context_id": "context:paragraph-anaphora-map-representatives"}, {"id": "sentence-link-train-timetable-b", "family": "paragraph-order-anaphora", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "指示表达与所指关系", "skill": "过程承接 + This lack of coordination", "q": "前文：The regional train and bus operators publish separate schedules. Passengers often miss a connection when one service runs late.\n【空缺】\n后文：This lack of coordination persuaded the council to introduce a common timetable.\n哪一句最自然？", "o": ["The operators bought more comfortable seats for several long-distance services.", "Mobile apps help tourists discover nearby restaurants and shops.", "Neither operator adjusts its departure times when the other's service is delayed.", "The council's new office opened beside the railway station last summer."], "a": 2, "exp": {"trans": "前文指出火车和公交时刻表各自独立，乘客因此误车；正确句补充双方遇到延误也不调整衔接班次；后文的this lack of coordination便有明确指代对象。", "structure": "Neither operator是主语，adjusts是谓语；when从句补充触发条件。后文This lack of coordination概括了这种双方未协调的行为。", "other": "timetable 时刻表；connection 换乘衔接；departure time 发车时间；adjust 调整。", "meaning": "这种题不是谁的主题词多谁正确，而是候选句是否构成后文this/these抽象名词可总结的具体事实，并与前文的矛盾同向。", "rest": "座椅改善和附近商店虽与交通有关，却无法解释协调缺失；办公室搬迁也不构成换乘失误的直接原因。"}, "context_id": "context:sentence-link-train-timetable-b"}], "example-claim-scope": [{"id": "example-council-reform-opposition-a", "family": "example-claim-scope", "introduced": "2026-10-11", "published_on": "2026-10-11", "budget": 60, "target": "具体反对行动支持哪条主旨", "skill": "例子→论点 / 不能多推态度变化", "q": "A city report says proposals to digitize building permits have repeatedly stalled because established interests resist change. It cites a builders' association that organized petitions and delayed the new system for six months. What does the example mainly illustrate?", "o": ["Organized groups can impede administrative reforms.", "The association persuaded every resident to change political allegiance.", "Most builders oppose the current political system in all circumstances.", "Digital permits always cost more than paper applications."], "a": 0, "exp": {"trans": "城市报告说，建筑许可数字化改革屡次被既有利益团体阻挠，并举建筑协会组织请愿、使新系统推迟六个月的例子。例子说明利益团体可能阻碍行政改革。", "structure": "主句proposals ... have stalled because...提出上层论点；It cites an association ...是作为证据的例子；organized petitions / delayed是例子中的行为与结果。", "other": "digitize 数字化；permit 许可证；established interests 既有利益集团；administrative reform 行政改革。", "meaning": "例证题先找例子附近作者要证明的论点：改革遭遇阻力。组织请愿不等于改变公众政治立场；反对一项改革也不等于反对整个政治制度。", "rest": "政治归属改变需要前后态度证据；所有情况下反对现行政治制度扩大对象与频率；数字许可成本并未涉及。"}, "context_id": "context:example-council-reform-opposition-a"}], "with": [], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-parallel-a", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "Not surprisingly / Equally unsurprisingly", "skill": "排序题并列递进标记", "budget": 50, "q": "段落甲结尾：Not surprisingly, nearly half of the applicants withdraw before the final interview.\n下面哪个段首与它的衔接最强？", "o": ["Equally unsurprisingly, only a small share of those who remain receive an offer.", "By contrast, the building was completed twenty years earlier.", "For example, the company sells products in four countries.", "In conclusion, this proves that all interviews are unnecessary."], "a": 0, "exp": {"trans": "甲段说“不出所料，近一半申请者在终面前退出”。最强衔接是：“同样不足为奇的是，留下的人中也只有很少一部分收到录用。”", "structure": "Not surprisingly先给出一个“并不意外”的结果；Equally unsurprisingly显式要求前面已经有一个同类判断，再补第二个并列结果。两个副词短语构成明显篇章钩子。", "other": "withdraw 退出；final interview 终面；a small share 少部分；receive an offer 获得录用。", "meaning": "Equally / similarly / also 等段首词常要求前文存在可并列对象。排序题中这种平行措辞比泛泛的主题相似更可靠。", "rest": "By contrast需要真正对立关系；For example需要前文有待举例的一般命题；In conclusion过早收束，而且all interviews are unnecessary也超出前文。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-parallel-a"}, {"id": "paragraph-order-discourse-conclusion-b", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "concludes / 收束段识别", "skill": "排序题结论信号", "budget": 50, "q": "一篇先分析家电过早报废、后提出改进办法的文章，有一候选段写道：After examining the figures, Dr Patel sums up her proposal: shared repair services could help residents keep appliances longer. 段末又说：Whether enough households will join, however, remains an open question.\n这一段最适合放在哪里？", "o": ["全文开头，用来首次介绍Dr Patel", "问题分析展开之前", "全文结尾附近，作为总结和改革建议", "只能放在具体数据段之前"], "a": 2, "exp": {"trans": "考察数据后，Patel博士总结自己的建议：共享维修服务或许能让居民更长久地使用电器。但是否有足够多家庭参与，仍是未决问题。这段最适合放在结尾附近。", "structure": "After examining the figures回看前文数据；Dr Patel + sums up + her proposal明确给出总结动作。末句Whether...will join作主语，remains...为谓语部分，以未决问题收束。", "other": "sum up 总结；shared repair service 共享维修服务；appliance 家电；household 家庭；open question 未决问题。", "meaning": "总结建议与回顾数据、开放结尾合起来支持尾段位置；单独出现concludes或sum up并不能证明必为全文最后一段。", "rest": "首次介绍人物不能解释已分析过数据；在问题分析前放总结建议与给定结构不合；“只能放在数据段之前”更与After examining the figures相反。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-conclusion-b"}, {"id": "paragraph-discourse-ticket-deposits", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 50, "target": "段尾问题 / 原因解释", "skill": "排序题并列递进标记", "q": "前段：The theatre sold every seat at the advertised price. Yet the deposits in its bank account were smaller than the value of tickets sold. The manager began tracing the gap between bookings and payments.\n哪个后段最能推进这一问题？", "o": ["Audience surveys ranked music above scenery when asking about favourite parts of the performance.", "The booking agency deducted its service fees before forwarding the remaining money to the theatre.", "The theatre had used the same stage for years, although its audience changed with each production.", "Rehearsals ended later than planned, so actors sometimes travelled home together."], "a": 1, "exp": {"trans": "剧院按宣传价卖出了所有座位，但银行入账小于售票总额。经理追查订票与收到款项之间的差额。订票代理转款之前先扣除服务费，最直接解释这个差额。", "structure": "The theatre + sold + every seat。deposits + were smaller than + the value of tickets sold是金额比较。正确后段中The booking agency + deducted + service fees；before forwarding说明扣款发生在剧院收到钱之前。", "other": "deposit 入账款；advertised price 宣传价格；deduct 扣除；forward money 转款。", "meaning": "没有One reason或Equally等显眼连接词，也能由段尾的收款差额锁定后段的扣费机制。这是问题→原因，不是看见theatre或audience就接同主题段。证据来自金额和交易阶段，不是一个单词。", "rest": "Audience surveys解释演出偏好，未说明钱款差额；same stage介绍场地历史，未接收款链；rehearsals和共同回家是演出活动信息，不解释代理转款前少了什么。"}, "context_id": "context:paragraph-discourse-ticket-deposits"}, {"id": "sentence-link-course-participation-a", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "表面便利 vs 参与不足", "skill": "讽刺语气 + 对比过渡", "q": "前文：The online course called itself interactive, but students could do little more than click Next after each recorded lecture. The easiest part was operating the screen; the hardest was staying awake.\n【空缺】\n后文：What would genuine participation require? Students could challenge arguments and revise one another's work.\n哪句最适合？", "o": ["The screen's simplicity proves that the course already offers full participation.", "By contrast, a redesigned course could let students contribute arguments instead of merely consuming lectures.", "Video lectures are cheaper to store than printed textbooks.", "Some courses include subtitles in several languages."], "a": 1, "exp": {"trans": "前文用带讽刺性的说法指出所谓互动课仍只让学生被动点下一页；正确句转向让学生真正贡献观点的另一种课程；后文追问真正参与需要什么。", "structure": "but建立宣称interactive与实际只能click Next的矛盾；the hardest was staying awake暗示被动乏味；By contrast引出另一模式，contribute arguments与后文challenge/revise形成衔接。", "other": "interactive 互动的；lecture 讲座/课；challenge an argument 质疑论点；revise 修订。", "meaning": "看到操作很简单，不能自动判为作者赞扬。应结合转折、夸张和后文提问判断作者真正评价：被动消费不足，主动参与才是重点。", "rest": "简单操作证明充分互动与but students could do little more相反；储存成本和字幕虽与网课有关，却不解释后文genuine participation。"}, "context_id": "context:sentence-link-course-participation-a"}], "viewpoint-fact": [{"id": "viewpoint-renting-a", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "孤立建议 / 量词范围", "skill": "区分规范与事实，结合完整证据", "q": "A report says: “For years, the conventional wisdom was that renting a small office was safer than buying one.” Which statement is justified?", "o": ["Every small business rented its office for years.", "There was a widespread belief that renting was safer.", "Buying an office was legally forbidden.", "Businesses that bought offices always failed."], "a": 1, "exp": {"trans": "报告说：“多年来，传统观念认为租一间小办公室比买一间更安全。”能够成立的是：曾经存在一种广泛观念，认为租赁更安全。", "structure": "主干：the conventional wisdom（主语）+ was（系动词）+ that从句（表语）。that从句说明“观念的内容”，不是统计所有企业实际做了什么。", "other": "conventional wisdom 传统看法/普遍观念；rent 租；buy 购买；widespread 广泛的。", "meaning": "本题只给出一条观念或建议，不能据此推出所有人都遵守；若完整文章另有实际行为证据，仍可以作相应行为推断。2011年第29题的A不能被这条孤立句原则排除。", "rest": "Every把范围扩大成全部企业；legally forbidden把“认为不安全”偷换成法律禁止；always failed把风险判断偷换成必然失败，都是证据过头。"}, "source_diagnosis": {"exam": "2011-english1", "question": 29, "status": "withdrawn", "reason": "旧的29题B答案及据此推断用户错误的诊断已撤回；本题保留为独立的证据范围练习。"}, "context_id": "context:viewpoint-renting-a"}], "scope-role-match": [{"id": "scope-role-report-subsidy-a", "family": "scope-role-match", "introduced": "2026-10-07", "published_on": "2026-10-07", "budget": 55, "target": "题干对象 / 评价对象匹配", "skill": "关键词相似前先核对主语", "q": "A review says: “The report contains pages of anecdotes and too little analysis of why small firms avoid the subsidy.” It later adds: “The subsidy’s most serious weakness is that participation falls once temporary bonuses end.” If asked what the report fails to do, which answer is best?", "o": ["explain adequately why small firms avoid the subsidy", "produce participation that lasts after bonuses end", "remove all anecdotes from the discussion", "prove that temporary bonuses never increase participation"], "a": 0, "exp": {"trans": "评论先说报告轶事过多，却没有充分分析小企业为何避开补贴；后面又说补贴本身最严重的问题是奖金结束后参与度下降。若题干问“报告没做到什么”，答案应回到报告本身。", "structure": "第一句The report是被评价对象；第二句The subsidy’s most serious weakness把评价对象切换成补贴政策。题干再次锁定the report。", "other": "anecdote 轶事；subsidy 补贴；participation 参与度；temporary bonus 临时奖励。", "meaning": "看到most serious weakness之类强信号不能直接选，先检查这个weakness属于谁。正确选项可以只改写并列句中的一侧，不必覆盖整句所有批评。", "rest": "“produce participation that lasts...”描述的是
