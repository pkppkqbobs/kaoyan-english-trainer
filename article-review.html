<script>window.REVIEW_DATA={"date": "2026-10-03", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2011 英语一 Text 3 · 本篇问题 4 题 + 历史弱项 4 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-10-03-2011-text3", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本篇复盘结果只有在你点击“提交结果到 GitHub”并在 GitHub 再点 Submit new issue 后，才会进入后续间隔复习。", "questions": [{"id": "legacy-faint-praise", "source": "today", "skill": "faint / faint praise", "target": "faint / faint praise", "q": "After a two-hour presentation, Maya said, “Well, at least the slides were readable.” Her remark is best described as:", "o": ["faint praise", "earnest approval", "open hostility", "sufficient evidence"], "a": 0, "diag": {"1": "earnest approval 是真诚而明确的赞许；“at least...”只给了很弱的一点肯定。", "2": "这句话并非直接敌意攻击，而是非常有限、勉强的表扬。", "3": "evidence 是“证据”，不是评价语气。"}, "exp": {"trans": "听完一场两小时的演讲后，Maya 说：“嗯，至少幻灯片还看得清。”这句话最适合形容为“勉强的赞扬”。", "structure": "Maya（主语）+ said（谓语）+ 引语（内容）。问句 Her remark is best described as... 中 is described是被动谓语，不是is加形容词表语。引语主干为the slides were readable；at least限制了肯定的力度。", "other": "presentation 演讲/展示；readable 易读的；remark 评论；at least 至少。", "meaning": "faint praise = 勉强的、力度很弱的赞扬。这里 faint 的核心是“微弱的、不强的”。", "rest": "earnest approval = 真诚、明确的赞成，语气过强；open hostility = 公开敌意，不符合；sufficient evidence = 充分证据，词义类别都不对。只有 faint praise（力度很弱的赞扬）符合 at least 的保留语气。"}, "family": "faint", "introduced": "2026-09-29", "budget": 35}, {"id": "viewpoint-renting-a", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "传统观念 ≠ 实际行为事实", "skill": "观点与事实区分", "q": "A report says: “For years, the conventional wisdom was that renting a small office was safer than buying one.” Which statement is justified?", "o": ["Every small business rented its office for years.", "There was a widespread belief that renting was safer.", "Buying an office was legally forbidden.", "Businesses that bought offices always failed."], "a": 1, "exp": {"trans": "报告说：“多年来，传统观念认为租一间小办公室比买一间更安全。”能够成立的是：曾经存在一种广泛观念，认为租赁更安全。", "structure": "主干：the conventional wisdom（主语）+ was（系动词）+ that从句（表语）。that从句说明“观念的内容”，不是统计所有企业实际做了什么。", "other": "conventional wisdom 传统看法/普遍观念；rent 租；buy 购买；widespread 广泛的。", "meaning": "belief/rule/considered safer描述的是人们怎么想，不能直接推成“所有人过去都这么做”。", "rest": "Every把范围扩大成全部企业；legally forbidden把“认为不安全”偷换成法律禁止；always failed把风险判断偷换成必然失败，都是证据过头。"}}, {"id": "author-stance-recall-a", "family": "author-stance", "introduced": "2026-10-03", "target": "事实描述 / 作者价值判断", "skill": "事实描述 ≠ 作者价值判断", "budget": 50, "q": "A report says that residents posted hundreds of angry comments after the council announced a parking plan. Which conclusion is directly supported?", "o": ["The plan deserved every angry comment it received.", "The announcement triggered substantial negative reaction.", "The council knowingly designed a harmful plan.", "All residents opposed the plan."], "a": 1, "exp": {"trans": "一份报告说，市议会公布停车方案后，居民发布了数百条愤怒评论。原文直接支持的是：该公告引发了大量负面反应。", "structure": "主句：A report（主语）+ says（谓语）+ that宾语从句。that从句：residents（主语）+ posted（谓语）+ hundreds of angry comments（宾语）；after从句只交代时间。句子报告发生了什么，没有评价这些评论是否应得。", "other": "council 市议会；announce 公布；substantial 大量的/显著的；reaction 反应。", "meaning": "阅读中有人批评或指控，只能直接证明存在负面反应，不能自动推出作者赞同这些批评或认为对象活该。", "rest": "deserved every angry comment加入作者价值判断和绝对化every；knowingly designed a harmful plan推测动机；All residents把数百条评论扩大成所有居民。"}}, {"id": "hostage-hijack-hashtag-a", "family": "hostage-hijack", "introduced": "2026-10-03", "target": "become hostage to / hijack", "skill": "hostage / hijack 比喻义", "budget": 45, "q": "A company created a cheerful hashtag for a launch, but angry customers soon filled it with complaints. The campaign effectively became hostage to the users. This means:", "o": ["the users physically detained the marketing staff", "the campaign came under the users' control and was turned against the company", "the company paid users to promote the campaign", "the campaign was legally transferred to another firm"], "a": 1, "exp": {"trans": "公司为新品发布创建了一个轻松的话题标签，但愤怒顾客很快用投诉占满了它。这个营销活动实际上受到了用户挟制，也就是传播控制权被用户夺走并反过来对公司不利。", "structure": "第一句but连接预期与反转。第二句：The campaign（主语）+ became（系动词）+ hostage to the users（表语）。这里hostage是比喻，不是实际绑架。", "other": "hashtag 话题标签；launch 发布；complaint 投诉；turn sth against sb 使某物反过来对某人不利。", "meaning": "become hostage to表示受……控制或挟制；传播语境里的hijack也常表示夺走原本的传播控制权。", "rest": "physically detained是字面绑架；paid users是付费推广；legally transferred是法律转让，都没有体现用户利用原活动反向施压。"}}, {"id": "title-coverage-library-a", "family": "title-coverage", "introduced": "2026-10-03", "target": "标题覆盖全文 / 局部主题", "skill": "主旨标题覆盖范围", "budget": 55, "q": "短文先介绍图书馆除纸质借阅外的电子书、设备借用和线上课程，随后重点讨论线上课程的版权风险。哪个标题最能覆盖全文？", "o": ["Copyright Problems in Online Courses", "Beyond Printed Books: New Library Services", "Why E-books Will Replace Libraries", "The Only Safe Way to Teach Online"], "a": 1, "exp": {"trans": "文章先介绍图书馆在纸质书借阅之外提供的多种新服务，后文再重点讨论其中线上课程的版权风险。最合适的标题应覆盖多种新服务这一全文框架，而不是只概括后半部分。", "structure": "题干给出总框架到其中一项风险的篇章结构。标题需要同时解释前半部分为什么介绍多个服务，也能容纳后半部分的版权讨论。", "other": "printed book 纸质书；device lending 设备借用；copyright 版权；cover 覆盖。", "meaning": "标题题要找能统摄全文的上位概念。局部篇幅很长，也不能因此把局部主题当成全文主题。", "rest": "Copyright Problems in Online Courses只覆盖后半篇；Why E-books Will Replace Libraries加入取代主张；The Only Safe Way含Only且主题过窄。"}}, {"id": "conceivably-ferry", "family": "conceivably", "introduced": null, "target": "conceivably", "skill": "conceivably", "q": "If the wind weakens before noon, the ferry could conceivably resume service this afternoon, but the operator has made no promise. Conceivably most nearly means:", "o": ["必然地", "有这种可能，但不能确定", "故意地", "表面上地"], "a": 1, "budget": 35, "exp": {"trans": "如果中午前风势减弱，渡轮今天下午有可能恢复运营，但运营方没有作出任何保证。", "structure": "if从句给出条件：the wind weakens before noon。主句：the ferry + could resume + service；conceivably修饰could resume，降低确定性。but后面的no promise进一步说明并不确定。", "other": "weaken 减弱；ferry 渡轮；resume service 恢复运营；operator 运营方。", "meaning": "conceivably = 可以设想地、有可能地，强调可能存在但远未确定。", "rest": "必然地接近certainly/inevitably，语气过强；故意地是deliberately/intentionally；表面上地是apparently/superficially，均不符合could...but no promise的弱可能语境。"}}, {"id": "infancy-payment-a", "family": "infancy", "introduced": "2026-10-03", "target": "be in its infancy", "skill": "infancy 比喻义", "budget": 35, "q": "The city's hydrogen-bus program is still in its infancy: only five vehicles are operating and the charging network is incomplete. Here, in its infancy means:", "o": ["处于衰退阶段", "仍处于起步阶段", "已经完全成熟", "只适合儿童使用"], "a": 1, "exp": {"trans": "这座城市的氢能公交项目仍处于起步阶段：目前只有五辆车在运营，补能网络也尚不完整。", "structure": "主句：The city's hydrogen-bus program（主语）+ is（系动词）+ still in its infancy（表语）。冒号后的only five vehicles和network is incomplete具体解释为什么说它还处于早期。", "other": "hydrogen 氢能；vehicle 车辆；operate 运营；incomplete 不完整的。", "meaning": "be in its infancy是固定比喻表达，表示某项技术、行业或计划尚处于早期、起步阶段。", "rest": "decline是衰退；fully mature与only five和incomplete矛盾；infancy在此不是字面婴儿期。"}}, {"id": "lined-up-internship-b", "family": "lined-up", "introduced": "2026-09-30", "budget": 35, "target": "have a job/internship lined up", "skill": "line up = 预先安排", "q": "Before graduating, Priya already had a summer internship lined up at a design studio. This means:", "o": ["She had already secured the internship in advance.", "She was still casually browsing internship ads.", "The studio had rejected her application.", "She planned to arrange desks in a line."], "a": 0, "exp": {"trans": "毕业前，Priya已经提前落实了一份在设计工作室的暑期实习。", "structure": "主干：Priya + had + a summer internship lined up。before graduating是时间状语。过去完成/拥有结构强调在毕业这一时间点之前，实习已经安排妥当。", "other": "graduate 毕业；internship 实习；design studio 设计工作室；secure 获得、落实。", "meaning": "have sth lined up = 提前安排好/确定好。与still browsing这种“还在找”相反。", "rest": "still browsing说明尚未落实；rejected表示被拒绝；arrange desks in a line利用line的字面义制造干扰，但与internship语境无关。"}}], "retry": {"faint": [{"id": "faint-map-line", "family": "faint", "introduced": "2026-09-29", "target": "faint", "skill": "faint / faint praise", "q": "After years in the sunlight, only a faint line remained on the old map.\n这里 faint 最接近哪种意思？", "o": ["神圣的", "突然出现的", "隐约的、不清晰的", "故意伪造的"], "a": 2, "exp": {"trans": "经过多年日晒，旧地图上只剩下一条隐约可见的线。", "structure": "After years in the sunlight是时间背景。only a faint line（主语）+ remained（不及物谓语）；on the old map是地点状语。", "other": "sunlight 阳光；remain 留下、仍然存在；line 线条；after years 多年之后。", "meaning": "faint在这里是微弱、不明显的；与faint praise中赞扬力度很弱具有相近的语义核心。", "rest": "神圣的常用holy/sacred；圣人是saint，不是faint。突然出现的可说sudden，重点是发生速度，不是清晰度。伪造的可说forged/fake，描述真伪，原句没有这种信息。"}}, {"id": "faint-praise-restoration", "family": "faint", "introduced": "2026-09-29", "target": "faint praise", "skill": "faint / faint praise", "q": "Calling the volunteers' six-month restoration project “not entirely useless” struck the team as faint praise.\n哪句改写最准确？", "o": ["The team heard an enthusiastic celebration of the project.", "The comment offered only a very weak form of approval.", "The comment proved that the project had failed completely.", "The team was told that the project had won an award."], "a": 1, "exp": {"trans": "把志愿者历时六个月的修复项目说成“并非完全没有用”，让团队觉得这只是很勉强的赞扬。", "structure": "Calling the volunteers' six-month restoration project ‘not entirely useless’是整个动名词短语主语；struck是谓语；the team是宾语；as faint praise表示给团队留下何种印象。短语内部call A B：称A为B。", "other": "restoration 修复；entirely 完全；strike sb as sth 给某人以某种印象；approval 赞许。", "meaning": "faint praise并非赞扬完全不存在，而是肯定得很有限，甚至暗含保留意见。", "rest": "enthusiastic celebration表示热情赞颂，力度过强；had failed completely表示彻底失败，把微弱肯定改成全面否定；had won an award表示获奖，原文没有提供获奖事实。"}}], "viewpoint-fact": [{"id": "viewpoint-diet-b", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "belief / rule / considered ≠ 行为事实", "skill": "观念与行为", "q": "The article states: “The old rule of thumb was that athletes should avoid strength training during the season.” What can you safely conclude?", "o": ["No athlete ever lifted weights during the season.", "Coaches once commonly advised against in-season strength training.", "Strength training was banned by every sports federation.", "Athletes who trained during the season were always injured."], "a": 1, "exp": {"trans": "文章说：“过去的经验法则认为，运动员赛季期间应避免力量训练。”安全的结论是：教练界过去普遍有这种建议。", "structure": "主干：The old rule of thumb + was + that从句。that athletes should avoid...说明规则/建议内容。should表达规范性判断，而不是历史行为统计。", "other": "rule of thumb 经验法则；athlete 运动员；strength training 力量训练；in-season 赛季期间的。", "meaning": "规范、建议和传统观念只能支持“有人这样主张/建议”，不能自动推出所有人都遵守。", "rest": "No athlete ever和every federation都是绝对化扩大；always injured把建议背后的风险偷换成必然结果。"}}], "author-stance": [], "hostage-hijack": [], "title-coverage": [], "conceivably": [], "infancy": [], "lined-up": [{"id": "lined-up-flat-a", "family": "lined-up", "introduced": "2026-09-30", "budget": 35, "target": "have sth lined up / position lined up", "skill": "line up 熟词义", "q": "Nora resigned from her apartment lease only after she had another place lined up for the following month. Here, had another place lined up means:", "o": ["把另一个地方排成一条线", "已经事先安排好了另一个住处", "正在地图上寻找另一个地方", "把另一个住处取消了"], "a": 1, "exp": {"trans": "Nora只有在已经提前安排好下个月的新住处之后，才终止了原来的租约。", "structure": "主句：Nora + resigned from/ended her lease（语义上是结束租约）。only after引导时间条件；she had another place lined up表示那时新住处已经提前落实。", "other": "lease 租约；following month 下个月；resign/leave 退出；place 住处。", "meaning": "have sth lined up = 已经预先安排好、落实好某事。position/job lined up就是已经找好下一份职位/工作。", "rest": "line up确实可表示排队/排成一列，但have a place lined up在此是安排义；寻找还未完成不能解释had...lined up；取消则与“先有新住处再退旧租约”的逻辑相反。"}}]}, "article_session": {"id": "2026-10-03-2011-text3", "source": "2011 英语一 Text 3", "session_file": "data/article-sessions/2026-10-03-2011-text3.json", "current_families": ["author-stance", "title-coverage", "infancy", "hostage-hijack"], "historical_families": ["lined-up", "faint", "conceivably", "viewpoint-fact"]}, "issues_used": [1, 2, 3, 4, 5, 6, 7], "engine": 4};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
