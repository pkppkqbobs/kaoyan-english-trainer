<script>window.REVIEW_DATA={"date": "2026-10-30", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2015 英语一 Reading Text 3 · 2026-10-29纸质复盘（10月30日发布） · 本篇问题 2 题 + 历史弱项 6 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-10-29-2015-text3", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本轮结果被GitHub接收并经Actions核验后，才会进入后续间隔复习；未提交的浏览器作答只保存在本地。", "questions": [{"id": "flag-up-walking-tour-warning", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-30", "target": "flag up / revise / store", "skill": "固定搭配与动作阶段辨析", "budget": 50, "q": "A walking-tour guide flagged up a shadeless stretch before the group set out. She kept the planned route and advised everyone to bring water. What did she do by flagging it up?", "o": ["Highlighted it as something to prepare for.", "Revised the route to leave that stretch out.", "Stored the route for a later walking tour.", "Found a shaded stretch to replace that part."], "a": 0, "exp": {"trans": "徒步导游在出发前特别提醒大家有一段路没有遮阴。她保留原定路线，建议大家带水。flagged up在此表示指出这段路值得提前留意和准备。", "structure": "首句主语A walking-tour guide，谓语flagged up，宾语a shadeless stretch；before从句说明提醒的时间。第二句kept与advised为并列谓语，分别表明路线未改和提醒带水。", "other": "walking tour徒步游览；shadeless无遮阴的；stretch一段路程；set out出发。", "meaning": "flag up是整体搭配，表示使某事引起注意，不是由up推断向上或动作完成。这里提醒风险与修改路线是不同动作。", "rest": "“修改路线避开该段”与kept the planned route矛盾；“储存路线供以后旅行”把提醒换成保存；“找到替代的遮阴路段”加入文中没有发生的发现和替换。只有“提醒大家提前准备”符合后续带水建议。"}, "context_id": "tour-shade-practical-warning"}, {"id": "causal-role-direction-travel-b", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "施事与受事 / 原因与结果", "skill": "作用关系不能倒置", "budget": 50, "q": "The gardeners shaded the seedlings during the hottest hours. As a result, fewer seedlings dried out. Which statement keeps the cause and the affected object in the right roles?", "o": ["Healthier seedlings prompted the gardeners to provide shade.", "The gardeners' shade reduced heat exposure for the seedlings.", "The seedlings sheltered the gardeners from the hottest sun.", "The drying seedlings caused a fall in the surrounding heat."], "a": 1, "exp": {"trans": "园丁在最热的几小时给幼苗遮阴，因此干枯的幼苗变少了。正确改写是：园丁提供的遮阴减少了幼苗暴露在高温中的程度。", "structure": "第一句：The gardeners（施事/主语）+ shaded（谓语）+ the seedlings（受事/宾语）。第二句：fewer seedlings（主语）+ dried out（谓语）。As a result明确把遮阴和干枯减少连接为原因与结果。", "other": "gardener 园丁；shade 给……遮阴；seedling 幼苗；dry out 干枯；exposure 暴露。", "meaning": "先标明谁采取动作、谁受影响，再核对因果方向。gardener → shade → seedlings dry out less，不能交换施事与受事。", "rest": "把幼苗更健康当成遮阳的先前原因是因果倒置；幼苗保护园丁交换了施事与受益者；干枯导致环境降温既反转因果，又偷换了暴露量与环境温度。"}, "source_exam": "2011-english1", "source_question": 40, "context_id": "context:causal-role-direction-travel-b"}, {"id": "legacy-such", "source": "old", "skill": "these / such 回指", "target": "these / such 回指", "q": "段A：The museum lowered ticket prices and added evening hours.\n段B：Such changes attracted more local families during the week.\n段C：A different museum across town raised its prices last year.\n\n段B中的 Such changes 最直接回指什么？", "o": ["段A中的降价和延长晚间开放时间", "段C中另一家博物馆的涨价", "所有博物馆过去一年的变化", "local families 本身"], "a": 0, "diag": {"1": "段B先于段C，且 Such changes 就近概括段A的两个措施。", "2": "题干没有支持“所有博物馆”的泛指。", "3": "changes 指的是措施变化，不是家庭。"}, "exp": {"trans": "A：博物馆降低了票价，并延长了晚间开放时间。B：这些变化吸引了更多本地家庭在工作日前来。C：城另一边的另一家博物馆去年提高了票价。", "structure": "段A先给出两个并列措施 lowered ticket prices / added evening hours；段B用 Such changes 对这两个措施整体回指，再说明结果 attracted more local families。", "other": "lower 降低；ticket price 票价；evening hours 晚间开放时段；attract 吸引。", "meaning": "such + 名词 常把前文已经描述过的同类事物/情况概括回指；这里 Such changes = 段A的两项变化。", "rest": "后文另一家博物馆的涨价、所有博物馆的泛指以及 local families 都不是 Such changes 的先行内容；它直接概括前文的降价和延长晚间开放时间。"}, "family": "reference", "introduced": null, "budget": 35, "context_id": "such-two-improvements"}, {"id": "with-bread-cooling", "family": "with", "introduced": null, "budget": 60, "target": "with + 名词 + 分词", "skill": "with + 名词 + 后置成分", "q": "The bakery opened at six, with warm bread cooling on the counter.\nwith 后面的结构主要起什么作用？", "o": ["补充开门时伴随的状态", "引出老板的直接引语", "说明开门的唯一目的", "充当opened的直接宾语"], "a": 0, "exp": {"trans": "面包店六点开门，当时温热的面包正在柜台上晾凉。", "structure": "主干：The bakery（主语）+ opened（不及物谓语）+ at six（时间状语）。原始简单句Warm bread was cooling on the counter → 去掉was，用with引出：with warm bread cooling on the counter。warm bread是with结构的逻辑主语，cooling是与之构成主动关系的现在分词。", "other": "bakery 面包店；cool 晾凉、变凉；counter 柜台；warm 温热的。", "meaning": "with复合结构可以补充主句发生时的伴随状态；它不是新的独立主句。", "rest": "直接引语通常由say等动词引出，此处没有任何说话行为。目的常用to do或in order to，原句只描写伴随状态。opened在本句是不及物用法，with短语不是其直接宾语。"}, "context_id": "with-simultaneous-ing"}, {"id": "text4-airspace-exclusive-d", "family": "text4-federal-state-boundary", "target": "occupied field / parallel vs contradict", "skill": "区分并行规则、直接冲突与领域排除", "budget": 55, "q": "A federal air-safety code exclusively regulates emergency signals. A city adopted a similar signal rule. Although the city's rule was not shown to contradict a specific clause, a court set it aside because the code already covered the entire field. Why?", "o": ["The city rule was barred because national law already occupied the field.", "The federal code was cancelled because the city's provisions ran parallel.", "The court ordered the city to enforce its rule beside the national code.", "The judges delayed a decision until the national agency reviewed its budget."], "a": 0, "exp": {"trans": "一套联邦航空安全规范对紧急信号作了专属规定。某市采用了类似规则。尽管没有证明市级规则直接违反特定条文，法院仍因联邦规范已全面覆盖该领域而排除了市级规定。", "structure": "Although引导让步：没有证明逐条直接矛盾；主句a court set it aside给出判决；because说明真正理由是整个领域已由上级规则全面规制。", "other": "exclusively 专属地；signal 信号；contradict 与……相矛盾；set aside 废除、排除；occupy the field 通过全面规制排除下级立法。", "meaning": "并行或类似不等于相抵触；领域排除的判断依据是整个领域已由上级法律覆盖，不要求指出某条具体文字直接冲突。", "rest": "没有推翻联邦规范；法院没有命令城市同时执行两套规则；也没有推迟判决等待预算审查。"}, "introduced": "2026-10-18", "published_on": "2026-10-18", "context_id": "context:text4-airspace-exclusive-d"}, {"id": "process-stage-hospital-routine-authority-c", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-15", "budget": 55, "target": "流程阶段与授权条件", "skill": "区分结果核验、消息公开与实施授权", "q": "A hospital trial finds that a scheduling tool reduces missed appointments. The methods panel accepts the results after checking the analysis, and a staff newsletter reports the trial. Routine use must nevertheless wait for the operations board to approve a staffing plan. Which event authorises the hospital to start using the tool routinely?", "o": ["Acceptance of the trial analysis by the methods panel.", "Publication of the trial results in the staff newsletter.", "The operations board's approval of the staffing plan.", "The trial team's observation of fewer missed appointments."], "a": 2, "exp": {"trans": "一家医院的试验发现，一种预约安排工具减少了爽约。方法审核小组检查分析后认可了结果，员工通讯也报道了这项试验。不过，常规使用仍须等待运营委员会批准人员配置计划。哪个事件授权医院开始常规使用该工具？答案是人员配置计划获批。", "structure": "A hospital trial + finds + that从句给出试验发现；The methods panel + accepts + the results说明核验阶段。Routine use + must wait + for the operations board to approve a staffing plan说明实施仍受另一项决定约束。nevertheless连接结果已获认可与尚不能常规实施的转折。", "other": "scheduling tool 预约安排工具；miss an appointment 爽约；methods panel 方法审核小组；staffing plan 人员配置计划；authorise 授权。", "meaning": "题目问开始常规实施的授权条件。独立核查在本文确实发生，却只让研究结果获得认可，不能替代运营委员会的实施批准。不能把所有过程题都机械答成独立验证。", "rest": "审核小组认可的是试验分析，不是常规使用的授权；员工通讯负责传播消息，没有审批权；试验团队观察到效果是提出采用建议的证据起点，仍未满足文中保留的实施条件。"}, "context_id": "context:process-stage-hospital-routine-authority-c"}, {"id": "text4-agreement-target-c", "family": "text4-agreement-target", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "judicial conclusion vs legislative reason", "skill": "区分法官认可的结论与国会提供的理由", "q": "A court permits county officers to check residency status during limited enforcement encounters. It cites Congress's support for joint national-local enforcement. What did the judges agree on?", "o": ["Congress must personally direct every local enforcement decision.", "Local authorities may assist with enforcement within the limits set by law.", "National officers must withhold all enforcement information from local teams.", "Local authorities can disregard national rules when enforcing local policy."], "a": 1, "exp": {"trans": "法院允许县级执法人员在有限的执法接触中核查居住身份，并引用国会支持国家与地方共同执法的立场。法官达成一致的是：地方当局可以在法律规定的范围内协助执法。", "structure": "A court permits...直接陈述司法结论；It cites...引出支持这一结论的立法背景。题目问What did the judges agree on，因此应回答法院允许什么，而不是重复国会的理由。", "other": "permit 允许；residency status 居住身份；joint 共同的；enforcement 执法；withhold information 不提供信息。", "meaning": "阅读题要区分结论和论据。国会鼓励共同执法，是法院认可地方执法角色的理由，不是题目所问的结论本身。", "rest": "国会亲自指挥每项地方执法决定过于绝对；原文鼓励信息共享而非要求扣留信息；地方参与执法并不意味着可以无视国家规则。"}, "context_id": "context:text4-agreement-target-c"}, {"id": "title-coverage-bookshop-pooled-delivery", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-10-30", "target": "主旨标题 / 行动与原因", "skill": "概括全文发展而非抓相关词", "budget": 65, "q": "Local bookshops are replacing separate next-day deliveries with a slower shared service. The article explains rising van costs, pooled routes, and customers accepting longer waits for lower delivery charges. A brief section about authors' visits supplies background. Which title best captures the main development?", "o": ["Online Shopping Reshapes Relations with Local Shops", "Local Bookshops Abandon Online Orders and Deliveries", "Book Launches Become the Main Job of Delivery Teams", "Bookshops Pool Deliveries to Lower Transport Costs"], "a": 3, "exp": {"trans": "当地书店正用速度稍慢的共享配送取代各店分别进行的次日配送。文章分析货车成本上涨、合并线路以及顾客接受较长等待来换取较低配送费；作家来访只是背景。主线是书店通过合并配送降低运输成本。", "structure": "首句主语Local bookshops，谓语are replacing，宾语separate next-day deliveries，with引出替代方案。第二句explains后列举改革原因、运作方式及顾客反应；最后一句明示作家活动只是背景。", "other": "pooled routes合并安排的线路；van厢式货车；delivery charge配送费；background背景。", "meaning": "一个标题若能同时统领成本原因、共享做法和顾客取舍，比只罗列相关话题更准确。概括不能把改用另一种配送扩大为停止线上业务。", "rest": "“网购改变与商店的关系”相关但过于宽泛，遗漏合并配送降成本的核心变化；“放弃网购订单和配送”与仍有shared service矛盾；“送货团队主要举办新书活动”把背景细节升级成主旨，并加入无依据的团队职责。"}, "context_id": "pooled-delivery-cost-response-vs-online-topic"}], "retry": {"relation-collocation": [{"id": "relation-tied-apart-a", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-05", "budget": 50, "target": "set A apart from B / be closely tied", "skill": "关系搭配 + because逻辑", "q": "The company keeps approval and sales decisions formally separate precisely because the two teams are closely tied through shared bonuses. Which reading is best?", "o": ["两个团队彼此没有关系，所以没有必要区分决策。", "两个团队现实利益联系紧密，因此制度上反而需要刻意把两类决策分开。", "shared bonuses证明销售团队已经接管审批团队。", "closely tied表示两个团队被绳子绑在一起。"], "a": 1, "exp": {"trans": "公司之所以在制度上把审批与销售决策分开，恰恰是因为两个团队通过共同奖金存在紧密利益联系。", "structure": "The company是主语，keeps A and B separate是谓语结构；precisely because引出原因，the two teams是主语，are closely tied是系表结构。", "other": "approval 审批；formally 正式地/制度上；bonus 奖金；shared 共同的。", "meaning": "set/keep A apart/separate from B表示区分；be closely tied表示紧密相关。because并不要求“原因”和“措施”表面同方向：正因为现实容易纠缠，制度上才需要分开。", "rest": "“没有关系、不必区分”与closely tied和keeps ... separate都相反；“销售团队接管审批团队”把利益联系夸大成组织控制，shared bonuses不能证明接管；“绳子绑在一起”按字面理解比喻性的关系搭配，无法解释共同奖金带来的利益联系。"}, "context_id": "context:relation-tied-apart-a"}, {"id": "relation-independence-b", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-05", "budget": 50, "target": "closely tied / institutional separation", "skill": "关系搭配 + 反直觉因果", "q": "The audit office is structurally independent from the ministry because its work is closely tied to decisions the ministry would otherwise judge itself. What is the logic?", "o": ["工作联系紧密，所以两个机构不再需要制度独立。", "审计涉及该部决定，制度独立可避免自己审自己。", "审计内容相关，所以审计办公室必须直属部长。", "because表达转折，前后两个分句没有因果关系。"], "a": 1, "exp": {"trans": "审计办公室在组织上独立于该部门，因为它的工作与该部门原本可能自行评判的决定紧密相关。正因为利益和事项联系密切，制度上才需要独立。", "structure": "The audit office是主语，is structurally independent是系表；because从句中its work是主语，is closely tied to是谓语结构，decisions是介词宾语。", "other": "audit 审计；structurally 组织结构上；ministry 部门/部；otherwise 否则。", "meaning": "closely tied to=与……紧密相关；independent from=独立于。文章常出现“现实联系紧密→制度上刻意分离”的治理逻辑，不能因为表面反向就否定because。", "rest": "联系紧密就无需独立反转了治理理由；工作内容相关不等于必须直属部长；because引出原因，不是转折。制度独立针对的是同一部门可能自己评判自己的决定。"}, "context_id": "context:relation-independence-b"}, {"id": "relation-more-to-repair-testing", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-27", "target": "整体表达与后文解释", "skill": "整体表达与后文解释", "budget": 50, "q": "The repair looks like replacing one cable, but there is more to it: the technician must also find the cause of the overheating and retest the circuit. What does \"there is more to it\" mean here?", "o": ["The replacement requires a longer piece of cable.", "The cable costs more than the other spare parts.", "It involves further work beyond changing a cable.", "It creates more faults than the tests can identify."], "a": 2, "exp": {"trans": "维修表面上像是换根电缆，但事情还不止这些：技师还必须查明过热原因，并重新测试电路。", "structure": "there is more to it是完整表达；it指维修这件事。冒号后的also与并列动作find、retest说明more具体增加了哪些工作。", "other": "overheating 过热；circuit 电路；retest 重新测试。", "meaning": "there is more to something表示某事比表面呈现的更复杂或包含更多内容；to连接所涉及的事情，不单独表示方向。", "rest": "电缆更长、价格更高都没有证据；后文是查因和复测，也没有说维修新制造了更多故障。"}, "context_id": "context:relation-more-to-repair-testing"}, {"id": "relation-display-allows-comparison", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-27", "target": "动作的施事与作用方式", "skill": "动作的施事与作用方式", "budget": 50, "q": "A map display shows travel time and price side by side; passengers remain free to ignore it. Which sentence best describes the function the display provides?", "o": ["It forces passengers to follow the cheapest route.", "It allows passengers to compare the route options.", "It requires passengers to book before comparing.", "It expects all passengers to make the same choice."], "a": 1, "exp": {"trans": "地图界面并列显示行程时间和价格，乘客可以不使用它。它的作用是让乘客能够比较方案，而不是强制某种选择。", "structure": "shows的主语是display；remain free的主语是passengers。allow/force/require/expect都可接宾语加to不定式，须进一步辨别语义。", "other": "allow 允许、使能够；force 强迫；require 要求；expect 期待；side by side 并列地。", "meaning": "中文“让”可能表示使能够或迫使，英语并不总用同一个动词。要看工具提供能力，还是主体施加强制要求。", "rest": "强迫走最便宜路线和要求先订票都增加了没有出现的限制；期待所有人同选也没有证据，且不能准确表述并列显示信息提供的比较能力。"}, "context_id": "context:relation-display-allows-comparison"}, {"id": "search-ledger-donation-entry", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-28", "target": "search for / search ... for ...", "skill": "搜索对象与寻找目标", "budget": 50, "q": "A curator searched for a missing ledger. After finding it, she searched the ledger for a donation entry. Which description matches only the second search?", "o": ["She examined the office to locate the ledger.", "She examined the address to locate its owner.", "She examined the ledger to locate an entry.", "She examined the donor to locate the ledger."], "a": 2, "exp": {"trans": "管理员先寻找一本失踪的账簿。找到后，她查看账簿，寻找一条捐赠记录。第二次搜索检查的是账簿，寻找的目标是记录。", "structure": "首句searched for后接寻找的目标a missing ledger；第二句searched的直接宾语是the ledger，for a donation entry说明要在其中寻找什么。After finding it中的it回指账簿，先找到它才进行第二个动作。", "other": "curator藏品管理员；ledger账簿；donation捐赠；entry一条记录。", "meaning": "search for X强调寻找X；search Y for X强调检查Y以寻找X。要分开标出被检查的范围和想找到的东西。", "rest": "“检查办公室找账簿”把第二次查看内容换回寻找物品；“检查地址找主人”加入不存在的对象与目标；“检查捐赠人找账簿”把账簿中的记录换成了人。只有“检查账簿找记录”对应第二句。"}, "context_id": "ledger-found-then-donation-entry"}, {"id": "flag-up-booking-workflow", "family": "relation-collocation", "introduced": "2026-10-05", "published_on": "2026-10-30", "target": "flag up / 流程阶段", "skill": "提示问题不等于审查或修改完成", "budget": 50, "q": "A night audit has flagged up a possible double booking, but the support team has not opened the case. Changing either reservation requires the customer's approval. Which stage has certainly been reached?", "o": ["Both customers have approved changes to their rooms.", "The support team has confirmed that an error occurred.", "A possible clash has been marked for staff attention.", "One reservation has already been revised and saved."], "a": 2, "exp": {"trans": "夜间检查已提示可能存在重复预订，但客服尚未查看此事。更改任一预订还需要客户同意。现在只能确认潜在冲突已被标示出来，供工作人员关注。", "structure": "A night audit为主语，has flagged up为谓语，a possible double booking为宾语；but后has not opened明确限制审查进度。Changing either reservation是第二句主语，requires为谓语，the customer's approval为宾语。", "other": "audit检查、核查；double booking重复预订；reservation预订；approval同意、批准。", "meaning": "先提示可能有问题，再核查是否确有问题，必要时取得许可并修改。possible保留不确定性，不能把流程的后续步骤当成已经完成。", "rest": "“两位客户都同意改动”没有依据；“客服确认错误”与尚未查看此事不符，也删掉possible；“已经修改并保存预订”跳过核查和授权。正确描述只停在已标示潜在冲突这一阶段。"}, "context_id": "booking-alert-before-review-and-approval"}], "causal-role-direction": [{"id": "causal-role-direction-fitness-a", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "attribute A to B / 原因与结果", "skill": "谁影响谁", "budget": 50, "q": "A trial attributed a drop in workshop dust to the installation of a new air filter. Which paraphrase preserves the reported cause and effect?", "o": ["The decrease in dust made the workshop install a new filter.", "Installing the filter helped reduce the amount of dust in the workshop.", "Dust in the workshop improved the filter's performance.", "The trial proved that every type of pollution had disappeared."], "a": 1, "exp": {"trans": "一项试验把车间粉尘的减少归因于安装了新的空气过滤器。准确改写应保留“安装过滤器 → 粉尘减少”的因果方向。", "structure": "A trial（主语）+ attributed（谓语）+ a drop in workshop dust（宾语/结果）+ to the installation of a new air filter（原因）。attribute A to B中A是被解释的结果，B是原因；名词化的installation保留install the filter这一动作。", "other": "trial 试验；workshop 车间；dust 粉尘；installation 安装；air filter 空气过滤器。", "meaning": "不要把先出现的名词误当成原因。attribute A to B的方向是B导致A，而不是A导致B。", "rest": "The decrease in dust made...把结果倒置为安装的原因；Dust improved the filter's performance交换了受影响对象并添加无据效果；every type of pollution把粉尘减少扩大为所有污染消失。"}, "source_exam": "2011-english1", "source_question": 40, "context_id": "context:causal-role-direction-fitness-a"}, {"id": "causal-role-trust-delays", "family": "causal-role-direction", "introduced": "2026-10-03", "published_on": "2026-10-05", "budget": 50, "target": "因果角色 / 作用方向", "skill": "谁影响谁", "q": "Trust in the complaints system was weakened by delays in acknowledging reports. Fewer residents subsequently used it. Which chain matches the account?", "o": ["Lower use caused the earlier delays, which then improved trust.", "Delays weakened trust; reduced use followed that loss of trust.", "Residents’ increased trust made acknowledgement take longer.", "Fewer reports showed that complaints had been resolved more quickly."], "a": 1, "exp": {"trans": "投诉系统迟迟不确认收到报告，削弱了人们对它的信任。随后使用它的居民减少了。符合叙述的链条是：确认延迟削弱信任，使用减少随后发生。", "structure": "Trust是主语；was weakened是被动谓语；by delays标明导致信任下降的因素。第二句Fewer residents是主语，used是谓语，it指投诉系统。subsequently给出时间方向。", "other": "complaints system 投诉系统；acknowledge reports 确认收到报告；delay 延迟；subsequently 随后。", "meaning": "被动句的语法主语是受到影响的信任，不是施加影响的延迟。第二步是后续使用减少，不能倒转为原先延迟的起因。文本是对该链条的叙述，并未报告受控实验。", "rest": "Lower use caused the earlier delays把后续使用减少倒置为较早事件的原因，且improved trust与weakened相反；increased trust同时交换方向和变化趋势；resolved more quickly把使用量下降替换成解决速度提升，原文没有处理速度数据。"}, "context_id": "context:causal-role-trust-delays"}, {"id": "causal-role-deadline-response", "family": "causal-role-direction", "introduced": "2026-10-03", "published_on": "2026-10-05", "budget": 50, "target": "原因 / 应对措施 / 后续结果", "skill": "谁影响谁", "q": "After several small firms missed an application deadline, the council extended the next round by a week to give them another chance. Participation in that later round has not yet been measured. Which statement preserves the roles?", "o": ["The extension caused firms to miss the earlier deadline.", "Measured gains in later participation prompted the council's extension.", "Missed deadlines prompted an extension; later effects are unmeasured.", "The earlier deadline was a response to the council's later extension."], "a": 2, "exp": {"trans": "几家小企业错过申请截止时间后，市政委员会将下一轮的期限延长一周，给它们再一次机会。后一轮的参与情况尚未统计。错过期限是延长期限这一应对措施的背景，措施对随后参与的影响仍未知。", "structure": "after从句：several small firms + missed + an application deadline。主句：the council + extended + the next round，by a week表示延长量，to give them another chance说明目的。Participation + has not yet been measured是现在完成时被动谓语。", "other": "firm 企业；application 申请；deadline 截止时间；participation 参与情况。", "meaning": "区分原先问题、事后应对和尚未观测的效果。不能让后来的措施成为较早失败的原因，也不能凭实施措施就宣称取得改善。", "rest": "后来的延期不能造成更早的错过期限；尚未测量的后续参与数据不能成为先前延期的依据；较早的规则也不是对较晚措施的回应。"}, "context_id": "context:causal-role-deadline-response"}, {"id": "causal-role-deadline-response-c", "family": "causal-role-direction", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "causal direction / known vs unknown outcome", "skill": "区分已知原因、措施与尚未验证的后续结果", "q": "A grant committee extended an application deadline after several applicants missed it. The report says the effect on later participation has not been measured. Which summary is justified?", "o": ["The missed deadline prompted an extension; later participation effects remain unmeasured.", "Later participation figures prompted the committee to extend the earlier deadline.", "The extension caused applicants to miss a deadline that had already passed.", "Officials changed the deadline only after a separate review showed participation had fallen."], "a": 0, "exp": {"trans": "几名申请者错过截止日期后，拨款委员会延长了申请期限。报告说，尚未测量这一调整对后续参与情况的影响。最准确的概括是：错过截止日期促成了延期，但延期对后续参与的影响仍未知。", "structure": "extended是主句谓语；after several applicants missed it交代延期的时间背景和触发情境；the effect...has not been measured明确限制了对后续结果的推断。", "other": "grant committee 拨款委员会；application deadline 申请截止日期；participation 参与；measure 测量、评估。", "meaning": "必须区分已知的原因与尚未测量的后果。原文支持错过期限后发生延期，但不支持断言延期一定提高或降低后续参与。", "rest": "后续参与数据没有促成前面的延期；延期不可能导致申请者错过一个已经过去的截止日期；原文没有提到另一次审查或参与人数下降。"}, "context_id": "context:causal-role-deadline-response-c"}, {"id": "causal-role-single-form-signatures", "family": "causal-role-direction", "introduced": "2026-10-03", "published_on": "2026-10-27", "budget": 50, "target": "措施与结果的对应关系", "skill": "措施与结果的对应关系", "q": "By accepting a single signed form, the club allows volunteers to avoid requesting a separate signature for every shift. Which benefit is described?", "o": ["Volunteers may work extra shifts without signing any form.", "Volunteers need not seek another signature for each shift.", "Supervisors supply more signatures for every new volunteer.", "Only supervisors may change the shifts a volunteer accepts."], "a": 1, "exp": {"trans": "俱乐部接受一份签好字的表格，从而使志愿者不必每个班次都另外请求签字。好处是省去反复请求签字的手续。", "structure": "By accepting...说明俱乐部采取的措施；allows的宾语是volunteers；to avoid requesting...说明志愿者由此免于什么行为。separate signature是被省去的逐班次手续。", "other": "shift 班次；signature 签字；avoid doing 避免做、不必做；single 单份的。", "meaning": "使某人免于寻找或请求某物，不等于给他更多该物。先列措施、受益主体、被省去的行为和结果，再检查选项有没有改成增加数量或扩大资格。", "rest": "原文仍有一份已签字表格，不能说完全无须签字或允许多工作班次；也未说主管供应更多签字；变更班次的权限没有提及。"}, "context_id": "context:causal-role-single-form-signatures"}], "reference": [{"id": "reference-radio-failures", "family": "reference", "introduced": null, "target": "these/such 回指 / 原词复现干扰", "skill": "原词复现 vs 明确回指", "q": "段A：The team lost radio contact, and its spare battery failed.\n段B：These failures forced the team to abandon the search.\n段C：Another team tested a radio before leaving camp.\n\n哪两个段落之间的衔接最强？", "o": ["A → C", "B → C", "C → A", "A → B"], "a": 3, "exp": {"trans": "段A：团队失去了无线电联系，备用电池也出了故障。段B：这些故障迫使团队放弃搜寻。段C：另一支团队离开营地前测试了一台无线电设备。", "structure": "段A有两个并列分句：The team + lost + radio contact；its spare battery + failed。段B：These failures（主语，概括前面的两项故障）+ forced（谓语）+ the team（宾语）+ to abandon the search（宾语补足语）。段C的Another team引入另一对象。", "other": "radio contact 无线电联系；spare 备用的；abandon 放弃；search 搜寻。", "meaning": "These failures明确回指已出现的两次故障；重复radio一词并不保证谈的是同一团队、同一事件。", "rest": "把两个含radio的句子相接，会忽略Another team造成的对象切换。把这些故障放在另一团队测试设备之前，后句没有承接故障结果。先说另一团队测试再说本团队出故障，也没有明确回指建立连接。"}, "context_id": "context:reference-radio-failures"}, {"id": "reference-return-rules", "family": "reference", "introduced": null, "target": "these requirements", "skill": "these / such 回指", "q": "A return is accepted only within thirty days and with a receipt. These requirements apply to online orders too.\nThese requirements 具体指什么？", "o": ["网上订单的付款和配送方式", "所有商店共同采用的退货政策", "三十天内退货并出示收据", "已经完成退款的订单处理结果"], "a": 2, "exp": {"trans": "只有在三十天内并出示收据，退货才会被受理。这些要求也适用于网上订单。", "structure": "第一句：A return（主语）+ is accepted（被动谓语）；only within thirty days和with a receipt并列限制受理条件。第二句：These requirements（主语）+ apply（谓语）+ to online orders（介词短语）。", "other": "return 退货；receipt 收据；apply to 适用于；online order 网上订单。", "meaning": "these + 名词可以概括前文的整组条件，不一定只指紧挨着它的一个名词。", "rest": "付款配送并未在前句出现；所有商店共同政策扩大了范围；退款已完成是结果，而前句只说明受理退货的两个条件。"}, "context_id": "context:reference-return-rules"}, {"id": "reference-panels-request-switch", "family": "reference", "introduced": null, "published_on": "2026-10-05", "budget": 35, "target": "it / this request / 对象切换", "skill": "these / such 回指", "q": "Two panels examined a report. The finance panel recommended publishing it in full, while the technical panel asked for more time. This request was granted. Which reading tracks it and This request correctly?", "o": ["it = the report; This request = publishing the report in full", "it = the finance panel’s recommendation; This request = more time", "it = the report; This request = more time for the technical panel", "it = the decision to publish; This request = the finance panel’s recommendation"], "a": 2, "exp": {"trans": "两个小组审阅了一份报告。财务小组建议全文发布它，技术小组则请求更多时间。这个请求获准了。it指报告；This request指技术小组请求更多时间。", "structure": "publishing it in full是recommended的补足内容，it代替前文的report。while对比两个小组的不同动作。This request作后句主语；was granted是被动谓语，回指asked for more time这一请求。", "other": "panel 小组；in full 全文、完整地；technical 技术的；grant a request 批准请求。", "meaning": "跟踪对象时既看名词数与位置，也看动作：publish的是report，asked for形成request。财务组的建议和技术组的请求不能混为同一对象。", "rest": "把This request指向全文发布，忽略asked for more time和while的对象切换；把it解释成recommendation，会把publish报告改成发布建议；decision to publish也不是it出现前已建立的实体，且没有说发布决定已经获批。"}, "context_id": "context:reference-panels-request-switch"}], "with": [{"id": "with-archive-loading-c", "family": "with", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "with + noun + participial phrase", "skill": "识别with复合结构的伴随状态", "q": "The archive reopened at noon, with several boxes waiting in the loading area. What does the with-clause do?", "o": ["It describes a state accompanying the archive's reopening.", "It gives the sole reason the archive reopened at noon.", "It reports an action that archive staff carried out.", "It is the direct object of reopened in the main clause."], "a": 0, "exp": {"trans": "档案馆中午重新开放，当时有几个箱子正等在装卸区。with结构补充了重新开放时伴随的状态。", "structure": "主干是The archive reopened at noon；with several boxes waiting in the loading area是with + 名词 + 现在分词结构，several boxes是waiting的逻辑主语。", "other": "archive 档案馆；reopen 重新开放；loading area 装卸区；accompany 伴随。", "meaning": "with复合结构常补充主句发生时的伴随状态。它不是reopened的直接宾语，也不自动表达原因或目的。", "rest": "句子没有说明这是档案馆重新开放的唯一原因；with短语描述箱子所处的状态，并未说工作人员另做了一项动作；reopened在这里是不及物动词，不需要直接宾语。"}, "context_id": "context:with-archive-loading-c"}], "text4-federal-state-boundary": [{"id": "text4-field-safety-label-c", "family": "text4-federal-state-boundary", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "parallel rule / occupied the field / field pre-emption", "skill": "区分并行规则、直接冲突与领域排除", "q": "A national safety code covers the whole field of product labelling. A state adds a parallel rule, and a court invalidates it because the code has “occupied the field.” Which explanation best fits the ruling?", "o": ["The rule failed because another state's policy directly contradicted it.", "The rule was pre-empted because national law already covered the field.", "The rule was approved because parallel rules can never conflict.", "The court delayed the case until lawmakers revised the enforcement budget."], "a": 1, "exp": {"trans": "国家安全规范全面覆盖了产品标签领域。某州又增加了一项并行规定，法院因为国家规范已经“占据了该领域”而判定州规定无效。最合适的解释是：国家法律已全面规制该领域，因此州规定被排除。", "structure": "A national safety code covers the whole field；第二句由and连接州增加规定与法院判定无效的动作；because从句给出判决理由。occupied the field是法律语境中的领域排除概念。", "other": "product labelling 产品标签；invalidate 判定无效；pre-empt 排除州层面的规制；enforcement budget 执法预算。", "meaning": "parallel表示并行，不等于contradict。即使没有逐条直接冲突，若国家立法已经全面覆盖该领域，州规定仍可能被排除。", "rest": "另一州的政策不是本案依据；parallel rules can never conflict把并行绝对化；法院已经作出无效判决，并非等待预算调整。"}, "context_id": "context:text4-field-safety-label-c"}, {"id": "text4-federal-field-a", "family": "text4-federal-state-boundary", "target": "knock out / contested provisions / field preemption", "skill": "法律词组放回语境 + 联邦与州权限边界", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 55, "q": "A legal report says the court 'knocked out' three contested provisions in a state's licensing plan. The judgment adds that the national legislature had already 'occupied the field,' although the state rules did not directly contradict one specific national clause. Which paraphrase best captures the reasoning?", "o": ["The court delayed the dispute because the rules were too complicated.", "The court struck down the rules because national law covered this field.", "The court approved the rules as harmless additions to national policy.", "The court found that the state had contradicted two other states' own laws."], "a": 1, "exp": {"trans": "法院推翻了州计划中的争议条款，因为国家立法已经全面覆盖该领域。", "structure": "knocked out表示推翻；contested provisions是有争议的条款；although引导让步，说明即使没有直接违反某一条具体规定，也可能因为occupied the field而被排除。", "other": "knock out 推翻、使无效；contested 有争议的；provision 法律条款；occupy the field 全面覆盖某一立法领域。", "meaning": "判决的理由不是其他州的政策，也不是条款太复杂，而是国家立法已经全面规制该领域。parallel不自动等于contradict。", "rest": "延期审理与法院已经推翻条款不符；批准条款与invalidates相反；原文没有说州政策违反了另外两个州的法律。"}, "context_id": "context:text4-federal-field-a"}, {"id": "text4-federal-field-b", "family": "text4-federal-state-boundary", "target": "parallel rule vs direct conflict", "skill": "区分并行规定、直接冲突与领域排除", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 55, "q": "A national law creates a comprehensive safety-label system for medical devices. A state adds a parallel labelling rule. A court invalidates the state provision because the national law has occupied the field. Which inference is strongest?", "o": ["Resemblance to national rules is enough to void a state rule.", "National coverage can bar a state rule without a direct clash.", "The state rule conflicted with a neighbouring state's law.", "The court found the national safety-label law lacked authority."], "a": 1, "exp": {"trans": "国家法律建立了全面的医疗器械安全标签制度。某州又增加了一项并行的标签规定。法院因为国家法律已经全面覆盖该领域而判定州规定无效。最有力的推断是：即使没有直接矛盾，州规定也可能因领域排除而不能成立。", "structure": "creates与adds分别描述国家和州制定规则；because引出法院判决的原因。because the national law has occupied the field不是说两项规则必须逐字冲突，而是说明该领域已由国家立法全面规制。", "other": "comprehensive 全面的；labelling 标签规定；invalidate 判定无效；pre-empt 排除与之不相容的州层面规制。", "meaning": "parallel只表示并行或相应，并不自动等于contradict。判断权限问题时，要区分直接冲突与国家立法已占据整个领域这两种理由。", "rest": "类似不自动等于无效，关键是国家立法已全面覆盖该领域；判决没有依据邻州法律；法院承认国家规范的权威，并未否定它。"}, "context_id": "context:text4-federal-field-b"}], "process-stage-role": [{"id": "process-stage-shelter-approval-a", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 55, "target": "个人估计 vs 集体验证", "skill": "区分主张起点和取得认可所需条件", "q": "An analyst estimates that the city has room for 4,000 people in emergency shelters. Officials will use this figure for evacuation plans only after independent teams verify the counts and agree on a common estimate. What makes the figure suitable for official planning?", "o": ["The analyst's personal familiarity with the shelters.", "Verification and agreement across independent teams.", "The public release of a large numerical estimate.", "The analyst's decision to avoid revising the original number."], "a": 1, "exp": {"trans": "一位分析员估计城市应急避难所可容纳4000人；只有独立团队核查数据并就统一估计达成一致，政府才会在疏散计划中采用这一数字。", "structure": "An analyst + estimates + that从句提出最初主张；Officials + will use + this figure ... only after ...，only after指出主张转化为官方依据所需的条件。", "other": "emergency shelter 应急避难所；evacuation 疏散；estimate 估计；verify 核验。", "meaning": "题干问的是让一项初步主张获得认可所需要的机制。个人估计是起点，独立团队核查与达成一致是条件；不能因为看到analyst就选个人经验。", "rest": "个人熟悉情况只能解释估计如何产生；数字公开和规模大都不能自动证明可靠；拒绝修订反而与核查机制相冲突。"}, "context_id": "process-initial-report-independent-verification"}, {"id": "process-stage-bridge-warning-b", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 55, "target": "单次发现 vs 跨来源确认", "skill": "过程终点与条件的角色识别", "q": "A driver first reports cracks on a bridge, but the warning is not issued to the whole region until engineers compare photographs, inspect the structure, and confirm the hazard. What is required for the initial report to become an official warning?", "o": ["A more vivid description from the first driver.", "Agreement that the first driver deserves public credit.", "Public enthusiasm for an alarming photograph.", "Independent assessment and confirmation of the reported danger."], "a": 3, "exp": {"trans": "司机最先报告桥面裂缝，但直到工程师比对照片、检查结构并确认危险，地区警报才正式发布。", "structure": "A driver + reports + cracks引入起点；the warning + is not issued ... until engineers compare, inspect, and confirm，用not...until表示形成正式警报的必要过程。", "other": "crack 裂缝；structure 结构；hazard 危险；issue a warning 发布警报。", "meaning": "个人首次报告不等于正式被认可；由多个步骤进行独立评估并确认，才使主张具有可推广的效力。注意题目问required而非who noticed it first。", "rest": "报告更生动不能替代核验；给报告人荣誉不是警报成立条件；公众情绪不能替代工程检查。"}, "context_id": "process-initial-report-independent-verification"}, {"id": "process-stage-shipment-hold-decision-d", "family": "process-stage-role", "introduced": "2026-10-10", "published_on": "2026-10-15", "budget": 55, "target": "异常上报、暂停与放行", "skill": "按提问定位过程中的决定而非总选最后一步", "q": "A technician noticed an unusual label on a food shipment and asked a supervisor whether it should be checked. The supervisor marked the shipment 'hold', stopping dispatch. A laboratory later found the contents safe, and the quality manager signed the release form. Which event directly stopped the shipment from leaving?", "o": ["The technician's request for advice about the label.", "The supervisor's decision to put the shipment on hold.", "The laboratory's conclusion that the contents were safe.", "The quality manager's signature on the release form."], "a": 1, "exp": {"trans": "技术员发现一批食品的标签异常，询问主管是否应检查。主管将这批货标为暂扣，停止发运。实验室后来确认货物内容安全，质量经理签署了放行单。哪个事件直接阻止了货物运出？是主管作出的暂扣决定。", "structure": "The technician + noticed ... and asked ...是发现和上报；whether it should be checked是询问内容，其中should be checked为被动谓语。The supervisor + marked + the shipment + hold，后接stopping dispatch说明结果。found the contents safe为find加宾语和形容词补语；signed the release form属于后来的放行阶段。", "other": "shipment 一批货物；put on hold 暂停、暂扣；dispatch 发运；release form 放行单；contents 所装物品。", "meaning": "先确定题目问的是停止发运，而非最早发现异常、确认安全或最终放行。直接产生停运结果的是主管的暂扣决定。过程角色题必须按问题定位阶段，不能一概选最后的正式批准。", "rest": "技术员询问是否检查，是上报起点，文中实际停运由主管决定；实验室认定安全发生在之后，支持解除疑虑；经理签放行单允许后续运出，与停止运出方向相反。"}, "context_id": "context:process-stage-shipment-hold-decision-d"}], "text4-agreement-target": [{"id": "text4-flood-inspections-d", "family": "text4-agreement-target", "target": "what judges upheld vs legislative justification", "skill": "判断题干询问的是司法结论还是解释理由", "budget": 50, "q": "A court upheld municipal inspectors' limited role in checking flood barriers. In support, it cited a law inviting national and municipal teams to share inspection reports. What did the court uphold?", "o": ["National lawmakers were required to lead each municipal inspection.", "City inspectors could assist while complying with national rules.", "Municipal teams gained the right to replace national flood standards.", "National inspectors had to stop exchanging reports with city teams."], "a": 1, "exp": {"trans": "法院认可市政检查员在防洪设施检查中的有限作用，并援引鼓励国家和地方机构共享检查报告的法律作为依据。问题问法院认可的结论，而不是法律提供的支持理由。", "structure": "A court upheld是第一句核心司法结论；In support, it cited...是第二句介绍支持证据的结构。What did the court uphold要求回到第一句。", "other": "uphold 维持、认可；municipal 市政的；barrier 防洪设施；cite 引用；inspection 检查；comply with 遵守。", "meaning": "法院认可地方机构在法律约束下协助检查；国会的协作规定只是理由。不能把原因中的立法机关错认成法院同意的具体事项。", "rest": "立法机关亲自检查不是结论；市政机构没有权力替换国家标准；原文支持共享报告，不能推成停止共享。"}, "introduced": "2026-10-18", "published_on": "2026-10-18", "context_id": "context:text4-flood-inspections-d"}, {"id": "text4-agreement-target-a", "family": "text4-agreement-target", "target": "what the judges agreed on vs why", "skill": "题干询问对象 + 结论与理由分层", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 55, "q": "Judges agreed that county officers could verify residency status during certain enforcement encounters. The opinion explains that the national legislature had repeatedly encouraged joint national-local enforcement and information sharing. What did the judges agree on?", "o": ["The national legislature had taken over every local enforcement decision.", "Counties were independent of national law.", "Local authorities had a legitimate role in enforcement within legal limits.", "National officers were required to withhold information."], "a": 2, "exp": {"trans": "法官们同意，县级执法人员在某些执法接触中可以核查居住身份。判决解释说，国家立法机关一直鼓励国家与地方共同执法和共享信息。法官们达成一致的是：地方当局在法律允许的范围内拥有正当的执法角色。", "structure": "Judges agreed that...直接引出法官认可的结论；The opinion explains that...再引出支持这一结论的理由。不要把后一句的national legislature误当成题干询问的结论主体。", "other": "verify 核实；enforcement 执法；legitimate 正当的、合法的；withhold information 扣留信息、不提供信息。", "meaning": "题干问what did the judges agree on，先找法院允许什么，再看立法机关的政策如何解释该决定。理由提到了国会，不代表答案就是国会介入。", "rest": "没有说立法机关接管所有地方执法；地方仍受国家法律约束；原文支持信息共享，而非要求联邦人员隐瞒信息。"}, "context_id": "context:text4-agreement-target-a"}, {"id": "text4-agreement-target-b", "family": "text4-agreement-target", "target": "conclusion vs supporting reason", "skill": "区分司法结论与立法背景", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 55, "q": "A court allows city inspectors to check permit status while coordinating with national officers. The opinion cites a statute encouraging shared databases and joint inspections. Which statement is the court's conclusion rather than the supporting reason?", "o": ["The legislature encouraged coordination between national and local officials.", "Local inspectors may play a legitimate role within the enforcement system.", "Officials are encouraged to share information.", "National law no longer applies to local inspections."], "a": 1, "exp": {"trans": "法院允许城市检查员在与国家执法人员协调时核查许可证状态。判决援引了一项鼓励共享数据库和联合检查的法律。法院的结论是：地方检查员可以在执法体系中发挥正当作用。", "structure": "The court allows...陈述法院允许的行为；The opinion cites...介绍支撑理由的法律背景。问题要求找conclusion，因此应回到法院实际允许什么。", "other": "coordinate 协调；permit status 许可证状态；cite 引用；supporting reason 支持理由。", "meaning": "文章中的立法背景、理由和司法结论承担不同功能。即使理由出现得更显眼，也不能把它当成题干询问的结论。", "rest": "鼓励协调和共享信息都是支持理由；原文并未取消国家法律对地方检查的约束。"}, "context_id": "context:text4-agreement-target-b"}], "title-coverage": [{"id": "title-coverage-library-a", "family": "title-coverage", "introduced": "2026-10-03", "target": "标题覆盖全文 / 局部主题", "skill": "主旨标题覆盖范围", "budget": 55, "q": "短文先介绍图书馆除纸质借阅外的电子书、设备借用和线上课程，随后重点讨论线上课程的版权风险。哪个标题最能覆盖全文？", "o": ["Copyright Problems in Online Courses", "Beyond Printed Books: New Library Services", "Why E-books Will Replace Libraries", "The Only Safe Way to Teach Online"], "a": 1, "exp": {"trans": "文章先介绍图书馆在纸质书借阅之外提供的多种新服务，后文再重点讨论其中线上课程的版权风险。最合适的标题应覆盖多种新服务这一全文框架，而不是只概括后半部分。", "structure": "题干给出总框架到其中一项风险的篇章结构。标题需要同时解释前半部分为什么介绍多个服务，也能容纳后半部分的版权讨论。", "other": "printed book 纸质书；device lending 设备借用；copyright 版权；cover 覆盖。", "meaning": "标题题要找能统摄全文的上位概念。局部篇幅很长，也不能因此把局部主题当成全文主题。", "rest": "Copyright Problems in Online Courses只覆盖后半篇；Why E-books Will Replace Libraries加入取代主张；The Only Safe Way含Only且主题过窄。"}, "context_id": "context:title-coverage-library-a"}, {"id": "title-coverage-kitchen-evolution", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-10-05", "budget": 55, "target": "标题 / 全文发展主线", "skill": "主旨标题覆盖范围", "q": "短文追踪社区公共厨房如何从临时救灾供餐点转为日常共享备餐场所；中段介绍管理规则的变化，末段采访新加入的常住居民。哪个标题覆盖全文主线？", "o": ["Who Uses Community Kitchens Today", "From Emergency Meals to Shared Cooking", "Rules for Running a Disaster Kitchen", "Why Shared Kitchens Need New Buildings"], "a": 1, "exp": {"trans": "全文追踪公共厨房从灾时供餐到日常共享备餐的转变。From Emergency Meals to Shared Cooking意为“从应急供餐到共享烹饪”；其他标题分别聚焦当下使用者、灾时管理、未提到的新建筑需求。", "structure": "叙述按功能转变组织；规则变化和居民采访都是这一演变的证据。标题中的from...to...覆盖起点、终点及中间变化，而不仅是末段人物。", "other": "emergency meal 应急供餐；shared cooking 共享烹饪；resident 常住居民；disaster 灾害。", "meaning": "全文覆盖可以体现时间或功能发展的主线，不必总列出多个并行服务。结尾采访显眼，但不应代替文章的发展轴。", "rest": "Who Uses...只覆盖末段使用者；Rules for Running...只覆盖原有救灾角色的管理部分，漏掉转变；New Buildings引入未论述的建设需求。"}, "context_id": "context:title-coverage-kitchen-evolution"}, {"id": "title-coverage-local-energy-choices", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-10-05", "budget": 55, "target": "标题 / 比较框架与局部例证", "skill": "主旨标题覆盖范围", "q": "短文比较潮汐发电、屋顶太阳能、废热回收在沿海城市中的成本、时间限制与扩展条件。末段详细讨论废热管网维护，作为能源方案受当地条件影响的例子。哪个标题最好？", "o": ["Maintaining Urban Heating Pipes", "The Limits of Tidal Generation", "Replacing Solar Panels with Recovered Heat", "Energy Choices Shaped by Local Conditions"], "a": 3, "exp": {"trans": "文章比较三类能源方案的成本、可用时段与扩展条件，并用废热管网维护作例证。Energy Choices Shaped by Local Conditions是“由当地条件塑造的能源选择”。", "structure": "全文是多方案比较框架；末段维护细节从属于共同约束。标题中shaped by local conditions是修饰Energy Choices的过去分词短语，突出共同决定因素。", "other": "tidal generation 潮汐发电；solar panel 太阳能板；recovered heat 回收热量；local condition 当地条件。", "meaning": "标题要覆盖比较对象及比较所得的共同轴线。篇幅较长的末段案例不等于全文唯一对象。", "rest": "Maintaining...缩成末段管网维护；Limits of Tidal...只剩一种发电方式；Replacing Solar...虚构“以废热替代太阳能”的取舍结论，原文只说比较与条件约束。"}, "context_id": "context:title-coverage-local-energy-choices"}, {"id": "title-coverage-public-alerts-a", "family": "title-coverage", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 65, "target": "多阶段主题覆盖 / 防止只抓矛盾", "skill": "全文标题覆盖检验", "q": "A town once treated residents' road-hazard reports as isolated messages. It later built a system in which local volunteers gather reports, engineers check them, and officials publish verified travel advice. Advice is corrected when new evidence arrives. The town says repeated checking and revision—not merely the first report—has made the system dependable. Which title best covers the passage?", "o": ["Why Local Volunteers Sometimes Make Mistakes", "The Threat of False Reports at the Start of Every Journey", "How Road-Hazard Reports Become Trusted Public Advice", "A Debate over Whether Engineers Should Be Replaced"], "a": 2, "exp": {"trans": "小镇从最初零散的道路危险报告，发展到志愿者收集、工程师核查、官方发布，并根据新证据修订建议的流程。全文重点是信息如何逐步成为可靠的公共建议。", "structure": "once ... later ... when ... 的时间和条件连接展开过程；最后一句not merely the first report强调可信度来自持续核查与修订。", "other": "hazard 危险；isolated 零散的；verified 核实过的；dependable 可靠的。", "meaning": "标题需要覆盖‘初始信息→验证→公开→更新→可信’整条主线。仅强调最初的错误或一次争论，都只覆盖局部或无证据。", "rest": "志愿者犯错只是潜在局部问题；旅途中的虚假报告不是全文核心；替换工程师与原文分工核查相反。"}, "context_id": "context:title-coverage-public-alerts-a"}, {"id": "title-coverage-school-meals-b", "family": "title-coverage", "introduced": "2026-10-10", "published_on": "2026-10-10", "budget": 65, "target": "标题跨段覆盖 / 不凭字母分布", "skill": "选择覆盖发展主线的标题", "q": "A school district began by collecting students' complaints about lunch menus. Nutrition staff then tested alternative recipes, while parents and kitchen workers assessed cost and acceptance. Several proposals were changed after trials. The district now repeats the evaluation each year rather than treating its first reform as final. Which is the best title?", "o": ["The Hidden Cost of Hiring School Kitchen Workers", "From Lunch Complaints to an Evolving Food Program", "Why Students Reject Every Healthy Menu", "A Final Recipe That Ended School Food Debates"], "a": 1, "exp": {"trans": "学区从收集学生对午餐菜单的意见出发，经过营养人员测试、家长和食堂人员评估、试行后修改，并每年继续复评。主线是餐食方案逐步形成并不断演进。", "structure": "began by ... then ... after trials ... now ... each year组成完整发展顺序；rather than treating ... as final明确不是一次定案。", "other": "nutrition staff 营养工作人员；alternative recipe 替代食谱；assess 评估；trial 试行。", "meaning": "最佳标题应包含问题提出、集体检验和持续改进。不能因为某个字母此前少出现，就放弃更能覆盖全文的选项。", "rest": "雇员成本只是局部评估维度；every healthy menu属于无依
