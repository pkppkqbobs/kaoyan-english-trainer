<script>window.REVIEW_DATA={"date": "2026-11-19", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2019 英语一 Section I (Cloze) · 2026-11-19 纸质真题复盘 · 本篇问题 4 题 + 历史弱项 4 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-11-19-2019-cloze", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本轮结果被GitHub接收并经Actions核验后，才会进入后续间隔复习；未提交的浏览器作答只保存在本地。", "questions": [{"id": "r18t4-bare-disclosure", "family": "bare-minimum-meaning", "introduced": "2026-11-17", "published_on": "2026-11-17", "budget": 45, "reading_budget": 120, "format": "english1_reading", "passage": "An organisation has promised greater openness about executive pay. Its first report lists a broad salary range and the date when the pay committee met. It gives no explanation of the criteria used or whether benefits beyond salary were included. The information is accurate, but readers cannot tell why one executive receives more than another.\n\nThe report meets the bare minimum of the organisation's publishing policy. That is different from giving staff enough information to understand a decision. Openness requires attention to the questions people need answered, not just confirmation that the smallest required set of figures has appeared on a website.", "q": "Calling the report \"the bare minimum\" suggests that it", "o": ["provides unreliable figures about executive salaries.", "offers only the least information required by the policy.", "explains the pay committee's decisions in useful detail.", "exceeds what employees need to understand the policy."], "a": 1, "target": "bare minimum强调最低限度，不等于充分透明", "skill": "bare minimum强调最低限度，不等于充分透明", "origin_session": "2026-11-17-2018-text4", "answer_support": "the smallest required set of figures", "exp": {"trans": "报告数字准确，却只满足公布规则的最低要求，仍不足以解释薪酬决定。", "structure": "先指出已有信息和遗漏，再区分最低合规与充分解释。", "other": "bare minimum：最低限度；criteria：标准。", "meaning": "正确项保留仅达到最低要求的程度，不能扩成信息虚假或已充分披露。", "rest": "原文说数字准确；也明确说读者仍不能理解决定，所以充分解释和超过需要都不成立。"}, "context_id": "r18t4-reading:bare-disclosure"}, {"id": "pb18-workshop-close", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-18", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "A cooperative opened a shared workshop where small furniture businesses could hire machines by the hour. One group of owners thought the main benefit would be lower costs. After a year, the coordinator found that many members were also borrowing measuring tools, sharing suppliers and giving advice about how to train new staff.\n\nThe cooperative has therefore started measuring more than the number of bookings. It asks businesses to record when sharing equipment has led to an exchange of skills or a joint order. The coordinator wants those accounts to inform future decisions about which resources the workshop should provide.", "q": "Which of the following would make the most appropriate final paragraph?", "o": ["The new figures can show both how often firms hire the machines and how their work together has changed.", "The new figures should help explain why workshop owners can now take on extra orders without speaking to other businesses.", "The next step is to choose a single method of training so that every business can offer its workers the same instruction.", "The chief task for the cooperative is now to decide whether the hourly rate can be used to estimate future building costs."], "a": 0, "target": "结尾须回收共同资源与长期协作", "skill": "结尾须回收共同资源与长期协作", "origin_session": "2026-11-18-2018-partb", "answer_support": "It asks businesses to record when sharing equipment has led to an exchange of skills or a joint order.", "exp": {"trans": "共享车间的价值既有机器使用成本，也有人际协作。运营方开始记录设备共享带来的互助。", "structure": "从创办目标到观察到的新作用，再转入如何核算两类收益。", "other": "cooperative 合作组织，joint order 联合订单，inform 为决策提供依据。", "meaning": "合适结尾同时回收机器使用与企业互助，也解释为何增加记录。", "rest": "不沟通就增加订单反转互助，统一培训方案添加政策，建造成本把主题转到原文没有展开的预算。"}, "context_id": "pb18:furniture-workshop-measures"}, {"id": "r18t4-title-timetable", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-11-17", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "A school district has responded to falling reading scores by buying extra tutoring hours. The help is welcome, particularly for pupils who have missed lessons. Yet the district's own review found that frequent timetable changes were repeatedly interrupting the normal reading classes. Paying for more teaching after school leaves that problem untouched.\n\nThe tutoring contract may prevent some pupils from falling further behind. It should not become a reason to postpone a more awkward discussion about how the school day is organised. A system that regularly disrupts its own lessons cannot put matters right simply by purchasing additional ones. The extra help is useful; a dependable timetable is still essential.", "q": "Which of the following would be the best title for the text?", "o": ["Why Reading Scores Call for Rapid Action", "Extra Lessons Cannot Repair a Broken Timetable", "After-School Tutors Deserve Greater Recognition", "How Families Can Help Children Read at Home"], "a": 1, "target": "标题须包含作者对现有措施不充分的评价", "skill": "标题须包含作者对现有措施不充分的评价", "origin_session": "2026-11-17-2018-text4", "answer_support": "A system that regularly disrupts its own lessons cannot put matters right simply by purchasing additional ones.", "exp": {"trans": "额外辅导有用，但正常阅读课不断被打断，作者主张处理课程安排本身的问题。", "structure": "先认可补救，再指出根因仍在，末段要求把改善基本安排纳入对策。", "other": "dependable：可靠的；put matters right：纠正问题。", "meaning": "正确标题抓住额外辅导无法代替稳定课程安排的论点。快速行动与阅读下降相关，但不是作者最强调的区别。", "rest": "紧急行动只概括背景需求；肯定辅导教师、家庭阅读均非文章论证中心。"}, "context_id": "r18t4-reading:title-timetable"}, {"id": "cl19-reference-wage-chart", "family": "synonym-reference", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 50, "reading_budget": 100, "target": "these breaks 及图表中的缺口", "skill": "用相邻句寻找同义回指", "passage": "The figures in a local wage survey were collected each summer from 1970 until 1990. Four years are missing because the survey forms were lost before the results could be recorded. Early charts drew a single line across the missing years, creating the impression of steady changes for which no evidence existed. When the figures were republished, the editors left gaps in the line at the relevant dates. These breaks warn readers against treating the line as a continuous record.", "q": "What do \"these breaks\" refer to?", "o": ["Changes in the wages reported by employers.", "Intervals between the dates of publication.", "Periods when employment fell in the area.", "Spaces in the chart where data are missing."], "a": 3, "answer_support": "the editors left gaps in the line at the relevant dates", "exp": {"trans": "当地工资调查有四年的表格丢失。早先的图表跨过这些年份直接连线，营造了变化连续的印象。重发数据时，编辑在对应位置把线断开，提醒读者这些年份缺少记录。", "structure": "数据遗失导致年份缺失。编辑用断开的线表示缺失，下一句用 These breaks 重提图上这些缺口，并说明它们的作用。", "other": "wage（工资）、figure（数字）、republish（重新发布）、continuous（连续的）。", "meaning": "breaks 在这里指连续线条的断开处。these 指向前一句已经明确出现的 gaps。", "rest": "工资变化、两次出版的间隔和就业下滑都是不同事件。图表断线标明没有记录，这些空白本身不足以推出任何工资或就业变化。"}, "context_id": "cl19:missing-years-in-wage-data"}, {"id": "cl19-spot-bulletin", "family": "spot-verb-meaning", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 50, "reading_budget": 100, "target": "spot 的观察发现义", "skill": "用事件中的动作辨认熟词词义", "passage": "The editor of a weekly bulletin found that a second reading on screen rarely caught small omissions. Writers knew what they had meant to say and mentally supplied the missing words as they read. She asked them to exchange drafts and read a printed copy aloud. This took only a few extra minutes, but the readers could spot omissions that had survived earlier checks. The final decision about wording remained with the person who wrote the piece.", "q": "The word \"spot\" in the text is closest in meaning to", "o": ["revise", "notice", "predict", "explain"], "a": 1, "answer_support": "the readers could spot omissions that had survived earlier checks", "exp": {"trans": "编辑发现作者熟悉自己想说的话，复读时容易在脑中补全漏掉的词。她让作者互换稿件并朗读纸稿，读者因而看出了先前校对遗漏的问题。最后怎样修改措辞仍由原作者决定。", "structure": "前两句讲作者漏查问题的原因。换稿朗读带来的结果是读者能发现问题。随后一句交代由谁决定如何改稿。", "other": "bulletin（简报）、omission（遗漏）、supply（补上）、wording（措辞）。", "meaning": "could spot omissions 表示能发现稿子里已经存在的漏词，notice 表达同一动作。", "rest": "revise 是修改，决定改法的仍是作者。predict 是预判之后会出现的问题，explain 是解释原因，两者均与发现已存在的遗漏不同。"}, "context_id": "cl19:proofreading-missing-words"}, {"id": "cl19-scene-side-labels", "family": "scene-evidence-chain", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 60, "reading_budget": 110, "target": "观察、原因与针对性行动", "skill": "根据相邻句的因果关系还原场景", "passage": "A furniture maker noticed that returns were rising even though customers were ordering the right parts. The error occurred in the storeroom, where boxes containing different fittings looked nearly identical. The boxes, which were stacked sideways to save space, had product numbers on the front and plain sides facing out. When two workers were asked to fill the same sample order, they picked different parts. The supervisor put the numbers on the sides of the boxes. Returns due to packing errors soon declined.", "q": "Why did the supervisor add numbers to the sides of the boxes?", "o": ["To identify parcels that customers had returned without the receipts.", "To let staff identify parts while the boxes were still on the shelf.", "To help customers look up alternative parts when supplies ran low.", "To indicate which boxes had already been checked before dispatch."], "a": 1, "answer_support": "The boxes, which were stacked sideways to save space, had product numbers on the front and plain sides facing out.", "exp": {"trans": "家具厂发现客户下对了单，退货却增加了。包装相近的配件箱横着堆放时，工作人员看不到印在正面的编号。两名员工按同一订单拿了不同配件后，主管把编号印到侧面，因配件装错造成的退货随即减少。", "structure": "先看异常，即同一订单拿出的配件不同。再找原因，即箱子横放使正面编号不可见。最后核对行动，把编号印在露出来的侧面。which were stacked sideways to save space 补充箱子的摆放方式。", "other": "fittings（配件）、sideways（横着）、fill an order（按订单配货）、dispatch（发货）。", "meaning": "侧面编号让工作人员不用翻箱便能分清配件。最后一句的 due to packing errors 修饰 returns，交代退货的原因。", "rest": "原文没有说客户缺收据、库存不够，或要用编号记录发货前的检查。新编号的位置针对的是货架上看不见原编号的问题。"}, "context_id": "cl19:stockroom-side-labels"}, {"id": "cl19-space-light-through-cloth", "family": "spatial-preposition", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 55, "reading_budget": 105, "target": "through 所表示的从内部穿过", "skill": "用语境重建运动的路径", "passage": "A team was testing a window shade for a reading room. A thick blind kept pedestrians from seeing inside, but it meant that people at the tables had to use lamps even on bright days. The second shade, which was made of tightly woven cloth, hid the desks from the street while allowing daylight to pass through the fabric. The designers could therefore leave the shade lowered for most of the afternoon without having to turn the lights on.", "q": "What happens when daylight passes \"through the fabric\"?", "o": ["It moves along the outer surface of the cloth.", "It reaches the room around the edges of the shade.", "It travels from one face of the cloth to the other.", "It falls on the pavement just beyond the window."], "a": 2, "answer_support": "hid the desks from the street while allowing daylight to pass through the fabric", "exp": {"trans": "阅览室第一种窗帘挡住街上视线，但白天也得开灯。第二种紧密织成的窗帘遮住了桌子，仍让日光透过布料，因此大部分下午可放下窗帘而不用开灯。", "structure": "which was made of tightly woven cloth 补充窗帘材质。主句说明第二种窗帘同时做到遮挡视线和透过日光，这两个效果解释了最后一句。", "other": "shade 和 blind 在这里都指窗帘或遮光装置。pedestrian 表示行人，woven 表示织成的。", "meaning": "through 说明光穿过布本身，从一侧到另一侧。carve a channel through packed snow 也是在材料内部开出一段通道。", "rest": "along 是沿着表面或边缘，around the edges 是绕开材料，beyond the window 只给出越过边界的位置。具体路径要看句子所说的动作。"}, "context_id": "cl19:daylight-through-a-shade"}, {"id": "e1r-volunteer-toast", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-17", "budget": 50, "reading_budget": 120, "format": "english1_reading", "passage": "The volunteers who run a community dining room are used to working while other people eat. For its anniversary, the organisers reversed that arrangement. Local restaurant staff prepared roast vegetables and bread, and the volunteers sat down together for a meal.\n\nBefore the food arrived, the chair raised her glass and proposed a toast to the team. It was a small gesture, but an appropriate one. Much of the work that keeps a community project alive goes unnoticed because it is done reliably and without fuss. An occasion that brings those people to the table can express thanks more clearly than another report listing how many meals they have served.", "q": "The word \"toast\" in Paragraph 2 refers to", "o": ["food warmed before a meal.", "a drink offered in honour of others.", "an increase in the volunteers' workload.", "a report on the dining room's results."], "a": 1, "target": "通过raise a glass与致谢语境辨析toast、roast及boost", "skill": "通过raise a glass与致谢语境辨析toast、roast及boost", "origin_session": "2026-11-17-reading-style", "answer_support": "the chair raised her glass and proposed a toast to the team", "exp": {"trans": "周年聚餐让平时服务他人的志愿者成为客人；主席举杯向团队致谢，作者借此强调对日常奉献的认可。", "structure": "先用角色反转介绍聚会，再描述举杯致谢，并说明这一行动的意义。", "other": "roast vegetables：烤蔬菜；propose a toast：提议祝酒；without fuss：默默而不张扬地。", "meaning": "raised her glass和to the team共同限定toast为向他人致意的祝酒，不是前文烤蔬菜或普通烤面包。", "rest": "加热食物混入了前段roast的语境；增加工作量误混boost；成果报告在末句出现，但不是举杯行动的含义。"}, "context_id": "english1-reading:volunteer-toast"}], "retry": {"bare-minimum-meaning": [{"id": "r18t4-bare-grant", "family": "bare-minimum-meaning", "introduced": "2026-11-17", "published_on": "2026-11-17", "budget": 45, "reading_budget": 120, "format": "english1_reading", "passage": "A grant allows a youth orchestra to hire a rehearsal room and pay the conductor. There is no money left for instrument repairs or travel to performances. The committee describes the grant as the bare minimum needed to keep rehearsals going, rather than a complete plan for developing the orchestra.\n\nThat description recognises a real benefit without exaggerating it. Rehearsals can continue, which matters to the players. But keeping one activity alive does not meet every requirement of a group that also hopes to perform and train new members. Further support would need to be judged against those wider aims.", "q": "The phrase \"bare minimum\" refers to support that is", "o": ["too unreliable to permit any rehearsal.", "greater than the orchestra can reasonably use.", "just enough to maintain the essential activity.", "intended solely for repairing old instruments."], "a": 2, "target": "最低限度有实际作用，但不等于全面满足需求", "skill": "最低限度有实际作用，但不等于全面满足需求", "origin_session": "2026-11-17-2018-text4", "answer_support": "the bare minimum needed to keep rehearsals going", "exp": {"trans": "资助能维持排练，但覆盖不了维修、演出交通和进一步发展，因此只是最低限度支持。", "structure": "先列支出与缺口，再承认基本支持的好处并限定其覆盖范围。", "other": "rehearsal：排练；exaggerate：夸大。", "meaning": "正确项是刚够维持核心活动。最低限度并非完全无效，也不是资源已经充裕。", "rest": "排练确能继续；维修尚无经费；超过所需与列出的缺口矛盾。"}, "context_id": "r18t4-reading:bare-grant"}], "paragraph-order-discourse": [{"id": "pb18-overview-stockroom", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-18", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "A theatre began lending its old stage equipment to local groups in the spring. The storekeeper expected to spend most of her time showing borrowers what was available. The scheme grew quickly, and she soon discovered that keeping items in use required work that had been easy to overlook.\n\n[Missing paragraph]\n\nOne of the first loans that spring shows why the return checks mattered. A group brought back a lighting stand with a cracked fitting. Because the storekeeper inspected it before putting it away, the fault was repaired before the next borrower arrived.", "q": "Which paragraph best fits the gap?", "o": ["The service set up a spring display so visitors could see which lights and costumes were available to borrow.", "At first the theatre kept the store open late. The additional hours made it easier for groups to collect equipment.", "The staff organised the work around booking, collection and inspection on return. Each task had its own checklist.", "Demand was especially high for racks and tables. Several groups asked whether they could keep these all summer."], "a": 2, "target": "概述环节后再写较早的具体实例", "skill": "概述环节后再写较早的具体实例", "origin_session": "2026-11-18-2018-partb", "answer_support": "One of the first loans that spring shows why the return checks mattered", "exp": {"trans": "剧院春季开始借出设备，材料空缺后用早期归还的一件器材说明为何要检查。", "structure": "前段留下维护流程的问题，后段以还件检查的实例展开。中间需先介绍借出及归还流程。", "other": "fitting 配件，inspection on return 归还时检查，cracked 有裂缝的。", "meaning": "正确段把预约、领取和归还检查放进同一流程，提供后文 return checks 的依据。初期案例放在流程概述之后仍自然。", "rest": "展示、延长开放时段和热门设备都有同一借用主题，也符合春季时间，却不能引出归还时对器材的检查。"}, "context_id": "pb18:theatre-equipment-inspection"}, {"id": "pb18-cause-watering", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-18", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "The allotment association noticed that several plots stayed dry even when others were watered often. Members first suspected that a pipe leaked. A survey showed instead that the early watering slot was the only one available to both ends of the site, and gardeners living farther away could seldom arrive in time.\n\n[Missing paragraph]\n\nUnder the new timetable, the outer plots could draw water in the evening, when more holders were able to come. The association later checked whether the former dry patches were still concentrated in the same part of the site.", "q": "Which paragraph best fits the gap?", "o": ["The committee asked each household to pay towards repairs, even if its plot had never suffered from a leak.", "The committee set out different watering hours, with a later slot for gardeners on the outer plots.", "The committee encouraged gardeners to choose plants that need less water during a dry season.", "The committee found that plots near the gate had been divided recently and began to review their sizes."], "a": 1, "target": "困难、调整方案与结果的因果链", "skill": "困难、调整方案与结果的因果链", "origin_session": "2026-11-18-2018-partb", "answer_support": "Under the new timetable, the outer plots could draw water in the evening", "exp": {"trans": "外侧地块缺水，调查发现时段不合适而非管道漏水。空缺后写时段调整的作用。", "structure": "先排除漏水并找到排班原因，再应有建立新时段的措施，最后检查效果。", "other": "allotment 分租的小块菜地，holder 使用者，draw water 取水。", "meaning": "正确段直接处理外侧地块的时段困难，也为后文的 new timetable 建立所指。", "rest": "筹修理费仍归因于漏水，耐旱植物与地块大小都没有解释后文为何出现新取水时段。"}, "context_id": "pb18:allotment-watering"}], "title-coverage": [{"id": "r18t4-title-swift-reform", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-11-17", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "Applicants for a training grant used to submit the same address details to three offices. A mismatch between the forms could delay an otherwise complete application for weeks. After staff traced the problem, the offices agreed to use one shared form. The change was introduced within days, and most applications could then move through the system without repeated checks of identical information.\n\nThere is a temptation to judge a reform's seriousness by how long it takes. This case points the other way. The change was quick because the obstacle was specific and the people involved had authority to remove it. Speed did not make the improvement superficial; it spared applicants another season of unnecessary delay.", "q": "Which of the following would be the best title for the text?", "o": ["A Grant Scheme in Need of More Patient Applicants", "The Risks of Sharing Information Between Offices", "A Swift Reform with Lasting Practical Benefits", "Why Major Reforms Must Begin with Longer Forms"], "a": 2, "target": "不把快速解决一律误判成临时补救", "skill": "不把快速解决一律误判成临时补救", "origin_session": "2026-11-17-2018-text4", "answer_support": "Speed did not make the improvement superficial", "exp": {"trans": "重复填表造成等待，统一表格迅速移除了具体障碍。作者强调迅速并不等于表面应付。", "structure": "第一段呈现原因、行动与结果，第二段明确评价速度与改革价值的关系。", "other": "superficial：表面的；trace：查明；obstacle：障碍。", "meaning": "本文恰好支持快速且有效的改革。标题判断必须跟随材料，不能学成见到quick就排除。", "rest": "要求申请人更耐心、警惕信息共享或延长表格，均不符合作者对这次改革的肯定。"}, "context_id": "r18t4-reading:title-swift-reform"}, {"id": "e1r-digital-library", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-11-17", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "Public libraries have spent heavily on faster internet connections and new computers. For residents without reliable access at home, those investments matter. Yet librarians report that some visitors still leave without completing the task that brought them in. A working computer is little help to someone unsure how to fill in an online form or judge whether a message is genuine.\n\nSeveral libraries are now assigning staff to offer short, practical sessions alongside the equipment. The service costs money and takes time away from other duties. But if public access is to mean more than a row of available screens, helping people use the connection deserves a place in the budget too.", "q": "Which of the following would be the best title for the text?", "o": ["Bringing Every Library Service Online", "A Better Connection Is Only a Beginning", "Making Public Computers Pay Their Way", "Why Libraries Are Losing Their Readers"], "a": 1, "target": "标题概括问题与解决方向，不只复现一个话题词", "skill": "标题概括问题与解决方向，不只复现一个话题词", "origin_session": "2026-11-17-reading-style", "answer_support": "helping people use the connection deserves a place in the budget too", "exp": {"trans": "图书馆配置网络和电脑后，部分读者仍缺少使用技能；作者主张把人员指导也纳入公共数字服务。", "structure": "从硬件投入的成效和不足，推进到实用指导的需求与经费，形成“连接只是起点”的论点。", "other": "genuine：真实的；assign：安排；alongside：与……同时。", "meaning": "正确标题同时覆盖硬件有用和仅有硬件不够这两层观点，包含文章后半部分提出的支持措施。", "rest": "把所有服务搬到线上不是文章主张；让电脑挣钱误读了公共预算讨论；文章也没有说图书馆正在失去读者。"}, "context_id": "english1-reading:digital-library"}, {"id": "e1r-empty-shops", "family": "title-coverage", "introduced": "2026-10-03", "published_on": "2026-11-17", "budget": 65, "reading_budget": 120, "format": "english1_reading", "passage": "An empty shop is more than a gap in a shopping street. When several remain vacant, fewer people pass through, and the surviving businesses lose customers. Simply advertising the empty units has done little where the rent and the cost of fitting out a whole shop are beyond a new trader's reach.\n\nA local partnership is now dividing several units into small shared spaces. Traders pay for a stall and basic services instead of taking on an entire building. The arrangement will not rescue every shopping street, but it tackles one reason premises stay unused. Reviving a high street may depend less on finding a single large tenant than on making room for several small ones.", "q": "Which of the following would be the best title for the text?", "o": ["Why Small Shops Need Larger Buildings", "The Cost of Advertising Vacant Properties", "Giving Empty Shops a Shared Future", "How Large Retailers Choose Their Tenants"], "a": 2, "target": "从整篇主线概括复兴途径，而非选择背景细节作标题", "skill": "从整篇主线概括复兴途径，而非选择背景细节作标题", "origin_session": "2026-11-17-reading-style", "answer_support": "Reviving a high street may depend less on finding a single large tenant than on making room for several small ones.", "exp": {"trans": "空铺加剧街区衰落，整间租用费用又阻挡小商户进入；共享铺位降低门槛，为街区复兴提供一种途径。", "structure": "先说明空置问题和原有办法的不足，再解释共享方案及其适用限度。", "other": "premises：经营场所；fit out：装修配备；tenant：租户。", "meaning": "正确标题覆盖空铺问题和共享利用的解决方向。它没有承诺所有街区都能因此获救。", "rest": "更大的建筑与小商户实际面临的负担相反；广告费用只是背景且非主线；文章不讨论大型零售商挑选租户。"}, "context_id": "english1-reading:empty-shops"}], "synonym-reference": [{"id": "cl19-reference-tutoring-slots", "family": "synonym-reference", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 50, "reading_budget": 100, "target": "用同义词承接已出现的时段", "skill": "核对回指对象及其在后续动作中的作用", "passage": "Needing space for study groups, a college considered opening another room. The bookings office discovered that three rooms were already vacant for short periods after regular classes ended. The empty slots were too brief for a full lecture, but long enough for a tutoring session. Advisers began reserving these openings for students who wanted help between classes. As the rooms could still be used for teaching at other times, the college was able to run the study groups without adding classrooms.", "q": "What did the advisers reserve for the students?", "o": ["Spare places in the regular college classes.", "Short intervals in the existing room schedules.", "New rooms set aside for meetings and lectures.", "Breaks taken by students during their lectures."], "a": 1, "answer_support": "The empty slots were too brief for a full lecture, but long enough for a tutoring session.", "exp": {"trans": "学院原想增开教室，但管理人员发现现有的三间教室在正常课程结束后会短暂空着。空档不够上一整节课，却够安排一次辅导。导师预订这些时段，学院因此可以不增设教室。", "structure": "short periods、empty slots 和 these openings 三处连起来，指向教室课表上同一批空档。最后一句交代利用空档后的结果。", "other": "vacant（空着的）、slot（时段）、tutoring session（辅导课）、reserve（预订）。", "meaning": "导师预订的是正常课后现有教室可用的时段。", "rest": "常规课堂的座位、增设的教室和听课中的休息时间都不是这几段可预订的空档。between classes 写的是学生何时来接受辅导。"}, "context_id": "cl19:unused-classroom-time"}], "spot-verb-meaning": [{"id": "cl19-spot-photo-bands", "family": "spot-verb-meaning", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 50, "reading_budget": 100, "target": "用 spot 表达视觉发现", "skill": "区分发现、测量和记录这些相邻动作", "passage": "A testing laboratory lets new staff examine a set of photographs before they use the measuring equipment. At first, the staff are asked to say only whether anything looks unusual. They soon learn to spot the faint bands that indicate uneven lighting. Only after they have reported a band does a supervisor measure its width and label the image for the record. This order helps everyone compare what they could see with what the instruments later confirmed.", "q": "What does \"spot\" mean in the third sentence?", "o": ["Remove the bands from photographs.", "Measure the width of the bands.", "Recognise the bands in the images.", "Mark the bands for the record."], "a": 2, "answer_support": "They soon learn to spot the faint bands that indicate uneven lighting.", "exp": {"trans": "实验室让新员工先观察照片找异常，逐渐学会发现光照不均造成的淡条带。报告条带后，主管才量宽度、给图片做记录。这样可以对照肉眼所见与仪器核验。", "structure": "先看照片，再报告看到的条带。Only after 引出随后由主管完成的测量与记录，两步的动作和主体都不同。", "other": "equipment（设备）、faint（不明显的）、band（条带）、uneven lighting（不均匀的照明）。", "meaning": "spot 是靠观察注意到或认出照片上的条带。", "rest": "测量和存档发生在发现之后。文中没有让新员工去消除照片上的条带。"}, "context_id": "cl19:photo-inspection-before-measuring"}], "scene-evidence-chain": [{"id": "cl19-scene-recording-hum", "family": "scene-evidence-chain", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 60, "reading_budget": 110, "target": "用观察与验证解释下一步行动", "skill": "把现象、原因和后续行动连在一起", "passage": "An archive's project to transcribe oral histories ran into an unexpected problem. Recordings made in its new interview room contained a low hum, but recordings of the same speakers elsewhere were clear. The sound was strongest in interviews conducted near the air vent. A technician briefly turned off the fan, and the hum disappeared. Rather than asking speakers to repeat their accounts more loudly, the team moved the interview table and microphone to the quiet end of the room. It could then keep the fan running during interviews.", "q": "Why did the team move the interview table?", "o": ["To let the speakers repeat passages without stopping the fan.", "To pick up the speech of visitors who sat farther from the table.", "To improve sound quality in all the archive's interview rooms.", "To record farther from the source of the background noise."], "a": 3, "answer_support": "The sound was strongest in interviews conducted near the air vent. A technician briefly turned off the fan, and the hum disappeared.", "exp": {"trans": "档案馆新访谈室的录音里有低沉的嗡嗡声，相同受访者在别处的录音却很清楚。通风口附近录到的噪音最强，停风扇时它消失。团队把访谈桌和麦克风移到较安静的一端，访谈期间仍可开风扇。", "structure": "先比较同一批人不同地点的录音，再用停风扇验证嗡嗡声的来源，最后移动录音位置。rather than 引出团队没有采用的应对办法。", "other": "transcribe（转写）、oral history（口述史）、hum（低沉的嗡嗡声）、air vent（通风口）。", "meaning": "录音难辨与通风噪音的位置有关。移动访谈桌让麦克风远离噪音最强的位置。", "rest": "请受访者重复是文中未采用的办法。文中没提到远座位上的访客，措施也只针对这一间访谈室。"}, "context_id": "cl19:oral-history-background-noise"}], "spatial-preposition": [{"id": "cl19-space-buoy-boundary", "family": "spatial-preposition", "introduced": "2026-11-19", "published_on": "2026-11-19", "origin_session": "2026-11-19-2019-cloze", "format": "english1_reading", "budget": 55, "reading_budget": 105, "target": "beyond 与沿边、横穿的空间区别", "skill": "以文中地标判断位置与经过的区域", "passage": "A field worker surveyed the eelgrass growing near the mouth of a harbour. She marked out a strip along the sea wall so that later teams could repeat the count. She found the plants within this strip, but could not tell whether they reached beyond the line of buoys that marked its seaward edge. A second team took a boat across the strip the following week and counted plants farther out. The extended survey helped show where the beds ended.", "q": "Which area does \"beyond the line of buoys\" describe?", "o": ["The water between the sea wall and the buoys.", "The water farther out than the marker buoys.", "The water immediately around the marker buoys.", "The part of the strip nearest the sea wall."], "a": 1, "answer_support": "beyond the line of buoys that marked its seaward edge", "exp": {"trans": "调查人员先沿海堤划出一条带状区域，发现里面有鳗草，但不知道鳗草是否延伸到外侧浮标线以外。第二组后来乘船横穿这一区域，到更远的水域统计，帮助确定鳗草丛的边界。", "structure": "海堤和浮标线确定了最初的调查范围。that marked its seaward edge 说明浮标标的是条带朝海的一侧。后句的 farther out 指向同一方向。", "other": "eelgrass（鳗草）、sea wall（海堤）、buoy（浮标）、seaward（朝海的）。", "meaning": "beyond the line 描述超过这条边界的位置，沿文中的方向是浮标线外更靠海的水域。", "rest": "两个在条带内的选项都没有越过浮标线。浮标周围也未必在线外。文中的 along 表示沿海堤延伸，across 表示从条带一侧到另一侧的移动。"}, "context_id": "cl19:eelgrass-survey-boundary"}], "boast-boost-distinction": [{"id": "e1r-skills-grant", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-17", "budget": 50, "reading_budget": 120, "format": "english1_reading", "passage": "A training centre used to offer evening courses in a building with unreliable heating and little space for practical work. A grant has paid for repairs and allowed tutors to run smaller groups. The centre expects these changes to boost attendance, particularly among adults who had stopped coming after the first few weeks.\n\nNew facilities alone will not guarantee that result. Courses must also fit around work and family commitments. Even so, removing problems that made attendance uncomfortable gives the centre a better chance of keeping its learners. The grant is intended to strengthen participation, rather than simply produce a more impressive building for the next brochure.", "q": "The word \"boost\" in Paragraph 1 is closest in meaning to", "o": ["record.", "praise.", "predict.", "increase."], "a": 3, "target": "在文章语境中区分boost的提升义与boast的夸耀义", "skill": "在文章语境中区分boost的提升义与boast的夸耀义", "origin_session": "2026-11-17-reading-style", "answer_support": "The grant is intended to strengthen participation", "exp": {"trans": "拨款改善教室和小班条件，中心希望吸引更多成人持续参加；作者指出课程时间也要适应生活安排。", "structure": "先介绍改善条件及预期作用，再保留效果实现的条件，末句概括拨款目标。", "other": "boost：提升、增加；commitment：必须履行的工作或家庭事务；attendance：出勤、参加人数。", "meaning": "后文strengthen participation说明boost attendance指增加参加。它不是boast所表示的夸耀，也不等于记录或预测。", "rest": "record只记录数量；praise评价数量好坏；predict预测数量，均没有表达提升参与的作用。"}, "context_id": "english1-reading:skills-grant"}, {"id": "e1r-careers-centre", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-17", "budget": 50, "reading_budget": 120, "format": "english1_reading", "passage": "A university brochure says its careers centre boasts advisers from a wide range of industries. For a student wondering where a degree might lead, that sounds reassuring. An engineer, an editor and a charity manager may offer different pictures of working life.\n\nThe important test, however, is whether students can actually meet them. Advisers who appear in a brochure but have no time for appointments contribute little to everyday guidance. Publishing the number of available sessions would tell applicants more than an impressive list of names. A university can possess an excellent resource without making it easy for the people who need it to benefit.", "q": "The word \"boasts\" in Paragraph 1 most nearly means", "o": ["has.", "increases.", "criticises.", "consults."], "a": 0, "target": "boast可表示以拥有……为傲，不能因形近而读成boost", "skill": "boast可表示以拥有……为傲，不能因形近而读成boost", "origin_session": "2026-11-17-reading-style", "answer_support": "A university can possess an excellent resource without making it easy for the people who need it to benefit.", "exp": {"trans": "宣传册说就业中心拥有行业背景多样的顾问。作者认为真正重要的还在于学生能否实际预约和使用这项资源。", "structure": "先介绍宣传优势，再追问实际可用性，并区分拥有资源与充分提供服务。", "other": "boast：拥有值得自豪的事物；appointment：预约；guidance：指导。", "meaning": "boasts advisers指拥有一批值得宣传的顾问；这里不是夸大数量，也不表示新增加了一批顾问。", "rest": "increases把boast误作boost的增加义；criticises反转了宣传中的正面描述；consults是向顾问咨询，不是拥有这项资源。"}, "context_id": "english1-reading:careers-centre"}]}, "article_session": {"id": "2026-11-19-2019-cloze", "source": "2019 英语一 Section I (Cloze) · 2026-11-19 纸质真题复盘", "creat
