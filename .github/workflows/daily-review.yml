name: Daily review state

on:
  schedule:
    # Start after midnight in Asia/Shanghai to leave time for GitHub dispatch delays.
    # Asia/Shanghai 00:17, 01:43, 03:27 (Tokyo 01:17, 02:43, 04:27).
    - cron: '17 16 * * *'
    - cron: '43 17 * * *'
    - cron: '27 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-review.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'data/base-bank.json'
      - 'data/questions/**'
      - 'data/learning-notes.json'
      - 'data/quality-exclusions.json'
      - 'data/article-sessions/**'
      - 'data/source-checks/**'
      - 'data/partb-questions/**'
      - 'data/question-contexts.json'
      - 'data/question-retirements.json'
      - 'data/question-presentations.json'
  issues:
    types: [opened, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-state
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[TRAINING_RESULT]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - name: Record trigger and study date
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          printf 'Event: %s\nCron (UTC): %s\n' "$GITHUB_EVENT_NAME" "${TRIGGER_CRON:-none}"
          date -u '+Actual start (UTC): %F %T'
          TZ=Asia/Shanghai date '+Study date (Asia/Shanghai): %F'
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Test review logic and question schema
        run: python3 -m unittest discover -s tests -v
      - name: Test browser-side interaction logic
        run: |
          node --check web/review.js
          node tests/ui.mjs
          node --check web/partb-core.js
          node --check web/partb.js
          node --check web/partb-home.js
          node --check scripts/question_bank_audit.mjs
          node tests/partb-ui.mjs
      - name: Read submitted results and build daily quiz
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/run_daily.py --sync
      - name: Build latest article review if present
        run: python3 scripts/article_review.py
      - name: Build independent Part B training and history
        run: python3 scripts/partb_review.py
      - name: Build synchronized session handoff
        run: python3 scripts/build_session_handoff.py
      - name: Preserve generated daily history
        run: |
          git add -- today.html data archive SESSION_HANDOFF.md
          if [ -f article-review.html ]; then git add -- article-review*.html; fi
          if [ -f partb-review.html ]; then git add -- partb-review.html partb-history.html; fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update daily review and spaced-repetition state'
            git push origin HEAD:main
          fi
