<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考研英语词汇/搭配小测</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#3157d5;--good:#087443;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.brand{font-weight:900}.bar{flex:1;height:7px;background:#e7eaf0;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #1018280d}.target{display:inline-block;background:#eef2ff;color:#303f9f;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.q{white-space:pre-line;font-size:18px;line-height:1.65;margin:16px 0}.opts{display:grid;gap:10px}.opt{border:1px solid var(--line);background:white;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:15px}.opt:hover{border-color:#aab7ff;background:#f8faff}.opt.good{background:var(--goodbg);border-color:#6ce9a6}.opt.bad{background:var(--badbg);border-color:#fda29b}
.row{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f5}.status{font-weight:800}.ok{color:var(--good)}.no{color:var(--bad)}.exp{margin-top:12px;display:none}.exp.show{display:block}.blk{border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px 11px;margin:6px 0;line-height:1.55;font-size:14px}.finish{text-align:center;padding:28px 0}.big{font-size:44px;font-weight:900}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@media(max-width:640px){.wrap{padding:8px}.card{padding:13px}.q{font-size:16px}.opt{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">考研英语 · 词汇/搭配</div><div class="bar"><div id="bar"></div></div><div class="muted" id="counter"></div></div>
<div class="card" id="app"></div>
</div>
<script>
const bank=[{"target":"be subject to / be subjected to","stem":"① Under the city’s rental rules, any rent increase is ___ review by an independent board.\n② In the durability test, the helmets were ___ repeated impacts from a mechanical arm.","options":["subject to / subjected to","subjected to / subject to","subjecting to / subjected to","subjected to / subjecting to"],"answer":0,"exp":["① 根据城市租赁规定，任何租金上涨都须接受独立委员会审查。② 在耐久性测试中，头盔经受了机械臂的反复撞击。","① any rent increase + is + subject to review；② the helmets + were subjected to + repeated impacts。前者是规则/状态，后者是被施加的过程。","rental rules＝租赁规定；independent board＝独立委员会；durability test＝耐久性测试；impact＝撞击。","be subject to＝须经/受制于/可能受到；be subjected to＝被施加、被置于某过程。","B 把两者语义方向颠倒；C/D 的 subjecting 形式与句子结构不成立。"]},{"target":"even / ever / over","stem":"___ the past ten years, no restoration project has ___ attracted this much attention, and ___ local schoolchildren now recognize the artist’s name.","options":["Even / over / ever","Over / ever / even","Ever / even / over","Over / even / ever"],"answer":1,"exp":["在过去十年里，从没有哪个修复项目曾吸引这么多关注，甚至连当地小学生现在都认识这位艺术家的名字。","Over the past ten years 作时间状语；has ever attracted 是完成时中的“曾经”；even local schoolchildren 表示“甚至连……”。","restoration project＝修复项目；attract attention＝吸引注意；recognize＝认出/认识。","over＝在……期间；ever＝曾经；even＝甚至。","A/C/D 都把三个副词/介词的位置放错，导致搭配或语义不自然。"]},{"target":"end up doing","stem":"“他本来只打算试用这个软件几分钟，结果最后把整个数据库重新整理了一遍。” 哪句最自然？","options":["He ended up reorganizing the whole database.","He ended to reorganize the whole database.","He ended up to reorganize the whole database.","He was ended up reorganizing the whole database."],"answer":0,"exp":["他结果最后把整个数据库重新整理了一遍。","He + ended up + reorganizing...；end up 后接动名词。","reorganize＝重新整理；database＝数据库；intend to＝打算。","end up doing＝结果最后做了某事。","B/C 错在 end up 后不能接 to do；D 不需要被动。"]},{"target":"account（记述）","stem":"Her account of the mountain rescue differed sharply from the official report released the next morning.\n这里 account 最接近：","options":["账户","记述、叙述","利息","计算"],"answer":1,"exp":["她对那次山地救援的叙述，与第二天早上发布的官方报告有很大出入。","Her account ... differed sharply from the official report。主语是 Her account，谓语 differed。","mountain rescue＝山地救援；differ from＝与……不同；official report＝官方报告。","account of sth＝对某事的记述、叙述。","account 也可表示账户；interest 才是利息；calculation 才是计算。"]},{"target":"constraint / constrain","stem":"Limited floor space is the main ___ on the project, and it may ___ the number of machines the lab can install.","options":["constrain / constraint","constraint / constrain","constraint / constraint","constrain / constrain"],"answer":1,"exp":["有限的场地空间是这个项目的主要限制因素，而且它可能限制实验室能安装的机器数量。","the main constraint：名词；may constrain：情态动词后接动词原形。","floor space＝可用地面空间；install＝安装；lab＝实验室。","constraint＝限制/制约因素；constrain＝限制、约束。","A 词性颠倒；C 第二空需要动词；D 第一空需要名词。"]},{"target":"fall victim of bias（真题原文措辞）","stem":"下面哪一句严格保留 2009 真题选项中的实际措辞，表达“因偏见而受害”？","options":["The selection process may fall victim of bias.","The selection process may fall victim to bias.","The selection process may be victim to bias.","The selection process may fall a victim from bias."],"answer":0,"exp":["该选拔过程可能沦为偏见的受害者。","The selection process + may fall victim of + bias。","selection process＝选拔过程；bias＝偏见；victim＝受害者。","本题只考真题原文措辞：fall victim of bias。","扩展用法：现代英语更常见 fall victim to sth / be a victim of sth；B 属于常见扩展，但不是该真题选项原文。C/D 搭配错误。"]},{"target":"remote / be far removed from","stem":"At first, the chance of recovering the deleted files seemed ___. Yet the backup they finally found was ___ the latest version: several months of work were missing.","options":["far removed / remote from","remote / far removed from","remote from / far removed","remotely / removed far from"],"answer":1,"exp":["起初，恢复被删除文件的可能性似乎很渺茫。然而，他们最后找到的备份与最新版本相差很远：几个月的工作都缺失了。","the chance ... seemed remote；the backup ... was far removed from the latest version。","recover＝恢复；deleted files＝被删文件；backup＝备份；latest version＝最新版本。","remote＝渺茫的；be far removed from＝与……相距甚远/差别很大。","A/C/D 都不符合固定搭配或词性。"]},{"target":"keep one's end up","stem":"Despite joining the debate team only a week earlier, Lena managed to keep her end up against speakers with years of experience.\n这里 keep her end up 最接近：","options":["把发言拖到最后","做好自己应做的部分，并能顶住对手","坚持站在队伍末尾","信守最后一个承诺"],"answer":1,"exp":["尽管 Lena 一周前才加入辩论队，她面对有多年经验的辩手时仍能顶住并做好自己该做的部分。","Lena + managed to keep her end up + against speakers...。","despite＝尽管；debate team＝辩论队；manage to＝设法做到。","keep one's end up＝尽好自己的责任、撑住场面、不落下风。","其余选项都是把 end 按字面“末尾”理解，或误解成承诺。"]},{"target":"standard（通行的、普遍采用的）","stem":"By the 1990s, digital editing had become standard practice in many publishing houses.\n这里 standard 最接近：","options":["标准尺寸的","标准答案","通行的、普遍采用的","高水平的"],"answer":2,"exp":["到20世纪90年代，数字编辑已经成为许多出版社普遍采用的做法。","digital editing + had become + standard practice。","publishing house＝出版社；practice＝做法；digital editing＝数字编辑。","standard practice＝通行做法、普遍采用的惯例。","A/B 是 standard 的其他常见含义；D 把 standard 误解成“高水平”。"]},{"target":"preposition + which","stem":"The city adopted a licensing system. Under the system, street vendors may operate only in designated areas.\n哪一个合并最正确？","options":["The city adopted a licensing system under which street vendors may operate only in designated areas.","The city adopted a licensing system which under street vendors may operate only in designated areas.","The city adopted a licensing system under that street vendors may operate only in designated areas.","The city adopted a licensing system which street vendors may operate under only in designated areas."],"answer":0,"exp":["这座城市采用了一套许可制度，在该制度下，街头摊贩只能在指定区域经营。","原始简单句：Street vendors may operate under the system. → the system under which street vendors may operate。再把它嵌回主句。","licensing system＝许可制度；street vendor＝街头摊贩；designated area＝指定区域。","介词 under 前置后，指物用 which：under which。","B 语序错误；C 前置介词后不能用 that；D 虽可理解，但结构笨拙且与原句要求的 under which 不符。"]},{"target":"so long as","stem":"You may use the studio after hours ___ you lock the door and switch off all the equipment before leaving.","options":["so long as","in case","as far as","even if"],"answer":0,"exp":["只要你离开前锁门并关闭所有设备，你就可以在非开放时间使用工作室。","主句 You may use...；so long as 引导条件状语从句。","after hours＝非开放时间；switch off＝关闭；equipment＝设备。","so long as＝只要。","in case＝以防；as far as＝就……而言/到……程度；even if＝即使。"]}];
const STORE='vocab_quiz_2026_09_27_v1';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{order:bank.map((_,i)=>i),pos:0,answers:{},wrong:[],mode:'all'};
const app=document.getElementById('app'), bar=document.getElementById('bar'), counter=document.getElementById('counter');
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function key(idx){return state.mode+'_'+idx}
function render(){
 if(state.pos>=state.order.length){finish();return}
 const idx=state.order[state.pos],q=bank[idx],s=state.answers[key(idx)];
 counter.textContent=(state.pos+1)+' / '+state.order.length;
 bar.style.width=((state.pos)/state.order.length*100)+'%';
 app.innerHTML='<span class="target">【本题目标：'+q.target+'】</span><div class="q">'+q.stem+'</div><div class="opts">'+q.options.map((x,i)=>'<button class="opt '+(s&&i===q.answer?'good':'')+' '+(s&&i===s.pick&&i!==q.answer?'bad':'')+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join('')+'</div><div class="row"><span class="status '+(s?(s.ok?'ok':'no'):'')+'">'+(s?(s.ok?'✓ 正确':'✗ 错误'):'')+'</span>'+(s?'<button class="btn secondary" id="expBtn">查看解析</button><button class="btn primary" id="next">'+(state.pos===state.order.length-1?'查看结果':'下一题')+'</button>':'')+'</div><div class="exp" id="exp">'+q.exp.map((x,i)=>'<div class="blk"><b>'+['1. 【整句翻译】','2. 【句子主干】','3. 【其他词汇】','4. 【本题词义】','5. 【其余选项】'][i]+'</b><br>'+x+'</div>').join('')+'</div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s)return; const pick=+b.dataset.i,ok=pick===q.answer; state.answers[key(idx)]={pick,ok}; if(!ok&&!state.wrong.includes(idx))state.wrong.push(idx); save(); render()});
 if(s){document.getElementById('expBtn').onclick=()=>document.getElementById('exp').classList.toggle('show'); document.getElementById('next').onclick=()=>{state.pos++;save();render()}}
}
function finish(){
 const right=state.order.filter(idx=>state.answers[key(idx)]?.ok).length;
 bar.style.width='100%'; counter.textContent='完成';
 app.innerHTML='<div class="finish"><div class="muted">本轮完成</div><div class="big">'+right+' / '+state.order.length+'</div><div class="muted">错题 '+(state.order.length-right)+' 道</div><div class="actions"><button class="btn primary" id="redoWrong">① 只重做错题</button><button class="btn secondary" id="viewWrong">② 查看错题与解析</button><button class="btn secondary" id="redoAll">③ 全部重做</button></div><div id="wrongArea"></div></div>';
 document.getElementById('redoWrong').onclick=()=>{if(!state.wrong.length){alert('本轮没有错题');return} state.order=[...state.wrong];state.pos=0;state.answers={};state.mode='wrong'+Date.now();save();render()};
 document.getElementById('redoAll').onclick=()=>{state={order:bank.map((_,i)=>i),pos:0,answers:{},wrong:[],mode:'all'+Date.now()};save();render()};
 document.getElementById('viewWrong').onclick=()=>{const a=document.getElementById('wrongArea');a.innerHTML=state.wrong.length?state.wrong.map(idx=>'<div class="blk" style="text-align:left"><b>【'+bank[idx].target+'】</b><br>'+bank[idx].exp[0]+'<br><b>核心：</b>'+bank[idx].exp[3]+'</div>').join(''):'<div class="blk">本轮没有错题。</div>'};
}
render();
</script>
</body></html>
