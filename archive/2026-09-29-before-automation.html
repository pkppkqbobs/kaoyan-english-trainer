function buildOrder(){
  for(let t=0;t<40;t++){
    const a=BANK.slice().sort(()=>Math.random()-.5);
    let ok=true;
    for(let i=1;i<a.length;i++){
      if(a[i].source==="today" && a[i-1].source==="today"){ok=false;break}
    }
    if(ok)return a;
  }
  return BANK.slice();
}

let state={answers:[],mode:"main",queue:order,index:0};

function E(id){return document.getElementById(id)}
function expHtml(q){return "<b>1.【整句翻译】</b>"+q.exp.trans+"<b>2.【句子主干】</b>"+q.exp.structure+"<b>3.【其他词汇】</b>"+q.exp.other+"<b>4.【本题词义】</b>"+q.exp.meaning+"<b>5.【其余选项】</b>"+q.exp.rest}
function render(){
  if(state.index>=state.queue.length){finish();return}
  const q=state.queue[state.index];state.qStart=Date.now();
  E("target").textContent="【本题目标："+q.target+"】";E("progress").textContent=(state.index+1)+" / "+state.queue.length;E("question").textContent=q.q;
  E("options").innerHTML="";E("feedback").innerHTML="";E("feedback").className="";E("explain").classList.add("hidden");E("whyBtn").classList.add("hidden");E("nextBtn").classList.add("hidden");
  q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+["A","B","C","D"][i]+".</b> "+t;b.onclick=()=>answer(i);E("options").appendChild(b)})
}
function answer(pick){
  const q=state.queue[state.index],ms=Date.now()-state.qStart,ok=pick===q.a;
  state.answers.push({id:q.id,source:q.source,skill:q.skill,target:q.target,pick,answer:q.a,ok,ms,mode:state.mode});
  [...document.querySelectorAll(".opt")].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");if(i===pick&&!ok)b.classList.add("wrong")});
  if(ok&&ms<=22000){E("feedback").className="feedback good";E("feedback").textContent="✓ 正确。"}
  else if(ok){E("feedback").className="feedback warn";E("feedback").textContent="✓ 正确，但用了 "+(ms/1000).toFixed(1)+" 秒，仍需间隔复习。"}
  else{E("feedback").className="feedback bad";E("feedback").innerHTML="✗ 这次更像是：<b>"+(q.diag[pick]||"判断路径需要调整")+"</b>。"}
  E("whyBtn").classList.remove("hidden");E("nextBtn").classList.remove("hidden")
}
E("whyBtn").onclick=()=>{const q=state.queue[state.index];E("explain").innerHTML=expHtml(q);E("explain").classList.remove("hidden")};
E("nextBtn").onclick=()=>{state.index++;render()};

function finish(){
  E("quiz").classList.add("hidden");E("result").classList.remove("hidden");
  const arr=state.answers.filter(x=>x.mode===state.mode),correct=arr.filter(x=>x.ok).length,avg=arr.length?Math.round(arr.reduce((a,b)=>a+b.ms,0)/arr.length/1000):0;
  E("scoreKpi").textContent=correct+"/"+arr.length;E("timeKpi").textContent=avg+"s";
  const bad=arr.filter(x=>!x.ok||x.ms>22000);E("weakKpi").textContent=bad[0]?bad[0].skill:"稳定";
}
E("viewWrongBtn").onclick=()=>{
  const arr=state.answers.filter(x=>x.mode==="main"&&!x.ok);
  E("wrongItems").innerHTML=arr.length?arr.map(r=>{const q=BANK.find(x=>x.id===r.id);return "<div class='review-item'><div class='qmini'>"+q.target+"</div><div class='sub'>你选 "+["A","B","C","D"][r.pick]+"，正确 "+["A","B","C","D"][r.answer]+" · "+(r.ms/1000).toFixed(1)+"s</div><div class='exp'>"+expHtml(q)+"</div></div>"}).join(""):"<div class='sub'>本轮无错题。</div>";
  E("wrongReview").classList.remove("hidden")
};
E("closeReview").onclick=()=>E("wrongReview").classList.add("hidden");
E("redoWrongBtn").onclick=()=>{
  const wrong=state.answers.filter(x=>x.mode==="main"&&!x.ok);if(!wrong.length){alert("本轮没有错题。");return}
  const qs=wrong.map(r=>{const base=BANK.find(x=>x.id===r.id),re=RETRY[r.id];return {...base,id:"retry-"+r.id,q:re.q,o:re.o,a:re.a}});
  state.mode="retry";state.queue=qs.sort(()=>Math.random()-.5);state.index=0;E("result").classList.add("hidden");E("wrongReview").classList.add("hidden");E("quiz").classList.remove("hidden");render()
};
E("redoAllBtn").onclick=()=>{state={answers:[],mode:"main",queue:buildOrder(),index:0};E("result").classList.add("hidden");E("wrongReview").classList.add("hidden");E("quiz").classList.remove("hidden");render()};
function makeReport(){
  const arr=state.answers.filter(x=>x.mode==="main"),correct=arr.filter(x=>x.ok).length;
  const lines=["考研英语混合间隔训练","题数 "+arr.length+"｜正确 "+correct+"｜正确率 "+(arr.length?Math.round(correct/arr.length*100):0)+"%"];
  if(arr.length)lines.push("平均用时 "+Math.round(arr.reduce((a,b)=>a+b.ms,0)/arr.length/1000)+"s");
  lines.push("","【逐题】");arr.forEach((x,i)=>lines.push("Q"+(i+1)+" ["+x.source+"] "+x.skill+"：选"+["A","B","C","D"][x.pick]+"→正确"+["A","B","C","D"][x.answer]+"；"+(x.ok?"正确":"错误")+"；"+(x.ms/1000).toFixed(1)+"s"));
  return lines.join("\n")
}
E("submitBtn").onclick=()=>{const title="[TRAINING_RESULT] 混合间隔训练 "+new Date().toISOString().slice(0,10)+" "+Date.now();const body="<!-- kaoyan-english-training-result -->\n"+makeReport();window.open("https://github.com/pkppkqbobs/kaoyan-english-trainer/issues/new?title="+encodeURIComponent(title)+"&body="+encodeURIComponent(body),"_blank","noopener,noreferrer")};
render();
</script>
</body>
</html>
