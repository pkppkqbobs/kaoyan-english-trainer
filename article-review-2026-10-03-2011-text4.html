<script>window.REVIEW_DATA={"date": "2026-10-03", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2011 英语一 Text 4 · 本篇问题 4 题 + 历史弱项 4 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-10-03-2011-text4", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本篇复盘结果只有在你点击“提交结果到 GitHub”并在 GitHub 再点 Submit new issue 后，才会进入后续间隔复习。", "questions": [{"id": "point-waiting", "family": "point", "introduced": "2026-09-29", "target": "point / there is no point in doing", "skill": "point 熟词生义", "q": "With the last bus already gone, there was no point in waiting at the stop.\npoint 在这里最接近：", "o": ["联合会", "尖端", "分数", "意义、用处"], "a": 3, "exp": {"trans": "末班车已经开走了，继续在车站等也没有意义。", "structure": "主干：there was no point in waiting at the stop，是there be存在句。With the last bus already gone补充原因背景。简单句The last bus was already gone → 去掉was，用with + 名词 + 状态补语压缩。", "other": "last bus 末班车；already 已经；be gone 已经离开、不在了；bus stop 公交站。", "meaning": "there is no point in doing sth：做某事没有意义；point不是物理位置上的点。", "rest": "联合会常用federation/association，与句意无关。尖端可用the point of a needle，必须是具体物体的尖端。分数可说score three points，但这里不是计分语境。"}}, {"id": "social-message-inference-career-a", "family": "social-message-inference", "introduced": "2026-10-03", "target": "社会暗示 / 满意度推断", "skill": "社会信息 ≠ 直接批评", "budget": 50, "q": "A workplace culture repeatedly celebrates employees who stay late, and workers who leave on time are often reminded that “real commitment means sacrifice.” What is most safely suggested?", "o": ["Workers who leave on time are formally punished every day.", "The culture may make some workers question whether they are committed enough.", "Employees who stay late are always more productive.", "Managers ignore workers who leave on time."], "a": 1, "exp": {"trans": "一种职场文化反复赞美加班员工，而准时下班的人经常被提醒“真正的投入意味着牺牲”。最稳妥的推断是：这种文化可能让一些人怀疑自己是否足够投入。", "structure": "主句1：A workplace culture + celebrates + employees。who stay late修饰employees。主句2：workers who leave on time + are reminded + that从句。that从句给出被灌输的信息。题目要从这种持续信息推断心理影响，而不是擅自添加处罚事实。", "other": "workplace culture 职场文化；commitment 投入/忠诚；sacrifice 牺牲；question whether 怀疑是否。", "meaning": "反复接收到某种价值信息，最直接支持的是“可能影响自我判断/满意度”，不等于已经遭受正式批评或惩罚。", "rest": "formally punished every day加入原文没有的正式处罚；always more productive把价值宣传偷换成生产率事实；ignore与“are often reminded”相反。"}}, {"id": "causal-role-direction-fitness-a", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "主语—作用方向 / 因果方向", "skill": "谁影响谁", "budget": 50, "q": "Fitness influencers often make intensive training look effortless, and such images may subtly shape beginners' expectations about exercise. Which statement preserves the direction of influence?", "o": ["Beginners make fitness influencers look effortless.", "Images of influencers may influence how beginners think about exercise.", "Exercise has little effect on the popularity of influencers.", "Beginners' expectations cause influencers to post more images."], "a": 1, "exp": {"trans": "健身博主经常把高强度训练展示得毫不费力，而这些形象可能潜移默化地影响初学者对锻炼的期待。正确改写必须保留“博主形象影响初学者期待”的方向。", "structure": "主句1：Fitness influencers + make + intensive training + look effortless。主句2：such images（主语）+ may shape（谓语）+ beginners' expectations（宾语）。作用方向是images → expectations。", "other": "intensive training 高强度训练；effortless 看起来不费力；subtly 潜移默化地；expectation 期待。", "meaning": "阅读中要先锁定施事和受事：谁是影响源，谁是被影响对象。不要因为词都出现过就把方向颠倒。", "rest": "Beginners make influencers...把方向完全反过来；Exercise has little effect...换成另一个因果关系；expectations cause influencers...同样倒置。"}}, {"id": "cling-policy-a", "family": "cling-climb", "introduced": "2026-09-30", "budget": 35, "target": "cling / climb / cling to", "skill": "形近词辨析", "q": "Even after the company simplified its procedures, a few managers continued to cling to the old rules. Here, cling to means:", "o": ["向上攀爬", "紧抓着不愿放弃", "公开批评", "快速修改"], "a": 1, "exp": {"trans": "即使公司简化了流程，仍有少数经理继续死守旧规定。", "structure": "Even after...是让步背景。主干：a few managers（主语）+ continued（谓语）+ to cling to the old rules（补足内容）。cling to的宾语是the old rules。", "other": "simplify 简化；procedure 流程；continue to do 继续做；old rules 旧规定。", "meaning": "cling to = 紧抓、依恋、不愿放弃。注意cling不是climb。", "rest": "climb才是“攀爬”；公开批评是criticize openly；快速修改是revise quickly。这里语境是明知规则已简化仍不愿放弃旧做法。"}}, {"id": "provoke-family-debate-a", "family": "provoke-family", "introduced": "2026-10-03", "budget": 40, "target": "provocative / provoke sb to do", "skill": "provoke 词族语境义", "q": "The documentary was deliberately provocative: it was designed to provoke viewers to question assumptions they had long accepted. Which explanation is most accurate?", "o": ["provocative means sexually attractive here", "provocative means thought-provoking or controversial, and provoke viewers to question means prompt them to question", "provoke always means make someone angry", "provocative means completely objective"], "a": 1, "exp": {"trans": "这部纪录片有意具有挑衅性/引发思考：它就是为了促使观众质疑自己长期接受的假设。", "structure": "第一分句：The documentary + was + deliberately provocative。冒号后解释其效果：it + was designed + to provoke viewers to question...。provoke viewers to question 是 provoke sb to do 结构。", "other": "documentary 纪录片；deliberately 有意地；assumption 假设/想当然的看法；accept 接受。", "meaning": "provocative在文章、观点、作品语境中常表示会引发争议或思考；provoke sb to do 可表示促使、激起某人去做某事，不一定是“激怒”。", "rest": "sexually attractive只是provocative在某些人物/服装语境中的另一义；provoke并非永远等于使人生气；completely objective与deliberately provocative相反。"}}, {"id": "past-tense-happiness-trip-a", "family": "past-tense-happiness", "introduced": "2026-10-03", "budget": 45, "target": "past-tense condition / happiness in retrospect", "skill": "回顾性幸福", "q": "A difficult expedition may be exhausting day by day yet feel deeply rewarding years later. In this sense, happiness is being treated as a “past-tense condition.” What does that mean?", "o": ["happiness can only exist in childhood", "happiness is judged retrospectively rather than only by moment-to-moment pleasure", "people should ignore all present emotions", "past events are always happier than present ones"], "a": 1, "exp": {"trans": "一次艰苦的探险每天可能都很累，但多年后回想起来却非常值得。在这个意义上，把幸福视为“过去时的状态”，就是强调幸福可以通过事后的回顾来判断，而不只看当下每一刻是否快乐。", "structure": "第一句由yet连接对比：expedition may be exhausting... yet feel rewarding later。问句主干：happiness + is being treated + as a past-tense condition。这里的past-tense是比喻性的时间视角。", "other": "expedition 探险；exhausting 令人疲惫的；rewarding 值得的/有回报的；retrospectively 回顾性地。", "meaning": "past-tense condition在此不是语法题，而是说幸福感可能在经历之后回看时才成立，与happiness in retrospect一致。", "rest": "childhood无关；不是要求忽略当下情绪，而是不把瞬时快乐当作唯一尺度；也没有说过去的事情总比现在幸福。"}}, {"id": "conceivably-ferry", "family": "conceivably", "introduced": null, "target": "conceivably", "skill": "conceivably", "q": "If the wind weakens before noon, the ferry could conceivably resume service this afternoon, but the operator has made no promise. Conceivably most nearly means:", "o": ["必然地", "有这种可能，但不能确定", "故意地", "表面上地"], "a": 1, "budget": 35, "exp": {"trans": "如果中午前风势减弱，渡轮今天下午有可能恢复运营，但运营方没有作出任何保证。", "structure": "if从句给出条件：the wind weakens before noon。主句：the ferry + could resume + service；conceivably修饰could resume，降低确定性。but后面的no promise进一步说明并不确定。", "other": "weaken 减弱；ferry 渡轮；resume service 恢复运营；operator 运营方。", "meaning": "conceivably = 可以设想地、有可能地，强调可能存在但远未确定。", "rest": "必然地接近certainly/inevitably，语气过强；故意地是deliberately/intentionally；表面上地是apparently/superficially，均不符合could...but no promise的弱可能语境。"}}, {"id": "legacy-faint-praise", "source": "today", "skill": "faint / faint praise", "target": "faint / faint praise", "q": "After a two-hour presentation, Maya said, “Well, at least the slides were readable.” Her remark is best described as:", "o": ["faint praise", "earnest approval", "open hostility", "sufficient evidence"], "a": 0, "diag": {"1": "earnest approval 是真诚而明确的赞许；“at least...”只给了很弱的一点肯定。", "2": "这句话并非直接敌意攻击，而是非常有限、勉强的表扬。", "3": "evidence 是“证据”，不是评价语气。"}, "exp": {"trans": "听完一场两小时的演讲后，Maya 说：“嗯，至少幻灯片还看得清。”这句话最适合形容为“勉强的赞扬”。", "structure": "Maya（主语）+ said（谓语）+ 引语（内容）。问句 Her remark is best described as... 中 is described是被动谓语，不是is加形容词表语。引语主干为the slides were readable；at least限制了肯定的力度。", "other": "presentation 演讲/展示；readable 易读的；remark 评论；at least 至少。", "meaning": "faint praise = 勉强的、力度很弱的赞扬。这里 faint 的核心是“微弱的、不强的”。", "rest": "earnest approval = 真诚、明确的赞成，语气过强；open hostility = 公开敌意，不符合；sufficient evidence = 充分证据，词义类别都不对。只有 faint praise（力度很弱的赞扬）符合 at least 的保留语气。"}, "family": "faint", "introduced": "2026-09-29", "budget": 35}], "retry": {"point": [{"id": "legacy-miss-point", "source": "today", "skill": "miss the point / point", "target": "miss the point / point", "q": "The committee spent twenty minutes arguing about the font on the warning sign, while the real issue was whether the bridge was safe. They were clearly ___.", "o": ["missing the point", "making a point", "reaching the point", "pointing out"], "a": 0, "diag": {"1": "make a point 常表示“提出观点/特意强调”，这里强调的是没抓住真正问题。", "2": "reach the point 需要具体语境，如 reach the point where...，不能表达“没抓住重点”。", "3": "point out 通常后接宾语，表示“指出”；这里既不合结构也不合语义。"}, "exp": {"trans": "委员会花了二十分钟争论警示牌的字体，而真正的问题是这座桥是否安全。他们显然没有抓住重点。", "structure": "第一句：The committee（主语）+ spent（谓语）+ twenty minutes（宾语）；arguing...说明时间花在何事上。while连接对比；whether the bridge was safe作表语从句。第二句：They（主语）+ were missing（现在进行时谓语）+ the point（宾语）。", "other": "committee 委员会；warning sign 警示牌；issue 问题/争议点；safe 安全的。", "meaning": "miss the point = 没抓住重点、没理解关键。point 在这里是“要点/关键”，不是“节点”。", "rest": "make a point = 提出/强调观点；reach the point = 达到某个阶段/程度；point out = 指出某事。只有 missing the point（没抓住重点）符合他们纠结字体却忽视桥梁安全的语境。"}, "family": "point", "introduced": "2026-09-29", "budget": 35}, {"id": "point-joke", "family": "point", "introduced": "2026-09-29", "target": "miss the point", "skill": "miss the point / point", "q": "Even after I explained the joke twice, my brother still missed the point.\nmissed the point 在这里表示什么？", "o": ["仍然怀念以前的笑话", "仍然没明白笑话的关键", "忘记了一个标点符号", "没赶上兄弟聚会"], "a": 1, "exp": {"trans": "即使我把这个笑话解释了两遍，我弟弟仍然没有明白其中的关键。", "structure": "主句：my brother（主语）+ missed（谓语）+ the point（宾语）。after从句：I + explained + the joke；twice修饰explained。even强调即便已经解释过，结果仍如此。", "other": "joke 笑话；twice 两次；still 仍然；explain 解释。", "meaning": "miss the point整体表示没领会关键、没明白意思，不能把miss机械地译成怀念。", "rest": "miss sb可表示想念某人，但miss the point不是这一义项。标点符号一般是punctuation mark，不是这里的point。miss a meeting可表示错过聚会，但原句没有meeting；brother是主语，不是被错过的活动。"}}], "social-message-inference": [{"id": "social-message-inference-parenting-b", "family": "social-message-inference", "introduced": "2026-10-03", "target": "message / criticism / satisfaction", "skill": "被灌输信息 ≠ 被直接批评", "budget": 50, "q": "A magazine constantly presents home ownership as the clearest sign of adulthood. Renters are repeatedly exposed to stories implying that a “real adult” owns a home. Which inference is best supported?", "o": ["Renters are constantly attacked personally by the magazine.", "Renters may be more likely to feel that something is missing from their lives.", "The magazine completely ignores renters.", "All homeowners are happier than all renters."], "a": 1, "exp": {"trans": "一本杂志不断把拥有住房描述为成年的最明确标志，并反复暗示“真正的成年人”都该有自己的房子。最能支持的推断是：租房者可能更容易觉得自己生活中缺了什么。", "structure": "主句：A magazine + presents + home ownership...。第二句：Renters + are exposed to + stories；implying...作后置分词，说明这些故事传达的暗示。推断应沿“信息 → 自我感受”走。", "other": "home ownership 自有住房；adulthood 成年状态；be exposed to 接触到；imply 暗示。", "meaning": "社会信息可能影响人的自我评价或满意度，但这与“被直接人身攻击”不同。", "rest": "attacked personally把暗示升级成直接攻击；completely ignores与repeatedly exposed相反；all homeowners are happier把价值信息偷换成绝对事实。"}}], "causal-role-direction": [{"id": "causal-role-direction-travel-b", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "主语角色交换 / influence", "skill": "作用关系不能倒置", "budget": 50, "q": "Travel advertisements can make remote destinations appear more glamorous than the actual experience, which may influence tourists' expectations. Which paraphrase is correct?", "o": ["Tourists' expectations make advertisements more glamorous.", "The actual trip makes the advertisements less realistic.", "Advertisements may shape tourists' expectations before they travel.", "Tourists make remote destinations appear glamorous to advertisers."], "a": 2, "exp": {"trans": "旅游广告可能让偏远目的地看起来比真实体验更光鲜，这可能影响游客出发前的期待。正确改写是：广告可能塑造游客的期待。", "structure": "主句：Travel advertisements（主语）+ can make（谓语）+ remote destinations（宾语）+ appear more glamorous（宾补）。which指代前面的整体现象；which may influence tourists' expectations继续说明这种呈现对游客期待的影响。", "other": "remote destination 偏远目的地；glamorous 光鲜迷人的；actual experience 实际体验；shape 塑造。", "meaning": "原句的因果链是advertisements/presentation → tourists' expectations。主语角色和作用方向不能交换。", "rest": "第一项把受影响者变成影响源；第二项讨论actual trip对广告的作用，原文没有；第四项同样把游客变成施事。"}}], "cling-climb": [{"id": "cling-rail-b", "family": "cling-climb", "introduced": "2026-09-30", "budget": 35, "target": "cling / climb", "skill": "cling ≠ climb", "q": "The frightened child ___ tightly to his father's arm as the boat lurched through rough water; when the boat reached the dock, he did not try to ___ over the safety barrier.", "o": ["climbed / cling", "clung / climb", "clung / climbed", "climbed / climb"], "a": 1, "exp": {"trans": "船在颠簸水面上摇晃时，受惊的孩子紧紧抓住父亲的手臂；船靠岸后，他没有试图翻过安全护栏。", "structure": "第一分句：The frightened child + clung tightly to + his father's arm，tightly修饰clung。第二分句：he + did not try + to climb over + the safety barrier。clung是cling的过去式；climb是不定式原形。", "other": "frightened 害怕的；tightly 紧紧地；lurch 突然摇晃；rough water 颠簸的水面；reach the dock 到达码头；safety barrier 安全护栏。", "meaning": "cling to = 紧抓不放；climb over = 翻越/爬过。两个词形相近，但动作和搭配不同。", "rest": "climbed tightly to his father's arm不符合“紧抓手臂”的语义和搭配；try to climbed over把过去式误放在不定式to后；climbed / climb的第二空虽可成立，但第一空仍不对；cling over不符合固定搭配。只有clung / climb同时满足两处语法和语义。"}}], "provoke-family": [], "past-tense-happiness": [], "conceivably": [], "faint": [{"id": "faint-map-line", "family": "faint", "introduced": "2026-09-29", "target": "faint", "skill": "faint / faint praise", "q": "After years in the sunlight, only a faint line remained on the old map.\n这里 faint 最接近哪种意思？", "o": ["神圣的", "突然出现的", "隐约的、不清晰的", "故意伪造的"], "a": 2, "exp": {"trans": "经过多年日晒，旧地图上只剩下一条隐约可见的线。", "structure": "After years in the sunlight是时间背景。only a faint line（主语）+ remained（不及物谓语）；on the old map是地点状语。", "other": "sunlight 阳光；remain 留下、仍然存在；line 线条；after years 多年之后。", "meaning": "faint在这里是微弱、不明显的；与faint praise中赞扬力度很弱具有相近的语义核心。", "rest": "神圣的常用holy/sacred；圣人是saint，不是faint。突然出现的可说sudden，重点是发生速度，不是清晰度。伪造的可说forged/fake，描述真伪，原句没有这种信息。"}}, {"id": "faint-praise-restoration", "family": "faint", "introduced": "2026-09-29", "target": "faint praise", "skill": "faint / faint praise", "q": "Calling the volunteers' six-month restoration project “not entirely useless” struck the team as faint praise.\n哪句改写最准确？", "o": ["The team heard an enthusiastic celebration of the project.", "The comment offered only a very weak form of approval.", "The comment proved that the project had failed completely.", "The team was told that the project had won an award."], "a": 1, "exp": {"trans": "把志愿者历时六个月的修复项目说成“并非完全没有用”，让团队觉得这只是很勉强的赞扬。", "structure": "Calling the volunteers' six-month restoration project ‘not entirely useless’是整个动名词短语主语；struck是谓语；the team是宾语；as faint praise表示给团队留下何种印象。短语内部call A B：称A为B。", "other": "restoration 修复；entirely 完全；strike sb as sth 给某人以某种印象；approval 赞许。", "meaning": "faint praise并非赞扬完全不存在，而是肯定得很有限，甚至暗含保留意见。", "rest": "enthusiastic celebration表示热情赞颂，力度过强；had failed completely表示彻底失败，把微弱肯定改成全面否定；had won an award表示获奖，原文没有提供获奖事实。"}}]}, "article_session": {"id": "2026-10-03-2011-text4", "source": "2011 英语一 Text 4", "session_file": "data/article-sessions/2026-10-03-2011-text4.json", "current_families": ["social-message-inference", "causal-role-direction", "provoke-family", "past-tense-happiness"], "historical_families": ["faint", "cling-climb", "point", "conceivably"]}, "issues_used": [1, 2, 3, 4, 5, 6, 7], "engine": 4};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
