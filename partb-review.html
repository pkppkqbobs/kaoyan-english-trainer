<script>window.PARTB_DATA={"schema": 1, "repo": "pkppkqbobs/kaoyan-english-trainer", "storagePrefix": "kaoyan.partb.v1.", "questions": [{"id": "pb-library-writing-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "成人写作课的两条参与路径", "topic": "教育", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "C", "text": "A public library offered an adult writing programme and advertised it as open to anyone interested in telling a story. Attendance declined after the first month, although most people who left still said that writing mattered to them. Librarian Leila Ortiz suspected that an invitation to join was not the same thing as a practical opportunity to participate."}, {"id": "F", "text": "Ortiz interviewed former participants instead of treating their absence as proof of weak motivation. Some could attend regularly but hesitated to read unfinished work aloud; others welcomed discussion but rarely left work before the evening session began. These accounts raised a question about the programme itself: why did one shared weekly meeting serve such different needs so poorly?"}, {"id": "A", "text": "One reason was that the meeting tied several activities to a single place and time. Participants had to arrive with a draft, discuss it publicly and receive comments before leaving, even if only one of those steps was difficult for them. A timetable designed around the library's staffing convenience had quietly become a rule governing who could learn."}, {"id": "E", "text": "To loosen that rule, Ortiz separated preparing a draft from attending a discussion and offered two participation routes. People who preferred quiet preparation could leave written drafts for brief private feedback before joining a small workshop. The early drafts from this route were short and hesitant, but several writers revised them repeatedly once public performance was no longer the first hurdle."}, {"id": "D", "text": "A comparable pattern emerged among people using the other route, which allowed them to send spoken drafts and exchange comments outside the scheduled evening meeting. Their first recordings often sounded uncertain, yet later versions developed clearer sequences and more detail. Neither route removed the need for revision; each changed the conditions under which people could begin that work."}, {"id": "B", "text": "The library kept the two routes while retaining a common expectation that every story would be revised. Its lesson was not that open meetings were useless, but that a single visible form of participation could hide different obstacles. Ortiz planned to compare the quality of later drafts rather than rely on attendance alone, so convenience would not be mistaken for either motivation or learning."}], "expectedOrder": ["C", "F", "A", "E", "D", "B"], "links": [{"from": "C", "to": "F", "signals": ["topic-introduction", "lexical-chain"], "strength": "medium", "anchor": false, "explanation": "C介绍退出却仍想写作的矛盾，F通过访谈区分两种障碍。Ortiz重复只是人物线索，关键是从怀疑动机解释转到调查证据。", "evidence": [{"level": "medium", "text": "C的attendance declined但writing mattered引出F调查absence不等于weak motivation。"}, {"level": "support", "text": "programme与participants保持话题，并不单独决定顺序。"}]}, {"from": "F", "to": "A", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "F问同一次会议为何不能服务不同需求，A解释把准备、公开讨论、反馈绑在同一时段。", "evidence": [{"level": "strong", "text": "one shared weekly meeting的问题对应A的single place and time。"}, {"level": "medium", "text": "不同困难被同一到场规则排除，回应F两类访谈结果。"}]}, {"from": "A", "to": "E", "signals": ["anaphora", "cause-effect"], "strength": "strong", "anchor": true, "explanation": "A把排除机制概括为rule，E用that rule回指并提出拆开准备与讨论的办法，随后介绍两条路径。", "evidence": [{"level": "strong", "text": "that rule回指A的rule governing who could learn。"}, {"level": "medium", "text": "E的separated preparing ... attending针对A的tied several activities。"}]}, {"from": "E", "to": "D", "signals": ["parallel", "anaphora"], "strength": "strong", "anchor": true, "explanation": "E介绍two routes并展开第一条，D以a comparable pattern及the other route承接第二条，既有对象回指也有平行结果。", "evidence": [{"level": "strong", "text": "the other route需要E已引入two participation routes和第一条的结果。"}, {"level": "medium", "text": "两段都呈现早期犹豫→多次修订后的进步，形成真正平行。"}]}, {"from": "D", "to": "B", "signals": ["conclusion", "contrast"], "strength": "medium", "anchor": false, "explanation": "B综合两条路径与共同修订要求，限定结论并安排后续比较。尾段判断需结合两条路径均已展开，不能只靠lesson一词。", "evidence": [{"level": "medium", "text": "kept the two routes要求前文已分别展示结果。"}, {"level": "medium", "text": "not ... useless, but ... hide different obstacles防止把改进措施扩大为否定全部公开会议。"}]}], "globalLogic": "C现象→F区别障碍并提问→A解释共同规则→E方案及第一条路径→D平行的第二条→B限定结论。A→E→D提供连续对象链；F的问题不能放在解释之后；B的two routes综合要求两个实例已经展开。", "themeTrap": "F和D都出现犹豫，但F调查的是障碍，D报告的是第二条路径的结果。C与B都谈attendance，前者提出问题，后者警惕将到场率当学习效果；同词并不意味着相邻。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}, {"id": "pb-market-compost-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "市场厨余回收的污染来源", "topic": "环境政策", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "F", "text": "A city expanded food-waste collection at its markets and celebrated the larger volume arriving at its compost plant. The plant's operators were less enthusiastic because rejected material increased alongside the deliveries. Environmental analyst Paula Torres was asked whether the problem lay in residents' willingness to recycle or in the way the collection scheme had been organized."}, {"id": "B", "text": "Torres watched how stalls cleared unsold food at closing time. Sellers used bags supplied by the scheme, but frequently placed disposable serving containers in those bags as well, despite a notice asking them to remove packaging. Why did the same mistake recur among sellers who could accurately explain the purpose of food-waste collection when interviewed?"}, {"id": "E", "text": "The containers looked suitable for the scheme because their suppliers described them as environmentally friendly. Some required industrial processing that the city's plant did not provide, while others contained coatings incompatible with its composting method. Sellers were making a practical decision from a broad label that concealed the particular conditions needed to process each product."}, {"id": "A", "text": "Correcting that mismatch meant linking collection advice to the plant's actual requirements. Torres tested a clearly marked return box for serving containers beside the food-waste bin, with pictures showing which items belonged in each place. Stalls no longer had to decide whether an attractive environmental claim meant that a container could be mixed with the unsold food."}, {"id": "C", "text": "Packaging suppliers remained relevant even after the new boxes improved sorting at the stalls. A separate purchasing trial favoured containers with fewer coatings, making rejected packaging easier to handle when mistakes still occurred. The improvement at collection therefore did not remove the need for decisions earlier in the supply chain, where the range of products entering the markets was determined."}, {"id": "D", "text": "The city came to treat the rising collection volume as a starting measure rather than a final verdict on the scheme. Clearer separation at the stalls and more suitable purchasing could both reduce rejection at the plant, through different stages of the same process. Torres recommended reporting usable output alongside deliveries and testing the combined changes before expanding the scheme to more markets."}], "expectedOrder": ["F", "B", "E", "A", "C", "D"], "links": [{"from": "F", "to": "B", "signals": ["topic-introduction", "lexical-chain"], "strength": "medium", "anchor": false, "explanation": "F引入回收量上升与拒收量上升的矛盾，B转到Torres观察清场行为。需要把待调查的问题与观察层次合看，不只是两个段都说scheme。", "evidence": [{"level": "medium", "text": "Torres被要求区分意愿与方案组织，B展示懂目的的商户仍重复混装。"}, {"level": "support", "text": "同一market/collection场景维持主题，并非充分排序证据。"}]}, {"from": "B", "to": "E", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "B段尾问懂目的为何仍犯错，E解释宽泛环保标签隐藏了处理条件差异。", "evidence": [{"level": "strong", "text": "B的serving containers对应E不同加工条件与coatings。"}, {"level": "medium", "text": "从已解释目的的sellers排除单纯意愿不足，转向标签信息的实际决策。"}]}, {"from": "E", "to": "A", "signals": ["anaphora", "cause-effect"], "strength": "strong", "anchor": true, "explanation": "E给出环保标签与处理条件不匹配，A的that mismatch回指并用分流容器解决实际分类。", "evidence": [{"level": "strong", "text": "that mismatch对应E的broad label concealed ... conditions。"}, {"level": "medium", "text": "A的actual requirements将建议与本市工厂能力对齐，回应E的did not provide。"}]}, {"from": "A", "to": "C", "signals": ["contrast", "lexical-chain"], "strength": "support", "anchor": false, "explanation": "A处理市场末端分类，C提醒分类改进后上游产品设计仍重要。此处靠“一个措施的边界→另一个阶段”的全篇比较，不是词重复即可接。", "evidence": [{"level": "medium", "text": "even after the new boxes要求A已介绍该措施；earlier supply chain与stalls形成层次对照。"}, {"level": "support", "text": "C引入另一项试验，位置还须由D对combined changes的总结来核对。"}]}, {"from": "C", "to": "D", "signals": ["conclusion", "parallel"], "strength": "strong", "anchor": true, "explanation": "D把A的分类与C的采购两个不同阶段并列总结，并回到开篇的量与实际输出之别。", "evidence": [{"level": "strong", "text": "Clearer separation ... more suitable purchasing分别回收两个改进。"}, {"level": "medium", "text": "usable output alongside deliveries回应F的庆祝指标，combined changes依赖两种措施都已介绍。"}]}], "globalLogic": "F指标矛盾→B现场观察并提问→E解释标签信息→A试验末端分类→C补充上游采购→D合并评价。E→A的mismatch锁定；C的new boxes需在A之后；D的combined changes需在C之后。", "themeTrap": "F、C、D都有plant或suppliers相关词，但角色不同。不要把C的供应商话题直接接在E标签解释后：C明确评价new boxes已经改善分类，而这一新措施直到A才出现。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}, {"id": "pb-prescription-handover-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "出院处方的交接责任", "topic": "医疗制度", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "A", "text": "A regional health service called patients several days after they left hospital to check whether follow-up arrangements had worked. Many reported no difficulty understanding their written instructions, yet some still waited for medicines that should have been available locally. The service asked researcher Owen Reed to investigate the journey of a prescription rather than immediately send patients more reminders."}, {"id": "D", "text": "Reed's audit followed prescriptions from hospital offices to neighbourhood pharmacies. Staff on both sides could show records of work completed, but the same document sometimes appeared as finished in one system while remaining unreceived in the other. How could two teams each report that they had done their job while a patient was still waiting for a usable prescription?"}, {"id": "F", "text": "A major reason was that sending and receiving were recorded under different responsibilities. The hospital closed its task when a file entered an outgoing queue; the pharmacy began its task only after an employee accepted that file into the local record. A rejected transmission could therefore sit between the two tasks without appearing as unfinished work on either team's ordinary list."}, {"id": "B", "text": "This split in responsibility became the focus of a small redesign. The hospital kept the prescription visible until the receiving pharmacy acknowledged it, and a named member of staff investigated files that lacked acknowledgement. The procedure added one explicit handover point, with the aim of preventing a gap between two systems from becoming an unexplained delay for a patient."}, {"id": "E", "text": "At one neighbourhood pharmacy, the acknowledgement step exposed files that had previously arrived without the information needed to process them. Staff returned these files to the named hospital contact instead of waiting for patients to ask what had happened. The first week required several extra conversations, but later records showed fewer requests stranded between the two offices."}, {"id": "C", "text": "The audit suggested that a completed internal task was an unreliable substitute for a completed handover. The health service retained its calls to patients, but used the new acknowledgements to locate missing work before asking anyone to repeat an instruction. It would extend the trial only after checking how smaller pharmacies managed the additional contact, rather than assuming that one successful site represented the whole region."}], "expectedOrder": ["A", "D", "F", "B", "E", "C"], "links": [{"from": "A", "to": "D", "signals": ["topic-introduction", "lexical-chain"], "strength": "medium", "anchor": false, "explanation": "A先提出患者懂说明却拿不到药的问题及Reed的任务，D才展开跨机构记录调查。接缝依靠任务到方法的展开，不只是研究者名字重复。", "evidence": [{"level": "medium", "text": "journey of a prescription对应D的from hospital offices to ... pharmacies。"}, {"level": "support", "text": "Reed名字使调查主体一致，但不能单独保证唯一相邻。"}]}, {"from": "D", "to": "F", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "D末句问两边都完成却患者仍等的矛盾，F解释发送与接收之间无人负责的空隙。", "evidence": [{"level": "strong", "text": "F给出的outgoing queue与accepted file定义D的两种finished状态。"}, {"level": "medium", "text": "rejected transmission解释患者等待而ordinary lists没有未完任务。"}]}, {"from": "F", "to": "B", "signals": ["anaphora", "lexical-chain"], "strength": "strong", "anchor": true, "explanation": "F建立职责分裂和无人看管的交接区，B的This split in responsibility明确回指，并设计接收确认与专人追踪。", "evidence": [{"level": "strong", "text": "This split对应F的sending and receiving ... different responsibilities。"}, {"level": "medium", "text": "visible until acknowledged正面修复任务关闭与任务开启之间的空隙。"}]}, {"from": "B", "to": "E", "signals": ["general-to-specific", "example"], "strength": "support", "anchor": false, "explanation": "B给出一般程序，E展示一家药房怎样实际使用它。需要看acknowledgement的具体用途与named contact的复现；At one地点词不是唯一证据。", "evidence": [{"level": "medium", "text": "E将B的acknowledged / named staff落实为退回缺信息文件。"}, {"level": "support", "text": "从设计到单点试验符合全篇调查顺序，仍要结合后文整体评价核对。"}]}, {"from": "E", "to": "C", "signals": ["conclusion", "contrast"], "strength": "strong", "anchor": true, "explanation": "C总结内部完成与真正交接的区别，并明确单点结果不能直接推广全区。", "evidence": [{"level": "strong", "text": "completed internal task / completed handover概括调查与试验的共同问题。"}, {"level": "medium", "text": "one successful site回顾E并限定推广范围，以后续验证收束。"}]}], "globalLogic": "A引入问题和调查任务→D提出记录矛盾→F解释责任空隙→B重新定义交接→E单点试验→C限定结论。F→B的split锁定，E的acknowledgement需先由B定义；C评价one successful site须在实例后。", "themeTrap": "A与C都提patient calls，但C评价它的作用并提出推广条件，不能跳过调查。D、E都出现pharmacy；D展示尚未解决的记录矛盾，E展示新确认程序后的结果，位置角色不同。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}, {"id": "pb-river-sensors-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "河流传感器的现场校验", "topic": "科研", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "D", "text": "Ecologist Mira Chen wanted earlier warnings of dangerously low river levels in remote valleys. Expensive instruments could provide reliable readings, but maintaining them at dozens of sites exceeded her team's budget. Cheap sensors offered wider coverage, making them attractive only if changes in their readings represented changes in the river itself."}, {"id": "A", "text": "Her team installed the cheaper devices beside several existing measuring stations and compared the records through spring and summer. The instruments agreed during the first weeks, yet later showed different trends even where the river appeared stable. Why did the apparent decline grow fastest at the quietest sites rather than at the driest ones?"}, {"id": "F", "text": "A likely explanation lay in the material collecting around each device. Slow water allowed fine sediment to settle over the sensor, gradually altering its response without any actual fall in river level. The error therefore tracked the conditions around the instrument, which could easily be mistaken for the wider environmental change the project hoped to detect."}, {"id": "C", "text": "This bias could not be removed simply by averaging more readings from the same device. Chen introduced weekly comparisons with a portable reference instrument and recorded the amount of sediment at each visit. The revised method distinguished a real fall from a dirty sensor, but its usefulness depended on arrangements that could survive the researchers' departure."}, {"id": "B", "text": "In the upland villages, the weekly checks became part of an existing volunteer group's walking route. Volunteers wrote down both the reference measurements and any cleaning they performed, rather than merely sending a reassuring message that a device still worked. Months after the field team left, these records continued to reveal problems hidden in the automatic readings."}, {"id": "E", "text": "The pilot thus changed the question from whether a cheap sensor could replace an expensive one to how a dependable observation could be produced. Equipment, comparison procedures and local routines all contributed to the final record. Chen recommended wider trials built around that combination, with expansion depending on whether each valley could sustain the checking work."}], "expectedOrder": ["D", "A", "F", "C", "B", "E"], "links": [{"from": "D", "to": "A", "signals": ["anaphora", "topic-introduction"], "strength": "medium", "anchor": false, "explanation": "D先交代Chen的目标、预算和廉价设备的条件，A再展开她的团队如何检验可靠性。Her只是人物回指，关键还在“只有反映真实河流水位才有价值”到比较实验的展开。", "evidence": [{"level": "support", "text": "Her team回指D中的Mira Chen。"}, {"level": "medium", "text": "D提出可靠性条件；A把这一条件变为并排比较的实验，并提出待解释的问题。"}]}, {"from": "A", "to": "F", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "A段尾问为什么安静地点的读数下降更快，F解释慢水使沉积物附着，导致仪器响应变化。原因针对具体反常现象，不是看到river重复就能接。", "evidence": [{"level": "strong", "text": "A的quietest sites对应F的Slow water与sediment。"}, {"level": "strong", "text": "F的without any actual fall解释A的river appeared stable却出现读数变化。"}]}, {"from": "F", "to": "C", "signals": ["anaphora", "cause-effect"], "strength": "strong", "anchor": true, "explanation": "F已经区分仪器误差与真实环境变化，C的This bias将这一偏差整体回指，并提出校验方法。", "evidence": [{"level": "strong", "text": "This bias回指F的altering its response without any actual fall。"}, {"level": "medium", "text": "不能只增加同一传感器读数，因而改用独立reference instrument。"}]}, {"from": "C", "to": "B", "signals": ["general-to-specific", "lexical-chain"], "strength": "support", "anchor": false, "explanation": "C提出校验能否长期持续的问题，B给出当地执行的实例。这条连接主要依赖“方法→落实方式”的全篇角色，不能把weekly一个词当成唯一接缝。", "evidence": [{"level": "support", "text": "weekly comparisons与weekly checks为同一校验步骤。"}, {"level": "medium", "text": "C的researchers departure引出B的Months after the field team left仍有记录，回答可持续性问题。"}]}, {"from": "B", "to": "E", "signals": ["conclusion", "synonym-chain"], "strength": "strong", "anchor": true, "explanation": "E把B的地方执行结果和前面的仪器、校验方法合并为结论，提出扩大试验的条件。", "evidence": [{"level": "strong", "text": "Equipment, comparison procedures and local routines分别概括前文三个层面。"}, {"level": "medium", "text": "The pilot thus及wider trials从已完成的实例转入整体判断与下一步。"}]}], "globalLogic": "D介绍目标→A显示反常读数→F解释成因→C提出独立校验→B检验长期执行→E概括三者组合。F→C先锁定；A的问题不能在解释后才出现；B的weekly checks需在C定义方法后才成立。剩余实例放在总结前，由全篇角色确定。", "themeTrap": "D、A、F都谈river与devices，B也谈readings；这些重复不支持随意相邻。尤其B不能因同样出现records就跳到A后面：那时还没有介绍weekly reference checks。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}, {"id": "pb-support-dashboard-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "客服仪表盘漏掉了什么", "topic": "公司管理", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "B", "text": "A software company introduced an automated assistant to shorten its customer support queues. Its dashboard soon showed faster replies and fewer open tickets, which executives welcomed as evidence of success. Callers, however, complained that they were explaining the same problems repeatedly, even while the official figures suggested that support was improving."}, {"id": "E", "text": "Operations manager Nadia Singh was asked to explain the gap between that favourable dashboard and callers' experience. She followed a sample of requests from the first message to the moment a customer could actually use the product again. Several requests disappeared from the queue long before any workable solution reached the person who had asked for help."}, {"id": "A", "text": "One reason for the mismatch was the rule used to close a ticket. A request counted as completed as soon as the assistant sent a standard reply, even when that reply merely directed the customer to another department. The system measured a successful first contact as though it were a successful resolution, concealing the work that still remained."}, {"id": "F", "text": "That distinction became central to Singh's replacement dashboard, which displayed first contacts and resolved problems separately. Frontline agents now had to decide whether a quick reply genuinely advanced a case before accepting credit for it. Some worried that investigating a difficult request would make their individual figures look worse than sending several easy replies."}, {"id": "C", "text": "Managers faced a comparable choice when they reviewed the new figures. Rewarding only the largest number of replies would reproduce the pressure felt by agents, whereas reviewing a few complete cases could expose stalled handovers between departments. Such reviews took time, but they also showed managers which staffing decisions were preventing agents from finishing the work."}, {"id": "D", "text": "The company consequently stopped judging the assistant through the queue length alone. It retained fast replies as one useful measure while checking whether unresolved work had merely moved elsewhere, and linked staff rewards to that broader view. The redesign made the dashboard less convenient to summarize, yet more capable of identifying what customers actually needed the service to accomplish."}], "expectedOrder": ["B", "E", "A", "F", "C", "D"], "links": [{"from": "B", "to": "E", "signals": ["anaphora", "topic-introduction"], "strength": "medium", "anchor": false, "explanation": "B引入指标好看却体验差的矛盾，E引入负责解释这一矛盾的人和调查方法。经理的出现不是单独的“人名接人名”，而是承接明确的gap。", "evidence": [{"level": "medium", "text": "that favourable dashboard回指B的faster replies/fewer open tickets。"}, {"level": "medium", "text": "B的callers重复陈述问题对应E追踪请求直至真正恢复使用。"}]}, {"from": "E", "to": "A", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "E末句出现请求在解决前就消失的现象，A解释关单规则，把首次回复误算为解决。", "evidence": [{"level": "strong", "text": "E的disappeared long before any workable solution对应A的as soon as ... standard reply。"}, {"level": "strong", "text": "One reason for the mismatch解释观察到的差距，而不是开启另一个统计话题。"}]}, {"from": "A", "to": "F", "signals": ["anaphora", "contrast"], "strength": "strong", "anchor": true, "explanation": "A给出first contact与resolution的区别，F用That distinction回指并说明新仪表盘怎样分开显示。", "evidence": [{"level": "strong", "text": "That distinction对应A最后一句的first contact / resolution。"}, {"level": "medium", "text": "F的separately是针对A混为一谈的设计修复。"}]}, {"from": "F", "to": "C", "signals": ["parallel", "cause-effect"], "strength": "medium", "anchor": false, "explanation": "F谈一线人员在速度指标下的选择，C转到管理者面临的同类选择。comparable只是辅助；管理者的奖励决定会重现一线压力，才把两个角色接起来。", "evidence": [{"level": "medium", "text": "comparable choice要求前文已有agents的选择与压力。"}, {"level": "medium", "text": "C的pressure felt by agents回顾F，并将原因追到管理者的奖励方式。"}]}, {"from": "C", "to": "D", "signals": ["conclusion", "lexical-chain"], "strength": "strong", "anchor": true, "explanation": "D结合关单规则、跨部门交接和奖励问题总结管理改进，不能在调查原因前先收束。", "evidence": [{"level": "strong", "text": "queue length alone与unresolved work moved elsewhere概括最初统计偏差及C的stalled handovers。"}, {"level": "medium", "text": "linked staff rewards回收C的管理决策，把技术与制度一并总结。"}]}], "globalLogic": "B矛盾→E追踪案例→A解释统计规则→F改变指标并呈现一线压力→C呈现平行的管理责任→D综合结论。A→F的distinction锁定，C需要F已介绍agents的选择；E的调查结果要先于原因说明。", "themeTrap": "B与D都谈queue length，不能把开头和结尾直接相连；D已经总结Singh的调查与奖励制度。C与E都谈manager，但C回应的是F的一线压力，并非经理初次进入调查。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}, {"id": "pb-transfer-buses-v1", "kind": "paragraph_order", "published_on": "2026-10-04", "title": "准点公交为何仍让人迟到", "topic": "城市交通", "budget": 420, "overview": "原创迁移材料。用局部证据与全篇结构共同判断，不靠主题词重复直接拼段。", "paragraphs": [{"id": "E", "text": "A coastal city added an evening bus connection between its railway station and the industrial district to reduce car journeys. Early reports praised the buses for arriving on schedule, yet workers said that they still reached their shifts late. The transport office decided to examine the complete journey instead of assuming that punctual buses meant a usable connection."}, {"id": "C", "text": "The review found that the connection worked well on paper but frequently failed at the station. Passengers leaving an arriving train often watched the bus depart while they were still walking across the concourse. The timetable allowed a short transfer, but why did a formally achievable walk turn into a missed bus on otherwise ordinary evenings?"}, {"id": "A", "text": "The explanation was not that passengers were unusually slow. A narrow exit beside the platform was closed after the daytime shops shut, forcing evening travellers around a longer route through the building. A transfer time measured during the afternoon therefore understated the walk required at night, even when both the train and the bus kept exactly to schedule."}, {"id": "F", "text": "Removing that hidden assumption required more than asking bus drivers to wait whenever somebody waved. Planners recalculated the evening walk and shifted departure times to provide a realistic margin, while clearly identifying the remaining open exit. They then tested whether this change helped people complete journeys that included a second leg beyond the industrial district."}, {"id": "D", "text": "One such journey belonged to a cleaner who changed again to reach a small hospital outside the city. Previously, missing the station bus also meant missing the final local service and paying for a taxi. During the trial she caught both buses regularly, although her experience did not establish that the revised timing would suit every other shift pattern."}, {"id": "B", "text": "The cleaner's result supported the broader decision to evaluate connected journeys rather than separate vehicles. The office kept its punctuality reports but added checks of transfer failures and access routes, recognizing that each service could meet its own target while the journey failed. Further timetable changes would be judged by the trips they enabled, with different shift patterns tested before expansion."}], "expectedOrder": ["E", "C", "A", "F", "D", "B"], "links": [{"from": "E", "to": "C", "signals": ["lexical-chain", "topic-introduction"], "strength": "medium", "anchor": false, "explanation": "E引入准点却迟到的矛盾及全程调查，C给出站内错过车的具体观察。connection的重复辅助主题延续，调查角色才区分开篇与展开。", "evidence": [{"level": "medium", "text": "E的examine the complete journey在C的review found中展开。"}, {"level": "support", "text": "connection重复说明同一换乘服务，不单独保证相邻。"}]}, {"from": "C", "to": "A", "signals": ["problem-to-reason", "paragraph-end-hook"], "strength": "strong", "anchor": true, "explanation": "C末句问正常晚上为什么错过车，A说明白天测量忽视夜间关闭出口，造成更长步行路线。", "evidence": [{"level": "strong", "text": "C的formally achievable walk与A的afternoon measured time / required at night形成解释。"}, {"level": "medium", "text": "even when ... kept exactly to schedule排除单车迟到这一替代原因。"}]}, {"from": "A", "to": "F", "signals": ["anaphora", "cause-effect"], "strength": "strong", "anchor": true, "explanation": "A已经暴露把白天路线当夜间路线的隐含假设，F的that hidden assumption回指它，并给出重新测量和时刻调整。", "evidence": [{"level": "strong", "text": "that hidden assumption对应白天测量低估夜间步行。"}, {"level": "medium", "text": "recalculated the evening walk直接针对较长夜间路线。"}]}, {"from": "F", "to": "D", "signals": ["anaphora", "example"], "strength": "strong", "anchor": true, "explanation": "F最后提出还要测试第二段行程，D以One such journey给出清洁工继续换乘的实例。", "evidence": [{"level": "strong", "text": "One such journey回指F的journeys ... a second leg。"}, {"level": "medium", "text": "D的changed again与caught both buses展示两段连接，而非只检验站内步行。"}]}, {"from": "D", "to": "B", "signals": ["conclusion", "lexical-chain"], "strength": "medium", "anchor": false, "explanation": "B由清洁工实例回到全程评价原则，并提出扩展前的检验要求。这里主要是实例后的概括收束；并非看到office即可认定尾段。", "evidence": [{"level": "medium", "text": "The cleaner result先要求D介绍个人旅程。"}, {"level": "medium", "text": "新增transfer failures / access routes两项回收调查的关键发现；扩展要求结束本次论证。"}]}], "globalLogic": "E提出矛盾→C定位站内问题→A解释夜间路线→F调整并提出第二段测试→D展示实例→B总结评价原则。A→F、F→D连续锁定；C的问题与A解释匹配；B概括清洁工结果不能早于D。", "themeTrap": "E、A、B都出现准点概念，但A解释时间测量偏差，B总结评价方式。D的hospital只是行程目的地，不能凭station或workers与开篇拼接，需承接F提出的第二段测试。", "mechanism_source": {"exam": "2011-english1", "source_check": "data/source-checks/2011-english1.json", "pairs": ["G>B", "B>D", "D>E", "E>A", "A>C", "C>F"]}}], "signals": {"anaphora": "回指", "lexical-chain": "词汇复现", "synonym-chain": "同义复现", "problem-to-reason": "问题→原因", "cause-effect": "因果", "general-to-specific": "概括→具体", "example": "举例", "parallel": "平行", "contrast": "转折", "conclusion": "收束", "topic-introduction": "主题引入", "paragraph-end-hook": "段尾钩子"}, "strengths": {"strong": "强", "medium": "中", "support": "辅助"}, "results": [], "recommend": true, "as_of": "2026-10-06"};</script>
