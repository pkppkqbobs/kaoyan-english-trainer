lation-collective-first-commissions-not-established"}], "retry": {"criteria-number": [{"id": "r17t3-criterion-single-rule", "family": "criteria-number", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "one criterion / several criteria", "skill": "one criterion / several criteria", "q": "A panel has removed every rule except one. Which revision is standard formal English?", "o": ["Only one criteria remain.", "Only one criteria remains.", "Only one criterion remain.", "Only one criterion remains."], "a": 3, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "评审组已删去其余规则，只剩一条。哪种改写符合规范的正式英语？", "structure": "one要求单数名词criterion；名词作主语时，单数主语对应remains；criteria是复数形式。", "other": "panel评审组；except除外；formal English正式英语；agreement主谓一致。", "meaning": "单数criterion与复数criteria同时影响名词选择和谓语一致，不能只记中文标准而忽略数量。", "rest": "criteria remain用于复数情形，不能跟one；criteria remains混用复数名词与单数谓语；criterion remain则缺少单数谓语形式。"}, "context_id": "one-remaining-rule-singular-noun-and-agreement"}], "shed-shelter-shade": [{"id": "r17t3-shelter-station", "family": "shed-shelter-shade", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "shelter / shade / shed", "skill": "shelter / shade / shed", "q": "During a storm, walkers take shelter in a railway waiting room. Which meaning of shelter is relevant?", "o": ["A small building intended primarily for keeping garden tools.", "An area made darker only by blocking direct rays of sunlight.", "Protection from bad weather, here provided by a waiting room.", "The release of leaves from a tree during a seasonal change."], "a": 2, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "暴风雨中，行人在铁路候车室避雨。shelter在这里对应什么含义？", "structure": "take shelter表示寻求庇护；in a railway waiting room指出提供庇护的场所；during a storm给出需要保护的背景。", "other": "walker步行者；waiting room候车室；primarily主要地；seasonal季节性的。", "meaning": "shelter强调免受风雨或危险的庇护，既可说功能也可指场所；这里不要求该场所是专用避难建筑。", "rest": "keeping tools描述shed常见名词义，却不是此处的保护功能；blocking sunlight只说明shade的遮阳方向；release of leaves是动词shed的另一语境。"}, "context_id": "railway-waiting-room-weather-protection-not-storage"}, {"id": "r17t3-shade-slats", "family": "shed-shelter-shade", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "shade does not guarantee rain protection", "skill": "shade does not guarantee rain protection", "q": "A slatted cover shades a reading area at noon, but rain still passes through its gaps. What does shades indicate here?", "o": ["Seals every gap so rain can no longer reach people underneath.", "Blocks direct sunlight without necessarily keeping the rain out.", "Turns the reading area into an enclosed building for tool storage.", "Releases enough light to make the whole reading area much brighter."], "a": 1, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "条板顶棚在中午为阅读区遮阳，但雨仍能从缝隙穿过。shades在这里表明什么？", "structure": "shades是cover所做的动作；but把遮阳与不能完全挡雨并列对照，不能只保留有保护作用的宽泛印象。", "other": "slatted由条板构成的；gap缝隙；underneath在下方；enclosed封闭的。", "meaning": "shade在这里遮挡直射阳光。某些东西同时遮阳避雨是可能的，但此处遮阳不保证挡雨，须保留后半句限制。", "rest": "Seals every gap与雨能穿过直接冲突；tool storage无依据地把功能改成shed；Releases light是散发光线，方向与遮挡相反。"}, "context_id": "slatted-cover-blocks-sun-but-rain-passes"}, {"id": "r17t3-shed-glow", "family": "shed-shelter-shade", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "shed light literally / shade", "skill": "shed light literally / shade", "q": "A desk lamp sheds a warm glow while a screen shades the window. Which reading fits both verbs?", "o": ["The lamp stores tools; the screen emits sunlight into the room.", "The lamp hides its light; the screen creates a new storage shed.", "The lamp loses its leaves; the screen provides a storm forecast.", "The lamp gives off light; the screen blocks some incoming sunlight."], "a": 3, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "台灯散发柔和光线，窗屏则遮挡窗外的光。哪种理解符合两个动词？", "structure": "lamp与screen分别是两个动作主体；shed的宾语glow指实际光线，此处是散发义；shade的宾语window表明遮光。", "other": "desk lamp台灯；glow柔和光线；give off散发；incoming进入的。", "meaning": "shed可按宾语表示散发光等，shade在这里是遮光；字形相近不等于方向相同。此处也不要将字面发光一概替换为shed light on的阐明义。", "rest": "stores tools把名词棚屋硬套进动词；hides反转发光；loses leaves忽略实际宾语glow；窗屏发光、建棚或预报天气也不符合原句。"}, "context_id": "desk-lamp-emission-versus-window-screen-shading"}], "relative": [{"id": "relative-borrowed-ladder", "family": "relative", "introduced": null, "budget": 60, "target": "preposition + whom", "skill": "介词 + whom", "q": "The plumber thanked the neighbour. He had borrowed a ladder from the neighbour.\n哪句合并正确？", "o": ["The plumber thanked the neighbour from that he had borrowed a ladder.", "The plumber thanked the neighbour whom from he had borrowed a ladder.", "The plumber thanked the neighbour from whom he had borrowed a ladder.", "The plumber thanked the neighbour whom he had borrowed a ladder from him."], "a": 2, "exp": {"trans": "水管工感谢了那位借梯子给他的邻居。", "structure": "原始简单句：He had borrowed a ladder from the neighbour. → 用whom替代重复的the neighbour：the neighbour whom he had borrowed a ladder from → 把from前置：the neighbour from whom he had borrowed a ladder。外层主干是The plumber + thanked + the neighbour，后接修饰neighbour的定语从句。", "other": "plumber 水管工；neighbour 邻居；ladder 梯子；borrow A from B 从B那里借来A。", "meaning": "from不是临时猜出来的，来自原句borrow...from...；先行词是人，介词后用whom。", "rest": "from that：关系代词that不能直接置于介词后。whom from he：介词前置时必须是from whom，不是whom from。from him：关系代词whom已经代替该人，再保留him造成重复。"}, "context_id": "context:relative-borrowed-ladder"}], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-parallel-a", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "Not surprisingly / Equally unsurprisingly", "skill": "排序题并列递进标记", "budget": 50, "q": "段落甲结尾：Not surprisingly, nearly half of the applicants withdraw before the final interview.\n下面哪个段首与它的衔接最强？", "o": ["Equally unsurprisingly, few of the remaining applicants receive an offer.", "By contrast, the final interviews take place in the company's new building.", "For example, managers from several departments attend the final interview.", "In conclusion, a final interview is unnecessary for applicants who remain."], "a": 0, "exp": {"trans": "甲段说“不出所料，近一半申请者在终面前退出”。最强衔接是：“同样不足为奇的是，留下的人中也只有很少一部分收到录用。”", "structure": "Not surprisingly先给出一个“并不意外”的结果；Equally unsurprisingly显式要求前面已经有一个同类判断，再补第二个并列结果。两个副词短语构成明显篇章钩子。", "other": "withdraw 退出；final interview 终面；a small share 少部分；receive an offer 获得录用。", "meaning": "Equally / similarly / also 等段首词常要求前文存在可并列对象。排序题中这种平行措辞比泛泛的主题相似更可靠。", "rest": "换到面试地点没有形成真正对立；经理参会不是申请者退出的例子；也不能从退出比例推出剩余申请者无需面试。平行标记与申请者筛选链共同支持承接。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-parallel-a"}, {"id": "paragraph-discourse-ticket-deposits", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 50, "target": "段尾问题 / 原因解释", "skill": "排序题并列递进标记", "q": "前段：The theatre sold every seat at the advertised price. Yet the deposits in its bank account were smaller than the value of tickets sold. The manager began tracing the gap between bookings and payments.\n哪个后段最能推进这一问题？", "o": ["Audience surveys ranked music above scenery when asking about favourite parts of the performance.", "The booking agency deducted its service fees before forwarding the remaining money to the theatre.", "The theatre had used the same stage for years, although its audience changed with each production.", "Rehearsals ended later than planned, so actors sometimes travelled home together."], "a": 1, "exp": {"trans": "剧院按宣传价卖出了所有座位，但银行入账小于售票总额。经理追查订票与收到款项之间的差额。订票代理转款之前先扣除服务费，最直接解释这个差额。", "structure": "The theatre + sold + every seat。deposits + were smaller than + the value of tickets sold是金额比较。正确后段中The booking agency + deducted + service fees；before forwarding说明扣款发生在剧院收到钱之前。", "other": "deposit 入账款；advertised price 宣传价格；deduct 扣除；forward money 转款。", "meaning": "没有One reason或Equally等显眼连接词，也能由段尾的收款差额锁定后段的扣费机制。这是问题→原因，不是看见theatre或audience就接同主题段。证据来自金额和交易阶段，不是一个单词。", "rest": "Audience surveys解释演出偏好，未说明钱款差额；same stage介绍场地历史，未接收款链；rehearsals和共同回家是演出活动信息，不解释代理转款前少了什么。"}, "context_id": "context:paragraph-discourse-ticket-deposits"}, {"id": "sentence-link-course-participation-a", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "表面便利 vs 参与不足", "skill": "讽刺语气 + 对比过渡", "q": "前文：The online course called itself interactive, but students could do little more than click Next after each recorded lecture. The easiest part was operating the screen; the hardest was staying awake.\n【空缺】\n后文：What would genuine participation require? Students could challenge arguments and revise one another's work.\n哪句最适合？", "o": ["The simple controls already give learners an active role in shaping the course.", "A redesign could replace passive viewing with a real role in shaping discussion.", "Recorded lectures also let learners choose when to watch the same presentation.", "Adding subtitles would make the recorded lectures easier for learners to follow."], "a": 1, "exp": {"trans": "前文用带讽刺性的说法指出所谓互动课仍只让学生被动点下一页；正确句转向让学生真正贡献观点的另一种课程；后文追问真正参与需要什么。", "structure": "but建立宣称interactive与实际只能click Next的矛盾；the hardest was staying awake暗示被动乏味。正确句用replace passive viewing with a real role in shaping discussion提出另一模式，后文再具体说明质疑论点与互相修改。", "other": "interactive 互动的；lecture 讲座/课；challenge an argument 质疑论点；revise 修订。", "meaning": "看到操作很简单，不能自动判为作者赞扬。应结合转折、夸张和后文提问判断作者真正评价：被动消费不足，主动参与才是重点。", "rest": "操作简单不等于能参与建构讨论；自选观看时间和字幕提升观看便利，却没有补上后文要求的质疑论点、互评修改等主动参与。"}, "context_id": "context:sentence-link-course-participation-a"}, {"id": "sentence-link-museum-experiment-b", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 65, "target": "单向展示→反向参与→后文设问", "skill": "双向篇章钩子", "q": "前文：At the old science museum, visitors watched a machine demonstrate each experiment. The most demanding thing they could do was press the Start button.\n【空缺】\n后文：What counts as taking part in an experiment? Visitors must be able to change a variable and compare the results.\n哪一句最适合？", "o": ["Repairs to the building could give the passive displays a more attractive setting.", "Simpler controls could help more visitors watch the same machine demonstrations.", "More detailed labels could explain the inventors behind the museum's machines.", "A redesign could replace watching demonstrations with carrying out one's own tests."], "a": 3, "exp": {"trans": "旧科技馆由机器单向演示，观众几乎只能按开始按钮。正确句引出新展览如何扭转这种被动观看，让观众亲自试验；后文再问什么才是真正参与实验。", "structure": "前文visitors watched与could do ... press Start显示参与程度低；正确句replace watching demonstrations with carrying out one’s own tests对比观看与亲自实验，后文change a variable和compare the results说明这种参与如何实现。", "other": "demanding 费力的；demonstration 演示；variable 变量；carry out a test 进行试验。", "meaning": "最有力的证据是双向：反转被动的安排承接前文，主动测试又引出后文讨论。‘最难任务只是按按钮’在语境中揭示参与不足，不是对设备的夸赞。", "rest": "场馆外观、观看操作和发明者标签仍把参观者放在观看或接收信息的位置；只有亲自测试自然引出后文改变变量、比较结果的参与标准。"}, "context_id": "context:sentence-link-museum-experiment-b"}, {"id": "pb13-library-joint-grants-a", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-library-joint-grants-a", "target": "new funding mechanism / That consequence / topical two-group distractor", "skill": "制度改革先说明执行机制，再由That引出合作结果", "q": "A public library will stop funding children's and adult literacy programs through entirely separate budgets. Officials stress that the reform should strengthen both. [BLANK] That should produce more projects serving whole families, rather than two unrelated groups. Which fits?", "o": ["The new process will require both programs to design projects together.", "Regional libraries have published more reports about literacy this year.", "Some employees focus on adult readers, while others teach children.", "The board will create separate committees for each age group."], "a": 0, "exp": {"trans": "图书馆计划取消儿童和成人识字项目完全分立的预算。改革目标是同时加强两者。随后要解释两项目如何一起设计方案，这才能使服务整个家庭的合作项目增加。", "structure": "That回指空格中描述的具体做法；new process...design projects together才会自然导致projects serving whole families。两个研究群体的存在是话题背景，不是合作机制。", "other": "literacy 读写能力；entirely separate 完全分开的；joint project 联合项目；committee 委员会。", "meaning": "topic match≠discourse link：后句That should produce...是结果句，前句需要明确的行动或机制。如果只描述两个群体，读起来相关却没有形成因果链。", "rest": "发表报告不一定促进合作；成人/儿童分工只描述现状；继续成立独立委员会甚至背离整合改革的目标。"}}, {"id": "pb13-museum-team-proposals-b", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-museum-team-proposals-b", "target": "policy integration / mechanism / This change consequence", "skill": "空前改革目标与空后合作效果需要中间实施步骤", "q": "A museum plans to replace isolated conservation and education grants with a shared application process. Its directors say neither department will lose support. [BLANK] This change could generate exhibitions linking research and visitor experience. Which fits?", "o": ["The museum has recently seen a sharp increase in visitor attendance.", "Staff will evaluate proposals jointly and choose teams to collaborate.", "The departments have long published very different research reports.", "The museum will divide each grant into two fixed independent parts."], "a": 1, "exp": {"trans": "博物馆将把保护和教育研究的独立资助改成联合申请。管理层说两部门都不会失去支持。空格要解释联合评审并选择合作团队，才能顺接‘这一变化会产生连接研究与观众体验的展览’。", "structure": "空格前提供改革背景和意图；This change could generate...给出预期效果。中间需要能产生该效果的具体协作措施，而非笼统主题描述。", "other": "conservation 保护、文物修复；grant 资助；jointly 联合地；exhibition 展览。", "meaning": "要核实桥接是否构成‘政策→机制→结果’链条，不能因选项也谈博物馆或部门就草率接受。", "rest": "游客增加和以往报告差异只是主题信息；再把资金硬分成两部分反而违背联合申请改革。"}}, {"id": "paragraph-discourse-audit-method-before-cases", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-27", "target": "说明与例证的层级", "skill": "说明与例证的层级", "budget": 65, "q": "An energy guide first explains that meter logs locate periods of high demand. A paragraph about equipment inspections follows. The next two paragraphs describe a bakery and a warehouse that combined logs with inspections. What is the role of the inspections paragraph?", "o": ["It completes the methods that the later cases apply.", "It summarizes the outcomes reported in the later cases.", "It gives a third case after the bakery and warehouse.", "It withdraws the claim that meter logs can be useful."], "a": 0, "exp": {"trans": "能源指南先解释用电表日志定位高需求时段，再介绍设备检查；后面两个案例同时使用日志和检查。检查段是在补齐随后案例会应用的方法。", "structure": "first、follows、next交代段落顺序；combined logs with inspections说明两个案例同时依赖前面两种方法，不是只应用第一段的方法。", "other": "meter log 电表记录；equipment inspection 设备检查；high demand 高需求；apply 应用。", "meaning": "一个方法段结束，不代表下一段必须马上举例。要检查后面案例需要哪些方法说明，再分清并列方法与两则应用案例的层级。", "rest": "总结后文结果需要结果性内容，检查方法本身不能当作结果总结；它位于两案例前也不是第三案例；案例同时使用日志，并未撤回日志有用的判断。"}, "context_id": "context:paragraph-discourse-audit-method-before-cases"}], "effect-source-target": [{"id": "cl17-effects-room-echo", "family": "effect-source-target", "introduced": "2026-11-07", "published_on": "2026-11-07", "budget": 50, "target": "effect of A on B", "skill": "effect of A on B", "q": "An engineer asks how room shape changes echoes. Which phrase names that relationship without reversing the source and the affected outcome?", "o": ["the effect of echoes on room shape", "the effect between echoes and shape", "the effect on shape caused by echoes", "the effect of room shape on echoes"], "a": 3, "origin_session": "2026-11-07-2017-cloze", "source_question": 6, "exp": {"trans": "工程师问房间形状如何改变回声，对应房间形状对回声的影响。", "structure": "还原：room shape changes echoes；将变化来源room shape置于of之后，受影响的echoes置于on之后。", "other": "engineer工程师；echo回声；reverse颠倒。", "meaning": "判断搭配也要核对语义方向，不能因为一组of/on形式正确就忽略谁影响谁。", "rest": "of echoes on room shape与on shape caused by echoes均把方向反过来；between只说两者之间，未构成题目所需的effect of A on B关系。"}, "context_id": "effect-reconstruct-direction-from-question"}], "shed-light-direction": [{"id": "r17t3-light-audit-process", "family": "shed-light-direction", "intro
