</style></head><body><aside class="notice" role="note" style="max-width:860px;margin:16px auto;padding:12px"><strong>真题来源订正</strong><p>2011 Text 4 第38题正确答案为A。criticism可以是持续的隐含否定性评价，不要求直接人身攻击；D的群体满意度比较没有充分依据。你原本考虑A、最后选B，不能把“原本考虑”算成已提交的首次答案。旧轮题目和本地作答保留，来源诊断以此订正为准。</p><p>2011 Part B 顺序为G→B→D→E→A→C→F。G→B需合看人物引入与主题展开；B→D需结合通识课程设计困难、回指和固定E段。His、Menand或humanities重复本身不能证明唯一相邻；平行判断与结尾信号也应放回全篇核对。</p></aside><main id="app"></main><p style="max-width:900px;margin:auto;padding:0 20px"><a href="./article-reviews.html">历史文章复盘</a></p><noscript>请启用浏览器JavaScript后做题。</noscript>

lusion过早收束，而且all interviews are unnecessary也超出前文。"}, "source_exam": "2011-english1", "source_part": "Part B"}, {"id": "title-booking-b", "family": "title-specificity", "introduced": "2026-09-30", "budget": 55, "target": "主旨标题 / 特殊限定条件", "skill": "标题题", "q": "短文：一些游客现在会在签证获批前就购买可退改机票。文章重点讨论这种“先订票、后等签证”的风险和好处。哪个标题最好？", "o": ["Travel in the Modern World", "Booking Before Approval", "The Only Smart Way to Travel", "Why Visas Should Disappear"], "a": 1, "exp": {"trans": "短文关注的是一种具体行为：在签证批准之前先订可退改机票，并讨论其风险与好处。", "structure": "主旨由反复出现的时间关系“before approval”限定。标题需要既覆盖行为，又保留这个特殊条件。", "other": "visa approval 签证获批；refundable 可退款的；risk 风险；benefit 好处。", "meaning": "Booking Before Approval准确概括特殊现象；不是只说“旅游”，也不夸大成唯一正确方式。", "rest": "Travel in the Modern World范围太大；The Only Smart Way含绝对化Only，原文只说“一些游客”；Why Visas Should Disappear引入原文没有的政策主张。"}}], "retry": {"relative": [{"id": "relative-borrowed-ladder", "family": "relative", "introduced": null, "budget": 60, "target": "preposition + whom", "skill": "介词 + whom", "q": "The plumber thanked the neighbour. He had borrowed a ladder from the neighbour.\n哪句合并正确？", "o": ["The plumber thanked the neighbour from that he had borrowed a ladder.", "The plumber thanked the neighbour whom from he had borrowed a ladder.", "The plumber thanked the neighbour from whom he had borrowed a ladder.", "The plumber thanked the neighbour whom he had borrowed a ladder from him."], "a": 2, "exp": {"trans": "水管工感谢了那位借梯子给他的邻居。", "structure": "原始简单句：He had borrowed a ladder from the neighbour. → 用whom替代重复的the neighbour：the neighbour whom he had borrowed a ladder from → 把from前置：the neighbour from whom he had borrowed a ladder。外层主干是The plumber + thanked + the neighbour，后接修饰neighbour的定语从句。", "other": "plumber 水管工；neighbour 邻居；ladder 梯子；borrow A from B 从B那里借来A。", "meaning": "from不是临时猜出来的，来自原句borrow...from...；先行词是人，介词后用whom。", "rest": "from that：关系代词that不能直接置于介词后。whom from he：介词前置时必须是from whom，不是whom from。from him：关系代词whom已经代替该人，再保留him造成重复。"}}], "causal-role-direction": [{"id": "causal-role-direction-travel-b", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "施事与受事 / 原因与结果", "skill": "作用关系不能倒置", "budget": 50, "q": "The gardeners shaded the seedlings during the hottest hours. As a result, fewer seedlings dried out. Which statement keeps the cause and the affected object in the right roles?", "o": ["The healthier seedlings caused the gardeners to provide shade.", "Shade provided by the gardeners reduced the seedlings' exposure to heat.", "The seedlings protected the gardeners from the heat.", "The heat was reduced because the seedlings dried out."], "a": 1, "exp": {"trans": "园丁在最热的几小时给幼苗遮阴，因此干枯的幼苗变少了。正确改写是：园丁提供的遮阴减少了幼苗暴露在高温中的程度。", "structure": "第一句：The gardeners（施事/主语）+ shaded（谓语）+ the seedlings（受事/宾语）。第二句：fewer seedlings（主语）+ dried out（谓语）。As a result明确把遮阴和干枯减少连接为原因与结果。", "other": "gardener 园丁；shade 给……遮阴；seedling 幼苗；dry out 干枯；exposure 暴露。", "meaning": "先标明谁采取动作、谁受影响，再核对因果方向。gardener → shade → seedlings dry out less，不能交换施事与受事。", "rest": "healthier seedlings caused...把结果当成原先行动的原因；seedlings protected gardeners交换了保护者与被保护者；heat was reduced because...反转因果，还把减少高温暴露偷换成降低环境温度。"}, "source_exam": "2011-english1", "source_question": 40}], "point": [{"id": "legacy-miss-point", "source": "today", "skill": "miss the point / point", "target": "miss the point / point", "q": "The committee spent twenty minutes arguing about the font on the warning sign, while the real issue was whether the bridge was safe. They were clearly ___.", "o": ["missing the point", "making a point", "reaching the point", "pointing out"], "a": 0, "diag": {"1": "make a point 常表示“提出观点/特意强调”，这里强调的是没抓住真正问题。", "2": "reach the point 需要具体语境，如 reach the point where...，不能表达“没抓住重点”。", "3": "point out 通常后接宾语，表示“指出”；这里既不合结构也不合语义。"}, "exp": {"trans": "委员会花了二十分钟争论警示牌的字体，而真正的问题是这座桥是否安全。他们显然没有抓住重点。", "structure": "第一句：The committee（主语）+ spent（谓语）+ twenty minutes（宾语）；arguing...说明时间花在何事上。while连接对比；whether the bridge was safe作表语从句。第二句：They（主语）+ were missing（现在进行时谓语）+ the point（宾语）。", "other": "committee 委员会；warning sign 警示牌；issue 问题/争议点；safe 安全的。", "meaning": "miss the point = 没抓住重点、没理解关键。point 在这里是“要点/关键”，不是“节点”。", "rest": "make a point = 提出/强调观点；reach the point = 达到某个阶段/程度；point out = 指出某事。只有 missing the point（没抓住重点）符合他们纠结字体却忽视桥梁安全的语境。"}, "family": "point", "introduced": "2026-09-29", "budget": 35}, {"id": "point-joke", "family": "point", "introduced": "2026-09-29", "target": "miss the point", "skill": "miss the point / point", "q": "Even after I explained the joke twice, my brother still missed the point.\nmissed the point 在这里表示什么？", "o": ["仍然怀念以前的笑话", "仍然没明白笑话的关键", "忘记了一个标点符号", "没赶上兄弟聚会"], "a": 1, "exp": {"trans": "即使我把这个笑话解释了两遍，我弟弟仍然没有明白其中的关键。", "structure": "主句：my brother（主语）+ missed（谓语）+ the point（宾语）。after从句：I + explained + the joke；twice修饰explained。even强调即便已经解释过，结果仍如此。", "other": "joke 笑话；twice 两次；still 仍然；explain 解释。", "meaning": "miss the point整体表示没领会关键、没明白意思，不能把miss机械地译成怀念。", "rest": "miss sb可表示想念某人，但miss the point不是这一义项。标点符号一般是punctuation mark，不是这里的point。miss a meeting可表示错过聚会，但原句没有meeting；brother是主语，不是被错过的活动。"}}], "social-message-inference": [{"id": "social-message-inference-career-a", "family": "social-message-inference", "introduced": "2026-10-03", "target": "社会评价 / 信息影响", "skill": "隐含批评与证据范围", "budget": 50, "q": "A workplace culture repeatedly celebrates employees who stay late, and workers who leave on time are often reminded that “real commitment means sacrifice.” What is most safely suggested?", "o": ["Workers who leave on time are formally punished every day.", "The culture may make some workers question whether they are committed enough.", "Employees who stay late are always more productive.", "Managers ignore workers who leave on time."], "a": 1, "exp": {"trans": "一种职场文化反复赞美加班员工，而准时下班的人经常被提醒“真正的投入意味着牺牲”。最稳妥的推断是：这种文化可能让一些人怀疑自己是否足够投入。", "structure": "主句1：A workplace culture + celebrates + employees。who stay late修饰employees。主句2：workers who leave on time + are reminded + that从句。that从句给出被灌输的信息。题目要从这种持续信息推断心理影响，而不是 lps staff choose the right storage conditions.", "These teachers were born in several different countries.", "Such salaries are difficult to compare across cities.", "That book was translated into three languages."], "a": 0, "exp": {"trans": "前文说仓库把冷藏货物和干货分区存放。最自然的衔接是：这种分开存放也有助于员工选择合适的储存条件。", "structure": "The warehouse + stores + chilled goods / dry goods，两个地点与keep them separate明确建立分离关系。This separation把这个关系名词化并回指，also再补充该安排的作用。", "other": "warehouse 仓库；chilled 冷藏的；dry goods 干货；storage conditions 储存条件。", "meaning": "在给定候选中，this separation有明确先行关系，另外几个指示词没有相应对象。这是本题的充分比较证据；不能推广成所有排序题都有唯一代词连接。", "rest": "These teachers需要前文先出现teachers；Such salaries需要先出现salary；That book需要先出现某本书，三者在给定前文中都没有先行对象。"}, "source_exam": "2011-english1", "source_part": "Part B"}], "complementary": [], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-conclusion-b", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "concludes / 收束段识别", "skill": "排序题结论信号", "budget": 50, "q": "一篇先分析家电过早报废、后提出改进办法的文章，有一候选段写道：After examining the figures, Dr Patel sums up her proposal: shared repair services could help residents keep appliances longer. 段末又说：Whether enough households will join, however, remains an open question.\n这一段最适合放在哪里？", "o": ["全文开头，用来首次介绍Dr Patel", "问题分析展开之前", "全文结尾附近，作为总结和改革建议", "只能放在具体数据段之前"], "a": 2, "exp": {"trans": "考察数据后，Patel博士总结自己的建议：共享维修服务或许能让居民更长久地使用电器。但是否有足够多家庭参与，仍是未决问题。这段最适合放在结尾附近。", "structure": "After examining the figures回看前文数据；Dr Patel + sums up + her proposal明确给出总结动作。末句Whether...will join作主语，remains...为谓语部分，以未决问题收束。", "other": "sum up 总结；shared repair service 共享维修服务；appliance 家电；household 家庭；open question 未决问题。", "meaning": "总结建议与回顾数据、开放结尾合起来支持尾段位置；单独出现concludes或sum up并不能证明必为全文最后一段。", "rest": "首次介绍人物不能解释已分析过数据；在问题分析前放总结建议与给定结构不合；“只能放在数据段之前”更与After examining the figures相反。"}, "source_exam": "2011-english1", "source_part": "Part B"}], "title-specificity": [{"id": "title-preprint-a", "family": "title-specificity", "introduced": "2026-09-30",
