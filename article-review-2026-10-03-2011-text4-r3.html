project had failed completely.", "The team was told that the project had won an award."], "a": 1, "exp": {"trans": "把志愿者历时六个月的修复项目说成“并非完全没有用”，让团队觉得这只是很勉强的赞扬。", "structure": "Calling the volunteers' six-month restoration project ‘not entirely useless’是整个动名词短语主语；struck是谓语；the team是宾语；as faint praise表示给团队留下何种印象。短语内部call A B：称A为B。", "other": "restoration 修复；entirely 完全；strike sb as sth 给某人以某种印象；approval 赞许。", "meaning": "faint praise并非赞扬完全不存在，而是肯定得很有限，甚至暗含保留意见。", "rest": "enthusiastic celebration表示热情赞颂，力度过强；had failed completely表示彻底失败，把微弱肯定改成全面否定；had won an award表示获奖，原文没有提供获奖事实。"}}, {"id": "feature-verb-magazine-a", "family": "feature-verb", "introduced": "2026-10-03", "budget": 35, "target": "feature 作动词", "skill": "feature 熟词生义", "q": "The revised training course features a workshop in which volunteers repair old bicycles. Here, features most nearly means:", "o": ["includes the workshop as a prominent part of the course", "lists the volunteers' physical characteristics", "cancels the bicycle workshop", "requires every volunteer to buy a new bicycle"], "a": 0, "exp": {"trans": "修订后的培训课程把志愿者修理旧自行车的工作坊作为特色内容。features表示把该工作坊作为课程的重要部分。", "structure": "The revised training course（主语）+ features（谓语）+ a workshop（宾语）。in which volunteers repair old bicycles是修饰workshop的定语从句，来自Volunteers repair old bicycles in the workshop。", "other": "revised 修订的；training course 培训课程；workshop 工作坊；volunteer 志愿者。", "meaning": "feature作及物动词表示把某内容作为重要或特色部分，不是名词“外貌特征”。", "rest": "physical characteristics对应features的名词义，与当前及物动词位置不符；cancels与课程包含工作坊相反；buy a new bicycle没有证据，原句讨论repair old bicycles。"}}, {"id": "directness-engineer-a", "family": "directness-modifier", "introduced": "2026-09-30", "budget": 45, "target": "surprisingly + adjective / straight up", "skill": "副词修饰范围 + straight up", "q": "When reporters asked why the product launch had been delayed, the engineer was surprisingly straight up: “We underestimated the testing time.” Her manner was best described as:", "o": ["frank", "impulsive", "ceremonial", "hostile"], "a": 0, "exp": {"trans": "记者问产品为什么延期发布时，这位工程师出人意料地直截了当：“我们低估了测试所需的时间。”她的表达方式最适合形容为坦率。", "structure": "主句：the engineer（主语）+ was（系动词）+ surprisingly straight up（表语）。surprisingly修饰straight up，回答“出人意料地怎么样”。冒号后的直接引语具体证明她没有遮掩原因。", "other": "product launch 产品发布；delay 推迟；underestimate 低估；testing time 测试时间。", "meaning": "straight up在这里表示坦率、直截了当；surprisingly只表示这种坦率令人意外，不等于“冲动”。", "rest": "impulsive表示冲动、未经充分考虑就行动，通常描述decision/action；ceremonial表示仪式性的；hostile表示敌对的。三者都不能由“直接承认低估测试时间”推出。"}}, {"id": "point-joke", "family": "point", "introduced": "2026-09-29", "target": "miss the point", "skill": "miss the point / point", "q": "Even after I explained the joke twice, my brother still missed the point.\nmissed the point 在这里表示什么？", "o": ["仍然怀念以前的笑话", "仍然没明白笑话的关键", "忘记了一个标点符号", "没赶上兄弟聚会"], "a": 1, "exp": {"trans": "即使我把这个笑话解释了两遍，我弟弟仍然没有明白其中的关键。", "structure": "主句：my brother（主语）+ missed（谓语）+ the point（宾语）。after从句：I + explained + the joke；twice修饰explained。even强调即便已经解释过，结果仍如此。", "other": "joke 笑话；twice 两次；still 仍然；explain 解释。", "meaning": "miss the point整体表示没领会关键、没明白意思，不能把miss机械地译成怀念。", "rest": "miss sb可表示想念某人，但miss the point不是这一义项。标点符号一般是punctuation mark，不是这里的point。miss a meeting可表示错过聚会，但原句没有meeting；brother是主语，不是被错过的活动。"}}, {"id": "causal-role-direction-fitness-a", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "attribute A to B / 原因与结果", "skill": "谁影响谁", "budget": 50, "q": "A trial attributed a drop in workshop dust to the installation of a new air filter. Which paraphrase preserves the reported cause and effect?", "o": ["The decrease in dust made the workshop install a new filter.", "Installing the filter helped reduce the amount of dust in the workshop.", "Dust in the workshop improved the filter's performance.", "The trial proved that every type of pollution had disappeared."], "a": 1, "exp": {"trans": "一项试验把车间粉尘的减少归因于安装了新的空气过滤器。准确改写应保留“安装过滤器 → 粉尘减少”的因果方向。", "structure": "A trial（主语）+ attributed（谓语）+ a drop in workshop dust（宾语/结果）+ to the installation of a new air filter（原因）。attribute A to B中A是被解释的结果，B是原因；名词化的installation保留install the filter这一动作。", "other": "trial 试验；workshop 车间；dust 粉尘；installation 安装；air filter 空气过滤器。", "meaning": "不要把先出现的名词误当成原因。attribute A to B的方向是B导致A，而不是A导致B。", "rest": "The decrease in dust made...把结果倒置为安装的原因；Dust improved the filter's performance交换了受影响对象并添加无据效果；every type of pollution把粉尘减少扩大为所有污染消失。"}}, {"id": "provoke-family-debate-a", "family": "provoke-family", "introduced": "2026-10-03", "budget": 40, "target": "provocative / provoke sb to do", "skill": "provoke 词族语境义", "q": "The documentary was deliberately provocative: it was designed to provoke viewers to question assumptions they had long accepted. Which explanation is most accurate?", "o": ["provocative means sexually attractive here", "provocative means thought-provoking or controversial, and provoke viewers to question means prompt them to question", "provoke always means make someone angry", "provocative means completely objective"], "a": 1, "exp": {"trans": "这部纪录片有意具有挑衅性/引发思考：它就是为了促使观众质疑自己长期接受的假设。", "structure": "第一分句：The documentary（主语）+ was（系动词）+ deliberately provocative（表语）。冒号后：it（主语）+ was designed（被动谓语）+ to provoke viewers to question...（目的）。provoke viewers to question是provoke sb to do结构；they had long accepted修饰assumptions。", "other": "documentary 纪录片；deliberately 有意地；assumption 假设/想当然的看法；accept 接受。", "meaning": "provocative在文章、观点、作品语境中常表示会引发争议或思考；provoke sb to do 可表示促使、激起某人去做某事，不一定是“激怒”。", "rest": "sexually attractive是某些人物/服装语境中的另一义，不能解释question assumptions；always make someone angry把一种义项扩大成唯一义项；completely objective讨论客观程度，原文没有提供这种判断，provocative本身也不等于不客观。"}}, {"id": "social-message-inference-career-a", "family": "social-message-inference", "introduced": "2026-10-03", "target": "社会暗示 / 满意度推断", "skill": "社会信息 ≠ 直接批评", "budget": 50, "q": "A workplace culture repeatedly celebrates employees who stay late, and workers who leave on time are often reminded that “real commitment means sacrifice.” What is most safely suggested?", "o": ["Workers who leave on time are formally punished every day.", "The culture may make some workers question whether they are committed enough.", "Employees who stay late are always more productive.", "Managers ignore workers who leave on time."], "a": 1, "exp": {"trans": "一种职场文化反复赞美加班员工，而准时下班的人经常被提醒“真正的投入意味着牺牲”。最稳妥的推断是：这种文化可能让一些人怀疑自己是否足够投入。", "structure": "主句1：A workplace culture + celebrates + employees。who stay late修饰employees。主句2：workers who leave on time + are reminded + that从句。that从句给出被灌输的信息。题目要从这种持续信息推断心理影响，而不是擅自添加处罚事实。", "other": "workplace culture 职场文化；commitment 投入/忠诚；sacrifice 牺牲；question whether 怀疑是否。", "meaning": "反复接收到某种价值信息，最直接支持的是“可能影响自我判断/满意度”，不等于已经遭受正式批评或惩罚。", "rest": "formally punished every day加入原文没有的正式处罚；always more productive把价值宣传偷换成生产率事实；ignore与“are often reminded”相反。"}}], "retry": {"nested": [{"id": "legacy-who-that-main", "source": "today", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "target": "who 定语从句 / that 宾语从句", "q": "Applicants who believe that a longer résumé automatically proves greater ability often overlook the value of relevance.\n哪组句法判断正确？", "o": ["主句主语 Applicants；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 proves；主句谓语 believe", "主句主语 a longer résumé；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 believe；主句谓语 proves"], "a": 0, "diag": {"1": "proves 属于 that 宾语从句，不是 who 从句的核心谓语；believe 也不是主句谓语。", "2": "a longer résumé 是 that 从句内部的主语，不是整句主语。", "3": "proves 是 that 从句谓语；整句主句谓语是 overlook。"}, "exp": {"trans": "那些认为简历越长就自然能证明能力越强的申请者，往往忽视了“相关性”的价值。", "structure": "原始简单句① Applicants often overlook the value of relevance. ② Applicants believe something. ③ A longer résumé automatically proves greater ability. → ②把 something 换成 that 从句：Applicants believe that... → 再把②变成修饰 Applicants 的 who 定语从句：Applicants who believe that... often overlook...。所以整句主语 Applicants，who 从句谓语 believe，that 从句谓语 proves，主句谓语 overlook。", "other": "applicant 申请者；résumé 简历；automatically 自然而然地/自动地；relevance 相关性。", "meaning": "看到 who 后先划到从句结束，再找主句谓语；who 从句里又可嵌套 that 宾语从句。", "rest": "把 that 从句的谓语 proves 误当成外层谓语，或把其中的 a longer résumé 误当成整句主语，都会错过：Applicants 是主句主语，believe 是 who 从句谓语，overlook 是主句谓语。"}, "family": "nested", "introduced": "2026-09-29", "budget": 60}], "faint": [{"id": "legacy-faint-praise", "source": "today", "skill": "faint / faint praise", "target": "faint / faint praise", "q": "After a two-hour presentation, Maya said, “Well, at least the slides were readable.” Her remark is best described as:", "o": ["faint praise", "earnest approval", "open hostility", "sufficient evidence"], "a": 0, "diag": {"1": "earnest approval 是真诚而明确的赞许；“at least...”只给了很弱的一点肯定。", "2": "这句话并非直接敌意攻击，而是非常有限、勉强的表扬。", "3": "evidence 是“证据”，不是评价语气。"}, "exp": {"trans": "听完一场两小时的演讲后，Maya 说：“嗯，至少幻灯片还看得清。”这句话最适合形容为“勉强的赞扬”。", "structure": "Maya（主语）+ said（谓语）+ 引语（内容）。问句 Her remark is best described as... 中 is described是被动谓语，不是is加形容词表语。引语主干为the slides were readable；at least限制了肯定的力度。", "other": "presentation 演讲/展示；readable 易读的；remark 评论；at least 至少。", "meaning": "faint praise = 勉强的、力度很弱的赞扬。这里 faint 的核心是“微弱的、不强的”。", "rest": "earnest approval = 真诚、明确的赞成，语气过强；open hostility = 公开敌意，不符合；sufficient evidence = 充分证据，词义类别都不对。只有 faint praise（力度很弱的赞扬）符合 at least 的保留语气。"}, "family": "faint", "introduced": "2026-09-29", "budget": 35}, {"id": "faint-map-line", "family": "faint", "introduced": "2026-09-29", "target": "faint", "skill": "faint / faint praise", "q": "After years in the sunlight, only a faint line remained on the old map.\n这里 faint 最接近哪种意思？", "o": ["神圣的", "突然出现的", "隐约的、不清晰的", "故意伪造的"], "a": 2, "exp": {"trans": "经过多年日晒，旧地图上只剩下一条隐约可见的线。", "structure": "After years in the sunlight是时间背景。only a faint line（主语）+ remained（不及物谓语）；on the old map是地点状语。", "other": "sunlight 阳光；remain 留下、仍然存在；line 线条；after years 多年之后。", "meaning": "faint在这里是微弱、不明显的；与faint praise中赞扬力度很弱具有相近的语义核心。", "rest": "神圣的常用holy/sacred；圣人是saint，不是faint。突然出现的可说sudden，重点是发生速度，不是清晰度。伪造的可说forged/fake，描述真伪，原句没有这种信息。"}}], "feature-verb": [], "directness-modifier": [{"id": "directness-curator-b", "family": "directness-modifier", "introduced": "2026-09-30", "budget": 45, "target": "come right out and say / frank", "skill": "直接表达", "q": "Instead of giving a vague excuse for the exhibition's cancellation, the curator came right out and said that ticket sales had been too low. This response was:", "o": ["evasive", "frank", "impulsive", "indifferent"], "a": 1, "exp": {"trans": "这位策展人没有用含糊的借口解释展览取消，而是直接说票卖得太少了。这种回应是坦率的。", "structure": "Instead of giving...是介词短语作对比背景。主干：the curator（主语）+ came right out and said（谓语）+ that从句（宾语）。that ticket sales had been too low说明她直接说出的真实原因。", "other": "vague excuse 含糊的借口；curator 策展人；cancellation 取消；ticket sales 票房/售票量。", "meaning": "come right out and say = 直截了当地说；语气上对应frank，而不是回避。", "rest": "evasive表示闪烁其词、回避，和instead of a vague excuse相反；impulsive强调冲动行为；indifferent表示冷漠、不在意，原句没有这种态度。"}}], "point": [{"id": "legacy-miss-point", "source": "today", "skill": "miss the point / point", "target": "miss the point / point", "q": "The committee spent twenty minutes arguing about the font on the warning sign, while the real issue was whether the bridge was safe. They were clearly ___.", "o": ["missing the point", "making a point", "reaching the point", "pointing out"], "a": 0, "diag": {"1": "make a point 常表示“提出观点/特意强调”，这里强调的是没抓住真正问题。", "2": "reach the point 需要具体语境，如 reach the point where...，不能表达“没抓住重点”。", "3": "point out 通常后接宾语，表示“指出”；这里既不合结构也不合语义。"}, "exp": {"trans": "委员会花了二十分钟争论警示牌的字体，而真正的问题是这座桥是否安全。他们显然没有抓住重点。", "structure": "第一句：The committee（主语）+ spent（谓语）+ twenty minutes（宾语）；arguing...说明时间花在何事上。while连接对比；whether the bridge was safe作表语从句。第二句：They（主语）+ were missing（现在进行时谓语）+ the point（宾语）。", "other": "committee 委员会；warning sign 警示牌；issue 问题/争议点；safe 安全的。", "meaning": "miss the point = 没抓住重点、没理解关键。point 在这里是“要点/关键”，不是“节点”。", "rest": "make a point = 提出/强调观点；reach the point = 达到某个阶段/程度；point out = 指出某事。只有 missing the point（没抓住重点）符合他们纠结字体却忽视桥梁安全的语境。"}, "family": "point", "introduced": "2026-09-29", "budget": 35}, {"id": "point-waiting", "family": "point", "introduced": "2026-09-29", "target": "point / there is no point in doing", "skill": "point 熟词生义", "q": "With the last bus already gone, there was no point in waiting at the stop.\npoint 在这里最接近：", "o": ["联合会", "尖端", "分数", "意义、用处"], "a": 3, "exp": {"trans": "末班车已经开走了，继续在车站等也没有意义。", "structure": "主干：there was no point in waiting at the stop，是there be存在句。With the last bus already gone补充原因背景。简单句The last bus was already gone → 去掉was，用with + 名词 + 状态补语压缩。", "other": "last bus 末班车；already 已经；be gone 已经离开、不在了；bus stop 公交站。", "meaning": "there is no point in doing sth：做某事没有意义；point不是物理位置上的点。", "rest": "联合会常用federation/association，与句意无关。尖端可用the point of a needle，必须是具体物体的尖端。分数可说score three points，但这里不是计分语境。"}}], "causal-role-direction": [{"id": "causal-role-direction-travel-b", "family": "causal-role-direction", "introduced": "2026-10-03", "target": "施事与受事 / 原因与结果", "skill": "作用关系不能倒置", "budget": 50, "q": "The gardeners shaded the seedlings during the hottest hours. As a result, fewer seedlings dried out. Which statement keeps the cause and the affected object in the right roles?", "o": ["The healthier seedlings caused the gardeners to provide shade.", "Shade provided by the gardeners reduced the seedlings' exposure to heat.", "The seedlings protected the gardeners from the heat.", "The heat was reduced because the seedlings dried out."], "a": 1, "exp": {"trans": "园丁在最热的几小时给幼苗遮阴，因此干枯的幼苗变少了。正确改写是：园丁提供的遮阴减少了幼苗暴露在高温中的程度。", "structure": "第一句：The gardeners（施事/主语）+ shaded（谓语）+ the seedlings（受事/宾语）。第二句：fewer seedlings（主语）+ dried out（谓语）。As a result明确把遮阴和干枯减少连接为原因与结果。", "other": "gardener 园丁；shade 给……遮阴；seedling 幼苗；dry out 干枯；exposure 暴露。", "meaning": "先标明谁采取动作、谁受影响，再核对因果方向。gardener → shade → seedlings dry out less，不能交换施事与受事。", "rest": "healthier seedlings caused...把结果当成原先行动的原因；seedlings protected gardeners交换了保护者与被保护者；heat was reduced because...反转因果，还把减少高温暴露偷换成降低环境温度。"}}], "provoke-family": [], "social-message-inference": [{"id": "social-message-inference-parenting-b", "family": "social-message-inference", "introduced": "2026-10-03", "target": "message / criticism / satisfaction", "skill": "被灌输信息 ≠ 被直接批评", "budget": 50, "q": "At a school, the wall of honour lists only perfect test scores. A pupil who has improved greatly still asks, “Does my progress count if I never appear on that wall?” Which inference is best supported?", "o": ["The pupil has been personally insulted by every teacher.", "The display may lead the pupil to doubt the value of improvement without perfection.", "The school has failed to display any test scores.", "Every pupil with a perfect score has made greater progress."], "a": 1, "exp": {"trans": "一所学校的荣誉墙只列满分成绩。一名进步很大的学生仍问：“如果我从未登上那面墙，我的进步还算数吗？”最稳妥的推断是：这种展示可能让他怀疑没有满分的进步是否有价值。", "structure": "第一句：the wall of honour + lists + only perfect test scores。第二句：A pupil + asks + 引语；who has improved greatly修饰pupil。引语里if从句给出没有上榜这一条件。学生的问题体现了对进步价值的怀疑。", "other": "wall of honour 荣誉墙；perfect score 满分；progress 进步；count 有价值/算数。", "meaning": "社会信息可以通过展示与选择标准传递，并影响自我评价；不需要出现直接人身批评。", "rest": "personally insulted无直接侮辱证据，every teacher还扩大范围；failed to display any scores与列出满分矛盾；greater progress把最终成绩偷换成进步幅度。"}}]}, "article_session": {"id": "2026-10-03-2011-text4", "source": "2011 英语一 Text 4", "created_at": "2026-10-03T17:40:27+08:00", "revision": 3, "session_file": "data/article-sessions/2026-10-03-2011-text4.json", "current_families": ["causal-role-direction", "social-message-inference", "feature-verb", "provoke-family"], "deferred_families": ["subconscious-way", "past-tense-happiness"], "historical_families": ["faint", "directness-modifier", "point", "nested"]}, "issues_used": [1, 2, 3, 4, 5, 6, 7, 8], "engine": 4};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
