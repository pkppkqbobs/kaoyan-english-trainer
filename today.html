<script>window.REVIEW_DATA={"date": "2026-11-12", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "r17t3-light-audit-process", "family": "shed-light-direction", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "bring to light / shed light on", "skill": "bring to light / shed light on", "q": "An audit brings an unrecorded payment to light. A later analysis sheds light on how it bypassed checks. Which reading preserves the different emphases?", "o": ["The audit hides the payment; the analysis also conceals the process.", "The audit explains the process; the analysis denies any payment existed.", "The audit illuminates a room; the analysis changes its lighting system.", "The audit reveals the payment; the analysis helps explain the process."], "a": 3, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "审计揭露了一笔未入账的款项；后续分析帮助说明它如何绕过检查。怎样理解才能保留两种表达的侧重点？", "structure": "brings...to light的宾语是先前未知的payment；sheds light on的对象是how引导的运作过程。", "other": "audit审计；unrecorded未记录的；bypass绕过；emphasis侧重点。", "meaning": "bring to light偏使隐情为人所知；shed light on偏提供理解所需的信息。这里可以前者揭露事实、后者解释机制，不必强行互斥。", "rest": "hides和conceals均反转方向；denies payment没有依据且否认已揭露事实；room/lighting system把两个比喻都误作物理照明。"}, "context_id": "payment-disclosure-versus-explanation-of-check-bypass"}, {"id": "r17t3-budding-friendship", "family": "budding-stage", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "early development / established relationship", "skill": "early development / established relationship", "q": "Two neighbours have begun sharing meals after years of merely exchanging greetings. The narrator describes a budding friendship. What is established?", "o": ["A closer relationship is beginning, though its future remains open.", "A lifelong friendship is already certain to survive every difficulty.", "Their earlier greetings prove that they have always been close friends.", "The relationship has ended because the neighbours avoid one another."], "a": 0, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "两位邻居多年只是打招呼，最近开始一起吃饭，叙述者称之为budding friendship。能确认什么？", "structure": "have begun标记变化开始；after years of merely...对比原先较疏远的状态；budding概括关系正萌芽。", "other": "merely仅仅；greeting问候；narrator叙述者；lifelong终生的。", "meaning": "是更亲密关系的开端，而非已经充分确立的终生承诺。发展初期、已有发展和最终稳定要区分。", "rest": "lifelong...certain是无依据保证；always close抹去先前只打招呼的限定；has ended与开始一起吃饭的动作相反。"}, "context_id": "new-neighbour-friendship-begins-without-guaranteed-future"}, {"id": "text4-vocab-tremendous-incentive", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-05", "budget": 45, "target": "tremendous incentive", "skill": "强度与鼓励机制", "q": "A university offered full travel grants to interns who accepted placements in remote clinics. The grants created a tremendous incentive to apply. What does the final phrase mean?", "o": ["An almost invisible change to the application form.", "A minor obstacle that made placements less attractive.", "A very strong reason encouraging interns to apply.", "A written order forcing every intern to participate."], "a": 2, "exp": {"trans": "大学为偏远实习岗位提供全额交通补助，这是很强的报名激励。", "structure": "created a tremendous incentive to apply交代资金对行动的影响。", "other": "tremendous巨大的；incentive激励；placement实习岗位。", "meaning": "巨大激励意味着有吸引力，而非强制命令。", "rest": "微小变化、轻微障碍和强制参与都不符合词义。"}, "context_id": "remote-internship-travel-grant-motivation"}, {"id": "nested-editor-quote-d", "family": "nested", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 60, "target": "who-clause / that-clause / main-clause predicate", "skill": "区分定语从句、宾语从句和主句谓语", "q": "Editors who learned that the quote was inaccurate removed it from the draft. Which sequence gives the main-clause subject head / who-clause verb / main-clause verb?", "o": ["Editors / learned / removed", "the quote / learned / was", "Editors / was / learned", "the draft / removed / learned"], "a": 0, "exp": {"trans": "得知引文不准确的编辑把它从草稿中删掉了。主句主语中心词是Editors，who从句谓语是learned，主句谓语是removed。", "structure": "主句骨架是Editors removed it from the draft；who learned...修饰Editors；that the quote was inaccurate是learned的宾语从句。三个谓语属于不同层级。", "other": "editor 编辑；quote 引文；inaccurate 不准确的；draft 草稿。", "meaning": "先找主句骨架，再把who定语从句和that宾语从句分别嵌入。quote是that从句的主语，Editors才是主句主语。", "rest": "the quote只在that从句中作主语；was属于that宾语从句，不是who从句谓语；the draft是介词from的宾语，不是主句主语。"}, "context_id": "context:nested-editor-quote-d"}, {"id": "with-archive-loading-c", "family": "with", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "with + noun + participial phrase", "skill": "识别with复合结构的伴随状态", "q": "The archive reopened at noon, with several boxes waiting in the loading area. What does the with-clause do?", "o": ["It describes a state accompanying the archive's reopening.", "It gives the sole reason the archive reopened at noon.", "It reports an action that archive staff carried out.", "It is the direct object of reopened in the main clause."], "a": 0, "exp": {"trans": "档案馆中午重新开放，当时有几个箱子正等在装卸区。with结构补充了重新开放时伴随的状态。", "structure": "主干是The archive reopened at noon；with several boxes waiting in the loading area是with + 名词 + 现在分词结构，several boxes是waiting的逻辑主语。", "other": "archive 档案馆；reopen 重新开放；loading area 装卸区；accompany 伴随。", "meaning": "with复合结构常补充主句发生时的伴随状态。它不是reopened的直接宾语，也不自动表达原因或目的。", "rest": "句子没有说明这是档案馆重新开放的唯一原因；with短语描述箱子所处的状态，并未说工作人员另做了一项动作；reopened在这里是不及物动词，不需要直接宾语。"}, "context_id": "context:with-archive-loading-c"}, {"id": "cl17-illness-diary", "family": "phrasal-verb-illness", "introduced": "2026-11-07", "published_on": "2026-11-07", "budget": 45, "target": "come across / come up with / come down with", "skill": "come across / come up with / come down with", "q": "A diary says: \"I came across an old friend in the port, came up with a new route, and came down with a fever on the way home.\" Which sequence does it report?", "o": ["Arranged a meeting; lost a route; recovered.", "Met by chance; devised a route; became ill.", "Published a story; followed a route; returned.", "Missed a friend; rejected a route; got better."], "a": 1, "origin_session": "2026-11-07-2017-cloze", "source_question": 8, "exp": {"trans": "日记说作者在港口偶遇老朋友，想出新路线，回程中发烧患病。", "structure": "三个并列谓语came across、came up with、came down with分别支配friend、route、fever；不能单看come或with。", "other": "port港口；route路线；devise想出、设计。", "meaning": "动词短语需要整体与其宾语、事件类型对应，而非只根据一粒介词猜测。", "rest": "arranged把偶遇说成安排；lost、rejected不是想出路线；recovered、got better与患病方向相反；published也不符合这三个短语。"}, "context_id": "come-particles-three-event-mapping"}, {"id": "t17t2-astronomer-roles", "family": "astronomy-word-family", "introduced": "2026-11-09", "published_on": "2026-11-09", "budget": 45, "target": "astronomer / astronaut roles", "skill": "astronomer / astronaut roles", "q": "One person analyses galaxy data to test a scientific model. Another pilots a crewed spacecraft during an orbital mission. Which pair names the roles described, in that order?", "o": ["Astronaut; astronomer studying data for a ground-based project.", "Astronomy; astronaut flying a crewed spacecraft while in orbit.", "Astronomer; astronaut flying a crewed spacecraft while in orbit.", "Astronomical; astronomer taking part in an orbital crew mission."], "a": 2, "origin_session": "2026-11-09-2017-text2", "exp": {"trans": "一个人分析星系数据以检验科学模型，另一个人在轨道任务中驾驶载人飞船。按这个顺序，应如何称呼两人的工作身份？", "structure": "One...Another...划分两个动作主体；analyses...to test是研究任务；pilots...during an orbital mission是实际航天任务。", "other": "galaxy星系；dock对接；crewed载人的；orbital在轨的。", "meaning": "astronomer是天文学研究者，astronaut是航天任务人员；astronomy是学科名，astronomical是形容词，不能直接替代人的职业名词。", "rest": "Astronaut; astronomer交换了两个工作；Astronomy把学科名用于人；Astronomical把形容词用于人，并把驾驶飞船的航天任务误称天文研究角色。"}, "context_id": "galaxy-data-analyst-versus-crewed-docking-trainee"}, {"id": "cloze-necessary-transport-a", "family": "cloze-baseline-necessary", "introduced": "2026-10-14", "published_on": "2026-10-14", "budget": 60, "target": "otherwise have been necessary / 反事实基线", "skill": "比较结构与必要性", "q": "Because of the road closure, the driver needed 25 more minutes than would otherwise have been ______. Which adjective fits?", "o": ["promising", "helpful", "possible", "necessary"], "a": 3, "exp": {"trans": "由于道路封闭，司机比道路没有封闭时原本需要的时间多花25分钟。", "structure": "Because of...说明额外耗时原因；needed 25 more minutes than...是比较结构；would otherwise have been necessary表达另一种条件下原本必需的时间。", "other": "road closure 封路；driver 司机；otherwise 若非如此/在其他情况下；extra time 额外时间。", "meaning": "need与necessary构成精确呼应；otherwise指如果没有前面封路这种情况，不是随意的‘另外’。", "rest": "promising描述前景，helpful表示有用但不表示必需，possible表示可能，都不能与needed...than...形成原本需要多少的准确比较。"}, "context_id": "context:cloze-necessary-transport-a"}], "retry": {"shed-light-direction": [{"id": "r17t3-light-race-timing", "family": "shed-light-direction", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "shed light on / conceal", "skill": "shed light on / conceal", "q": "A coach compares video with runners' split times. The comparison sheds light on why a handover failed, although one camera angle is missing. What does the expression say the comparison achieves?", "o": ["It keeps the cause of the failed handover hidden from view.", "It helps explain the failure despite a gap in the evidence.", "It physically brightens the track where the runners compete.", "It proves the cause even without any supporting information."], "a": 1, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "教练将视频与运动员的分段用时比较。尽管缺少一个拍摄角度，这种比较仍帮助解释交接为什么失败。该表达说明比较起到什么作用？", "structure": "The comparison是主语；sheds light on后接why引导的解释对象；although保留信息仍不完整这一限定。", "other": "split time分段用时；handover交接；camera angle拍摄角度；settle确定解决。", "meaning": "shed light on是帮助说明、使更清楚，方向与隐藏相反；部分解释可以成立，不等于所有细节已经证实。", "rest": "keeps...hidden把阐明反转为遮蔽；physically brightens把固定短语硬译为照明；proves...without information把帮助理解夸大成无证据也能证明。"}, "context_id": "relay-video-comparison-explains-without-complete-certainty"}], "budding-stage": [{"id": "r17t3-budding-project", "family": "budding-stage", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "budding / fully developed", "skill": "budding / fully developed", "q": "A translation collective has completed its first small commission and is still learning how to work together. A reviewer calls it a budding enterprise. Which expectation fits?", "o": ["It has already reached a stable and fully developed operating scale.", "Its first commission proves that every future project must succeed.", "It is showing early promise while its organisation is still developing.", "It has permanently stopped operating before completing any project."], "a": 2, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "一个翻译合作团队刚完成首个小委托，成员仍在学习协作。评论者称它为budding enterprise。怎样理解适当？", "structure": "first small commission与still learning共同限定发展阶段；budding修饰enterprise，评价的是事业的初期发展。", "other": "collective合作团队；commission委托；enterprise事业、企业；promise潜力。", "meaning": "budding表示萌芽、开始显现潜力，不等于充分成熟；积极预期也不能推出每个项目必定成功。", "rest": "fully developed把初期推成成熟；every future...must夸大确定性；permanently stopped与已完成委托并继续学习不符。"}, "context_id": "new-translation-collective-first-commissions-not-established"}], "familiar-word-polysemy": [{"id": "polysemy-rest-unjust-a", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-05", "budget": 45, "target": "the rest of / just / unjust", "skill": "熟词生义由结构决定", "q": "After approving two applications, the panel rejected the rest as unjust to smaller firms. In this sentence, the rest and unjust mean:", "o": ["休息 / 仅仅的", "其余申请 / 不公正的", "其余评委 / 刚刚发生的", "暂停审批 / 合法的"], "a": 1, "exp": {"trans": "批准两份申请后，评审组以“对小企业不公平”为由拒绝了其余申请。the rest指剩下的申请；unjust表示不公正的。", "structure": "the panel是主语，rejected是谓语，the rest是宾语；as unjust to smaller firms说明把其余申请视为何种性质。After approving...是时间背景。", "other": "application 申请；panel 评审组；approve 批准；firm 企业。", "meaning": "rest单独可表示休息，但the rest (of...)常表示“其余的”；just既可作副词“仅仅/刚刚”，也可作形容词“公正的”，unjust由后者加un-构成“不公正的”。", "rest": "“休息 / 仅仅的”没有识别the rest所指的剩余申请，也误认了unjust的构词；“其余评委 / 刚刚发生的”把申请偷换成评委，且unjust不是副词just“刚刚”的否定；“暂停审批 / 合法的”既改变the rest的名词性含义，又把unjust的价值判断反转。"}, "context_id": "context:polysemy-rest-unjust-a"}, {"id": "polysemy-dismiss-address-b", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-05", "budget": 50, "target": "dismiss A as B / address concerns", "skill": "熟词生义 + 固定搭配", "q": "Officials first dismissed the complaint as trivial, but later had to address the evidence it contained. Which paraphrase is best?", "o": ["他们先解雇了投诉人，后来查找证据的地址。", "他们起初把投诉斥为无足轻重，后来不得不处理其中的证据。", "他们先证明投诉正确，后来决定忽视证据。", "他们先将投诉寄出，后来改变了通信地址。"], "a": 1, "exp": {"trans": "官员们起初把这项投诉斥为无足轻重，但后来不得不处理其中包含的证据。", "structure": "Officials是主语；dismissed是第一个谓语，the complaint是宾语，as trivial是宾补；but后had to address是第二个谓语结构，the evidence是宾语。", "other": "complaint 投诉；trivial 微不足道的；evidence 证据；contain 包含。", "meaning": "dismiss可表示“解雇”，但dismiss A as B是“把A斥为/视为B而不予重视”；address作动词可表示“处理、应对问题/担忧/证据”，不只表示地址。", "rest": "“解雇投诉人、查找地址”把dismiss的宾语从投诉换成投诉人，并误用address的名词义；“先证明正确、后忽视证据”反转了dismiss与address在此处的意义；“寄出投诉、改变地址”虚构了邮寄行为和地址变化。"}, "context_id": "context:polysemy-dismiss-address-b"}, {"id": "polysemy-justified-complaint-a", "family": "familiar-word-polysemy", "introduced": "2026-10-08", "published_on": "2026-10-08", "budget": 45, "target": "justified anger / 有正当理由", "skill": "just / justify / justified", "q": "Residents' anger over the water outage was justified: records showed that the utility had ignored repeated warnings before the pipes failed. Here justified means:", "o": ["happening only a moment ago", "expressed by an entirely impartial person", "supported by adequate reasons", "merely mentioned without emotion"], "a": 2, "exp": {"trans": "居民因停水而愤怒是有充分理由的：记录显示，自来水公司在水管故障前多次忽视警告。", "structure": "Residents' anger是主语，was justified是系表/被动性质表达；冒号后records showed...为其理由提供证据。", "other": "utility 公用事业公司；outage 中断；ignore warnings 忽视警告；adequate 充分的。", "meaning": "justified通常表示有正当理由或充分依据，不应因为just也有‘仅仅’或‘公正的’就机械套进来。这里强调愤怒有依据，而不是愤怒这个情绪是否中立。", "rest": "刚刚发生对应just的副词用法而不是justified；完全中立并非愤怒有依据的条件；merely mentioned否定了原文的情绪与证据。"}, "context_id": "context:polysemy-justified-complaint-a"}, {"id": "polysemy-just-justified-b", "family": "familiar-word-polysemy", "introduced": "2026-10-08", "published_on": "2026-10-08", "budget": 50, "target": "just decision / justified suspicion", "skill": "公正性与证据充分性", "q": "The panel made a just decision, but the suspicion that its members had accepted bribes was not justified by the available evidence. Which distinction is correct?", "o": ["The decision was recent; the evidence only referred to bribery.", "The decision was fair; evidence did not support the suspicion.", "The decision was unfair; evidence confirmed the bribery claim.", "The decision expressed pride; the suspicion praised the panel."], "a": 1, "exp": {"trans": "委员会作出了公正的决定，但现有证据不足以支持成员受贿的怀疑。just修饰决定时指公正；justified修饰怀疑时指是否有充分依据。", "structure": "The panel + made + a just decision；but后the suspicion是主语，was not justified by...表示该怀疑缺乏证据支持；that从句解释怀疑的内容。", "other": "panel 委员会；suspicion 怀疑；bribe 贿赂；available evidence 现有证据。", "meaning": "just作为形容词可表示公正；justify动词表示证明合理/有正当理由；justified为有依据、可辩护的。它们语义相连但不能在句中任意互换。", "rest": "recent和only误套just的其他词义；不公正且受贿已证实把两处意思都反转；pride和praise均不是这里just或justified的含义。"}, "context_id": "context:polysemy-just-justified-b"}, {"id": "polysemy-hearing-picked-up-pace", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-27", "target": "搭配中的动作与指向", "skill": "搭配中的动作与指向", "budget": 50, "q": "At first, witnesses answered one question every ten minutes. Once the clerk combined repeated questions, the proceedings picked up pace. What changed?", "o": ["The hearing moved through the questions faster.", "The hearing switched to a more cautious schedule.", "The clerk collected more questions for later use.", "The witnesses were chosen at a more regular rate."], "a": 0, "exp": {"trans": "起初证人每十分钟回答一题；书记员合并重复问题后，听证进程加快了。", "structure": "Once引出时间条件；主句the proceedings是主语，picked up pace是谓语表达。速度变化属于听证进程，不属于挑选证人的频率。", "other": "proceedings 会议或听证程序；clerk 书记员；witness 证人；pace 节奏、速度。", "meaning": "pick up pace表示加快进程，要把pick up和pace作为整体理解，再结合减少重复问题的背景确认方向。", "rest": "更谨慎的日程不等于加速；收集问题把pick up误套到另一个宾语；挑选证人的频率把动作主体和对象都换掉了。"}, "context_id": "context:polysemy-hearing-picked-up-pace"}, {"id": "polysemy-sleep-mental-sharpness", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-27", "target": "语境中的能力与变化", "skill": "语境中的能力与变化", "budget": 50, "q": "After a week of poor sleep, her mental sharpness declined: she needed longer to notice mistakes in a familiar spreadsheet. What declined?", "o": ["Her readiness to adopt a different working method.", "Her willingness to persevere with a difficult task.", "Her speed and accuracy in noticing relevant details.", "Her freedom to choose which assignments to accept."], "a": 2, "exp": {"trans": "一周睡眠不足后，她的思维敏锐度下降了：在熟悉的电子表格中发现错误也需要更久。", "structure": "mental修饰sharpness；冒号后needed longer to notice mistakes解释这种能力下降的具体表现。", "other": "sharpness 敏锐度；plasticity 可塑性；flexibility 灵活性；spreadsheet 电子表格。", "meaning": "敏锐度是及时捕捉、辨识信息的能力，不是可塑性、意志或选择自由。后文的表现帮助确定这个抽象名词的含义。", "rest": "采用新方法的意愿接近灵活性而非敏锐度；坚持意愿属于毅力；自主选择工作属于自由度，都不能解释发现熟悉表格中的错误变慢。"}, "context_id": "context:polysemy-sleep-mental-sharpness"}, {"id": "polysemy-sort-maker-entries", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-31", "target": "sort / sorting", "skill": "熟词词性与语境", "budget": 50, "q": "The maker club receives projects of every sort. Before choosing a display, volunteers sort the entries by safety requirements, not by the money their owners can pay. Which reading of the two uses of sort is correct?", "o": ["First: organise; second: a category of projects.", "First: a category; second: arrange into groups.", "First: select; second: the quality of projects.", "First: a group; second: repair faulty projects."], "a": 1, "exp": {"trans": "创客社团收到各种类型的项目。决定展示什么之前，志愿者按安全要求整理、分类这些参展项目，而不是按所有者能付多少钱。第一处sort是种类，第二处是进行分类。", "structure": "of every sort中sort是介词of后的名词；第二句volunteers是主语，sort是谓语，the entries是宾语，by safety requirements说明分类依据。not by...排除另一标准。", "other": "maker club创客社团；entry参展项目；display展示；requirement要求。", "meaning": "同一个熟词要根据句中位置判断词性。名词sort指种类，动词sort指分类、整理或筛选；这里不能让一种词性覆盖两处。", "rest": "“先整理、后种类”将两处词性颠倒；“先选择、后项目质量”既把首处当动词又替换第二处含义；“先群体、后修理”没有体现of every sort的各类义，也把分类错成修复。"}, "context_id": "maker-sort-noun-and-verb"}, {"id": "polysemy-sorting-arts-fund", "family": "familiar-word-polysemy", "introduced": "2026-10-05", "published_on": "2026-10-31", "target": "sorting mechanism / 评价依据", "skill": "抽象表达在具体决策中的作用", "budget": 50, "q": "A youth arts fund calls online popularity its 'sorting mechanism': acts with large followings get support, even if less visible groups show greater improvement. The writer questions the criterion, not the existence of different art forms. What does the expression refer to?", "o": ["A building in which applications are kept on file.", "A rule that prevents all public performances.", "A criterion deciding which groups receive support.", "A kind of performance that the fund itself buys."], "a": 2, "exp": {"trans": "青年艺术基金把网络人气当作筛选机制：粉丝多的团队得到支持，即使曝光少的团队进步更大。作者质疑的是这种选择标准，而非艺术形式有不同种类这一事实。", "structure": "首句A youth arts fund为主语，calls为谓语，online popularity为宾语，its sorting mechanism为宾语补足语；冒号后用实际分配支持的做法解释该抽象词组。even if引出不改变结果的让步条件。", "other": "act演出团队；following追随者群体；criterion标准；visible受关注的。", "meaning": "sorting mechanism在这里指决定支持给谁的筛选、评价机制；理解抽象名词时，应找后文说明它如何运作的具体案例。", "rest": "“存放申请的建筑”只抓到整理文件的表层联想；“禁止全部公共演出”加入并不存在的禁令；“基金购买的演出种类”把选择机制换成艺术类别。"}, "context_id": "arts-fund-popularity-allocation"}, {"id": "cloze-sermon-sunday-service-g", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-02", "budget": 35, "target": "sermon", "skill": "语境中的宗教词汇", "q": "The minister delivered a sermon on forgiveness during the Sunday service. A sermon is:", "o": ["a religious talk given to a congregation", "a written list of payments due to a church", "a private meeting to arrange a marriage", "a short announcement about the weather"], "a": 0, "exp": {"trans": "牧师在周日礼拜期间发表了一篇关于宽恕的布道。sermon指布道、宗教讲道。", "structure": "The minister是主语，delivered是谓语，a sermon是宾语；on forgiveness说明讲道主题，during the Sunday service说明时间场景。", "other": "minister牧师；forgiveness宽恕；congregation会众；service礼拜。", "meaning": "sermon通常指宗教场合面向会众的讲道，也可引申为带有训诫意味的长篇说教。", "rest": "教会应付款清单、安排婚姻的私人会议和天气公告都不符合minister、Sunday service及forgiveness共同构成的宗教语境。"}, "context_id": "sermon-sunday-service"}, {"id": "cloze-piling-crates-h", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-02", "budget": 35, "target": "piling", "skill": "动词动作与堆叠场景", "q": "Workers were piling empty crates beside the loading bay before the delivery arrived. Piling means:", "o": ["stacking them together in a heap", "checking each one for a label", "sending them to a distant warehouse", "taking them apart for repair"], "a": 0, "exp": {"trans": "货物送达前，工人正在装卸区旁把空箱子堆起来。piling在此表示堆放、堆叠。", "structure": "Workers是主语，were piling是过去进行时谓语，empty crates是宾语；beside the loading bay说明堆放地点。", "other": "crate板条箱；loading bay装卸区；stack堆叠；delivery送货。", "meaning": "pile可作动词，表示把物品堆成一堆；具体动作由宾语empty crates和地点beside the loading bay确定。", "rest": "检查标签、运往仓库和拆开维修都是其他操作，不能表达把箱子堆在一起。"}, "context_id": "literal-piling-of-crates"}, {"id": "cloze-piling-up-complaints-i", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-02", "budget": 40, "target": "pile up / 抽象累积", "skill": "同一动词的具体与抽象语境", "q": "After the booking website failed, complaints began piling up in the customer-service inbox. What does piling up mean here?", "o": ["being deleted one by one", "accumulating in increasing numbers", "being answered before they arrived", "being transferred to another company"], "a": 1, "exp": {"trans": "预约网站故障后，客服收件箱里的投诉开始不断累积。piling up在此表示数量越来越多。", "structure": "complaints是主语，began piling up是谓语结构；in the customer-service inbox说明累积的位置。", "other": "booking website预约网站；complaint投诉；accumulate累积；inbox收件箱。", "meaning": "pile up既可指把实体物品堆叠起来，也可引申为问题、工作或投诉数量不断累积；这里不是把投诉作为实体搬动。", "rest": "删除、提前答复和转交给其他公司都不是数量持续增加的意思。"}, "context_id": "figurative-piling-up-complaints"}, {"id": "text1-runway-fashion-catwalk-a", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-02", "budget": 40, "target": "runway / 时装秀T台", "skill": "熟词多义与事件语境", "q": "At a fashion show, organizers extended the runway so models could walk farther in front of the audience. What did they change?", "o": ["The catwalk used by models was made longer.", "A strip for aircraft take-offs was added.", "The standards for judging body shape were rewritten.", "The audience seating was rearranged around the stage."], "a": 0, "exp": {"trans": "时装秀主办方延长了runway，让模特能在观众面前走得更远。这里改变的是模特走秀的T台长度。", "structure": "At a fashion show限定场景；organizers是主语，extended是谓语，the runway是宾语；so引导结果状语。", "other": "runway在时装秀语境中是T台；catwalk走秀台；aircraft take-off飞机起飞；body shape体形。", "meaning": "runway有机场跑道义，也有时装秀T台义。词义由fashion show、models和audience共同限定。原题中的错误选项抓住runways这一局部词形，却把时装展示语境改成机场基础设施。", "rest": "把T台换成飞机起降设施；把延长T台改成修改审美标准，改变了动作对象；改动观众席也与句中明确延长runway不符。"}, "context_id": "fashion-show-runway-catwalk"}, {"id": "text1-arbiters-design-jury-b", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-02", "budget": 40, "target": "arbiters / 评判者", "skill": "抽象名词在评价语境中的含义", "q": "At a national design competition, the jury served as the final arbiters of which proposals would receive the award. Here, arbiters are people who:", "o": ["make the final decision about what is accepted", "prepare the proposals for public display", "provide funding to the designers on the shortlist", "record the audience's reactions after the award"], "a": 0, "exp": {"trans": "在全国设计竞赛中，评审团是决定哪些方案获奖的最终裁定者。arbiters指作出最终判断的人。", "structure": "the jury是主语，served as是谓语，the final arbiters是主语补足语；of which proposals说明裁定对象。", "other": "arbiter裁定者、评判者；jury评审团；proposal提案；shortlist入围名单。", "meaning": "arbiter强调有权作出判断或裁定的人，不是负责准备材料、提供资金或记录反馈的人。", "rest": "准备展品、提供资金和记录观众反应都是竞赛中的其他工作，不等于决定哪些方案获奖。"}, "context_id": "design-jury-final-arbiters"}, {"id": "text2-backing-vs-alongside-heritage", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-03", "budget": 35, "target": "backed vs alongside", "skill": "支持关系与并列关系", "q": "The city report listed its heritage museum alongside the public library as a valued institution. It said nothing about funding. What is supported by the report?", "o": ["The library provided full funding for the museum.", "The museum and library appeared in the same list.", "The museum was run directly by library staff.", "The library officially backed every museum plan."], "a": 1, "exp": {"trans": "报告把博物馆和图书馆并列列为重要机构，未提资金来源。", "structure": "listed A alongside B是并列列举；没有提供支持的谓语。", "other": "heritage遗产；funding资金；back支持。", "meaning": "alongside表示并列提及，不自动推出be backed by。", "rest": "资金、管理和全部计划的支持都擅自添加了原文未给出的关系。"}, "context_id": "heritage-museum-alongside-not-backed"}, {"id": "text2-overshadowed-research-prize", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-03", "budget": 35, "target": "overshadowed vs destroyed", "skill": "抽象遮蔽与实体损毁", "q": "A laboratory's early research prizes were overshadowed by a later safety scandal, but its published papers remained available. What happened to the prizes?", "o": ["They were destroyed along with every research paper.", "They received new awards for the later safety work.", "Their significance was eclipsed by the scandal.", "They were formally withdrawn by the entire team."], "a": 2, "exp": {"trans": "实验室早年的研究奖项被安全丑闻盖过风头，但论文仍然存在。", "structure": "were overshadowed是被动谓语；but限定论文依然存在。", "other": "eclipsed使黯然失色；scandal丑闻；withdraw撤回。", "meaning": "overshadow侧重重要性或影响被盖过，不等于实体摧毁。", "rest": "销毁、再获奖与正式撤回均是原文未确认的动作。"}, "context_id": "research-awards-overshadowed-not-destroyed"}, {"id": "text2-sided-with-community-appeal", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-03", "budget": 35, "target": "sided with / pleading", "skill": "立场选择与请求内容", "q": "During a school budget dispute, the teachers' union sided with parents pleading for smaller classes, although the board preferred a cheaper plan. Which position did the union take?", "o": ["It supported the parents' request for smaller classes.", "It endorsed the board's preferred cheaper proposal.", "It asked the parents to stop making any requests.", "It stayed neutral between parents and the board."], "a": 0, "exp": {"trans": "工会支持呼吁缩小班级规模的家长，董事会则倾向更廉价的方案。", "structure": "union是sided with主语；pleading for smaller classes修饰parents。", "other": "side with支持某方；plead for呼吁；board董事会。", "meaning": "side with明确支持对象，pleading for交代对方诉求。", "rest": "支持董事会、阻止诉求和保持中立都与支持家长相反。"}, "context_id": "teachers-union-sides-with-parents"}, {"id": "text2-intrusion-discontinued-access", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-03", "budget": 35, "target": "intrusion / discontinue", "skill": "侵入行为与停止政策", "q": "A research reserve forbade intrusion into nesting areas. The director later discontinued unrestricted vehicle access while keeping marked footpaths open. Which summary is accurate?", "o": ["All visitors were permanently barred from the reserve.", "The reserve stopped all forms of scientific research.", "Vehicles were granted new access to nesting areas.", "Unrestricted driving ended; footpaths stayed open."], "a": 3, "exp": {"trans": "保护区禁止侵入筑巢区，终止无限制车辆通行，但步道继续开放。", "structure": "discontinued宾语是unrestricted vehicle access；while表示另一安排依旧。", "other": "intrusion侵入；discontinue停止；footpath步道。", "meaning": "停止某项政策不意味着全面关闭场所或终止全部活动。", "rest": "其余选项夸大停止范围，或颠倒了车辆通行状态。"}, "context_id": "nesting-reserve-vehicle-access-limits"}, {"id": "text4-vocab-rustle-leaves", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-05", "budget": 45, "target": "rustle of leaves", "skill": "声响词的语境含义", "q": "At dusk, hikers heard the rustle of dry leaves as a small animal crossed the path. What did rustle refer to?", "o": ["A loud whistle made by a passing train.", "A soft scraping sound from moving leaves.", "A heavy splash in the nearby river.", "A sudden flash of light above the trees."], "a": 1, "exp": {"trans": "傍晚小动物穿过小路时，枯叶发出轻微沙沙声。", "structure": "heard的宾语是the rustle of dry leaves；as交代同时发生事件。", "other": "rustle沙沙声；scraping摩擦的；dusk黄昏。", "meaning": "纸张、树叶、布料的轻微摩擦均可用rustle描述。", "rest": "汽笛、水花和闪光不是枯叶轻微摩擦声。"}, "context_id": "woodland-leaf-rustle-small-animal"}, {"id": "text4-vocab-dwarf-costs", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-05", "budget": 45, "target": "dwarf as a verb", "skill": "规模比较中的熟词生义", "q": "In the mountain station's annual accounts, heating costs dwarf the fees paid for occasional repairs. Here, dwarf means that heating costs:", "o": ["are too small to appear in annual accounts", "are exactly equal to the fees for repairs", "have completely disappeared from the budget", "are much larger than the repair expenses"], "a": 3, "exp": {"trans": "山间站点供暖费用远远超过零星维修费。", "structure": "heating costs主语，dwarf谓语，repair fees是比较对象。", "other": "dwarf作动词是使相形见绌、远超；accounts账目。", "meaning": "dwarf在此表示相对数量显著更大，不是名词的含义。", "rest": "数额太小、完全相等和已消失均与句中比较相反。"}, "context_id": "mountain-station-heating-vs-repair-cost"}, {"id": "text4-vocab-ditch-get-out-of", "family": "familiar-word-polysemy", "introduced": null, "published_on": "2026-11-05", "budget": 45, "target": "ditch and get out of a business", "skill": "放弃计划与退出行业", "q": "A college publisher decided to ditch its costly equipment-leasing scheme and get out of the rental service altogether. What was its plan?", "o": ["Abandon the scheme and leave the rental business.", "Increase the number of machines it leases out.", "Dig trenches to install additional rental equipment.", "Open a second leasing office on the college site."], "a": 0, "exp": {"trans": "学院出版机构决定放弃昂贵租赁方案，并退出租赁服务业务。", "structure": "decided to ditch ... and get out of ...是两个并列行动。", "other": "ditch放弃；get out of退出行业；lease租赁。", "meaning": "ditch不是沟渠，get out of不是物理上从房间走出来。", "rest": "扩租、挖沟渠、新开租赁办公室都与退出相反。"}, "context_id": "college-publisher-abandons-equipment-rental"}], "nested": [{"id": "legacy-who-that-main", "source": "today", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "target": "who 定语从句 / that 宾语从句", "q": "Applicants who believe that a longer résumé automatically proves greater ability often overlook the value of relevance.\n哪组句法判断正确？", "o": ["主句主语 Applicants；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 proves；主句谓语 believe", "主句主语 a longer résumé；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 believe；主句谓语 proves"], "a": 0, "diag": {"1": "proves 属于 that 宾语从句，不是 who 从句的核心谓语；believe 也不是主句谓语。", "2": "a longer résumé 是 that 从句内部的主语，不是整句主语。", "3": "proves 是 that 从句谓语；整句主句谓语是 overlook。"}, "exp": {"trans": "那些认为简历越长就自然能证明能力越强的申请者，往往忽视了“相关性”的价值。", "structure": "原始简单句① Applicants often overlook the value of relevance. ② Applicants believe something. ③ A longer résumé automatically proves greater ability. → ②把 something 换成 that 从句：Applicants believe that... → 再把②变成修饰 Applicants 的 who 定语从句：Applicants who believe that... often overlook...。所以整句主语 Applicants，who 从句谓语 believe，that 从句谓语 proves，主句谓语 overlook。", "other": "applicant 申请者；résumé 简历；automatically 自然而然地/自动地；relevance 相关性。", "meaning": "看到 who 后先划到从句结束，再找主句谓语；who 从句里又可嵌套 that 宾语从句。", "rest": "把 that 从句的谓语 proves 误当成外层谓语，或把其中的 a longer résumé 误当成整句主语，都会错过：Applicants 是主句主语，believe 是 who 从句谓语，overlook 是主句谓语。"}, "family": "nested", "introduced": "2026-09-29", "budget": 60, "context_id": "nested-who-that-predicate"}, {"id": "nested-shared-gate", "family": "nested", "introduced": "2026-09-29", "budget": 60, "target": "who 定语从句 / that 宾语从句", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "q": "Residents who discovered that the shared gate was unlocked called the caretaker.\n按“主句主语中心词 / who从句谓语 / 主句谓语”的顺序，哪组正确？", "o": ["Residents / discovered / called", "the shared gate / discovered / was", "Residents / was unlocked / discovered", "the caretaker / called / discovered"], "a": 0, "exp": {"trans": "发现公共大门没有锁上的住户给管理员打了电话。", "structure": "简单句①Residents called the caretaker. ②Residents discovered something. ③The shared gate was unlocked. → 把③接在discovered后：Residents discovered that the shared gate was unlocked. → 把重复的Residents换成who并嵌入①：Residents [who discovered [that the shared gate was unlocked]] called the caretaker。主句完整主语包含who从句，中心词是Residents。", "other": "resident 住户；shared 共用的；unlocked 没锁上的；caretaker 管理员。", "meaning": "发现这件事的是住户；没有锁上的是大门；打电话给管理员的还是住户。三个小句的主语和谓语不能串层。", "rest": "the shared gate只在that从句中作主语，不能升为主句主语。was unlocked属于that从句，discovered属于who从句；两者都不是主句谓语。the caretaker是called的宾语，不是发现大门未锁的人。"}, "context_id": "nested-who-that-predicate"}, {"id": "nested-valve-leak-c", "family": "nested", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 60, "target": "who-clause / that-clause / main-clause predicate", "skill": "区分定语从句、宾语从句和主句谓语", "q": "Engineers who noticed that the valve was leaking shut down the line. Which sequence gives the main-clause subject head / who-clause verb / main-clause verb?", "o": ["Engineers / noticed / shut down", "the valve / noticed / was leaking", "Engineers / was leaking / noticed", "the line / shut down / noticed"], "a": 0, "exp": {"trans": "注意到阀门漏液的工程师关闭了生产线。按题目要求的顺序，主句主语中心词是Engineers，who从句谓语是noticed，主句谓语是shut down。", "structure": "主句骨架是Engineers shut down the line；who noticed...修饰Engineers；that the valve was leaking是noticed的宾语从句。三个谓语分别属于不同层级。", "other": "engineer 工程师；valve 阀门；leak 漏液；shut down 关闭、停运；subject head 主语中心词。", "meaning": "先找主句骨架，再把who定语从句和that宾语从句分别嵌入。阀门是that从句的主语，工程师才是主句主语。", "rest": "the valve只在that从句中作主语；was leaking属于that宾语从句，不是who从句谓语；the line是shut down的宾语，不是主句主语。"}, "context_id": "context:nested-valve-leak-c"}, {"id": "cloze-whatever-equipment-workshop-o", "family": "nested", "introduced": null, "published_on": "2026-11-02", "budget": 60, "target": "whatever + 名词 / 嵌入式修饰结构", "skill": "名词短语内部结构与主句宾语", "q": "The workshop lets each visiting researcher retain whatever equipment they brought for the project. Which analysis is accurate?", "o": ["The phrase is the subject of lets and refers to the researcher.", "The whole phrase is the object of retain; whatever determines equipment.", "The phrase is a direct question asking what equipment was brought.", "The phrase modifies workshop and explains why the visit occurred."], "a": 1, "exp": {"trans": "工作坊允许每位来访研究人员保留自己为项目带来的任何设备。whatever equipment they brought for the project整体作retain的宾语。", "structure": "主句骨架：The workshop lets each visiting researcher retain something。whatever equipment they brought for the project替换something，整体是retain的宾语；whatever限定equipment，they brought for the project修饰equipment。", "other": "workshop工作坊；visiting researcher来访研究人员；retain保留；equipment设备。", "meaning": "whatever + 名词可表示“任何……/所……的任何东西”。先识别整个名词短语在主句中的位置，再分析短语内部的限定词和修饰从句。", "rest": "主句主语是The workshop，不是whatever短语；这里不是直接疑问句；whatever短语不修饰workshop，也不说明访问原因。"}, "context_id": "whatever-equipment-as-object"}, {"id": "cloze-whatever-documents-registrar-p", "family": "nested", "introduced": null, "published_on": "2026-11-02", "budget": 60, "target": "whatever + 名词 / 整体作宾语", "skill": "名词性结构与从句内部关系", "q": "The registrar will accept whatever documents the applicant submits before Friday. What role does the underlined phrase play?", "o": ["It is the object of accept: any documents the applicant submits.", "It is the subject of submits and refers to the registrar.", "It asks which documents the applicant may submit.", "It modifies Friday and explains the reason for the deadline."], "a": 0, "exp": {"trans": "登记员会接受申请人在周五之前提交的任何文件。whatever documents the applicant submits整体作accept的宾语。", "structure": "主句：The registrar will accept something。whatever documents the applicant submits before Friday整体替代something，作accept的宾语；the applicant submits是修饰documents的限定性关系结构，documents是submits的宾语。", "other": "registrar登记员；applicant申请人；submit提交；deadline截止时间。", "meaning": "whatever + 名词表示任何符合后续限定的该类事物；整个短语可以在主句中作宾语。要区分外层动词accept与内层从句谓语submits。", "rest": "underlined phrase不是submits的主语，内层主语是the applicant；这不是直接疑问句；Friday是before的宾语，不是被whatever短语修饰的对象，也没有说明截止原因。"}, "prompt_marks": [{"type": "underline", "text": "whatever documents the applicant submits before Friday", "occurrence": 0}], "context_id": "whatever-documents-as-object"}], "with": [{"id": "with-bread-cooling", "family": "with", "introduced": null, "budget": 60, "target": "with + 名词 + 分词", "skill": "with + 名词 + 后置成分", "q": "The bakery opened at six, with warm bread cooling on the counter.\nwith 后面的结构主要起什么作用？", "o": ["补充开门时伴随的状态", "引出老板的直接引语", "说明开门的唯一目的", "充当opened的直接宾语"], "a": 0, "exp": {"trans": "面包店六点开门，当时温热的面包正在柜台上晾凉。", "structure": "主干：The bakery（主语）+ opened（不及物谓语）+ at six（时间状语）。原始简单句Warm bread was cooling on the counter → 去掉was，用with引出：with warm bread cooling on the counter。warm bread是with结构的逻辑主语，cooling是与之构成主动关系的现在分词。", "other": "bakery 面包店；cool 晾凉、变凉；counter 柜台；warm 温热的。", "meaning": "with复合结构可以补充主句发生时的伴随状态；它不是新的独立主句。", "rest": "直接引语通常由say等动词引出，此处没有任何说话行为。目的常用to do或in order to，原句只描写伴随状态。opened在本句是不及物用法，with短语不是其直接宾语。"}, "context_id": "with-simultaneous-ing"}, {"id": "with-lights-dimming", "family": "with", "introduced": null, "target": "with + 名词 + 后置成分", "skill": "with + 名词 + 后置修饰", "q": "The audience waited quietly, with the lights gradually dimming before the film began. The with-structure mainly:", "o": ["adds a simultaneous background state", "states the purpose of waiting", "introduces an independent main clause", "means the audience waited together with the lights"], "a": 0, "budget": 55, "exp": {"trans": "观众安静地等待着，电影开始前，灯光正逐渐变暗。", "structure": "主干：The audience（主语）+ waited（谓语）+ quietly（状语）。原始简单句：The lights were gradually dimming before the film began. → 去掉were，用with引出：with the lights gradually dimming...。the lights是with结构的逻辑主语，dimming与lights构成主动关系。", "other": "audience 观众；gradually 逐渐地；dim 变暗；before the film began 电影开始前。", "meaning": "with + 名词 + 后置成分可补充主句发生时的伴随
