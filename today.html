<script>window.REVIEW_DATA={"date": "2026-11-14", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "cloze-overview-rainfall-a", "family": "cloze-big-picture", "introduced": "2026-10-14", "published_on": "2026-10-14", "budget": 50, "target": "the big picture / 整体背景", "skill": "固定词组与局部-整体", "q": "The emergency office assessed drought risk using only last week's rainfall. A researcher urged officials to examine five years of climate data and consider ______ before announcing a new water policy.", "o": ["the next visitor", "a single newspaper headline", "the big picture", "an unrelated complaint"], "a": 2, "exp": {"trans": "应急部门仅凭上周降雨量评估干旱风险；研究者建议在宣布新供水政策前查看五年气候数据、考虑整体情况。", "structure": "The emergency office是主语，assessed是谓语；A researcher urged officials to examine... and consider...，两个不定式动作共同构成建议。", "other": "drought 干旱；rainfall 降雨量；climate data 气候数据；water policy 供水政策。", "meaning": "the big picture是整体局面或全貌；与仅凭上周局部数据下判断形成鲜明对比，不是一个单独的大问题。", "rest": "下一位访客、某篇报道与无关投诉都不能概括五年的整体数据，无法解释作者要求扩大视野的目的。"}, "context_id": "context:cloze-overview-rainfall-a"}, {"id": "pb17-moralist-inference", "family": "moralist-role", "introduced": "2026-11-12", "published_on": "2026-11-12", "budget": 50, "target": "moralist：描述言论不认证人格", "skill": "moralist：描述言论不认证人格", "q": "A review calls the speakers moralists because they urge businesses to put fairness before convenience. What does that description establish?", "o": ["Their private conduct always meets the highest standards.", "Their professional duties include enforcing criminal law.", "Their discussion avoids judging whether conduct is right.", "Their arguments promote a standard of right behaviour."], "a": 3, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "评论称这些演讲者是道德倡导者，因为他们要求企业先考虑公平、再考虑方便。这个称呼能确定什么？", "structure": "because从句给出被如此称呼的依据：urge...to...是在倡导价值标准；不是对全部私人行为作认证。", "other": "fairness公平；convenience便利；establish确定。", "meaning": "词义能够支持其言论的伦理关注，不能自动证明其个人完美或法定身份。", "rest": "private conduct...always把言论立场扩大为所有行为；enforcing criminal law添加执法身份；avoids judging与要求fairness相反。"}, "context_id": "business-speakers-ethical-advocacy-not-personal-perfection"}, {"id": "pb17-seed-label-link", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "同关键词不等于篇章连接", "skill": "同关键词不等于篇章连接", "q": "Paragraph P: The seed collection has two packets called \"winter bean\". Records show that they came from different valleys and need different storage temperatures. Which paragraph should follow to address the problem just identified?", "o": ["Winter beans also appear in recipes collected from cooks.", "Each packet will keep its local name plus a unique code.", "The collection began when a gardener donated bean seeds.", "Beans become tender when heated for a sufficient period."], "a": 1, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "两个同名种子包来自不同山谷、需不同储温。哪段最适合接着解决刚提出的问题？", "structure": "two packets called同名与different来源/条件共同制造识别风险；后段需同时保留本地名和区分身份。", "other": "packet小包；storage储存；unique code唯一编码。", "meaning": "主题词bean重复不足以证明相邻；唯一编码回应同名异物的具体关系。", "rest": "recipes转到烹饪；collection began倒退背景；tender讨论烹煮，都没有处理同名种子识别问题。"}, "context_id": "seed-vault-homonymous-labels-require-identity-not-shared-theme"}, {"id": "dnt-consent-partners-a", "family": "dnt-actor-boundary", "target": "提出请求、提供设置、执行响应的主体", "introduced": "2026-10-16", "published_on": "2026-10-16", "budget": 55, "skill": "提出请求、提供设置、执行响应的主体", "q": "A news app lets users send an opt-out notice to independent advertising partners. The app supplies the switch; the partners must decide whether to stop profiling users. Which interpretation preserves the roles?", "o": ["The app alone decides whether all advertisers stop profiling.", "The app offers the setting, while the advertising partners handle requests.", "The users created the advertising partners' software.", "The advertising partners are the only parties who can send opt-out notices."], "a": 1, "exp": {"trans": "新闻应用提供开关，用户借此发出退出通知，而收到通知的广告合作方需要决定如何响应。", "structure": "第一句说明app提供的渠道与用户动作，第二句分别用The app和the partners指明执行开关与处理请求的主体。", "other": "opt-out notice退出通知；profiling用户画像；independent独立的；advertising partner广告合作方。", "meaning": "将创建界面、发送用户偏好和执行请求分开，不能将相关业务主体一概等同为同一家公司。", "rest": "只由应用负责所有广告商的行动与原文partners decide相反；用户和广告方软件开发、唯一发送者均未得到原文支持。"}, "context_id": "context:dnt-consent-partners-a"}, {"id": "cloze-whatever-equipment-workshop-o", "family": "nested", "introduced": null, "published_on": "2026-11-02", "budget": 60, "target": "whatever + 名词 / 嵌入式修饰结构", "skill": "名词短语内部结构与主句宾语", "q": "The workshop lets each visiting researcher retain whatever equipment they brought for the project. Which analysis is accurate?", "o": ["The phrase is the subject of lets and refers to the researcher.", "The whole phrase is the object of retain; whatever determines equipment.", "The phrase is a direct question asking what equipment was brought.", "The phrase modifies workshop and explains why the visit occurred."], "a": 1, "exp": {"trans": "工作坊允许每位来访研究人员保留自己为项目带来的任何设备。whatever equipment they brought for the project整体作retain的宾语。", "structure": "主句骨架：The workshop lets each visiting researcher retain something。whatever equipment they brought for the project替换something，整体是retain的宾语；whatever限定equipment，they brought for the project修饰equipment。", "other": "workshop工作坊；visiting researcher来访研究人员；retain保留；equipment设备。", "meaning": "whatever + 名词可表示“任何……/所……的任何东西”。先识别整个名词短语在主句中的位置，再分析短语内部的限定词和修饰从句。", "rest": "主句主语是The workshop，不是whatever短语；这里不是直接疑问句；whatever短语不修饰workshop，也不说明访问原因。"}, "context_id": "whatever-equipment-as-object"}, {"id": "get-cracking-reviews-a", "family": "crack-polysemy", "target": "get cracking on=赶紧开始做", "introduced": "2026-10-16", "published_on": "2026-10-16", "budget": 55, "skill": "get cracking on=赶紧开始做", "q": "The committee had twenty files to review before lunch. Its chair said, 'We had better get cracking on these applications.' What did the chair mean?", "o": ["Find cracks in the paper folders.", "Delay the work until next month.", "Argue about the names of all the files.", "Start reviewing the files without delay."], "a": 3, "exp": {"trans": "委员会午餐前需要审查二十份文件，主席催促大家立刻着手审查。", "structure": "had twenty files to review描述紧迫任务；get cracking on these applications在引语中表达催促启动工作。", "other": "committee委员会；application申请材料；review审查；without delay不要拖延。", "meaning": "get cracking是习惯表达，意思是立即行动；不能把crack名词裂缝的字面意义套用到整个短语。", "rest": "破损纸张没有依据；延迟或争论文件命名都和午餐前必须审查的工作目标矛盾。"}, "context_id": "context:get-cracking-reviews-a"}, {"id": "pb17-backdrop-stage", "family": "backdrop-context", "introduced": "2026-11-12", "published_on": "2026-11-12", "budget": 50, "target": "backdrop：舞台背景", "skill": "backdrop：舞台背景", "q": "For an indoor play, a painted cloth showing snowy hills hangs behind the actors. The director changes the backdrop but keeps the costumes. What is changed?", "o": ["The clothing worn by the actors during the performance.", "The spoken lines that explain the characters' motives.", "The scenery placed behind the actors on the stage.", "The audience seats nearest to the front of the stage."], "a": 2, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "室内戏剧中，绘着雪山的布挂在演员后方。导演更换backdrop但保留服装。换了什么？", "structure": "showing snowy hills修饰cloth；behind the actors确定空间位置；but keeps costumes排除服装。", "other": "costume戏服；scenery布景；motive动机。", "meaning": "backdrop在此是舞台背景布景；不同于事件发生的抽象背景，但二者都有承托主事件的意义。", "rest": "clothing对应保留的costumes；spoken lines是台词；audience seats是观众座位，都不是演员后面的绘景布。"}, "context_id": "indoor-play-painted-cloth-versus-costume-dialogue-seating"}, {"id": "belief-negation-software-update-b", "family": "belief-negation-clause", "introduced": "2026-10-15", "published_on": "2026-10-15", "budget": 55, "target": "imagined that ... had not / 提取完整观点", "skill": "信念内容不能由后续结果倒推", "q": "Noor imagined that a software update had not changed her machine's output. Later measurements showed a substantial change. Which statement describes Noor's initial belief?", "o": ["She initially thought the update made no difference.", "She had decided to replace the machine entirely.", "She knew from the beginning that output had changed greatly.", "She was excessively enthusiastic about software updates."], "a": 0, "exp": {"trans": "Noor起初认为更新没有改变机器产出，后来的测量才发现变化明显。", "structure": "Noor imagined that...中that从句作宾语；had not changed是其核心否定谓语；Later measurements引出相反事实。", "other": "output 产出；substantial 显著的；measurement 测量；initial 初始的。", "meaning": "必须区分人物当时相信什么与后来实际发现了什么；不能只因出现update就推定其对软件痴迷。", "rest": "更换机器无依据；把后来证据当成最初已知事实颠倒时间；过分热衷更新是附加心理描述。"}, "context_id": "context:belief-negation-software-update-b"}], "retry": {"cloze-big-picture": [{"id": "cloze-overview-plant-b", "family": "cloze-big-picture", "introduced": "2026-10-14", "published_on": "2026-10-14", "budget": 50, "target": "big picture / 整体绩效", "skill": "全面证据与单个样本", "q": "A factory manager praised a production line after one unusually productive morning. The annual report, however, showed repeated delays and large repair costs. Which advice is best supported?", "o": ["Celebrate the morning and ignore the report.", "Look at the big picture rather than one exceptional shift.", "Decide that the line has never produced anything useful.", "Assume that annual costs are irrelevant to performance."], "a": 1, "exp": {"trans": "厂长凭一次特别高产的上午就夸奖生产线，但年度报告显示反复延误及高额维修费。评价应着眼整体而非单次样本。", "structure": "A factory manager + praised + a production line；however引出与单次乐观印象相反的长期证据；Which advice要求概括两边的关系。", "other": "productive 高产的；annual report 年报；repair cost 维修费用；exceptional 例外的。", "meaning": "look at the big picture表示看全局、顾及长期背景，避免单凭个别表现判断整体。", "rest": "只看那一个上午就是原文批评的做法；断言生产线毫无用处过度概括；完全忽略年度成本也背离证据。"}, "context_id": "context:cloze-overview-plant-b"}], "moralist-role": [{"id": "pb17-moralist-public-duty", "family": "moralist-role", "introduced": "2026-11-12", "published_on": "2026-11-12", "budget": 50, "target": "moralist：道德倡导者的角色", "skill": "moralist：道德倡导者的角色", "q": "During a debate about lost property, Leena keeps asking what people owe to strangers. A colleague calls her a moralist. Which activity best fits that description?", "o": ["Measuring how often residents misplace their own belongings.", "Urging residents to judge their conduct by ethical duties.", "Identifying which strangers legally own the lost objects.", "Describing how surprise changes a stranger's emotions."], "a": 1, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "讨论失物时，莉娜不断追问人们对陌生人负有什么责任；同事称她为moralist。哪种活动符合这一描述？", "structure": "what people owe to strangers是asking的宾语；moralist指人，核心是对正确行为的评价或倡导。", "other": "owe负有义务；conduct行为；ethical伦理的。", "meaning": "根据责任与行为是非识别道德倡导者，不能只把moralist看成泛指善良的人。", "rest": "Measuring只统计失物；Identifying...legally确定财产权属；Describing...emotions描写情绪，都未体现倡导伦理行为。"}, "context_id": "lost-property-debate-normative-duty-versus-counting-law-emotion"}], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-parallel-a", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "Not surprisingly / Equally unsurprisingly", "skill": "排序题并列递进标记", "budget": 50, "q": "段落甲结尾：Not surprisingly, nearly half of the applicants withdraw before the final interview.\n下面哪个段首与它的衔接最强？", "o": ["Equally unsurprisingly, few of the remaining applicants receive an offer.", "By contrast, the final interviews take place in the company's new building.", "For example, managers from several departments attend the final interview.", "In conclusion, a final interview is unnecessary for applicants who remain."], "a": 0, "exp": {"trans": "甲段说“不出所料，近一半申请者在终面前退出”。最强衔接是：“同样不足为奇的是，留下的人中也只有很少一部分收到录用。”", "structure": "Not surprisingly先给出一个“并不意外”的结果；Equally unsurprisingly显式要求前面已经有一个同类判断，再补第二个并列结果。两个副词短语构成明显篇章钩子。", "other": "withdraw 退出；final interview 终面；a small share 少部分；receive an offer 获得录用。", "meaning": "Equally / similarly / also 等段首词常要求前文存在可并列对象。排序题中这种平行措辞比泛泛的主题相似更可靠。", "rest": "换到面试地点没有形成真正对立；经理参会不是申请者退出的例子；也不能从退出比例推出剩余申请者无需面试。平行标记与申请者筛选链共同支持承接。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-parallel-a"}, {"id": "paragraph-order-discourse-conclusion-b", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "concludes / 收束段识别", "skill": "排序题结论信号", "budget": 50, "q": "一篇先分析家电过早报废、后提出改进办法的文章，有一候选段写道：After examining the figures, Dr Patel sums up her proposal: shared repair services could help residents keep appliances longer. 段末又说：Whether enough households will join, however, remains an open question.\n这一段最适合放在哪里？", "o": ["全文开头，用来首次介绍Dr Patel", "问题分析展开之前", "全文结尾附近，作为总结和改革建议", "只能放在具体数据段之前"], "a": 2, "exp": {"trans": "考察数据后，Patel博士总结自己的建议：共享维修服务或许能让居民更长久地使用电器。但是否有足够多家庭参与，仍是未决问题。这段最适合放在结尾附近。", "structure": "After examining the figures回看前文数据；Dr Patel + sums up + her proposal明确给出总结动作。末句Whether...will join作主语，remains...为谓语部分，以未决问题收束。", "other": "sum up 总结；shared repair service 共享维修服务；appliance 家电；household 家庭；open question 未决问题。", "meaning": "总结建议与回顾数据、开放结尾合起来支持尾段位置；单独出现concludes或sum up并不能证明必为全文最后一段。", "rest": "首次介绍人物不能解释已分析过数据；在问题分析前放总结建议与给定结构不合；“只能放在数据段之前”更与After examining the figures相反。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-conclusion-b"}, {"id": "paragraph-discourse-ticket-deposits", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 50, "target": "段尾问题 / 原因解释", "skill": "排序题并列递进标记", "q": "前段：The theatre sold every seat at the advertised price. Yet the deposits in its bank account were smaller than the value of tickets sold. The manager began tracing the gap between bookings and payments.\n哪个后段最能推进这一问题？", "o": ["Audience surveys ranked music above scenery when asking about favourite parts of the performance.", "The booking agency deducted its service fees before forwarding the remaining money to the theatre.", "The theatre had used the same stage for years, although its audience changed with each production.", "Rehearsals ended later than planned, so actors sometimes travelled home together."], "a": 1, "exp": {"trans": "剧院按宣传价卖出了所有座位，但银行入账小于售票总额。经理追查订票与收到款项之间的差额。订票代理转款之前先扣除服务费，最直接解释这个差额。", "structure": "The theatre + sold + every seat。deposits + were smaller than + the value of tickets sold是金额比较。正确后段中The booking agency + deducted + service fees；before forwarding说明扣款发生在剧院收到钱之前。", "other": "deposit 入账款；advertised price 宣传价格；deduct 扣除；forward money 转款。", "meaning": "没有One reason或Equally等显眼连接词，也能由段尾的收款差额锁定后段的扣费机制。这是问题→原因，不是看见theatre或audience就接同主题段。证据来自金额和交易阶段，不是一个单词。", "rest": "Audience surveys解释演出偏好，未说明钱款差额；same stage介绍场地历史，未接收款链；rehearsals和共同回家是演出活动信息，不解释代理转款前少了什么。"}, "context_id": "context:paragraph-discourse-ticket-deposits"}, {"id": "sentence-link-course-participation-a", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "表面便利 vs 参与不足", "skill": "讽刺语气 + 对比过渡", "q": "前文：The online course called itself interactive, but students could do little more than click Next after each recorded lecture. The easiest part was operating the screen; the hardest was staying awake.\n【空缺】\n后文：What would genuine participation require? Students could challenge arguments and revise one another's work.\n哪句最适合？", "o": ["The simple controls already give learners an active role in shaping the course.", "A redesign could replace passive viewing with a real role in shaping discussion.", "Recorded lectures also let learners choose when to watch the same presentation.", "Adding subtitles would make the recorded lectures easier for learners to follow."], "a": 1, "exp": {"trans": "前文用带讽刺性的说法指出所谓互动课仍只让学生被动点下一页；正确句转向让学生真正贡献观点的另一种课程；后文追问真正参与需要什么。", "structure": "but建立宣称interactive与实际只能click Next的矛盾；the hardest was staying awake暗示被动乏味。正确句用replace passive viewing with a real role in shaping discussion提出另一模式，后文再具体说明质疑论点与互相修改。", "other": "interactive 互动的；lecture 讲座/课；challenge an argument 质疑论点；revise 修订。", "meaning": "看到操作很简单，不能自动判为作者赞扬。应结合转折、夸张和后文提问判断作者真正评价：被动消费不足，主动参与才是重点。", "rest": "操作简单不等于能参与建构讨论；自选观看时间和字幕提升观看便利，却没有补上后文要求的质疑论点、互评修改等主动参与。"}, "context_id": "context:sentence-link-course-participation-a"}, {"id": "sentence-link-museum-experiment-b", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 65, "target": "单向展示→反向参与→后文设问", "skill": "双向篇章钩子", "q": "前文：At the old science museum, visitors watched a machine demonstrate each experiment. The most demanding thing they could do was press the Start button.\n【空缺】\n后文：What counts as taking part in an experiment? Visitors must be able to change a variable and compare the results.\n哪一句最适合？", "o": ["Repairs to the building could give the passive displays a more attractive setting.", "Simpler controls could help more visitors watch the same machine demonstrations.", "More detailed labels could explain the inventors behind the museum's machines.", "A redesign could replace watching demonstrations with carrying out one's own tests."], "a": 3, "exp": {"trans": "旧科技馆由机器单向演示，观众几乎只能按开始按钮。正确句引出新展览如何扭转这种被动观看，让观众亲自试验；后文再问什么才是真正参与实验。", "structure": "前文visitors watched与could do ... press Start显示参与程度低；正确句replace watching demonstrations with carrying out one’s own tests对比观看与亲自实验，后文change a variable和compare the results说明这种参与如何实现。", "other": "demanding 费力的；demonstration 演示；variable 变量；carry out a test 进行试验。", "meaning": "最有力的证据是双向：反转被动的安排承接前文，主动测试又引出后文讨论。‘最难任务只是按按钮’在语境中揭示参与不足，不是对设备的夸赞。", "rest": "场馆外观、观看操作和发明者标签仍把参观者放在观看或接收信息的位置；只有亲自测试自然引出后文改变变量、比较结果的参与标准。"}, "context_id": "context:sentence-link-museum-experiment-b"}, {"id": "pb13-library-joint-grants-a", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-library-joint-grants-a", "target": "new funding mechanism / That consequence / topical two-group distractor", "skill": "制度改革先说明执行机制，再由That引出合作结果", "q": "A public library will stop funding children's and adult literacy programs through entirely separate budgets. Officials stress that the reform should strengthen both. [BLANK] That should produce more projects serving whole families, rather than two unrelated groups. Which fits?", "o": ["The new process will require both programs to design projects together.", "Regional libraries have published more reports about literacy this year.", "Some employees focus on adult readers, while others teach children.", "The board will create separate committees for each age group."], "a": 0, "exp": {"trans": "图书馆计划取消儿童和成人识字项目完全分立的预算。改革目标是同时加强两者。随后要解释两项目如何一起设计方案，这才能使服务整个家庭的合作项目增加。", "structure": "That回指空格中描述的具体做法；new process...design projects together才会自然导致projects serving whole families。两个研究群体的存在是话题背景，不是合作机制。", "other": "literacy 读写能力；entirely separate 完全分开的；joint project 联合项目；committee 委员会。", "meaning": "topic match≠discourse link：后句That should produce...是结果句，前句需要明确的行动或机制。如果只描述两个群体，读起来相关却没有形成因果链。", "rest": "发表报告不一定促进合作；成人/儿童分工只描述现状；继续成立独立委员会甚至背离整合改革的目标。"}}, {"id": "pb13-museum-team-proposals-b", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-museum-team-proposals-b", "target": "policy integration / mechanism / This change consequence", "skill": "空前改革目标与空后合作效果需要中间实施步骤", "q": "A museum plans to replace isolated conservation and education grants with a shared application process. Its directors say neither department will lose support. [BLANK] This change could generate exhibitions linking research and visitor experience. Which fits?", "o": ["The museum has recently seen a sharp increase in visitor attendance.", "Staff will evaluate proposals jointly and choose teams to collaborate.", "The departments have long published very different research reports.", "The museum will divide each grant into two fixed independent parts."], "a": 1, "exp": {"trans": "博物馆将把保护和教育研究的独立资助改成联合申请。管理层说两部门都不会失去支持。空格要解释联合评审并选择合作团队，才能顺接‘这一变化会产生连接研究与观众体验的展览’。", "structure": "空格前提供改革背景和意图；This change could generate...给出预期效果。中间需要能产生该效果的具体协作措施，而非笼统主题描述。", "other": "conservation 保护、文物修复；grant 资助；jointly 联合地；exhibition 展览。", "meaning": "要核实桥接是否构成‘政策→机制→结果’链条，不能因选项也谈博物馆或部门就草率接受。", "rest": "游客增加和以往报告差异只是主题信息；再把资金硬分成两部分反而违背联合申请改革。"}}, {"id": "paragraph-discourse-audit-method-before-cases", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-27", "target": "说明与例证的层级", "skill": "说明与例证的层级", "budget": 65, "q": "An energy guide first explains that meter logs locate periods of high demand. A paragraph about equipment inspections follows. The next two paragraphs describe a bakery and a warehouse that combined logs with inspections. What is the role of the inspections paragraph?", "o": ["It completes the methods that the later cases apply.", "It summarizes the outcomes reported in the later cases.", "It gives a third case after the bakery and warehouse.", "It withdraws the claim that meter logs can be useful."], "a": 0, "exp": {"trans": "能源指南先解释用电表日志定位高需求时段，再介绍设备检查；后面两个案例同时使用日志和检查。检查段是在补齐随后案例会应用的方法。", "structure": "first、follows、next交代段落顺序；combined logs with inspections说明两个案例同时依赖前面两种方法，不是只应用第一段的方法。", "other": "meter log 电表记录；equipment inspection 设备检查；high demand 高需求；apply 应用。", "meaning": "一个方法段结束，不代表下一段必须马上举例。要检查后面案例需要哪些方法说明，再分清并列方法与两则应用案例的层级。", "rest": "总结后文结果需要结果性内容，检查方法本身不能当作结果总结；它位于两案例前也不是第三案例；案例同时使用日志，并未撤回日志有用的判断。"}, "context_id": "context:paragraph-discourse-audit-method-before-cases"}, {"id": "pb17-chorus-relations", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "并列与递进的段落功能", "skill": "并列与递进的段落功能", "q": "P: Singers can practise difficult rhythms by clapping. Q: They can also hum the melody without words to check pitch. R: A rehearsal combines both exercises before restoring the lyrics. Which account of the paragraph roles is accurate?", "o": ["P and Q are rival results; R rejects both as unsuccessful.", "P explains a failure; Q supplies its cause; R changes topic.", "P and Q offer parallel methods; R combines their use.", "P is a conclusion; Q gives its premise; R introduces P."], "a": 2, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "P拍手练节奏，Q哼唱检查音高，R把两项合并排练再恢复歌词。段落作用是什么？", "structure": "also标出另一方法；both回收前两种练习；combines才是从方法列举转向组合应用的推进。", "other": "hum哼唱；pitch音高；lyrics歌词。", "meaning": "P/Q并列而非彼此因果；R在并列方法之上推进到综合应用。", "rest": "rival results...rejects虚构竞争和失败；failure...cause虚构因果；P is a conclusion颠倒介绍与总结的位置。"}, "context_id": "choir-rhythm-pitch-parallel-methods-to-combined-application"}, {"id": "pb17-music-ending", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "结尾与全局论证相容", "skill": "结尾与全局论证相容", "q": "An essay introduces software that restores damaged musical scores, shows one rhythm error it produced, and explains how musicians can check its output. Which closing paragraph best fits that argument?", "o": ["Human checks help; useful output can still contain errors.", "The history of ticket prices now needs a detailed account.", "All restored notes must be right whenever software is used.", "One rhythm error proves that every digital tool is useless."], "a": 0, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "文章介绍修复乐谱的软件，展示一处节奏错误，再解释音乐家如何核验。哪段适合结尾？", "structure": "开头对象、错误例证、核验措施共同约束末段；结尾应合并优势与限制，不另起无关话题或扩大为全称断言。", "other": "score乐谱；restore修复；output输出结果。", "meaning": "全局位置要检查论证链是否闭合；技术有用与仍需人类核验可以同时成立。", "rest": "ticket prices另起无关话题；All restored notes把能力夸成保证；every digital tool把单例扩大为全体无用。"}, "context_id": "music-score-restoration-global-conclusion-with-qualified-claim"}], "dnt-actor-boundary": [{"id": "dnt-vendors-messages-b", "family": "dnt-actor-boundary", "target": "跨句识别负责执行的主体", "introduced": "2026-10-16", "published_on": "2026-10-16", "budget": 55, "skill": "跨句识别负责执行的主体", "q": "A council built a website where residents could ask outside contractors to stop marketing messages. The contractors promised to comply. Who is responsible for changing the outgoing messages?", "o": ["The outside contractors.", "The residents who used the form.", "The council members who created the site.", "The unrelated firms hosting the city's internet connection."], "a": 0, "exp": {"trans": "市议会提供请求渠道，居民提出停止消息的要求，但真正承诺停止发送营销信息的是外部承包商。", "structure": "第一句council built引出平台建设者；第二句The contractors promised to comply明确承诺者和履行请求的执行方。", "other": "council市议会；contractor承包商；comply遵守；marketing message营销信息。", "meaning": "指代分析不能只看上文最近被提到的组织，还要核对承诺、执行和发送行为对应的真实主语。", "rest": "居民是请求方，市议会是平台建设方；互联网连接服务商没有参与这项承诺，也没有文本证据表明它能停止消息。"}, "context_id": "context:dnt-vendors-messages-b"}], "nested": [{"id": "legacy-who-that-main", "source": "today", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "target": "who 定语从句 / that 宾语从句", "q": "Applicants who believe that a longer résumé automatically proves greater ability often overlook the value of relevance.\n哪组句法判断正确？", "o": ["主句主语 Applicants；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 proves；主句谓语 believe", "主句主语 a longer résumé；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 believe；主句谓语 proves"], "a": 0, "diag": {"1": "proves 属于 that 宾语从句，不是 who 从句的核心谓语；believe 也不是主句谓语。", "2": "a longer résumé 是 that 从句内部的主语，不是整句主语。", "3": "proves 是 that 从句谓语；整句主句谓语是 overlook。"}, "exp": {"trans": "那些认为简历越长就自然能证明能力越强的申请者，往往忽视了“相关性”的价值。", "structure": "原始简单句① Applicants often overlook the value of relevance. ② Applicants believe something. ③ A longer résumé automatically proves greater ability. → ②把 something 换成 that 从句：Applicants believe that... → 再把②变成修饰 Applicants 的 who 定语从句：Applicants who believe that... often overlook...。所以整句主语 Applicants，who 从句谓语 believe，that 从句谓语 proves，主句谓语 overlook。", "other": "applicant 申请者；résumé 简历；automatically 自然而然地/自动地；relevance 相关性。", "meaning": "看到 who 后先划到从句结束，再找主句谓语；who 从句里又可嵌套 that 宾语从句。", "rest": "把 that 从句的谓语 proves 误当成外层谓语，或把其中的 a longer résumé 误当成整句主语，都会错过：Applicants 是主句主语，believe 是 who 从句谓语，overlook 是主句谓语。"}, "family": "nested", "introduced": "2026-09-29", "budget": 60, "context_id": "nested-who-that-predicate"}, {"id": "nested-shared-gate", "family": "nested", "introduced": "2026-09-29", "budget": 60, "target": "who 定语从句 / that 宾语从句", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "q": "Residents who discovered that the shared gate was unlocked called the caretaker.\n按“主句主语中心词 / who从句谓语 / 主句谓语”的顺序，哪组正确？", "o": ["Residents / discovered / called", "the shared gate / discovered / was", "Residents / was unlocked / discovered", "the caretaker / called / discovered"], "a": 0, "exp": {"trans": "发现公共大门没有锁上的住户给管理员打了电话。", "structure": "简单句①Residents called the caretaker. ②Residents discovered something. ③The shared gate was unlocked. → 把③接在discovered后：Residents discovered that the shared gate was unlocked. → 把重复的Residents换成who并嵌入①：Residents [who discovered [that the shared gate was unlocked]] called the caretaker。主句完整主语包含who从句，中心词是Residents。", "other": "resident 住户；shared 共用的；unlocked 没锁上的；caretaker 管理员。", "meaning": "发现这件事的是住户；没有锁上的是大门；打电话给管理员的还是住户。三个小句的主语和谓语不能串层。", "rest": "the shared gate只在that从句中作主语，不能升为主句主语。was unlocked属于that从句，discovered属于who从句；两者都不是主句谓语。the caretaker是called的宾语，不是发现大门未锁的人。"}, "context_id": "nested-who-that-predicate"}, {"id": "nested-valve-leak-c", "family": "nested", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 60, "target": "who-clause / that-clause / main-clause predicate", "skill": "区分定语从句、宾语从句和主句谓语", "q": "Engineers who noticed that the valve was leaking shut down the line. Which sequence gives the main-clause subject head / who-clause verb / main-clause verb?", "o": ["Engineers / noticed / shut down", "the valve / noticed / was leaking", "Engineers / was leaking / noticed", "the line / shut down / noticed"], "a": 0, "exp": {"trans": "注意到阀门漏液的工程师关闭了生产线。按题目要求的顺序，主句主语中心词是Engineers，who从句谓语是noticed，主句谓语是shut down。", "structure": "主句骨架是Engineers shut down the line；who noticed...修饰Engineers；that the valve was leaking是noticed的宾语从句。三个谓语分别属于不同层级。", "other": "engineer 工程师；valve 阀门；leak 漏液；shut down 关闭、停运；subject head 主语中心词。", "meaning": "先找主句骨架，再把who定
