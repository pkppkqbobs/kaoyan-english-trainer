<script>window.REVIEW_DATA={"date": "2026-10-02", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "tone-recovery-physio", "family": "tone", "introduced": null, "target": "tone", "skill": "tone 熟词生义", "q": "After several weeks of physiotherapy, the patient regained enough muscle tone to stand without assistance. Here, muscle tone refers to:", "o": ["说话语气", "肌肉张力", "肤色", "音高"], "a": 1, "budget": 35, "exp": {"trans": "经过几周的物理治疗后，患者恢复了足够的肌张力，可以在无人帮助的情况下站立。", "structure": "主干：the patient（主语）+ regained（谓语）+ enough muscle tone（宾语）。to stand without assistance表示恢复到足以站立的结果/程度。", "other": "physiotherapy 物理治疗；regain 恢复；assistance 帮助；stand 站立。", "meaning": "muscle tone是固定医学表达，指肌张力。", "rest": "tone可表示语气、色调、音调，但muscle明确限定了词义；说话语气常见tone of voice，肤色常见skin tone，音高通常是pitch。"}}, {"id": "legacy-unpretentious", "source": "today", "skill": "unpretentious / unpredictable", "target": "unpretentious / unpredictable", "q": "The scientist's office was surprisingly ___: plain shelves, an old desk, and no awards on display.", "o": ["unpretentious", "unpredictable", "formidable", "perplexing"], "a": 0, "diag": {"1": "把 unpretentious 和 unpredictable 混淆了：这里描述的是朴素、不摆架子的风格，不是“无法预测”。", "2": "formidable 表示“令人敬畏的、难对付的”，与 plain / no awards 的语义方向相反。", "3": "perplexing 表示“令人困惑的”，这里没有“难以理解”的线索。"}, "exp": {"trans": "这位科学家的办公室出人意料地朴素：普通的书架、一张旧书桌，而且没有陈列任何奖项。", "structure": "主干：The scientist's office（主语）+ was（系动词）+ unpretentious（表语）。冒号后 plain shelves, an old desk, and no awards on display 是对“朴素”的具体说明。", "other": "plain 普通的/朴素的；shelf 书架；on display 陈列着；award 奖项。", "meaning": "unpretentious = 不装腔作势的、朴实低调的。注意：unpredictable 才是“无法预测的”。", "rest": "B unpredictable=不可预测的；C formidable=令人敬畏的/难对付的；D perplexing=令人困惑的。这里只有 A 与后面的“普通书架、旧桌子、不展示奖项”一致。"}, "family": "unpretentious", "introduced": "2026-09-29", "budget": 35}, {"id": "title-preprint-a", "family": "title-specificity", "introduced": "2026-09-30", "budget": 55, "target": "标题具体性 / 抓反复强调的特殊现象", "skill": "主旨标题", "q": "短文：越来越多研究团队会在同行评审完成前先发布预印本。作者反复讨论这样做的速度优势、误读风险，以及“先公开、后评审”正在改变学术传播节奏。哪个标题最贴切？", "o": ["Science Is Changing", "The Only Future for Researchers", "Publishing Before Peer Review", "Why Research Is Difficult"], "a": 2, "exp": {"trans": "短文核心是：越来越多团队在同行评审完成之前先公开预印本，并讨论这种“先公开、后评审”的新节奏。", "structure": "题干给了三类信息：现象（先发预印本）、利弊（速度/误读风险）、趋势（改变传播节奏）。标题应抓住反复出现的特殊条件，而不是只抓大类话题science/research。", "other": "preprint 预印本；peer review 同行评审；misreading 误读；academic communication 学术传播。", "meaning": "好标题通常覆盖全文最特殊、反复出现的现象。Publishing Before Peer Review直接命中“评审前发布”。", "rest": "Science Is Changing过于宽泛；The Only Future含Only，原文只说越来越多，不是唯一道路；Why Research Is Difficult把主题偷换成研究困难。"}}, {"id": "faint-praise-restoration", "family": "faint", "introduced": "2026-09-29", "target": "faint praise", "skill": "faint / faint praise", "q": "Calling the volunteers' six-month restoration project “not entirely useless” struck the team as faint praise.\n哪句改写最准确？", "o": ["The team heard an enthusiastic celebration of the project.", "The comment offered only a very weak form of approval.", "The comment proved that the project had failed completely.", "The team was told that the project had won an award."], "a": 1, "exp": {"trans": "把志愿者历时六个月的修复项目说成“并非完全没有用”，让团队觉得这只是很勉强的赞扬。", "structure": "Calling the volunteers' six-month restoration project ‘not entirely useless’是整个动名词短语主语；struck是谓语；the team是宾语；as faint praise表示给团队留下何种印象。短语内部call A B：称A为B。", "other": "restoration 修复；entirely 完全；strike sb as sth 给某人以某种印象；approval 赞许。", "meaning": "faint praise并非赞扬完全不存在，而是肯定得很有限，甚至暗含保留意见。", "rest": "enthusiastic celebration表示热情赞颂，力度过强；had failed completely表示彻底失败，把微弱肯定改成全面否定；had won an award表示获奖，原文没有提供获奖事实。"}}, {"id": "parallel-governance-repair", "family": "parallel-governance", "introduced": null, "target": "共同动词支配 / either...or...", "skill": "共同动词支配", "q": "Which sentence has a clean parallel structure in which the same modal verb governs both alternatives?", "o": ["The technician can either replace the sensor or recalibrate the device.", "The technician either can replace the sensor or recalibration of the device.", "The technician can either replacing the sensor or recalibrate the device.", "The technician can either replace the sensor or the device is recalibrated."], "a": 0, "budget": 45, "exp": {"trans": "正确句：技术员可以要么更换传感器，要么重新校准设备。", "structure": "主干：The technician（主语）+ can（情态动词）+ either replace... or recalibrate...。can同时支配replace和recalibrate，两边都是动词原形，结构完全平行。", "other": "technician 技术员；sensor 传感器；recalibrate 重新校准；device 设备。", "meaning": "共同动词支配时，并列两端应保持同一语法层级。这里 can + replace / recalibrate。", "rest": "either can replace... or recalibration... 把动词结构和名词结构并列；can either replacing... 中情态动词后不能接-ing形式；replace... or the device is recalibrated 把动词短语和完整从句并列，层级不一致。"}}, {"id": "with-lights-dimming", "family": "with", "introduced": null, "target": "with + 名词 + 后置成分", "skill": "with + 名词 + 后置修饰", "q": "The audience waited quietly, with the lights gradually dimming before the film began. The with-structure mainly:", "o": ["adds a simultaneous background state", "states the purpose of waiting", "introduces an independent main clause", "means the audience waited together with the lights"], "a": 0, "budget": 55, "exp": {"trans": "观众安静地等待着，电影开始前，灯光正逐渐变暗。", "structure": "主干：The audience（主语）+ waited（谓语）+ quietly（状语）。原始简单句：The lights were gradually dimming before the film began. → 去掉were，用with引出：with the lights gradually dimming...。the lights是with结构的逻辑主语，dimming与lights构成主动关系。", "other": "audience 观众；gradually 逐渐地；dim 变暗；before the film began 电影开始前。", "meaning": "with + 名词 + 后置成分可补充主句发生时的伴随状态或背景。", "rest": "目的通常用to do/in order to；with结构不是新的独立主句；这里with不是“和灯光一起”等普通介词伴随对象，而是带逻辑主语和分词的复合结构。"}}, {"id": "conceivably-ferry", "family": "conceivably", "introduced": null, "target": "conceivably", "skill": "conceivably", "q": "If the wind weakens before noon, the ferry could conceivably resume service this afternoon, but the operator has made no promise. Conceivably most nearly means:", "o": ["必然地", "有这种可能，但不能确定", "故意地", "表面上地"], "a": 1, "budget": 35, "exp": {"trans": "如果中午前风势减弱，渡轮今天下午有可能恢复运营，但运营方没有作出任何保证。", "structure": "if从句给出条件：the wind weakens before noon。主句：the ferry + could resume + service；conceivably修饰could resume，降低确定性。but后面的no promise进一步说明并不确定。", "other": "weaken 减弱；ferry 渡轮；resume service 恢复运营；operator 运营方。", "meaning": "conceivably = 可以设想地、有可能地，强调可能存在但远未确定。", "rest": "必然地接近certainly/inevitably，语气过强；故意地是deliberately/intentionally；表面上地是apparently/superficially，均不符合could...but no promise的弱可能语境。"}}, {"id": "cling-policy-a", "family": "cling-climb", "introduced": "2026-09-30", "budget": 35, "target": "cling / climb / cling to", "skill": "形近词辨析", "q": "Even after the company simplified its procedures, a few managers continued to cling to the old rules. Here, cling to means:", "o": ["向上攀爬", "紧抓着不愿放弃", "公开批评", "快速修改"], "a": 1, "exp": {"trans": "即使公司简化了流程，仍有少数经理继续死守旧规定。", "structure": "Even after...是让步背景。主干：a few managers（主语）+ continued（谓语）+ to cling to the old rules（补足内容）。cling to的宾语是the old rules。", "other": "simplify 简化；procedure 流程；continue to do 继续做；old rules 旧规定。", "meaning": "cling to = 紧抓、依恋、不愿放弃。注意cling不是climb。", "rest": "climb才是“攀爬”；公开批评是criticize openly；快速修改是revise quickly。这里语境是明知规则已简化仍不愿放弃旧做法。"}}], "retry": {"tone": [], "unpretentious": [{"id": "unpretentious-volunteer", "family": "unpretentious", "introduced": "2026-09-29", "target": "unpretentious / unpredictable", "skill": "unpretentious / unpredictable", "q": "Despite her fame, the author washed dishes with the volunteers and asked for no special treatment. Her manner was ___.", "o": ["unpredictable", "hostile", "unpretentious", "perplexing"], "a": 2, "exp": {"trans": "尽管很有名，这位作家还是和志愿者一起洗碗，没有要求任何特殊待遇。她为人不摆架子。", "structure": "第一句主干：the author（主语）+ washed / asked（并列谓语）；dishes是washed的宾语，for no special treatment是asked后的介词短语。Despite her fame是让步状语。第二句：Her manner + was + unpretentious。", "other": "despite 尽管；fame 名气；volunteer 志愿者；special treatment 特殊待遇。", "meaning": "unpretentious表示朴实、不自命不凡，描述作风而非能否预测。", "rest": "unpredictable：无法预测的，常搭配weather或behaviour；这里没有反复无常的线索。hostile：敌对的，常用be hostile to；与合作洗碗不符。perplexing：令人困惑的，常修饰question或situation；这里强调不摆架子。"}}, {"id": "unpredictable-response-time", "family": "unpretentious", "introduced": "2026-09-29", "target": "unpretentious / unpredictable", "skill": "unpretentious / unpredictable", "q": "On the same phone, the app sometimes opens instantly and sometimes takes a full minute. Its response time is ___.", "o": ["unpretentious", "unpredictable", "constant", "reliable"], "a": 1, "exp": {"trans": "在同一部手机上，这个应用有时马上打开，有时却要整整一分钟。它的响应时间难以预测。", "structure": "the app是主语；opens和takes是并列谓语，sometimes...and sometimes...形成对比。第二句：Its response time（主语）+ is（系动词）+ unpredictable（表语）。", "other": "instantly 立刻；a full minute 整整一分钟；response time 响应时间；constant 恒定的。", "meaning": "unpredictable来自predict，表示难以预测；这里说性能表现忽快忽慢。", "rest": "unpretentious：朴实、不摆架子的，常修饰person/style，不表示快慢无法预测。constant：恒定的，与忽快忽慢相反。reliable：可靠的，常用reliable information/service，不能概括这里不稳定的时间表现。"}}], "title-specificity": [{"id": "title-booking-b", "family": "title-specificity", "introduced": "2026-09-30", "budget": 55, "target": "主旨标题 / 特殊限定条件", "skill": "标题题", "q": "短文：一些游客现在会在签证获批前就购买可退改机票。文章重点讨论这种“先订票、后等签证”的风险和好处。哪个标题最好？", "o": ["Travel in the Modern World", "Booking Before Approval", "The Only Smart Way to Travel", "Why Visas Should Disappear"], "a": 1, "exp": {"trans": "短文关注的是一种具体行为：在签证批准之前先订可退改机票，并讨论其风险与好处。", "structure": "主旨由反复出现的时间关系“before approval”限定。标题需要既覆盖行为，又保留这个特殊条件。", "other": "visa approval 签证获批；refundable 可退款的；risk 风险；benefit 好处。", "meaning": "Booking Before Approval准确概括特殊现象；不是只说“旅游”，也不夸大成唯一正确方式。", "rest": "Travel in the Modern World范围太大；The Only Smart Way含绝对化Only，原文只说“一些游客”；Why Visas Should Disappear引入原文没有的政策主张。"}}], "faint": [{"id": "legacy-faint-praise", "source": "today", "skill": "faint / faint praise", "target": "faint / faint praise", "q": "After a two-hour presentation, Maya said, “Well, at least the slides were readable.” Her remark is best described as:", "o": ["faint praise", "earnest approval", "open hostility", "sufficient evidence"], "a": 0, "diag": {"1": "earnest approval 是真诚而明确的赞许；“at least...”只给了很弱的一点肯定。", "2": "这句话并非直接敌意攻击，而是非常有限、勉强的表扬。", "3": "evidence 是“证据”，不是评价语气。"}, "exp": {"trans": "听完一场两小时的演讲后，Maya 说：“嗯，至少幻灯片还看得清。”这句话最适合形容为“勉强的赞扬”。", "structure": "Maya（主语）+ said（谓语）+ 引语（内容）。问句 Her remark is best described as... 中 is described是被动谓语，不是is加形容词表语。引语主干为the slides were readable；at least限制了肯定的力度。", "other": "presentation 演讲/展示；readable 易读的；remark 评论；at least 至少。", "meaning": "faint praise = 勉强的、力度很弱的赞扬。这里 faint 的核心是“微弱的、不强的”。", "rest": "B earnest approval=真诚、认真地赞成，语气过强；C open hostility=公开敌意，不符合；D sufficient evidence=充分证据，词义类别都不对。"}, "family": "faint", "introduced": "2026-09-29", "budget": 35}, {"id": "faint-map-line", "family": "faint", "introduced": "2026-09-29", "target": "faint", "skill": "faint / faint praise", "q": "After years in the sunlight, only a faint line remained on the old map.\n这里 faint 最接近哪种意思？", "o": ["神圣的", "突然出现的", "隐约的、不清晰的", "故意伪造的"], "a": 2, "exp": {"trans": "经过多年日晒，旧地图上只剩下一条隐约可见的线。", "structure": "After years in the sunlight是时间背景。only a faint line（主语）+ remained（不及物谓语）；on the old map是地点状语。", "other": "sunlight 阳光；remain 留下、仍然存在；line 线条；after years 多年之后。", "meaning": "faint在这里是微弱、不明显的；与faint praise中赞扬力度很弱具有相近的语义核心。", "rest": "神圣的常用holy/sacred；圣人是saint，不是faint。突然出现的可说sudden，重点是发生速度，不是清晰度。伪造的可说forged/fake，描述真伪，原句没有这种信息。"}}], "parallel-governance": [], "with": [{"id": "with-bread-cooling", "family": "with", "introduced": null, "budget": 60, "target": "with + 名词 + 分词", "skill": "with + 名词 + 后置成分", "q": "The bakery opened at six, with warm bread cooling on the counter.\nwith 后面的结构主要起什么作用？", "o": ["补充开门时伴随的状态", "引出老板的直接引语", "说明开门的唯一目的", "充当opened的直接宾语"], "a": 0, "exp": {"trans": "面包店六点开门，当时温热的面包正在柜台上晾凉。", "structure": "主干：The bakery（主语）+ opened（不及物谓语）+ at six（时间状语）。原始简单句Warm bread was cooling on the counter → 去掉was，用with引出：with warm bread cooling on the counter。warm bread是with结构的逻辑主语，cooling是与之构成主动关系的现在分词。", "other": "bakery 面包店；cool 晾凉、变凉；counter 柜台；warm 温热的。", "meaning": "with复合结构可以补充主句发生时的伴随状态；它不是新的独立主句。", "rest": "直接引语通常由say等动词引出，此处没有任何说话行为。目的常用to do或in order to，原句只描写伴随状态。opened在本句是不及物用法，with短语不是其直接宾语。"}}], "conceivably": [], "cling-climb": [{"id": "cling-rail-b", "family": "cling-climb", "introduced": "2026-09-30", "budget": 35, "target": "cling / climb", "skill": "cling ≠ climb", "q": "The child ___ to the railing while the boat crossed the rough water; he did not try to ___ it.", "o": ["climbed / cling", "clung / climb", "clung / clung", "climbed / climb"], "a": 1, "exp": {"trans": "船驶过颠簸水面时，孩子紧紧抓住栏杆；他并没有试图爬上去。", "structure": "第一分句：The child + clung to + the railing。第二分句：he + did not try + to climb + it。clung是cling的过去式；climb是不定式原形。", "other": "railing 栏杆；rough water 风浪较大的水面；cross 穿过；try to do 试图做。", "meaning": "cling → clung表示抓紧不放；climb表示向上爬。两个词形相近但动作完全不同。", "rest": "climbed to the railing更像“爬到栏杆处”，不符合抓稳身体；try to cling it缺少介词to且语义不对；两个都用clung无法表达第二句“爬”。"}}]}, "issues_used": [1, 2, 3, 4, 5], "engine": 3};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
