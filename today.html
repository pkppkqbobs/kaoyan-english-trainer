<script>window.REVIEW_DATA={"date": "2026-09-30", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "unpretentious-volunteer", "family": "unpretentious", "introduced": "2026-09-29", "target": "unpretentious / unpredictable", "skill": "unpretentious / unpredictable", "q": "Despite her fame, the author washed dishes with the volunteers and asked for no special treatment. Her manner was ___.", "o": ["unpredictable", "hostile", "unpretentious", "perplexing"], "a": 2, "exp": {"trans": "尽管很有名，这位作家还是和志愿者一起洗碗，没有要求任何特殊待遇。她为人不摆架子。", "structure": "第一句主干：the author（主语）+ washed / asked（并列谓语）；dishes是washed的宾语，for no special treatment是asked后的介词短语。Despite her fame是让步状语。第二句：Her manner + was + unpretentious。", "other": "despite 尽管；fame 名气；volunteer 志愿者；special treatment 特殊待遇。", "meaning": "unpretentious表示朴实、不自命不凡，描述作风而非能否预测。", "rest": "unpredictable：无法预测的，常搭配weather或behaviour；这里没有反复无常的线索。hostile：敌对的，常用be hostile to；与合作洗碗不符。perplexing：令人困惑的，常修饰question或situation；这里强调不摆架子。"}}, {"id": "legacy-such", "source": "old", "skill": "these / such 回指", "target": "these / such 回指", "q": "段A：The museum lowered ticket prices and added evening hours.\n段B：Such changes attracted more local families during the week.\n段C：A different museum across town raised its prices last year.\n\n段B中的 Such changes 最直接回指什么？", "o": ["段A中的降价和延长晚间开放时间", "段C中另一家博物馆的涨价", "所有博物馆过去一年的变化", "local families 本身"], "a": 0, "diag": {"1": "段B先于段C，且 Such changes 就近概括段A的两个措施。", "2": "题干没有支持“所有博物馆”的泛指。", "3": "changes 指的是措施变化，不是家庭。"}, "exp": {"trans": "A：博物馆降低了票价，并延长了晚间开放时间。B：这些变化吸引了更多本地家庭在工作日前来。C：城另一边的另一家博物馆去年提高了票价。", "structure": "段A先给出两个并列措施 lowered ticket prices / added evening hours；段B用 Such changes 对这两个措施整体回指，再说明结果 attracted more local families。", "other": "lower 降低；ticket price 票价；evening hours 晚间开放时段；attract 吸引。", "meaning": "such + 名词 常把前文已经描述过的同类事物/情况概括回指；这里 Such changes = 段A的两项变化。", "rest": "B 是后文另一对象；C 范围被无依据扩大；D 词义和语法都不匹配。"}, "family": "reference", "introduced": null, "budget": 35}, {"id": "end-up-lamps", "family": "end-up", "introduced": null, "target": "end up doing", "skill": "end up doing", "q": "We set out to buy new lamps but ended up ___ the broken ones ourselves.", "o": ["to repair", "repaired", "repair", "repairing"], "a": 3, "exp": {"trans": "我们本来打算买新灯，结果却自己把坏的修好了。", "structure": "We是共同主语；set out和ended up是由but连接的并列谓语部分。to buy new lamps说明原先打算；repairing the broken ones ourselves接在ended up后，说明最终结果。", "other": "set out to do 开始着手、打算做；lamp 灯；the broken ones 坏掉的那些；ourselves 我们自己。", "meaning": "end up doing sth表示最后竟做了某事，常用于结果偏离原计划。", "rest": "to repair是不定式，不能在这里与end up搭配；repaired是过去式或过去分词，不符合此结构；repair是动词原形，也不能直接接在ended up后。常见正确形式是end up repairing。"}}, {"id": "subject-curtains-steam", "family": "subject", "introduced": null, "budget": 45, "target": "subject A to B / be subjected to", "skill": "be subject to / be subjected to", "q": "The cleaner deliberately subjected the curtains to a steam treatment yesterday.\n要保留“昨天实际施加了处理”的含义，哪句被动改写准确？", "o": ["The curtains are subject to changes in fashion.", "The curtains were exempt from treatment yesterday.", "The curtains were subjected to a steam treatment by the cleaner yesterday.", "The curtains are suitable for steam treatment."], "a": 2, "exp": {"trans": "清洁人员昨天特意对窗帘做了蒸汽处理。被动句：窗帘昨天被清洁人员进行了蒸汽处理。", "structure": "主动简单句：The cleaner（主语）+ subjected（谓语）+ the curtains（宾语）+ to a steam treatment。→ 把宾语the curtains提升为被动句主语，把subjected改成were subjected，并用by保留施事：The curtains were subjected to a steam treatment by the cleaner yesterday。", "other": "cleaner 清洁人员；curtain 窗帘；deliberately 特意地；steam treatment 蒸汽处理。", "meaning": "subject A to B表示使A经历B；变成被动结构就是A be subjected to B，实际处理过程仍然保留。", "rest": "are subject to changes in fashion：说窗帘可能受时尚变化影响，不是昨天被处理的事件。were exempt from treatment：免于处理，与原文相反。are suitable for steam treatment：适合做处理，只表示适宜性，不能证明处理发生过。"}}, {"id": "legacy-faint-praise", "source": "today", "skill": "faint / faint praise", "target": "faint / faint praise", "q": "After a two-hour presentation, Maya said, “Well, at least the slides were readable.” Her remark is best described as:", "o": ["faint praise", "earnest approval", "open hostility", "sufficient evidence"], "a": 0, "diag": {"1": "earnest approval 是真诚而明确的赞许；“at least...”只给了很弱的一点肯定。", "2": "这句话并非直接敌意攻击，而是非常有限、勉强的表扬。", "3": "evidence 是“证据”，不是评价语气。"}, "exp": {"trans": "听完一场两小时的演讲后，Maya 说：“嗯，至少幻灯片还看得清。”这句话最适合形容为“勉强的赞扬”。", "structure": "Maya（主语）+ said（谓语）+ 引语（内容）。问句 Her remark is best described as... 中 is described是被动谓语，不是is加形容词表语。引语主干为the slides were readable；at least限制了肯定的力度。", "other": "presentation 演讲/展示；readable 易读的；remark 评论；at least 至少。", "meaning": "faint praise = 勉强的、力度很弱的赞扬。这里 faint 的核心是“微弱的、不强的”。", "rest": "B earnest approval=真诚、认真地赞成，语气过强；C open hostility=公开敌意，不符合；D sufficient evidence=充分证据，词义类别都不对。"}, "family": "faint", "introduced": "2026-09-29", "budget": 35}, {"id": "point-joke", "family": "point", "introduced": "2026-09-29", "target": "miss the point", "skill": "miss the point / point", "q": "Even after I explained the joke twice, my brother still missed the point.\nmissed the point 在这里表示什么？", "o": ["仍然怀念以前的笑话", "仍然没明白笑话的关键", "忘记了一个标点符号", "没赶上兄弟聚会"], "a": 1, "exp": {"trans": "即使我把这个笑话解释了两遍，我弟弟仍然没有明白其中的关键。", "structure": "主句：my brother（主语）+ missed（谓语）+ the point（宾语）。after从句：I + explained + the joke；twice修饰explained。even强调即便已经解释过，结果仍如此。", "other": "joke 笑话；twice 两次；still 仍然；explain 解释。", "meaning": "miss the point整体表示没领会关键、没明白意思，不能把miss机械地译成怀念。", "rest": "miss sb可表示想念某人，但miss the point不是这一义项。标点符号一般是punctuation mark，不是这里的point。miss a meeting可表示错过聚会，但原句没有meeting；brother是主语，不是被错过的活动。"}}, {"id": "remote-lottery-chance", "family": "remote", "introduced": null, "target": "remote", "skill": "remote 熟词生义", "q": "With thousands of names in the box and only one prize, my chance of winning seemed remote.\nremote 最接近：", "o": ["奖品在偏远地区", "机会需要远程控制", "获奖希望渺茫", "获奖已成定局"], "a": 2, "exp": {"trans": "箱子里有成千上万个名字，却只有一个奖项，我获奖的希望看来很渺茫。", "structure": "主干：my chance of winning（主语）+ seemed（系动词）+ remote（表语）。with...给出背景；of winning修饰chance，说明是什么机会。", "other": "thousands of 成千上万的；prize 奖项；chance of doing 做某事的机会；seem 似乎。", "meaning": "remote修饰chance/possibility时表示可能性很小、渺茫，不是空间上遥远。", "rest": "偏远地区可说a remote area，但原句remote修饰chance而非地点。远程控制是remote control，与抽奖概率无关。已成定局接近certain/assured，与渺茫相反。"}}, {"id": "legacy-who-that-main", "source": "today", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "target": "who 定语从句 / that 宾语从句", "q": "Applicants who believe that a longer résumé automatically proves greater ability often overlook the value of relevance.\n哪组句法判断正确？", "o": ["主句主语 Applicants；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 proves；主句谓语 believe", "主句主语 a longer résumé；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 believe；主句谓语 proves"], "a": 0, "diag": {"1": "proves 属于 that 宾语从句，不是 who 从句的核心谓语；believe 也不是主句谓语。", "2": "a longer résumé 是 that 从句内部的主语，不是整句主语。", "3": "proves 是 that 从句谓语；整句主句谓语是 overlook。"}, "exp": {"trans": "那些认为简历越长就自然能证明能力越强的申请者，往往忽视了“相关性”的价值。", "structure": "原始简单句① Applicants often overlook the value of relevance. ② Applicants believe something. ③ A longer résumé automatically proves greater ability. → ②把 something 换成 that 从句：Applicants believe that... → 再把②变成修饰 Applicants 的 who 定语从句：Applicants who believe that... often overlook...。所以整句主语 Applicants，who 从句谓语 believe，that 从句谓语 proves，主句谓语 overlook。", "other": "applicant 申请者；résumé 简历；automatically 自然而然地/自动地；relevance 相关性。", "meaning": "看到 who 后先划到从句结束，再找主句谓语；who 从句里又可嵌套 that 宾语从句。", "rest": "B/D 都把 that 从句的 proves 错当成外层谓语；C 把 that 从句内部的 a longer résumé 错当成整句主语。"}, "family": "nested", "introduced": "2026-09-29", "budget": 60}], "retry": {"unpretentious": [{"id": "legacy-unpretentious", "source": "today", "skill": "unpretentious / unpredictable", "target": "unpretentious / unpredictable", "q": "The scientist's office was surprisingly ___: plain shelves, an old desk, and no awards on display.", "o": ["unpretentious", "unpredictable", "formidable", "perplexing"], "a": 0, "diag": {"1": "把 unpretentious 和 unpredictable 混淆了：这里描述的是朴素、不摆架子的风格，不是“无法预测”。", "2": "formidable 表示“令人敬畏的、难对付的”，与 plain / no awards 的语义方向相反。", "3": "perplexing 表示“令人困惑的”，这里没有“难以理解”的线索。"}, "exp": {"trans": "这位科学家的办公室出人意料地朴素：普通的书架、一张旧书桌，而且没有陈列任何奖项。", "structure": "主干：The scientist's office（主语）+ was（系动词）+ unpretentious（表语）。冒号后 plain shelves, an old desk, and no awards on display 是对“朴素”的具体说明。", "other": "plain 普通的/朴素的；shelf 书架；on display 陈列着；award 奖项。", "meaning": "unpretentious = 不装腔作势的、朴实低调的。注意：unpredictable 才是“无法预测的”。", "rest": "B unpredictable=不可预测的；C formidable=令人敬畏的/难对付的；D perplexing=令人困惑的。这里只有 A 与后面的“普通书架、旧桌子、不展示奖项”一致。"}, "family": "unpretentious", "introduced": "2026-09-29", "budget": 35}, {"id": "unpredictable-response-time", "family": "unpretentious", "introduced": "2026-09-29", "target": "unpretentious / unpredictable", "skill": "unpretentious / unpredictable", "q": "On the same phone, the app sometimes opens instantly and sometimes takes a full minute. Its response time is ___.", "o": ["unpretentious", "unpredictable", "constant", "reliable"], "a": 1, "exp": {"trans": "在同一部手机上，这个应用有时马上打开，有时却要整整一分钟。它的响应时间难以预测。", "structure": "the app是主语；opens和takes是并列谓语，sometimes...and sometimes...形成对比。第二句：Its response time（主语）+ is（系动词）+ unpredictable（表语）。", "other": "instantly 立刻；a full minute 整整一分钟；response time 响应时间；constant 恒定的。", "meaning": "unpredictable来自predict，表示难以预测；这里说性能表现忽快忽慢。", "rest": "unpretentious：朴实、不摆架子的，常修饰person/style，不表示快慢无法预测。constant：恒定的，与忽快忽慢相反。reliable：可靠的，常用reliable information/service，不能概括这里不稳定的时间表现。"}}], "reference": [{"id": "reference-radio-failures", "family": "reference", "introduced": null, "target": "these/such 回指 / 原词复现干扰", "skill": "原词复现 vs 明确回指", "q": "段A：The team lost radio contact, and its spare battery failed.\n段B：These failures forced the team to abandon the search.\n段C：Another team tested a radio before leaving camp.\n\n哪两个段落之间的衔接最强？", "o": ["A → C", "B → C", "C → A", "A → B"], "a": 3, "exp": {"trans": "段A：团队失去了无线电联系，备用电池也出了故障。段B：这些故障迫使团队放弃搜寻。段C：另一支团队离开营地前测试了一台无线电设备。", "structure": "段A有两个并列分句：The team + lost + radio contact；its spare battery + failed。段B：These failures（主语，概括前面的两项故障）+ forced（谓语）+ the team（宾语）+ to abandon the search（宾语补足语）。段C的Another team引入另一对象。", "other": "radio contact 无线电联系；spare 备用的；abandon 放弃；search 搜寻。", "meaning": "These failures明确回指已出现的两次故障；重复radio一词并不保证谈的是同一团队、同一事件。", "rest": "把两个含radio的句子相接，会忽略Another team造成的对象切换。把这些故障放在另一团队测试设备之前，后句没有承接故障结果。先说另一团队测试再说本团队出故障，也没有明确回指建立连接。"}}, {"id": "reference-return-rules", "family": "reference", "introduced": null, "target": "these requirements", "skill": "these / such 回指", "q": "A return is accepted only within thirty days and with a receipt. These requirements apply to online orders too.\nThese requirements 具体指什么？", "o": ["网上订单本身", "所有商店的规定", "三十天以内退货且出示收据这两个条件", "退款已经完成这一结果"], "a": 2, "exp": {"trans": "只有在三十天内并出示收据，退货才会被受理。这些要求也适用于网上订单。", "structure": "第一句：A return（主语）+ is accepted（被动谓语）；only within thirty days和with a receipt并列限制受理条件。第二句：These requirements（主语）+ apply（谓语）+ to online orders（介词短语）。", "other": "return 退货；receipt 收据；apply to 适用于；online order 网上订单。", "meaning": "these + 名词可以概括前文的整组条件，不一定只指紧挨着它的一个名词。", "rest": "online orders是第二句中被这些要求约束的对象，不是要求本身。所有商店的规定扩大了范围，原文未说all shops。退款完成是结果，但前句只陈述受理规则，没有报告任何实际退款。"}}], "end-up": [], "subject": [{"id": "subject-rule-departure", "family": "subject", "introduced": null, "budget": 40, "target": "be subject to / be subjected to", "skill": "be subject to / be subjected to", "q": "需要写一句仍适用的票务规则：“发车时间可能调整。”这里只说明可能性，不报告已经执行的处理。哪句准确？", "o": ["Departure times were subjected to repeated adjustments yesterday.", "Departure times are subject to change.", "Departure times are subjected to a detailed inspection every morning.", "Departure times are immune to change."], "a": 1, "exp": {"trans": "Departure times are subject to change：发车时间可能发生调整。", "structure": "Departure times（主语）+ are（系动词）+ subject to change（表语）。这里是规则或可能状态，不是在叙述谁已经对时刻表做了什么处理。", "other": "departure 出发；adjustment 调整；inspection 检查；be immune to 不受……影响。", "meaning": "be subject to在这条规则中表示可能受变化影响。be subjected to通常强调某对象被施加了某个过程。", "rest": "were subjected to repeated adjustments yesterday：报告昨天实际经历了反复调整，时态和事件性质均不符。are subjected to a detailed inspection：说每天被施加检查过程，inspection也不是时间可能调整。are immune to change：表示不受变化影响，与题意相反。"}}], "faint": [{"id": "faint-map-line", "family": "faint", "introduced": "2026-09-29", "target": "faint", "skill": "faint / faint praise", "q": "After years in the sunlight, only a faint line remained on the old map.\n这里 faint 最接近哪种意思？", "o": ["神圣的", "突然出现的", "隐约的、不清晰的", "故意伪造的"], "a": 2, "exp": {"trans": "经过多年日晒，旧地图上只剩下一条隐约可见的线。", "structure": "After years in the sunlight是时间背景。only a faint line（主语）+ remained（不及物谓语）；on the old map是地点状语。", "other": "sunlight 阳光；remain 留下、仍然存在；line 线条；after years 多年之后。", "meaning": "faint在这里是微弱、不明显的；与faint praise中赞扬力度很弱具有相近的语义核心。", "rest": "神圣的常用holy/sacred；圣人是saint，不是faint。突然出现的可说sudden，重点是发生速度，不是清晰度。伪造的可说forged/fake，描述真伪，原句没有这种信息。"}}, {"id": "faint-praise-restoration", "family": "faint", "introduced": "2026-09-29", "target": "faint praise", "skill": "faint / faint praise", "q": "Calling the volunteers' six-month restoration project “not entirely useless” struck the team as faint praise.\n哪句改写最准确？", "o": ["The team heard an enthusiastic celebration of the project.", "The comment offered only a very weak form of approval.", "The comment proved that the project had failed completely.", "The team was told that the project had won an award."], "a": 1, "exp": {"trans": "把志愿者历时六个月的修复项目说成“并非完全没有用”，让团队觉得这只是很勉强的赞扬。", "structure": "Calling the volunteers' six-month restoration project ‘not entirely useless’是整个动名词短语主语；struck是谓语；the team是宾语；as faint praise表示给团队留下何种印象。短语内部call A B：称A为B。", "other": "restoration 修复；entirely 完全；strike sb as sth 给某人以某种印象；approval 赞许。", "meaning": "faint praise并非赞扬完全不存在，而是肯定得很有限，甚至暗含保留意见。", "rest": "enthusiastic celebration表示热情赞颂，力度过强；had failed completely表示彻底失败，把微弱肯定改成全面否定；had won an award表示获奖，原文没有提供获奖事实。"}}], "point": [{"id": "legacy-miss-point", "source": "today", "skill": "miss the point / point", "target": "miss the point / point", "q": "The committee spent twenty minutes arguing about the font on the warning sign, while the real issue was whether the bridge was safe. They were clearly ___.", "o": ["missing the point", "making a point", "reaching the point", "pointing out"], "a": 0, "diag": {"1": "make a point 常表示“提出观点/特意强调”，这里强调的是没抓住真正问题。", "2": "reach the point 需要具体语境，如 reach the point where...，不能表达“没抓住重点”。", "3": "point out 通常后接宾语，表示“指出”；这里既不合结构也不合语义。"}, "exp": {"trans": "委员会花了二十分钟争论警示牌的字体，而真正的问题是这座桥是否安全。他们显然没有抓住重点。", "structure": "第一句：The committee（主语）+ spent（谓语）+ twenty minutes（宾语）；arguing...说明时间花在何事上。while连接对比；whether the bridge was safe作表语从句。第二句：They（主语）+ were missing（现在进行时谓语）+ the point（宾语）。", "other": "committee 委员会；warning sign 警示牌；issue 问题/争议点；safe 安全的。", "meaning": "miss the point = 没抓住重点、没理解关键。point 在这里是“要点/关键”，不是“节点”。", "rest": "B make a point=提出/强调一个观点；C reach the point=达到某个阶段/程度；D point out=指出某事。"}, "family": "point", "introduced": "2026-09-29", "budget": 35}, {"id": "point-waiting", "family": "point", "introduced": "2026-09-29", "target": "point / there is no point in doing", "skill": "point 熟词生义", "q": "With the last bus already gone, there was no point in waiting at the stop.\npoint 在这里最接近：", "o": ["联合会", "尖端", "分数", "意义、用处"], "a": 3, "exp": {"trans": "末班车已经开走了，继续在车站等也没有意义。", "structure": "主干：there was no point in waiting at the stop，是there be存在句。With the last bus already gone补充原因背景。简单句The last bus was already gone → 去掉was，用with + 名词 + 状态补语压缩。", "other": "last bus 末班车；already 已经；be gone 已经离开、不在了；bus stop 公交站。", "meaning": "there is no point in doing sth：做某事没有意义；point不是物理位置上的点。", "rest": "联合会常用federation/association，与句意无关。尖端可用the point of a needle，必须是具体物体的尖端。分数可说score three points，但这里不是计分语境。"}}], "remote": [], "nested": [{"id": "nested-shared-gate", "family": "nested", "introduced": "2026-09-29", "budget": 60, "target": "who 定语从句 / that 宾语从句", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "q": "Residents who discovered that the shared gate was unlocked called the caretaker.\n按“主句主语中心词 / who从句谓语 / 主句谓语”的顺序，哪组正确？", "o": ["Residents / discovered / called", "the shared gate / discovered / was", "Residents / was unlocked / discovered", "the caretaker / called / discovered"], "a": 0, "exp": {"trans": "发现公共大门没有锁上的住户给管理员打了电话。", "structure": "简单句①Residents called the caretaker. ②Residents discovered something. ③The shared gate was unlocked. → 把③接在discovered后：Residents discovered that the shared gate was unlocked. → 把重复的Residents换成who并嵌入①：Residents [who discovered [that the shared gate was unlocked]] called the caretaker。主句完整主语包含who从句，中心词是Residents。", "other": "resident 住户；shared 共用的；unlocked 没锁上的；caretaker 管理员。", "meaning": "发现这件事的是住户；没有锁上的是大门；打电话给管理员的还是住户。三个小句的主语和谓语不能串层。", "rest": "the shared gate只在that从句中作主语，不能升为主句主语。was unlocked属于that从句，discovered属于who从句；两者都不是主句谓语。the caretaker是called的宾语，不是发现大门未锁的人。"}}]}, "issues_used": [1, 2, 3, 4], "engine": 3};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
