<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下一轮定制复习 · 考研英语</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#3157d5;--accent2:#eef2ff;--good:#087443;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;--warn:#b54708;--warnbg:#fffaeb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:860px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.brand{font-size:21px;font-weight:900}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #1018280d}.target{display:inline-block;background:var(--accent2);color:#303f9f;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.q{font-size:18px;line-height:1.65;margin:16px 0;white-space:pre-line}.opts{display:grid;gap:9px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;cursor:pointer;line-height:1.5}.opt:hover{border-color:#aab7ff;background:#fafbff}.opt.correct{background:var(--goodbg);border-color:#6ce9a6}.opt.wrong{background:var(--badbg);border-color:#fda29b}.opt:disabled{cursor:default;color:inherit}.feedback{margin-top:12px;border-radius:12px;padding:11px 12px;line-height:1.55}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}.feedback.warn{background:var(--warnbg);color:var(--warn)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f5;color:#111827}.warn{background:var(--warnbg);color:var(--warn)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.exp{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.65;background:#fbfcfe}.exp b{display:block;margin-top:8px}.exp b:first-child{margin-top:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi strong{display:block;font-size:22px}.review-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.review-item .qmini{font-weight:800;margin-bottom:6px}.home{color:var(--accent);text-decoration:none;font-weight:800}
@media(max-width:650px){.app{padding:10px}.q{font-size:16px}.top{flex-direction:column}.summary{grid-template-columns:1fr 1fr 1fr}.btn{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="brand">下一轮定制 · 8题</div>
      <div class="sub">来源已打散：当天新点≤2题，其余来自昨天/近3天与更早历史错题；每次打开顺序随机。</div>
    </div>
    <a class="home" href="./">返回总训练站</a>
  </div>

  <div id="quiz" class="card">
    <div class="meta"><span class="target" id="target"></span><span class="sub" id="progress"></span></div>
    <div class="q" id="question"></div>
    <div class="opts" id="options"></div>
    <div id="feedback"></div>
    <div id="explain" class="exp hidden"></div>
    <div class="actions">
      <button class="btn secondary hidden" id="whyBtn">查看完整解析</button>
      <button class="btn primary hidden" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="result" class="card hidden">
    <h2 style="margin-top:0">本轮完成</h2>
    <div class="summary">
      <div class="kpi"><strong id="scoreKpi">0/8</strong><span class="sub">正确</span></div>
      <div class="kpi"><strong id="timeKpi">0s</strong><span class="sub">平均用时</span></div>
      <div class="kpi"><strong id="weakKpi">-</strong><span class="sub">最需回炉</span></div>
    </div>
    <div class="actions">
      <button class="btn warn" id="redoWrongBtn">① 只重做错题</button>
      <button class="btn secondary" id="viewWrongBtn">② 查看本轮错题与解析</button>
      <button class="btn secondary" id="redoAllBtn">③ 全部重做</button>
      <button class="btn primary" id="submitBtn">提交结果到 GitHub</button>
    </div>
  </div>

  <div id="wrongReview" class="card hidden" style="margin-top:14px">
    <div class="meta"><h3 style="margin:0">本轮错题与解析</h3><button class="btn secondary" id="closeReview">收起</button></div>
    <div id="wrongItems"></div>
  </div>
</div>

<script>
const BANK = [
{
id:"subject",source:"recent",skill:"be subject to / be subjected to",target:"be subject to / be subjected to",
q:"① The final grant amount is ___ approval by the university's finance office.\n② Before the coating was evaluated, the glass panels were ___ repeated salt-water spray for three days.",
o:["subject to / subjected to","subjected to / subject to","subject to / subject to","subjected to / subjected to"],a:0,
diag:{1:"把规则状态和被施加过程颠倒",2:"第二空强调实验处理中“被置于/经历”",3:"第一空是审批规则，不是动作过程"},
exp:{trans:"① 最终资助金额须经大学财务部门批准。② 在评估涂层前，玻璃板连续三天经受盐水喷雾处理。",structure:"① The final grant amount（主语）+ is（系动词）+ subject to approval（表语）。② the glass panels（主语）+ were subjected to（被动谓语）+ repeated salt-water spray。",other:"grant amount 资助金额；finance office 财务部门；coating 涂层；evaluate 评估。",meaning:"be subject to 强调规则/状态；be subjected to 强调被施加某过程。",rest:"其余三项都把状态和过程至少混错一处。"}
},
{
id:"even",source:"recent",skill:"even / ever / over",target:"even / ever / over",
q:"___ the last few years, the archive has become more popular than ___ before, and ___ students who rarely read history now visit it regularly.",
o:["Even / over / ever","Over / ever / even","Ever / even / over","Over / even / ever"],a:1,
diag:{0:"三个词的功能位置混乱",2:"Ever 不能表示一段时间范围",3:"第二空需要“曾经”，第三空需要“甚至”"},
exp:{trans:"在过去几年里，这个档案馆比以往任何时候都更受欢迎，甚至那些很少读历史的学生现在也会经常来访。",structure:"Over the last few years 是时间范围；more popular than ever before 是比较结构；even students... 表示“甚至……”。",other:"archive 档案馆/档案；regularly 经常地；rarely 很少；popular 受欢迎的。",meaning:"over=在一段时间内；ever=曾经/任何时候；even=甚至。",rest:"其他排列都会让至少一个位置的词性或语义不成立。"}
},
{
id:"account",source:"old",skill:"account 熟词生义",target:"account = 记述 / 叙述",
q:"The two witnesses gave sharply different accounts of what happened outside the station.\n这里 accounts 最准确的是：",
o:["银行账户","叙述、说法","账单","计算过程"],a:1,
diag:{0:"被最常见词义“账户”吸引",2:"bill 才是账单",3:"calculation 才是计算过程"},
exp:{trans:"两名目击者对车站外发生的事情给出了截然不同的叙述。",structure:"The two witnesses（主语）+ gave（谓语）+ different accounts（宾语）+ of what happened...（介词短语修饰 accounts）。",other:"witness 目击者；sharply different 截然不同；outside 在……外面；station 车站。",meaning:"account 作名词可表示“记述、叙述、说法”。",rest:"账户/账单/计算都不符合 witnesses gave ... of what happened 的语境。"}
},
{
id:"with",source:"old",skill:"with + 名词 + 后置成分",target:"with + 名词 + 后置成分",
q:"The hikers reached the shelter before dark, with their clothes soaked and their boots covered in mud.\nwith 后半部分在句中的作用最接近：",
o:["说明到达 shelter 的目的","补充说明到达时伴随的状态","表示和谁一起到达","引出一个新的独立主句"],a:1,
diag:{0:"这里不是目的关系",2:"with 不是“和某人一起”的普通伴随对象",3:"with 结构不是独立主句"},
exp:{trans:"徒步者在天黑前到达了避难所，当时他们的衣服已经湿透，靴子上也满是泥。",structure:"主干：The hikers reached the shelter before dark。with their clothes soaked / their boots covered in mud 是 with + 名词 + 过去分词，补充当时的伴随状态。原始简单句：Their clothes were soaked. Their boots were covered in mud. → 压缩为 with 复合结构。",other:"hiker 徒步者；shelter 避难所；soaked 湿透的；mud 泥。",meaning:"with + 名词 + 后置成分常补充状态、背景或伴随信息。",rest:"A 不是目的；C 不是“和……一起”的对象；D 不是独立主句。"}
},
{
id:"whom",source:"old",skill:"介词 + whom",target:"preposition + whom",
q:"The journalist interviewed several volunteers. She had worked with the volunteers during the flood-relief campaign.\n合并最自然的是：",
o:["The journalist interviewed several volunteers with whom she had worked during the flood-relief campaign.","The journalist interviewed several volunteers whom with she had worked during the flood-relief campaign.","The journalist interviewed several volunteers with that she had worked during the flood-relief campaign.","The journalist interviewed several volunteers, whom she had worked with them during the flood-relief campaign."],a:0,
diag:{1:"介词位置错误",2:"介词后不能用 that",3:"whom 已经代替 volunteers，再加 them 重复"},
exp:{trans:"这名记者采访了几位志愿者，她曾在抗洪救灾行动中和这些志愿者一起工作过。",structure:"原始简单句：She had worked with the volunteers. → the volunteers 换成 whom → she had worked with whom → 正式结构把介词前置：with whom she had worked。",other:"journalist 记者；volunteer 志愿者；flood-relief 抗洪救灾；campaign 行动/活动。",meaning:"介词 + whom 用于人；介词来自原简单句里的固定搭配 work with sb。",rest:"B 介词位置错；C 介词后不能用 that；D whom 与 them 重复。"}
},
{
id:"lex",source:"old",skill:"原词复现 vs 明确回指",target:"明确回指 > 原词重复",
q:"段A：The new ticket system produced several unexpected complaints from elderly passengers.\n段B：These objections led the operator to add more staff at the entrance.\n段C：Another ticket system used in a neighboring city reduced passenger complaints.\n\n哪一个衔接最强？",
o:["A → C","C → A","A → B","B → C"],a:2,
diag:{0:"被 ticket system / complaints 的表面重复吸引，但 C 已换成 another system",1:"缺乏明确回指",3:"B 后没有足够强的指代把它连到 C"},
exp:{trans:"A：新的售票系统引发了老年乘客的几项意外投诉。B：这些反对意见促使运营方在入口处增加工作人员。C：邻市使用的另一套售票系统减少了乘客投诉。",structure:"A 先出现 complaints；B 用 These objections 进行同义回指。C 虽然重复 ticket system/complaints，但引入 another system，换了对象。",other:"complaint 投诉；objection 反对意见；operator 运营方；neighboring 邻近的。",meaning:"明确回指比原词复现更强。",rest:"A→C 只是表面词汇重复；其余顺序缺乏可验证的衔接关系。"}
},
{
id:"tone",source:"today",skill:"tone 熟词生义",target:"tone = 肌张力",
q:"The medication reduced muscle tone in the patient's legs, making movement temporarily more difficult.\n这里 reduced muscle tone 最接近：",
o:["降低了说话语气","降低了肌肉张力","降低了声音音调","降低了皮肤色调"],a:1,
diag:{0:"只记住 tone=语气，没有看 muscle 搭配",2:"声音语境才是音调",3:"颜色/视觉语境才是色调"},
exp:{trans:"这种药物降低了患者腿部的肌张力，使得活动暂时变得更加困难。",structure:"The medication（主语）+ reduced（谓语）+ muscle tone（宾语）；making... 是结果状语。",other:"medication 药物；patient 患者；temporarily 暂时地；movement 活动。",meaning:"muscle tone = 肌张力。",rest:"tone 的确可表示语气、音调、色调，但和 muscle 搭配时词义被限定。"}
},
{
id:"conceivably",source:"today",skill:"conceivably",target:"conceivably",
q:"With a different route, the delivery could conceivably arrive before noon, although no one can guarantee it.\n这里 conceivably 的语气最准确的是：",
o:["几乎肯定","有这种可能，但不能确定","表面上看起来如此","故意这样做"],a:1,
diag:{0:"把弱可能性误读成强确定性",2:"superficially 才是表面上",3:"deliberately 才是故意"},
exp:{trans:"如果换一条路线，这批货有可能在中午前送到，不过没人能保证。",structure:"主干：the delivery could arrive before noon；conceivably 修饰整个可能性判断；although 引出让步说明“不能保证”。",other:"route 路线；delivery 运送/货物；guarantee 保证；before noon 中午前。",meaning:"conceivably = 可以设想地、有可能地，语气弱于 probably/certainly。",rest:"A 语气过强；C、D 词义不符。"}
}
];

const RETRY = {
subject:{q:"① The timetable is ___ change if severe weather is forecast.\n② The prototype was ___ continuous vibration for six hours.",o:["subject to / subjected to","subjected to / subject to","subject to / subject to","subjected to / subjected to"],a:0},
even:{q:"___ the past month, no speaker has ___ received such a long applause, and ___ the technicians came out to listen.",o:["Even / over / ever","Over / ever / even","Ever / even / over","Over / even / ever"],a:1},
account:{q:"Her account of the accident was later checked against the camera footage.\naccount 最接近：",o:["账户","叙述","账单","预算"],a:1},
with:{q:"The meeting ended early, with several key questions still unanswered.\nwith 结构主要表示：",o:["目的","伴随状态","原因从句","独立主句"],a:1},
whom:{q:"The professor thanked the researchers. She had collaborated with the researchers for years.\n最自然合并：",o:["The professor thanked the researchers with whom she had collaborated for years.","The professor thanked the researchers whom with she had collaborated for years.","The professor thanked the researchers with that she had collaborated for years.","The professor thanked the researchers, whom she had collaborated with them for years."],a:0},
lex:{q:"段A：The policy caused several unexpected delays.\n段B：These setbacks forced the agency to revise its timetable.\n段C：Another policy reduced delays elsewhere.\n最强衔接：",o:["A → C","C → A","A → B","B → C"],a:2},
tone:{q:"Regular stretching can reduce excessive muscle tone.\ntone 在这里是：",o:["语气","肌张力","音调","色调"],a:1},
conceivably:{q:"The repair could conceivably be finished tonight, but that remains uncertain.\nconceivably = ?",o:["必然","有可能","表面上","故意"],a:1}
};

function buildOrder(){
  for(let t=0;t<40;t++){
    const a=BANK.slice().sort(()=>Math.random()-.5);
    let ok=true;
    for(let i=1;i<a.length;i++){
      if(a[i].source==="today" && a[i-1].source==="today"){ok=false;break}
    }
    if(ok)return a;
  }
  return BANK.slice();
}
let order = buildOrder();
let state={answers:[],mode:"main",queue:order,index:0};

function E(id){return document.getElementById(id)}
function expHtml(q){return "<b>1.【整句翻译】</b>"+q.exp.trans+"<b>2.【句子主干】</b>"+q.exp.structure+"<b>3.【其他词汇】</b>"+q.exp.other+"<b>4.【本题词义】</b>"+q.exp.meaning+"<b>5.【其余选项】</b>"+q.exp.rest}
function render(){
  if(state.index>=state.queue.length){finish();return}
  const q=state.queue[state.index];state.qStart=Date.now();
  E("target").textContent="【本题目标："+q.target+"】";E("progress").textContent=(state.index+1)+" / "+state.queue.length;E("question").textContent=q.q;
  E("options").innerHTML="";E("feedback").innerHTML="";E("feedback").className="";E("explain").classList.add("hidden");E("whyBtn").classList.add("hidden");E("nextBtn").classList.add("hidden");
  q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+["A","B","C","D"][i]+".</b> "+t;b.onclick=()=>answer(i);E("options").appendChild(b)})
}
function answer(pick){
  const q=state.queue[state.index],ms=Date.now()-state.qStart,ok=pick===q.a;
  state.answers.push({id:q.id,source:q.source,skill:q.skill,target:q.target,pick,answer:q.a,ok,ms,mode:state.mode});
  [...document.querySelectorAll(".opt")].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");if(i===pick&&!ok)b.classList.add("wrong")});
  if(ok&&ms<=22000){E("feedback").className="feedback good";E("feedback").textContent="✓ 正确。"}
  else if(ok){E("feedback").className="feedback warn";E("feedback").textContent="✓ 正确，但用了 "+(ms/1000).toFixed(1)+" 秒，仍需间隔复习。"}
  else{E("feedback").className="feedback bad";E("feedback").innerHTML="✗ 这次更像是：<b>"+(q.diag[pick]||"判断路径需要调整")+"</b>。"}
  E("whyBtn").classList.remove("hidden");E("nextBtn").classList.remove("hidden")
}
E("whyBtn").onclick=()=>{const q=state.queue[state.index];E("explain").innerHTML=expHtml(q);E("explain").classList.remove("hidden")};
E("nextBtn").onclick=()=>{state.index++;render()};

function finish(){
  E("quiz").classList.add("hidden");E("result").classList.remove("hidden");
  const arr=state.answers.filter(x=>x.mode===state.mode),correct=arr.filter(x=>x.ok).length,avg=arr.length?Math.round(arr.reduce((a,b)=>a+b.ms,0)/arr.length/1000):0;
  E("scoreKpi").textContent=correct+"/"+arr.length;E("timeKpi").textContent=avg+"s";
  const bad=arr.filter(x=>!x.ok||x.ms>22000);E("weakKpi").textContent=bad[0]?bad[0].skill:"稳定";
}
E("viewWrongBtn").onclick=()=>{
  const arr=state.answers.filter(x=>x.mode==="main"&&!x.ok);
  E("wrongItems").innerHTML=arr.length?arr.map(r=>{const q=BANK.find(x=>x.id===r.id);return "<div class='review-item'><div class='qmini'>"+q.target+"</div><div class='sub'>你选 "+["A","B","C","D"][r.pick]+"，正确 "+["A","B","C","D"][r.answer]+" · "+(r.ms/1000).toFixed(1)+"s</div><div class='exp'>"+expHtml(q)+"</div></div>"}).join(""):"<div class='sub'>本轮无错题。</div>";
  E("wrongReview").classList.remove("hidden")
};
E("closeReview").onclick=()=>E("wrongReview").classList.add("hidden");
E("redoWrongBtn").onclick=()=>{
  const wrong=state.answers.filter(x=>x.mode==="main"&&!x.ok);if(!wrong.length){alert("本轮没有错题。");return}
  const qs=wrong.map(r=>{const base=BANK.find(x=>x.id===r.id),re=RETRY[r.id];return {...base,id:"retry-"+r.id,q:re.q,o:re.o,a:re.a}});
  state.mode="retry";state.queue=qs.sort(()=>Math.random()-.5);state.index=0;E("result").classList.add("hidden");E("wrongReview").classList.add("hidden");E("quiz").classList.remove("hidden");render()
};
E("redoAllBtn").onclick=()=>{state={answers:[],mode:"main",queue:buildOrder(),index:0};E("result").classList.add("hidden");E("wrongReview").classList.add("hidden");E("quiz").classList.remove("hidden");render()};
function makeReport(){
  const arr=state.answers.filter(x=>x.mode==="main"),correct=arr.filter(x=>x.ok).length;
  const lines=["考研英语混合间隔训练","题数 "+arr.length+"｜正确 "+correct+"｜正确率 "+(arr.length?Math.round(correct/arr.length*100):0)+"%"];
  if(arr.length)lines.push("平均用时 "+Math.round(arr.reduce((a,b)=>a+b.ms,0)/arr.length/1000)+"s");
  lines.push("","【逐题】");arr.forEach((x,i)=>lines.push("Q"+(i+1)+" ["+x.source+"] "+x.skill+"：选"+["A","B","C","D"][x.pick]+"→正确"+["A","B","C","D"][x.answer]+"；"+(x.ok?"正确":"错误")+"；"+(x.ms/1000).toFixed(1)+"s"));
  return lines.join("\n")
}
E("submitBtn").onclick=()=>{const title="[TRAINING_RESULT] 混合间隔训练 "+new Date().toISOString().slice(0,10)+" "+Date.now();const body="<!-- kaoyan-english-training-result -->\n"+makeReport();window.open("https://github.com/pkppkqbobs/kaoyan-english-trainer/issues/new?title="+encodeURIComponent(title)+"&body="+encodeURIComponent(body),"_blank","noopener,noreferrer")};
render();
</script>
</body>
</html>
