<script>window.REVIEW_DATA={"date": "2026-11-17", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "r18t3-high-cost-boundary", "family": "costs-effort-intensity", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "at a high cost与regardless of consequences分开", "skill": "at a high cost与regardless of consequences分开", "q": "A restoration was completed at a high cost. The report gives the final expense but says nothing about what losses the organizers would have accepted. What can be concluded?", "o": ["The expense was substantial; unlimited acceptance is not stated.", "The organizers promised to accept every possible harmful result.", "The organizers were unwilling to make any serious financial effort.", "The restoration would have continued regardless of the consequences."], "a": 0, "origin_session": "2026-11-16-2018-text3", "exp": {"trans": "修复以高昂代价完成。报告给出最终费用，却没说组织者愿意接受哪些损失。能得出什么？", "structure": "at a high cost描述已发生的代价大小；would have accepted是报告未提供的条件性态度。", "other": "substantial相当大的；expense费用。", "meaning": "高昂代价不等于无论什么代价都接受；不能把描述性成本事实改成at all costs式的无条件承诺。", "rest": "every possible harmful result和regardless都补加无限接受的承诺；unwilling...any effort既无依据又与高额支出不符。"}, "context_id": "completed-restoration-large-expense-not-unlimited-commitment"}, {"id": "sentence-link-course-participation-a", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "表面便利 vs 参与不足", "skill": "讽刺语气 + 对比过渡", "q": "前文：The online course called itself interactive, but students could do little more than click Next after each recorded lecture. The easiest part was operating the screen; the hardest was staying awake.\n【空缺】\n后文：What would genuine participation require? Students could challenge arguments and revise one another's work.\n哪句最适合？", "o": ["The simple controls already give learners an active role in shaping the course.", "A redesign could replace passive viewing with a real role in shaping discussion.", "Recorded lectures also let learners choose when to watch the same presentation.", "Adding subtitles would make the recorded lectures easier for learners to follow."], "a": 1, "exp": {"trans": "前文用带讽刺性的说法指出所谓互动课仍只让学生被动点下一页；正确句转向让学生真正贡献观点的另一种课程；后文追问真正参与需要什么。", "structure": "but建立宣称interactive与实际只能click Next的矛盾；the hardest was staying awake暗示被动乏味。正确句用replace passive viewing with a real role in shaping discussion提出另一模式，后文再具体说明质疑论点与互相修改。", "other": "interactive 互动的；lecture 讲座/课；challenge an argument 质疑论点；revise 修订。", "meaning": "看到操作很简单，不能自动判为作者赞扬。应结合转折、夸张和后文提问判断作者真正评价：被动消费不足，主动参与才是重点。", "rest": "操作简单不等于能参与建构讨论；自选观看时间和字幕提升观看便利，却没有补上后文要求的质疑论点、互评修改等主动参与。"}, "context_id": "context:sentence-link-course-participation-a"}, {"id": "belief-negation-online-bookings-a", "family": "belief-negation-clause", "introduced": "2026-10-15", "published_on": "2026-10-15", "budget": 55, "target": "assume that ... did not / 被批评的信念", "skill": "宾语从句与否定范围", "q": "A restaurant owner rebuked an apprentice for assuming that the online booking page did not influence walk-in customers. Surveys showed that many visitors discovered the restaurant through the page. What did the apprentice mistakenly believe?", "o": ["The owner had avoided creating an online booking page.", "Walk-in customers were unaffected by the booking page.", "Customers preferred online orders to meals at the restaurant.", "The owner placed excessive importance on online advertising."], "a": 1, "exp": {"trans": "老板批评学徒，因为学徒以为网上订位页面不影响未经预约直接到店的人；调查却显示不少访客就是经此页面了解餐厅。", "structure": "rebuked an apprentice为主干，for assuming that...说明批评原因，that后的did not influence是学徒持有的错误判断。", "other": "rebuke 责备；apprentice 学徒；walk-in customer 无预约上门顾客；reservation 预约。", "meaning": "assume/imagine that表示以为、认为；否定词位于从句中，决定被批评的是低估作用而非对网络的痴迷。", "rest": "老板未建网页和顾客点餐偏好均无证据；把老板说成过分重视广告，也没有回答学徒错误地否认网页对临时到店顾客的影响。"}, "context_id": "context:belief-negation-online-bookings-a"}, {"id": "relative-borrowed-ladder", "family": "relative", "introduced": null, "budget": 60, "target": "preposition + whom", "skill": "介词 + whom", "q": "The plumber thanked the neighbour. He had borrowed a ladder from the neighbour.\n哪句合并正确？", "o": ["The plumber thanked the neighbour from that he had borrowed a ladder.", "The plumber thanked the neighbour whom from he had borrowed a ladder.", "The plumber thanked the neighbour from whom he had borrowed a ladder.", "The plumber thanked the neighbour whom he had borrowed a ladder from him."], "a": 2, "exp": {"trans": "水管工感谢了那位借梯子给他的邻居。", "structure": "原始简单句：He had borrowed a ladder from the neighbour. → 用whom替代重复的the neighbour：the neighbour whom he had borrowed a ladder from → 把from前置：the neighbour from whom he had borrowed a ladder。外层主干是The plumber + thanked + the neighbour，后接修饰neighbour的定语从句。", "other": "plumber 水管工；neighbour 邻居；ladder 梯子；borrow A from B 从B那里借来A。", "meaning": "from不是临时猜出来的，来自原句borrow...from...；先行词是人，介词后用whom。", "rest": "from that：关系代词that不能直接置于介词后。whom from he：介词前置时必须是from whom，不是whom from。from him：关系代词whom已经代替该人，再保留him造成重复。"}, "context_id": "context:relative-borrowed-ladder"}, {"id": "r18t3-onlywhen-room", "family": "only-when-necessary", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "only when：必要条件不是充分保证", "skill": "only when：必要条件不是充分保证", "q": "A rehearsal room is unlocked only when a supervisor is present. Even then it may remain locked for maintenance. Which inference follows?", "o": ["A supervisor's arrival always guarantees that the room is unlocked.", "Without a supervisor, the room is not unlocked under this rule.", "Maintenance requires the supervisor to leave before unlocking.", "An unlocked room proves that maintenance has never occurred."], "a": 1, "origin_session": "2026-11-16-2018-text3", "exp": {"trans": "排练室只有在主管在场时才开锁；即便主管在场，维修也可能使房间继续锁住。能推出什么？", "structure": "only when P才Q：Q意味着P是必要条件；P不自动足以推出Q。题干另给维修限制确认这一点。", "other": "supervisor主管；maintenance维修。", "meaning": "没有主管不能按该规则开锁；主管到场并不保证开锁。区分必要条件与充分条件，不能把only删掉。", "rest": "always guarantees反转蕴含方向；requires...leave虚构维修规则；never occurred从当前开锁推断全部过去。"}, "context_id": "rehearsal-room-supervisor-necessary-not-sufficient"}, {"id": "evidence-concrete-freeze-b", "family": "test-object-scope", "introduced": "2026-10-08", "published_on": "2026-10-08", "budget": 55, "target": "研究测试对象 / 后续应用障碍", "skill": "定位题干关系而非重复词", "q": "A field study is designed to measure how well recycled concrete withstands repeated freezing. Later, the report notes that inconsistent municipal building codes could slow its adoption. Which issue does the study itself investigate?", "o": ["The durability of the material under freezing conditions.", "The political motives behind local building codes.", "Whether every city will adopt identical construction rules.", "The cost of enforcing municipal regulations."], "a": 0, "exp": {"trans": "实地研究旨在测量再生混凝土反复受冻后的耐久性；报告后面提到市政建筑规范不一致可能阻碍推广。研究本身调查的是材料耐冻性能。", "structure": "A field study + is designed + to measure...，how well从句指出测量指标；Later标出随后讨论的应用障碍，不会追溯改变研究对象。", "other": "recycled concrete 再生混凝土；withstand 承受；municipal 市政的；adoption 采用、推广。", "meaning": "研究/案件究竟test、measure、assess什么，要以动词支配的内容为准。相邻句里的‘法规不统一’是相关后果或障碍，不等于研究问题本身。", "rest": "政治动机没有被调查；所有城市采用相同规则只是可能的政策议题；执法成本没有数据，均不能替代耐冻性这一明确测量目标。"}, "context_id": "context:evidence-concrete-freeze-b"}, {"id": "dnt-vendors-messages-b", "family": "dnt-actor-boundary", "target": "跨句识别负责执行的主体", "introduced": "2026-10-16", "published_on": "2026-10-16", "budget": 55, "skill": "跨句识别负责执行的主体", "q": "A council built a website where residents could ask outside contractors to stop marketing messages. The contractors promised to comply. Who is responsible for changing the outgoing messages?", "o": ["The outside contractors.", "The residents who used the form.", "The council members who created the site.", "The unrelated firms hosting the city's internet connection."], "a": 0, "exp": {"trans": "市议会提供请求渠道，居民提出停止消息的要求，但真正承诺停止发送营销信息的是外部承包商。", "structure": "第一句council built引出平台建设者；第二句The contractors promised to comply明确承诺者和履行请求的执行方。", "other": "council市议会；contractor承包商；comply遵守；marketing message营销信息。", "meaning": "指代分析不能只看上文最近被提到的组织，还要核对承诺、执行和发送行为对应的真实主语。", "rest": "居民是请求方，市议会是平台建设方；互联网连接服务商没有参与这项承诺，也没有文本证据表明它能停止消息。"}, "context_id": "context:dnt-vendors-messages-b"}, {"id": "r18t2-role-route-evidence", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "改选证据强度：语义证据优于词面重合", "skill": "改选证据强度：语义证据优于词面重合", "q": "An orienteering club gives walkers a \"route card\" on which they mark completed checkpoints. At meetings, members exchange views about route difficulty. A reader first selects \"recording progress\", then prefers \"exchanging views on route cards\" for its repeated words. Which detail should control the choice?", "o": ["Walkers put checkpoint marks on their cards during the walk.", "The meetings discuss routes using a closely related noun.", "The two answer choices contain similar numbers of words.", "The later answer came to mind after reading the text again."], "a": 0, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "定向活动给行走者卡片，用来标记已通过的检查点；会议另讨论路线难度。读者因重复词而想把记录进度改成交流路线卡观点。应以哪条细节判断？", "structure": "on which引出卡片上的具体动作；at meetings转入另一场合。要核对谁在何处对什么做了什么，而非只看route重复。", "other": "orienteering定向活动；checkpoint检查点；progress进度。", "meaning": "检查点标记直接支持记录完成进度；会议存在并不证明卡片是交换观点的讨论对象。初选受支持，是因为具体证据，不是因为它更早出现。", "rest": "closely related noun只证明词汇相关；numbers of words是形式线索；later...again只是判断发生得晚，都没有推翻卡片用于记录这一语义证据。"}, "context_id": "route-card-checkpoint-recording-versus-route-discussion-and-revision"}], "retry": {"costs-effort-intensity": [{"id": "r18t3-effort-theatre", "family": "costs-effort-intensity", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "尽力与不惜代价：保留原文限制", "skill": "尽力与不惜代价：保留原文限制", "q": "A theatre team promises to spare no effort in rebuilding a damaged set, but will abandon the plan if the hall cannot be made safe. Which summary preserves the commitment?", "o": ["The team must rebuild the set regardless of every consequence.", "The team will make every effort within the stated safety limit.", "The team will attempt repairs only if no serious work is needed.", "The team treats its rebuilding goal as more important than safety."], "a": 1, "origin_session": "2026-11-16-2018-text3", "exp": {"trans": "剧团承诺尽全力重建布景，但若礼堂不能达到安全条件就放弃。哪种概括保留了这一承诺？", "structure": "spare no effort强调努力程度；but后的条件限制同样有效，不能被前半句抹去。", "other": "set布景；abandon放弃；commitment承诺。", "meaning": "尽全力不自动等于不计后果。这里有明确安全限制，改写成at all costs或regardless of every consequence会超出原文。", "rest": "regardless与more important than safety删除安全限制；no serious work把尽力反成只在不费力时才做。"}, "context_id": "theatre-set-restoration-effort-with-explicit-safety-limit"}, {"id": "r18t3-costs-competition", "family": "costs-effort-intensity", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "at any cost / at all costs的强度", "skill": "at any cost / at all costs的强度", "q": "In a fictional competition, a captain says, \"We must win at any cost.\" What strength does the phrase add to the statement?", "o": ["Winning is desirable only while no extra expense is required.", "Winning has already required a large but fixed payment.", "Winning should be pursued whatever the price or difficulty.", "Winning is guaranteed whenever the team makes a serious effort."], "a": 2, "origin_session": "2026-11-16-2018-text3", "exp": {"trans": "在一个虚构比赛中，队长说必须不惜任何代价取胜。这个短语增加了什么强度？", "structure": "at any cost与at all costs为惯用近义表达，限定追求目标时接受代价的态度，而不是宣布结果已经发生。", "other": "pursue追求；desirable值得追求的。", "meaning": "短语突出无论代价或困难的强烈取向，不只是努力程度；这类表达也可能有修辞色彩，不能因此保证一定成功。", "rest": "no extra expense反向增加省钱限制；already...fixed payment混成已付高价；guaranteed把强烈意愿误成结果必然实现。"}, "context_id": "competition-captain-unconditional-price-versus-effort-and-guarantee"}, {"id": "r18t3-under-no-circumstances", "family": "costs-effort-intensity", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "under no circumstances：强度与适用对象", "skill": "under no circumstances：强度与适用对象", "q": "A display rule states, \"Under no circumstances may the original letter leave its case; staff may handle copies.\" Which statement preserves the rule?", "o": ["Staff may never touch any copy or original item on display.", "The original may leave its case when a visitor pays extra.", "Copies must remain locked away just like the original letter.", "The original must stay in its case, while copies may be handled."], "a": 3, "origin_session": "2026-11-16-2018-text3", "exp": {"trans": "展陈规则说原信件在任何情况下都不得离开盒子，工作人员可拿取副本。哪句保留规则？", "structure": "Under no circumstances的绝对限制指向original letter；分号后明确给copies不同权限。", "other": "case陈列盒；original原件；copy副本。", "meaning": "强措辞并非一律错误：原文明确如此规定且对象范围一致时，应保留强度；不能扩大到所有副本。", "rest": "never...any copy与copies locked扩大限制对象；pays extra增加原文没有的例外。"}, "context_id": "display-original-letter-absolute-rule-with-copy-exception"}], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-parallel-a", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "Not surprisingly / Equally unsurprisingly", "skill": "排序题并列递进标记", "budget": 50, "q": "段落甲结尾：Not surprisingly, nearly half of the applicants withdraw before the final interview.\n下面哪个段首与它的衔接最强？", "o": ["Equally unsurprisingly, few of the remaining applicants receive an offer.", "By contrast, the final interviews take place in the company's new building.", "For example, managers from several departments attend the final interview.", "In conclusion, a final interview is unnecessary for applicants who remain."], "a": 0, "exp": {"trans": "甲段说“不出所料，近一半申请者在终面前退出”。最强衔接是：“同样不足为奇的是，留下的人中也只有很少一部分收到录用。”", "structure": "Not surprisingly先给出一个“并不意外”的结果；Equally unsurprisingly显式要求前面已经有一个同类判断，再补第二个并列结果。两个副词短语构成明显篇章钩子。", "other": "withdraw 退出；final interview 终面；a small share 少部分；receive an offer 获得录用。", "meaning": "Equally / similarly / also 等段首词常要求前文存在可并列对象。排序题中这种平行措辞比泛泛的主题相似更可靠。", "rest": "换到面试地点没有形成真正对立；经理参会不是申请者退出的例子；也不能从退出比例推出剩余申请者无需面试。平行标记与申请者筛选链共同支持承接。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-parallel-a"}, {"id": "paragraph-order-discourse-conclusion-b", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "concludes / 收束段识别", "skill": "排序题结论信号", "budget": 50, "q": "一篇先分析家电过早报废、后提出改进办法的文章，有一候选段写道：After examining the figures, Dr Patel sums up her proposal: shared repair services could help residents keep appliances longer. 段末又说：Whether enough households will join, however, remains an open question.\n这一段最适合放在哪里？", "o": ["全文开头，用来首次介绍Dr Patel", "问题分析展开之前", "全文结尾附近，作为总结和改革建议", "只能放在具体数据段之前"], "a": 2, "exp": {"trans": "考察数据后，Patel博士总结自己的建议：共享维修服务或许能让居民更长久地使用电器。但是否有足够多家庭参与，仍是未决问题。这段最适合放在结尾附近。", "structure": "After examining the figures回看前文数据；Dr Patel + sums up + her proposal明确给出总结动作。末句Whether...will join作主语，remains...为谓语部分，以未决问题收束。", "other": "sum up 总结；shared repair service 共享维修服务；appliance 家电；household 家庭；open question 未决问题。", "meaning": "总结建议与回顾数据、开放结尾合起来支持尾段位置；单独出现concludes或sum up并不能证明必为全文最后一段。", "rest": "首次介绍人物不能解释已分析过数据；在问题分析前放总结建议与给定结构不合；“只能放在数据段之前”更与After examining the figures相反。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-conclusion-b"}, {"id": "paragraph-discourse-ticket-deposits", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 50, "target": "段尾问题 / 原因解释", "skill": "排序题并列递进标记", "q": "前段：The theatre sold every seat at the advertised price. Yet the deposits in its bank account were smaller than the value of tickets sold. The manager began tracing the gap between bookings and payments.\n哪个后段最能推进这一问题？", "o": ["Audience surveys ranked music above scenery when asking about favourite parts of the performance.", "The booking agency deducted its service fees before forwarding the remaining money to the theatre.", "The theatre had used the same stage for years, although its audience changed with each production.", "Rehearsals ended later than planned, so actors sometimes travelled home together."], "a": 1, "exp": {"trans": "剧院按宣传价卖出了所有座位，但银行入账小于售票总额。经理追查订票与收到款项之间的差额。订票代理转款之前先扣除服务费，最直接解释这个差额。", "structure": "The theatre + sold + every seat。deposits + were smaller than + the value of tickets sold是金额比较。正确后段中The booking agency + deducted + service fees；before forwarding说明扣款发生在剧院收到钱之前。", "other": "deposit 入账款；advertised price 宣传价格；deduct 扣除；forward money 转款。", "meaning": "没有One reason或Equally等显眼连接词，也能由段尾的收款差额锁定后段的扣费机制。这是问题→原因，不是看见theatre或audience就接同主题段。证据来自金额和交易阶段，不是一个单词。", "rest": "Audience surveys解释演出偏好，未说明钱款差额；same stage介绍场地历史，未接收款链；rehearsals和共同回家是演出活动信息，不解释代理转款前少了什么。"}, "context_id": "context:paragraph-discourse-ticket-deposits"}, {"id": "sentence-link-museum-experiment-b", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 65, "target": "单向展示→反向参与→后文设问", "skill": "双向篇章钩子", "q": "前文：At the old science museum, visitors watched a machine demonstrate each experiment. The most demanding thing they could do was press the Start button.\n【空缺】\n后文：What counts as taking part in an experiment? Visitors must be able to change a variable and compare the results.\n哪一句最适合？", "o": ["Repairs to the building could give the passive displays a more attractive setting.", "Simpler controls could help more visitors watch the same machine demonstrations.", "More detailed labels could explain the inventors behind the museum's machines.", "A redesign could replace watching demonstrations with carrying out one's own tests."], "a": 3, "exp": {"trans": "旧科技馆由机器单向演示，观众几乎只能按开始按钮。正确句引出新展览如何扭转这种被动观看，让观众亲自试验；后文再问什么才是真正参与实验。", "structure": "前文visitors watched与could do ... press Start显示参与程度低；正确句replace watching demonstrations with carrying out one’s own tests对比观看与亲自实验，后文change a variable和compare the results说明这种参与如何实现。", "other": "demanding 费力的；demonstration 演示；variable 变量；carry out a test 进行试验。", "meaning": "最有力的证据是双向：反转被动的安排承接前文，主动测试又引出后文讨论。‘最难任务只是按按钮’在语境中揭示参与不足，不是对设备的夸赞。", "rest": "场馆外观、观看操作和发明者标签仍把参观者放在观看或接收信息的位置；只有亲自测试自然引出后文改变变量、比较结果的参与标准。"}, "context_id": "context:sentence-link-museum-experiment-b"}, {"id": "pb13-library-joint-grants-a", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-library-joint-grants-a", "target": "new funding mechanism / That consequence / topical two-group distractor", "skill": "制度改革先说明执行机制，再由That引出合作结果", "q": "A public library will stop funding children's and adult literacy programs through entirely separate budgets. Officials stress that the reform should strengthen both. [BLANK] That should produce more projects serving whole families, rather than two unrelated groups. Which fits?", "o": ["The new process will require both programs to design projects together.", "Regional libraries have published more reports about literacy this year.", "Some employees focus on adult readers, while others teach children.", "The board will create separate committees for each age group."], "a": 0, "exp": {"trans": "图书馆计划取消儿童和成人识字项目完全分立的预算。改革目标是同时加强两者。随后要解释两项目如何一起设计方案，这才能使服务整个家庭的合作项目增加。", "structure": "That回指空格中描述的具体做法；new process...design projects together才会自然导致projects serving whole families。两个研究群体的存在是话题背景，不是合作机制。", "other": "literacy 读写能力；entirely separate 完全分开的；joint project 联合项目；committee 委员会。", "meaning": "topic match≠discourse link：后句That should produce...是结果句，前句需要明确的行动或机制。如果只描述两个群体，读起来相关却没有形成因果链。", "rest": "发表报告不一定促进合作；成人/儿童分工只描述现状；继续成立独立委员会甚至背离整合改革的目标。"}}, {"id": "pb13-museum-team-proposals-b", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-museum-team-proposals-b", "target": "policy integration / mechanism / This change consequence", "skill": "空前改革目标与空后合作效果需要中间实施步骤", "q": "A museum plans to replace isolated conservation and education grants with a shared application process. Its directors say neither department will lose support. [BLANK] This change could generate exhibitions linking research and visitor experience. Which fits?", "o": ["The museum has recently seen a sharp increase in visitor attendance.", "Staff will evaluate proposals jointly and choose teams to collaborate.", "The departments have long published very different research reports.", "The museum will divide each grant into two fixed independent parts."], "a": 1, "exp": {"trans": "博物馆将把保护和教育研究的独立资助改成联合申请。管理层说两部门都不会失去支持。空格要解释联合评审并选择合作团队，才能顺接‘这一变化会产生连接研究与观众体验的展览’。", "structure": "空格前提供改革背景和意图；This change could generate...给出预期效果。中间需要能产生该效果的具体协作措施，而非笼统主题描述。", "other": "conservation 保护、文物修复；grant 资助；jointly 联合地；exhibition 展览。", "meaning": "要核实桥接是否构成‘政策→机制→结果’链条，不能因选项也谈博物馆或部门就草率接受。", "rest": "游客增加和以往报告差异只是主题信息；再把资金硬分成两部分反而违背联合申请改革。"}}, {"id": "paragraph-discourse-audit-method-before-cases", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-27", "target": "说明与例证的层级", "skill": "说明与例证的层级", "budget": 65, "q": "An energy guide first explains that meter logs locate periods of high demand. A paragraph about equipment inspections follows. The next two paragraphs describe a bakery and a warehouse that combined logs with inspections. What is the role of the inspections paragraph?", "o": ["It completes the methods that the later cases apply.", "It summarizes the outcomes reported in the later cases.", "It gives a third case after the bakery and warehouse.", "It withdraws the claim that meter logs can be useful."], "a": 0, "exp": {"trans": "能源指南先解释用电表日志定位高需求时段，再介绍设备检查；后面两个案例同时使用日志和检查。检查段是在补齐随后案例会应用的方法。", "structure": "first、follows、next交代段落顺序；combined logs with inspections说明两个案例同时依赖前面两种方法，不是只应用第一段的方法。", "other": "meter log 电表记录；equipment inspection 设备检查；high demand 高需求；apply 应用。", "meaning": "一个方法段结束，不代表下一段必须马上举例。要检查后面案例需要哪些方法说明，再分清并列方法与两则应用案例的层级。", "rest": "总结后文结果需要结果性内容，检查方法本身不能当作结果总结；它位于两案例前也不是第三案例；案例同时使用日志，并未撤回日志有用的判断。"}, "context_id": "context:paragraph-discourse-audit-method-before-cases"}, {"id": "pb17-seed-label-link", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "同关键词不等于篇章连接", "skill": "同关键词不等于篇章连接", "q": "Paragraph P: The seed collection has two packets called \"winter bean\". Records show that they came from different valleys and need different storage temperatures. Which paragraph should follow to address the problem just identified?", "o": ["Winter beans also appear in recipes collected from cooks.", "Each packet will keep its local name plus a unique code.", "The collection began when a gardener donated bean seeds.", "Beans become tender when heated for a sufficient period."], "a": 1, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "两个同名种子包来自不同山谷、需不同储温。哪段最适合接着解决刚提出的问题？", "structure": "two packets called同名与different来源/条件共同制造识别风险；后段需同时保留本地名和区分身份。", "other": "packet小包；storage储存；unique code唯一编码。", "meaning": "主题词bean重复不足以证明相邻；唯一编码回应同名异物的具体关系。", "rest": "recipes转到烹饪；collection began倒退背景；tender讨论烹煮，都没有处理同名种子识别问题。"}, "context_id": "seed-vault-homonymous-labels-require-identity-not-shared-theme"}, {"id": "pb17-chorus-relations", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "并列与递进的段落功能", "skill": "并列与递进的段落功能", "q": "P: Singers can practise difficult rhythms by clapping. Q: They can also hum the melody without words to check pitch. R: A rehearsal combines both exercises before restoring the lyrics. Which account of the paragraph roles is accurate?", "o": ["P and Q are rival results; R rejects both as unsuccessful.", "P explains a failure; Q supplies its cause; R changes topic.", "P and Q offer parallel methods; R combines their use.", "P is a conclusion; Q gives its premise; R introduces P."], "a": 2, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "P拍手练节奏，Q哼唱检查音高，R把两项合并排练再恢复歌词。段落作用是什么？", "structure": "also标出另一方法；both回收前两种练习；combines才是从方法列举转向组合应用的推进。", "other": "hum哼唱；pitch音高；lyrics歌词。", "meaning": "P/Q并列而非彼此因果；R在并列方法之上推进到综合应用。", "rest": "rival results...rejects虚构竞争和失败；failure...cause虚构因果；P is a conclusion颠倒介绍与总结的位置。"}, "context_id": "choir-rhythm-pitch-parallel-methods-to-combined-application"}, {"id": "pb17-music-ending", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "结尾与全局论证相容", "skill": "结尾与全局论证相容", "q": "An essay introduces software that restores damaged musical scores, shows one rhythm error it produced, and explains how musicians can check its output. Which closing paragraph best fits that argument?", "o": ["Human checks help; useful output can still contain errors.", "The history of ticket prices now needs a detailed account.", "All restored notes must be right whenever software is used.", "One rhythm error proves that every digital tool is useless."], "a": 0, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "文章介绍修复乐谱的软件，展示一处节奏错误，再解释音乐家如何核验。哪段适合结尾？", "structure": "开头对象、错误例证、核验措施共同约束末段；结尾应合并优势与限制，不另起无关话题或扩大为全称断言。", "other": "score乐谱；restore修复；output输出结果。", "meaning": "全局位置要检查论证链是否闭合；技术有用与仍需人类核验可以同时成立。", "rest": "ticket prices另起无关话题；All restored notes把能力夸成保证；every digital tool把单例扩大为全体无用。"}, "context_id": "music-score-restoration-global-conclusion-with-qualified-claim"}], "belief-negation-clause": [{"id": "belief-negation-software-update-b", "family": "belief-negation-clause", "introduced": "2026-10-15", "published_on": "2026-10-15", "budget": 55, "target": "imagined that ... had not / 提取完整观点", "skill": "信念内容不能由后续结果倒推", "q": "Noor imagined that a software update had not changed her machine's output. Later measurements showed a substantial change. Which statement describes Noor's initial belief?", "o": ["She initially thought the update made no difference.", "She had decided to replace the machine entirely.", "She knew from the beginning that output had changed greatly.", "She was excessively enthusiastic about software updates."], "a": 0, "exp": {"trans": "Noor起初认为更新没有改变机器产出，后来的测量才发现变化明显。", "structure": "Noor imagined that...中that从句作宾语；had not changed是其核心否定谓语；Later measurements引出相反事实。", "other": "output 产出；substantial 显著的；measurement 测量；initial 初始的。", "meaning": "必须区分人物当时相信什么与后来实际发现了什么；不能只因出现update就推定其对软件痴迷。", "rest": "更换机器无依据；把后来证据当成最初已知事实颠倒时间；过分热衷更新是附加心理描述。"}, "context_id": "context:belief-negation-software-update-b"}], "relative": [{"id": "legacy-which", "source": "old", "skill": "介词 + which", "target": "preposition + which", "q": "The archive contains several letters. The historian based her argument on those letters.\n最自然的合并是：", "o": ["The archive contains several letters on which the historian based her argument.", "The archive contains several letters which on the historian based her argument.", "The archive contains several letters on that the historian based her argument.", "The archive contains several letters which the historian based her argument on them."], "a": 0, "diag": {"1": "介词 on 应放在关系代词 which 前，不能写 which on the historian...", "2": "介词后不能用关系代词 that；应使用 which。", "3": "which 已经代替 those letters，后面再用 them 造成重复。"}, "exp": {"trans": "这个档案馆收藏着几封信，历史学家正是依据这些信件提出了她的论证。", "structure": "原始简单句：The historian based her argument on those letters. → those letters 变成先行词 several letters，并用 which 代替：the letters which the historian based her argument on → 正式写法把介词前置：the letters on which the historian based her argument。", "other": "archive 档案馆；historian 历史学家；base A on B 以B为依据建立A；argument 论证/观点。", "meaning": "介词 + which 用于物；介词来自原简单句中的搭配 base A on B。", "rest": "介词前置的正确句是 “letters on which ...”；把 which 放在 on 前、把 that 放在介词后，或在 which 后再保留 them，都会造成词序或关系词重复问题。"}, "family": "relative", "introduced": null, "budget": 60, "context_id": "on-which-argument"}], "only-when-necessary": [{"id": "r18t3-onlywhen-exhibition", "family": "only-when-necessary", "introduced": "2026-11-16", "published_on": "2026-11-17", "budget": 50, "target": "only when与额外条件", "skill": "only when与额外条件", "q": "An exhibiti 验测量的结果。"}, "context_id": "context:evidence-flood-sensor-trial-a"}], "dnt-actor-boundary": [{"id": "dnt-consent-partners-a", "family": "dnt-actor-boundary", "target": "提出请求、提供设置、执行响应的主体", "introduced": "2026-10-16", "published_on": "2026-10-16", "budget": 55, "skill": "提出请求、提供设置、执行响应的主体", "q": "A news app lets users send an opt-out notice to independent advertising partners. The app supplies the switch; the partners must decide whether to stop profiling users. Which interpretation preserves the roles?", "o": ["The app alone decides whether all advertisers stop profiling.", "The app offers the setting, while the advertising partners handle requests.", "The users created the advertising partners' software.", "The advertising partners are the only parties who can send opt-out notices."], "a": 1, "exp": {"trans": "新闻应用提供开关，用户借此发出退出通知，而收到通知的广告合作方需要决定如何响应。", "structure": "第一句说明app提供的渠道与用户动作，第二句分别用The app和the partners指明执行开关与处理请求的主体。", "other": "opt-out notice退出通知；profiling用户画像；independent独立的；advertising partner广告合作方。", "meaning": "将创建界面、发送用户偏好和执行请求分开，不能将相关业务主体一概等同为同一家公司。", "rest": "只由应用负责所有广告商的行动与原文partners decide相反；用户和广告方软件开发、唯一发送者均未得到原文支持。"}, "context_id": "context:dnt-consent-partners-a"}], "semantic-action-roles": [{"id": "r18t2-role-bridge-kit", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "工具用途与讨论话题：动作、对象和主体", "skill": "工具用途与讨论话题：动作、对象和主体", "q": "A repair cooperative lends a \"bridge kit\", a spare wheel that riders return when their damaged wheel is ready. Skills clinics also let members exchange repair methods. What does the evidence establish about the bridge kit?", "o": ["It gives members a place to exchange methods of wheel repair.", "Temporary equipment keeps riders moving during wheel repairs.", "It records views on the methods taught at the repair clinics.", "A bridge-kit forum lets members debate which repairs are best."], "a": 1, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "维修合作社把备用车轮称为bridge kit，借给顾客直到原车轮修好；技能课另外提供交流维修方法的机会。关于备用车轮能确定什么？", "structure": "lends与return构成临时借用关系；when从句限定归还时间。Skills clinics是另一个承担交流功能的主体，不能把它的动作转给bridge kit。", "other": "cooperative合作社；spare备用的；clinic在此指技能指导课。", "meaning": "正确概括可用temporary equipment同义改写spare wheel；保留repair、methods等词却把借用设备换成讨论工具，是动作和角色偷换。", "rest": "place to exchange与forum把实体备用轮当成讨论场所；records views把交流或记录功能添加给车轮。提到维修这一共同话题不够。"}, "context_id": "repair-cooperative-temporary-wheel-versus-skills-discussion"}, {"id": "r18t2-role-rehearsal-grid", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "比较动作对象和工具所支持的任务", "skill": "比较动作对象和工具所支持的任务", "q": "A conductor marks player availability on \"section cards\" and places them in a room-and-time grid to prevent rehearsal clashes. Players suggest new repertoire at a separate meeting. What is the role of the cards?", "o": ["They provide a topic for sharing opinions about new music.", "They record which new pieces players most want to perform.", "They invite players to debate the meaning of section cards.", "They organize which players rehearse in each room and slot."], "a": 3, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "指挥把乐手可到场的时间写在卡片上，放入房间与时间表以避免排练冲突；乐手在另一个会议上建议新曲目。卡片发挥什么作用？", "structure": "marks...places...to prevent给出动作与目的链；at a separate meeting把提出曲目的行为放在另一个活动中。", "other": "availability可到场情况；clash冲突；repertoire曲目。", "meaning": "卡片用于人员、地点与时间的安排；讨论曲目不因文中同时出现音乐相关词就成为卡片的功能。", "rest": "sharing opinions与debate改成讨论行为；record which new pieces误把时间可用性换成曲目偏好，均改变了动作对象。"}, "context_id": "rehearsal-availability-grid-versus-repertoire-meeting"}, {"id": "r18t2-role-justified-revision", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "正确改选也要有正确理由", "skill": "正确改选也要有正确理由", "q": "A notice says a library is launching a \"lending circle\". A reader initially expects book loans. The full definition says the circle meets to de
