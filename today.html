<script>window.REVIEW_DATA={"date": "2026-10-01", "repo": "pkppkqbobs/kaoyan-english-trainer", "questions": [{"id": "directness-curator-b", "family": "directness-modifier", "introduced": "2026-09-30", "budget": 45, "target": "come right out and say / frank", "skill": "直接表达", "q": "Instead of giving a vague excuse for the exhibition's cancellation, the curator came right out and said that ticket sales had been too low. This response was:", "o": ["evasive", "frank", "impulsive", "indifferent"], "a": 1, "exp": {"trans": "这位策展人没有用含糊的借口解释展览取消，而是直接说票卖得太少了。这种回应是坦率的。", "structure": "Instead of giving...是介词短语作对比背景。主干：the curator（主语）+ came right out and said（谓语）+ that从句（宾语）。that ticket sales had been too low说明她直接说出的真实原因。", "other": "vague excuse 含糊的借口；curator 策展人；cancellation 取消；ticket sales 票房/售票量。", "meaning": "come right out and say = 直截了当地说；语气上对应frank，而不是回避。", "rest": "evasive表示闪烁其词、回避，和instead of a vague excuse相反；impulsive强调冲动行为；indifferent表示冷漠、不在意，原句没有这种态度。"}}, {"id": "logic-unless-freezer", "family": "logic", "introduced": null, "target": "because / unless 整句逻辑", "skill": "because / unless 整句逻辑", "q": "The medicine must stay below 8°C; it may lose effectiveness ___ it is kept in a refrigerator during transport.", "o": ["because", "unless", "although", "so that"], "a": 1, "budget": 40, "exp": {"trans": "这种药必须保持在8摄氏度以下；运输途中如果不放在冰箱里，它可能会失去药效。", "structure": "分号前：The medicine（主语）+ must stay（谓语）+ below 8°C（补足信息）。分号后主干：it（主语）+ may lose（谓语）+ effectiveness（宾语）。unless引导条件状语从句：it is kept in a refrigerator during transport，相当于 if it is not kept...。", "other": "effectiveness 有效性；refrigerator 冰箱；during transport 在运输过程中；keep sth below... 使某物保持在……以下。", "meaning": "unless = if...not，表示“除非/如果不”。这里逻辑是：不冷藏 → 可能失效。", "rest": "because表示原因，会变成“因为被冷藏所以失效”，逻辑相反；although表示让步，不能表达必要条件；so that表示目的/结果，通常是“为了……”，与这里的风险条件不符。"}}, {"id": "summary-overall-midsection", "family": "summary-location", "introduced": null, "target": "Overall / 总结词定位", "skill": "总结词定位", "q": "A paragraph begins: “Overall, the first phase cut waiting times but raised operating costs.” The article then spends two more paragraphs discussing why costs rose. What does Overall most likely do here?", "o": ["It proves the article has reached its final sentence.", "It summarizes the first phase before the article moves to further analysis.", "It introduces a completely unrelated example.", "It means the following claim is uncertain."], "a": 1, "budget": 45, "exp": {"trans": "段落开头说：“总体来看，第一阶段缩短了等待时间，但提高了运营成本。”随后文章又用两段分析成本为何上升。这里 Overall 最可能是在进一步分析之前概括第一阶段的总体结果。", "structure": "引号内主干：the first phase（主语）+ cut / raised（并列谓语）+ waiting times / operating costs（宾语）。Overall修饰整句判断，表示概括性评价；后文仍可继续展开。", "other": "phase 阶段；waiting time 等待时间；operating cost 运营成本；further analysis 进一步分析。", "meaning": "Overall是句子/段落层面的总结副词，表示“总体而言”；它不等于“全文到此结束”。", "rest": "总结词可以出现在文章中段，不能凭Overall就判断是最后一句；unrelated example是引例功能，与概括相反；Overall不表达不确定性，uncertain更接近possibly/apparently等语气词。"}}, {"id": "nested-shared-gate", "family": "nested", "introduced": "2026-09-29", "budget": 60, "target": "who 定语从句 / that 宾语从句", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "q": "Residents who discovered that the shared gate was unlocked called the caretaker.\n按“主句主语中心词 / who从句谓语 / 主句谓语”的顺序，哪组正确？", "o": ["Residents / discovered / called", "the shared gate / discovered / was", "Residents / was unlocked / discovered", "the caretaker / called / discovered"], "a": 0, "exp": {"trans": "发现公共大门没有锁上的住户给管理员打了电话。", "structure": "简单句①Residents called the caretaker. ②Residents discovered something. ③The shared gate was unlocked. → 把③接在discovered后：Residents discovered that the shared gate was unlocked. → 把重复的Residents换成who并嵌入①：Residents [who discovered [that the shared gate was unlocked]] called the caretaker。主句完整主语包含who从句，中心词是Residents。", "other": "resident 住户；shared 共用的；unlocked 没锁上的；caretaker 管理员。", "meaning": "发现这件事的是住户；没有锁上的是大门；打电话给管理员的还是住户。三个小句的主语和谓语不能串层。", "rest": "the shared gate只在that从句中作主语，不能升为主句主语。was unlocked属于that从句，discovered属于who从句；两者都不是主句谓语。the caretaker是called的宾语，不是发现大门未锁的人。"}}, {"id": "reference-radio-failures", "family": "reference", "introduced": null, "target": "these/such 回指 / 原词复现干扰", "skill": "原词复现 vs 明确回指", "q": "段A：The team lost radio contact, and its spare battery failed.\n段B：These failures forced the team to abandon the search.\n段C：Another team tested a radio before leaving camp.\n\n哪两个段落之间的衔接最强？", "o": ["A → C", "B → C", "C → A", "A → B"], "a": 3, "exp": {"trans": "段A：团队失去了无线电联系，备用电池也出了故障。段B：这些故障迫使团队放弃搜寻。段C：另一支团队离开营地前测试了一台无线电设备。", "structure": "段A有两个并列分句：The team + lost + radio contact；its spare battery + failed。段B：These failures（主语，概括前面的两项故障）+ forced（谓语）+ the team（宾语）+ to abandon the search（宾语补足语）。段C的Another team引入另一对象。", "other": "radio contact 无线电联系；spare 备用的；abandon 放弃；search 搜寻。", "meaning": "These failures明确回指已出现的两次故障；重复radio一词并不保证谈的是同一团队、同一事件。", "rest": "把两个含radio的句子相接，会忽略Another team造成的对象切换。把这些故障放在另一团队测试设备之前，后句没有承接故障结果。先说另一团队测试再说本团队出故障，也没有明确回指建立连接。"}}, {"id": "recruitment-hunt-b", "family": "recruitment-vocab", "introduced": "2026-09-30", "budget": 40, "target": "hunt for / attend to / poach", "skill": "招聘语境辨析", "q": "The museum hired a specialist recruiter to ___ candidates with experience in restoring ancient textiles. Which phrase best fits?", "o": ["hunt for", "attend to", "guard against", "approve of"], "a": 0, "exp": {"trans": "博物馆聘请了一名专业招聘人员，去物色有古代纺织品修复经验的候选人。", "structure": "主干：The museum + hired + a specialist recruiter。to hunt for candidates是不定式作目的状语；with experience...修饰candidates。", "other": "specialist recruiter 专业招聘人员；candidate 候选人；restore 修复；ancient textiles 古代纺织品。", "meaning": "hunt for = 寻找、搜寻、物色。它强调寻找对象；poach则进一步强调从别处把人挖走。", "rest": "attend to = 处理/照料，常见attend to a customer/problem；guard against = 防范；approve of = 赞成。均不表示招聘人员寻找候选人。"}}, {"id": "viewpoint-renting-a", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "传统观念 ≠ 实际行为事实", "skill": "观点与事实区分", "q": "A report says: “For years, the conventional wisdom was that renting a small office was safer than buying one.” Which statement is justified?", "o": ["Every small business rented its office for years.", "There was a widespread belief that renting was safer.", "Buying an office was legally forbidden.", "Businesses that bought offices always failed."], "a": 1, "exp": {"trans": "报告说：“多年来，传统观念认为租一间小办公室比买一间更安全。”能够成立的是：曾经存在一种广泛观念，认为租赁更安全。", "structure": "主干：the conventional wisdom（主语）+ was（系动词）+ that从句（表语）。that从句说明“观念的内容”，不是统计所有企业实际做了什么。", "other": "conventional wisdom 传统看法/普遍观念；rent 租；buy 购买；widespread 广泛的。", "meaning": "belief/rule/considered safer描述的是人们怎么想，不能直接推成“所有人过去都这么做”。", "rest": "Every把范围扩大成全部企业；legally forbidden把“认为不安全”偷换成法律禁止；always failed把风险判断偷换成必然失败，都是证据过头。"}}, {"id": "career-chef-a", "family": "career-evidence", "introduced": "2026-09-30", "budget": 50, "target": "post=职位 / aspiration / 文本证据", "skill": "熟词生义 + 证据约束", "q": "After five years as a sous-chef, Lena began applying for head-chef posts because she wanted to run a kitchen of her own. What is directly supported by the sentence?", "o": ["She expected a higher salary.", "She was pursuing a new career goal.", "She disliked everyone in her current kitchen.", "She had already been offered a head-chef job."], "a": 1, "exp": {"trans": "做了五年副厨师长后，Lena开始申请主厨职位，因为她想独立管理一个厨房。句子直接支持：她正在追求新的职业目标。", "structure": "主句：Lena（主语）+ began applying（谓语）+ for head-chef posts。because从句给出原因：she wanted to run a kitchen of her own。原因明确指向职业角色和职责，而非薪酬。", "other": "sous-chef 副厨师长；head-chef post 主厨职位；apply for 申请；run a kitchen 管理厨房。", "meaning": "post在这里是职位；“想独立管理厨房”是职业抱负/目标。不能因为职位更高就擅自补出“工资更高”。", "rest": "higher salary在现实中可能成立，但原句没有salary/pay等证据；disliked everyone完全无依据；began applying只表示开始申请，不等于已经拿到offer。"}}], "retry": {"directness-modifier": [{"id": "directness-engineer-a", "family": "directness-modifier", "introduced": "2026-09-30", "budget": 45, "target": "surprisingly + adjective / straight up", "skill": "副词修饰范围 + straight up", "q": "When reporters asked why the product launch had been delayed, the engineer was surprisingly straight up: “We underestimated the testing time.” Her manner was best described as:", "o": ["frank", "impulsive", "ceremonial", "hostile"], "a": 0, "exp": {"trans": "记者问产品为什么延期发布时，这位工程师出人意料地直截了当：“我们低估了测试所需的时间。”她的表达方式最适合形容为坦率。", "structure": "主句：the engineer（主语）+ was（系动词）+ surprisingly straight up（表语）。surprisingly修饰straight up，回答“出人意料地怎么样”。冒号后的直接引语具体证明她没有遮掩原因。", "other": "product launch 产品发布；delay 推迟；underestimate 低估；testing time 测试时间。", "meaning": "straight up在这里表示坦率、直截了当；surprisingly只表示这种坦率令人意外，不等于“冲动”。", "rest": "impulsive表示冲动、未经充分考虑就行动，通常描述decision/action；ceremonial表示仪式性的；hostile表示敌对的。三者都不能由“直接承认低估测试时间”推出。"}}], "logic": [], "summary-location": [], "nested": [{"id": "legacy-who-that-main", "source": "today", "skill": "who 定语从句 + that 宾语从句 + 主句谓语", "target": "who 定语从句 / that 宾语从句", "q": "Applicants who believe that a longer résumé automatically proves greater ability often overlook the value of relevance.\n哪组句法判断正确？", "o": ["主句主语 Applicants；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 proves；主句谓语 believe", "主句主语 a longer résumé；who 从句谓语 believe；主句谓语 overlook", "主句主语 Applicants；who 从句谓语 believe；主句谓语 proves"], "a": 0, "diag": {"1": "proves 属于 that 宾语从句，不是 who 从句的核心谓语；believe 也不是主句谓语。", "2": "a longer résumé 是 that 从句内部的主语，不是整句主语。", "3": "proves 是 that 从句谓语；整句主句谓语是 overlook。"}, "exp": {"trans": "那些认为简历越长就自然能证明能力越强的申请者，往往忽视了“相关性”的价值。", "structure": "原始简单句① Applicants often overlook the value of relevance. ② Applicants believe something. ③ A longer résumé automatically proves greater ability. → ②把 something 换成 that 从句：Applicants believe that... → 再把②变成修饰 Applicants 的 who 定语从句：Applicants who believe that... often overlook...。所以整句主语 Applicants，who 从句谓语 believe，that 从句谓语 proves，主句谓语 overlook。", "other": "applicant 申请者；résumé 简历；automatically 自然而然地/自动地；relevance 相关性。", "meaning": "看到 who 后先划到从句结束，再找主句谓语；who 从句里又可嵌套 that 宾语从句。", "rest": "B/D 都把 that 从句的 proves 错当成外层谓语；C 把 that 从句内部的 a longer résumé 错当成整句主语。"}, "family": "nested", "introduced": "2026-09-29", "budget": 60}], "reference": [{"id": "legacy-such", "source": "old", "skill": "these / such 回指", "target": "these / such 回指", "q": "段A：The museum lowered ticket prices and added evening hours.\n段B：Such changes attracted more local families during the week.\n段C：A different museum across town raised its prices last year.\n\n段B中的 Such changes 最直接回指什么？", "o": ["段A中的降价和延长晚间开放时间", "段C中另一家博物馆的涨价", "所有博物馆过去一年的变化", "local families 本身"], "a": 0, "diag": {"1": "段B先于段C，且 Such changes 就近概括段A的两个措施。", "2": "题干没有支持“所有博物馆”的泛指。", "3": "changes 指的是措施变化，不是家庭。"}, "exp": {"trans": "A：博物馆降低了票价，并延长了晚间开放时间。B：这些变化吸引了更多本地家庭在工作日前来。C：城另一边的另一家博物馆去年提高了票价。", "structure": "段A先给出两个并列措施 lowered ticket prices / added evening hours；段B用 Such changes 对这两个措施整体回指，再说明结果 attracted more local families。", "other": "lower 降低；ticket price 票价；evening hours 晚间开放时段；attract 吸引。", "meaning": "such + 名词 常把前文已经描述过的同类事物/情况概括回指；这里 Such changes = 段A的两项变化。", "rest": "B 是后文另一对象；C 范围被无依据扩大；D 词义和语法都不匹配。"}, "family": "reference", "introduced": null, "budget": 35}, {"id": "reference-return-rules", "family": "reference", "introduced": null, "target": "these requirements", "skill": "these / such 回指", "q": "A return is accepted only within thirty days and with a receipt. These requirements apply to online orders too.\nThese requirements 具体指什么？", "o": ["网上订单本身", "所有商店的规定", "三十天以内退货且出示收据这两个条件", "退款已经完成这一结果"], "a": 2, "exp": {"trans": "只有在三十天内并出示收据，退货才会被受理。这些要求也适用于网上订单。", "structure": "第一句：A return（主语）+ is accepted（被动谓语）；only within thirty days和with a receipt并列限制受理条件。第二句：These requirements（主语）+ apply（谓语）+ to online orders（介词短语）。", "other": "return 退货；receipt 收据；apply to 适用于；online order 网上订单。", "meaning": "these + 名词可以概括前文的整组条件，不一定只指紧挨着它的一个名词。", "rest": "online orders是第二句中被这些要求约束的对象，不是要求本身。所有商店的规定扩大了范围，原文未说all shops。退款完成是结果，但前句只陈述受理规则，没有报告任何实际退款。"}}], "recruitment-vocab": [{"id": "recruitment-poach-a", "family": "recruitment-vocab", "introduced": "2026-09-30", "budget": 40, "target": "poach / hunt for / attend to", "skill": "招聘语境熟词", "q": "A rival laboratory offered unusually generous contracts in an attempt to ___ two senior researchers from our team.", "o": ["attend to", "poach", "guard against", "approve of"], "a": 1, "exp": {"trans": "一家竞争实验室开出异常优厚的合同，试图从我们团队挖走两名资深研究员。", "structure": "主干：A rival laboratory（主语）+ offered（谓语）+ contracts（宾语）。in an attempt to poach...表示目的；poach的宾语是two senior researchers，from our team说明从哪里挖走。", "other": "rival competitor 竞争对手；generous contract 优厚合同；senior researcher 资深研究员；in an attempt to 试图。", "meaning": "商业/招聘语境中poach sb from... = 从别的组织挖人、挖角。", "rest": "attend to = 处理/照料；guard against = 防范；approve of = 赞成。它们都不表达“用条件把别人的人才招走”。"}}], "viewpoint-fact": [{"id": "viewpoint-diet-b", "family": "viewpoint-fact", "introduced": "2026-09-30", "budget": 50, "target": "belief / rule / considered ≠ 行为事实", "skill": "观念与行为", "q": "The article states: “The old rule of thumb was that athletes should avoid strength training during the season.” What can you safely conclude?", "o": ["No athlete ever lifted weights during the season.", "Coaches once commonly advised against in-season strength training.", "Strength training was banned by every sports federation.", "Athletes who trained during the season were always injured."], "a": 1, "exp": {"trans": "文章说：“过去的经验法则认为，运动员赛季期间应避免力量训练。”安全的结论是：教练界过去普遍有这种建议。", "structure": "主干：The old rule of thumb + was + that从句。that athletes should avoid...说明规则/建议内容。should表达规范性判断，而不是历史行为统计。", "other": "rule of thumb 经验法则；athlete 运动员；strength training 力量训练；in-season 赛季期间的。", "meaning": "规范、建议和传统观念只能支持“有人这样主张/建议”，不能自动推出所有人都遵守。", "rest": "No athlete ever和every federation都是绝对化扩大；always injured把建议背后的风险偷换成必然结果。"}}], "career-evidence": [{"id": "career-editor-b", "family": "career-evidence", "introduced": "2026-09-30", "budget": 50, "target": "post=职位 / 不用常识补因果", "skill": "证据链", "q": "Marco said he was looking for an editor-in-chief post because he wanted final responsibility for a magazine's content. Which explanation stays closest to the text?", "o": ["He mainly wanted better financial status.", "He wanted a different level of professional responsibility.", "He had been dismissed from his current job.", "He was trying to avoid all management work."], "a": 1, "exp": {"trans": "Marco说他正在寻找总编辑职位，因为他想对一本杂志的内容承担最终责任。最贴近原文的是：他想获得不同层级的职业责任。", "structure": "主句：Marco + said + 宾语从句。宾语从句中he was looking for an editor-in-chief post；because从句he wanted final responsibility...解释求职动机。", "other": "editor-in-chief 总编辑；final responsibility 最终责任；content 内容；professional responsibility 职业职责。", "meaning": "原文证据链是post → responsibility，而不是post → money。做阅读题必须沿文本明说的因果走。", "rest": "financial status没有文本证据；dismissed没有被解雇信息；avoid management与想承担最终责任正相反。"}}]}, "issues_used": [1, 2, 3, 4, 5], "engine": 3};</script><script src="./web/review.js?v=66c0b5066e16"></script></body></html>
