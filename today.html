<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日定制复习 · 考研英语</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#3157d5;--accent2:#eef2ff;--good:#087443;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;--warn:#b54708;--warnbg:#fffaeb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:850px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.brand{font-size:21px;font-weight:900}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #1018280d}.target{display:inline-block;background:var(--accent2);color:#303f9f;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.q{font-size:18px;line-height:1.65;margin:16px 0;white-space:pre-line}.opts{display:grid;gap:9px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;cursor:pointer;line-height:1.5}.opt:hover{border-color:#aab7ff;background:#fafbff}.opt.correct{background:var(--goodbg);border-color:#6ce9a6}.opt.wrong{background:var(--badbg);border-color:#fda29b}.opt:disabled{cursor:default;color:inherit}.feedback{margin-top:12px;border-radius:12px;padding:11px 12px;line-height:1.55}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}.feedback.warn{background:var(--warnbg);color:var(--warn)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f5;color:#111827}.warn{background:var(--warnbg);color:var(--warn)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.exp{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.65;background:#fbfcfe}.exp b{display:block;margin-top:8px}.exp b:first-child{margin-top:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi strong{display:block;font-size:22px}.review-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.review-item .qmini{font-weight:800;margin-bottom:6px}.tag{font-size:11px;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#475467;font-weight:800}.home{color:var(--accent);text-decoration:none;font-weight:800}.bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--accent)}
@media(max-width:650px){.app{padding:10px}.q{font-size:16px}.top{flex-direction:column}.summary{grid-template-columns:1fr 1fr 1fr}.btn{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="brand">今日定制 · 8题</div>
      <div class="sub">昨天 GitHub 结果 + 今天完形错误思路/框词 + 历史长期薄弱点。每类最多 1–2 题，不堆量。</div>
    </div>
    <a class="home" href="./">返回总训练站</a>
  </div>

  <div id="quiz" class="card">
    <div class="meta"><span class="target" id="target"></span><span class="sub" id="progress"></span></div>
    <div class="q" id="question"></div>
    <div class="opts" id="options"></div>
    <div id="feedback"></div>
    <div id="explain" class="exp hidden"></div>
    <div class="actions">
      <button class="btn secondary hidden" id="whyBtn">查看完整解析</button>
      <button class="btn primary hidden" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="result" class="card hidden">
    <h2 style="margin-top:0">本轮完成</h2>
    <div class="summary">
      <div class="kpi"><strong id="scoreKpi">0/8</strong><span class="sub">正确</span></div>
      <div class="kpi"><strong id="timeKpi">0s</strong><span class="sub">平均用时</span></div>
      <div class="kpi"><strong id="weakKpi">-</strong><span class="sub">最需回炉</span></div>
    </div>
    <div id="weakList"></div>
    <div class="actions">
      <button class="btn warn" id="redoWrongBtn">① 只重做错题</button>
      <button class="btn secondary" id="viewWrongBtn">② 查看本轮错题与解析</button>
      <button class="btn secondary" id="redoAllBtn">③ 全部重做</button>
      <button class="btn primary" id="submitBtn">提交结果到 GitHub</button>
    </div>
  </div>

  <div id="wrongReview" class="card hidden" style="margin-top:14px">
    <div class="meta"><h3 style="margin:0">本轮错题与解析</h3><button class="btn secondary" id="closeReview">收起</button></div>
    <div id="wrongItems"></div>
  </div>
</div>

<script>
var MAIN = [
{
id:"d1",skill:"be subject to / be subjected to",target:"be subject to / be subjected to",
q:"① Under the gallery's loan policy, every overseas shipment is ___ customs inspection before release.\n② During the experiment, the seedlings were ___ extremely dry air for twelve hours.",
o:["subject to / subjected to","subjected to / subject to","subject to / subject to","subjected to / subjected to"],a:0,
diag:{1:"把“规则状态”和“被施加的过程”颠倒了",2:"第二空需要强调被置于干燥空气中的实验过程",3:"第一空是须经检查的规则状态，不是在描述一个动作过程"},
exp:{trans:"① 按照画廊的借展规定，每一批海外运送物在放行前都须接受海关检查。② 实验中，幼苗被置于极度干燥的空气中12小时。",
structure:"① 主语 every overseas shipment + 系动词 is + 表语 subject to customs inspection。② 主语 the seedlings + 被动 were subjected to + 宾语极干燥空气。",
other:"loan policy 借展规定；shipment 货运/运送批次；release 放行；seedling 幼苗。",
meaning:"be subject to = 须经/受制于/可能受……影响，强调状态或规则；be subjected to = 被施加/被置于/经历，强调动作过程。",
rest:"B 把两种语义颠倒；C 第二空只写状态，弱化了实验中“被置于”这一过程；D 第一空把规则误写成被施加的动作。"}
},
{
id:"d2",skill:"原词复现 vs 明确回指",target:"明确回指 > 原词重复",

diag:{1:"又被 scheduling / delays 的原词复现吸引了，但对象已经换成另一套系统",2:"没有明确回指，顺序依据不足",3:"B 的 These setbacks 明确需要前文先给出 setbacks/delays"},
exp:{trans:"A：新的排期系统造成了几次意外延误。B：这些挫折迫使组织者缩短最后一场活动。C：附近一所学校使用的另一套排期系统减少了延误。",
structure:"A 先给出 several unexpected delays；B 用 These setbacks 对其进行同义回指。C 虽然重复 scheduling/delays，但引入的是 another system。",
other:"scheduling system 排期系统；setback 挫折/阻碍；shorten 缩短；session 场次/环节。",
meaning:"排序中明确指代/回指通常强于单纯重复相同单词。",
rest:"B项只看到 scheduling 和 delays 重复，却忽略 another system 已换对象；C、D 都缺乏可验证的回指链。"}
},
{
id:"d3",skill:"because / unless 整句逻辑",target:"because / unless",
q:"The researcher argues that people do not feel relaxed ___ they slow their breathing; rather, slowing the breathing can itself create a sense of calm.",
o:["unless","because","until","if"],a:1,
diag:{0:"只让前半句局部通顺，却没有和 rather 后面的因果反转形成完整论证",2:"until 表示时间终点，不能表达被否定的原因关系",3:"if 会变成条件关系，和 rather 后面的因果反转不匹配"},
exp:{trans:"研究者认为，人并不是因为放慢呼吸才感到放松；相反，放慢呼吸这一动作本身就可能产生平静感。",

other:"slow one's breathing 放慢呼吸；rather 在这里表示“相反/更确切地说”；a sense of calm 平静感。",
meaning:"because 在这里被 not 否定：not feel relaxed because... = 并不是因为……才感到放松。",
rest:"unless=除非，讨论必要条件；until=直到，讨论时间；if=如果，讨论条件。它们都无法和后半句构成“原先因果被反转”的逻辑。"}
},
{
id:"d4",skill:"共同动词支配",target:"共同动词 + either A or B",
q:"For the posture study, volunteers were asked to ___ a small card either between two fingers or under the chin while a camera recorded their movements.",
o:["bite","hold","fold","tear"],a:1,
diag:{0:"看到身体部位就凭局部联想选动作，没有检查这个动词能否同时支配 either...or... 两边",2:"fold a card 可以，但 under the chin 这一搭配不成立",3:"tear 与两个位置结构都不匹配"},
exp:{trans:"在姿势研究中，志愿者被要求把一张小卡片夹持在两根手指之间或下巴下面，同时由摄像机记录他们的动作。",
structure:"主干：volunteers were asked to hold a small card；either between two fingers or under the chin 是两个并列位置，前面的同一个动词必须同时适用于两边。",
other:"posture 姿势；volunteer 志愿者；record 记录；movement 动作。",
meaning:"hold = 拿住、夹持、保持在某位置。做完形看到 either A or B，要检查空格里的词能否同时和 A、B 搭配。",
rest:"bite 只能和部分身体动作联想搭上；fold=折叠；tear=撕裂。它们都不能同时满足两个位置短语。"}
},
{
id:"d5",skill:"Similarly / Conversely",target:"Similarly / Conversely",

o:["Conversely","Similarly","Nevertheless","In turn"],a:1,
diag:{0:"被“相反”类词的熟悉感带走了，但前后两句实际上是同向结果",2:"前后不是让步关系",3:"这里不是 A 导致 B、B 再导致 C 的链式因果"},

other:"lower heart rate 降低心率；dim the lights 调暗灯光；comparable 可比的/相近的；calming effect 镇静效果。",

rest:"Conversely=相反地；Nevertheless=尽管如此；In turn=继而/进而，常表示链式结果。当前语境都不合适。"}
},

exp:{trans:"做完拉伸练习后，肩部的肌肉张力明显下降。",

other:"stretching routine 拉伸训练；shoulder 肩部；decrease 下降；noticeably 明显地。",

rest:"tone 可表示语气、音调、色调，但和 muscle 构成固定语境时应理解为肌张力。"}
},
{
id:"d7",skill:"conceivably",target:"conceivably",

exp:{trans:"对时间表做一个小调整，有可能减少入口处的拥挤。",

other:"timetable 时间表；reduce crowding 减少拥挤；entrance 入口；could 表示可能。",
meaning:"conceivably = 可以设想地、有可能地，语气较弱，不等于“肯定”。",
rest:"necessarily/inevitably 才接近“必然地”；superficially=表面上；deliberately=故意地。"}
},
{
id:"d8",skill:"介词 + which",target:"preposition + which",
q:"The museum introduced an online archive. Through the archive, visitors can examine rare manuscripts from home.\n合并成一句最自然的是：",
o:["The museum introduced an online archive through which visitors can examine rare manuscripts from home.","The museum introduced an online archive which through visitors can examine rare manuscripts from home.","The museum introduced an online archive through that visitors can examine rare manuscripts from home.","The museum introduced an online archive, which visitors can examine rare manuscripts through it from home."],a:0,
diag:{1:"介词必须放在关系代词 which 前，而不是 which through",2:"介词后不能用 that 引导这种定语从句",3:"which 已经代替 archive，再加 it 就重复指代了"},
exp:{trans:"博物馆建立了一个在线档案系统，访客可以通过这个系统在家查看珍贵手稿。",
structure:"原始简单句：Visitors can examine rare manuscripts through the archive. → 把 the archive 换成 which → visitors can examine rare manuscripts through which（不自然位置）→ 把介词提前：through which visitors can examine...。",
other:"archive 档案/档案系统；manuscript 手稿；from home 在家；introduce 推出/引入。",
meaning:"介词 + which 用于物；介词来自原简单句里的固定关系：through the archive → through which。",
rest:"B 介词位置错；C 介词后不能用 that；D which 与 it 重复。"}
}
];

var RETRY = {

"d2":{id:"r2",skill:"原词复现 vs 明确回指",target:"明确回指 > 原词重复",q:"段A：The survey revealed three unexpected gaps in access to public libraries.\n段B：These disparities were largest in rural districts.\n段C：A different survey measured library access in two coastal cities.\n\n哪一个衔接最强？",o:["A → C","C → B","A → B","B → C"],a:2,diag:{0:"被 survey / access 的重复词吸引，但对象已换成 different survey",1:"These disparities 缺少明确上文来源",3:"主题相关不等于强衔接"},exp:{trans:"A：调查揭示了公共图书馆使用机会上的三个意外差距。B：这些差异在农村地区最大。C：另一项调查测量了两个沿海城市的图书馆使用情况。",structure:"A 的 gaps → B 的 These disparities 是同义回指。",other:"reveal 揭示；gap 差距；disparity 差异；rural 农村的。",meaning:"明确回指链优先于原词重复。",rest:"A→C 只是 survey/access 重复且换对象；其余缺少可验证指代。"}},
"d3":{id:"r3",skill:"because / unless 整句逻辑",target:"because / unless",q:"The theory does not claim that children become confident ___ adults praise them; rather, it suggests that repeated success can itself build confidence.",o:["unless","because","until","although"],a:1,diag:{0:"局部条件句看似通顺，但破坏 rather 后的因果反转",2:"不是时间关系",3:"不是让步关系"},exp:{trans:"该理论并不是说孩子因为得到成年人表扬才变得自信；相反，它认为反复获得成功本身就能建立自信。",structure:"not A because B; rather, C can create A。",other:"claim 声称；praise 表扬；repeated success 反复成功；confidence 自信。",meaning:"because 被 not 否定，表达“并不是因为……”。",rest:"unless 条件；until 时间；although 让步，都不匹配。"}},
"d4":{id:"r4",skill:"共同动词支配",target:"共同动词 + both/either",q:"The guide asked visitors to ___ the badge either on a jacket pocket or on a backpack strap.",o:["wear","eat","fold","tear"],a:0,diag:{1:"词义完全不合",2:"只可能对物做动作，但和两个位置搭配不自然",3:"同样不能同时满足两个位置短语"},exp:{trans:"导游让访客把徽章佩戴在夹克口袋处或背包带上。",structure:"同一个动词必须同时和两个位置状语搭配。",other:"badge 徽章；jacket pocket 夹克口袋；backpack strap 背包带；visitor 访客。",meaning:"wear 可表示佩戴，能同时适用于两个位置。",rest:"eat/fold/tear 都不符合整体搭配。"}},

};

var state={answers:[],start:Date.now(),mode:"main",queue:MAIN.slice(),index:0};
function el(id){return document.getElementById(id)}
function render(){
  if(state.index>=state.queue.length){finish();return}
  var q=state.queue[state.index];state.qStart=Date.now();
  el("target").textContent="【本题目标："+q.target+"】";
  el("progress").textContent=(state.index+1)+" / "+state.queue.length;
  el("question").textContent=q.q; el("options").innerHTML=""; el("feedback").innerHTML=""; el("feedback").className="";
  el("explain").classList.add("hidden");el("whyBtn").classList.add("hidden");el("nextBtn").classList.add("hidden");
  q.o.forEach(function(t,i){var b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+["A","B","C","D"][i]+".</b> "+t;b.onclick=function(){answer(i)};el("options").appendChild(b)});
}
function answer(pick){
  var q=state.queue[state.index],ms=Date.now()-state.qStart,ok=pick===q.a;
  var rec={id:q.id,skill:q.skill,target:q.target,pick:pick,answer:q.a,ok:ok,ms:ms,mode:state.mode,q:q.q};
  state.answers.push(rec);
  Array.from(document.querySelectorAll(".opt")).forEach(function(b,i){b.disabled=true;if(i===q.a)b.classList.add("correct");if(i===pick&&!ok)b.classList.add("wrong")});
  if(ok&&ms<=22000){el("feedback").className="feedback good";el("feedback").textContent="✓ 正确。"}
  else if(ok){el("feedback").className="feedback warn";el("feedback").textContent="✓ 正确，但用了 "+(ms/1000).toFixed(1)+" 秒，说明还没形成快速反应。"}
  else{el("feedback").className="feedback bad";el("feedback").innerHTML="✗ 这次更像是：<b>"+(q.diag[pick]||"当前判断路径需要调整")+"</b>。"}
  el("whyBtn").classList.remove("hidden");el("nextBtn").classList.remove("hidden");
}
function expHtml(q){
  return "<b>1.【整句翻译】</b>"+q.exp.trans+
  "<b>2.【句子主干】</b>"+q.exp.structure+
  "<b>3.【其他词汇】</b>"+q.exp.other+
  "<b>4.【本题词义】</b>"+q.exp.meaning+
  "<b>5.【其余选项】</b>"+q.exp.rest;
}
el("whyBtn").onclick=function(){var q=state.queue[state.index];el("explain").innerHTML=expHtml(q);el("explain").classList.remove("hidden")};
el("nextBtn").onclick=function(){state.index++;render()};

function currentRun(){return state.answers.filter(function(x){return x.mode===state.mode})}
function finish(){
  el("quiz").classList.add("hidden");el("result").classList.remove("hidden");
  var arr=state.answers.filter(function(x){return x.mode===state.mode}),correct=arr.filter(function(x){return x.ok}).length;
  var avg=arr.length?Math.round(arr.reduce(function(a,b){return a+b.ms},0)/arr.length/1000):0;
  el("scoreKpi").textContent=correct+"/"+arr.length;el("timeKpi").textContent=avg+"s";
  var by={};arr.forEach(function(x){if(!by[x.skill])by[x.skill]={n:0,ok:0,ms:0};by[x.skill].n++;by[x.skill].ok+=x.ok?1:0;by[x.skill].ms+=x.ms});
  var rank=Object.keys(by).map(function(k){var v=by[k];return {k:k,w:(1-v.ok/v.n)*2+(v.ms/v.n>22000?0.7:0)}}).sort(function(a,b){return b.w-a.w});
  el("weakKpi").textContent=rank[0]?rank[0].k:"-";
  el("weakList").innerHTML="<div class='sub'>优先回炉："+(rank.slice(0,3).map(function(x){return x.k}).join(" → ")||"本轮稳定")+"</div>";
}
function wrongsForMode(m){return state.answers.filter(function(x){return x.mode===m&&!x.ok})}
el("redoWrongBtn").onclick=function(){
  var wrong=wrongsForMode(state.mode); if(!wrong.length){alert("本轮没有错题。");return}
  var ids={};wrong.forEach(function(x){ids[x.id]=true});
  var qs=MAIN.filter(function(q){return ids[q.id]&&RETRY[q.id]}).map(function(q){return RETRY[q.id]});
  if(!qs.length){qs=MAIN.filter(function(q){return ids[q.id]})}
  state.mode="retry"+Date.now();state.queue=qs;state.index=0;el("result").classList.add("hidden");el("wrongReview").classList.add("hidden");el("quiz").classList.remove("hidden");render();
};
el("viewWrongBtn").onclick=function(){
  var mainWrong=state.answers.filter(function(x){return x.mode==="main"&&!x.ok});var box=el("wrongItems");
  if(!mainWrong.length){box.innerHTML="<div class='sub'>本轮无错题。</div>"}
  else{box.innerHTML=mainWrong.map(function(r){var q=MAIN.find(function(x){return x.id===r.id});return "<div class='review-item'><div class='qmini'>"+r.target+"</div><div class='sub'>你选 "+["A","B","C","D"][r.pick]+"，正确 "+["A","B","C","D"][r.answer]+" · "+(r.ms/1000).toFixed(1)+"s</div><div class='exp'>"+expHtml(q)+"</div></div>"}).join("")}
  el("wrongReview").classList.remove("hidden");
};
el("closeReview").onclick=function(){el("wrongReview").classList.add("hidden")};
el("redoAllBtn").onclick=function(){state={answers:[],start:Date.now(),mode:"main",queue:MAIN.slice(),index:0};el("result").classList.add("hidden");el("wrongReview").classList.add("hidden");el("quiz").classList.remove("hidden");render()};
function makeReport(){
  var arr=state.answers.filter(function(x){return x.mode==="main"}),correct=arr.filter(function(x){return x.ok}).length;
  var lines=["考研英语定制训练 2026-09-28","题数 "+arr.length+"｜正确 "+correct+"｜正确率 "+(arr.length?Math.round(correct/arr.length*100):0)+"%"];
  if(arr.length)lines.push("平均用时 "+Math.round(arr.reduce(function(a,b){return a+b.ms},0)/arr.length/1000)+"s");
  lines.push("","【逐题】");
  arr.forEach(function(x,i){lines.push("Q"+(i+1)+" "+x.skill+"：选"+["A","B","C","D"][x.pick]+"→正确"+["A","B","C","D"][x.answer]+"；"+(x.ok?"正确":"错误")+"；"+(x.ms/1000).toFixed(1)+"s")});
  lines.push("","【本轮错题】");var w=arr.filter(function(x){return !x.ok});
  if(!w.length)lines.push("无");else w.forEach(function(x){lines.push(x.skill+"｜目标："+x.target)});
  return lines.join("\n")
}
el("submitBtn").onclick=function(){var title="[TRAINING_RESULT] 定制复习 2026-09-28";var body="<!-- kaoyan-english-training-result -->\n"+makeReport();var u="https://github.com/pkppkqbobs/kaoyan-english-trainer/issues/new?title="+encodeURIComponent(title)+"&body="+encodeURIComponent(body);window.open(u,"_blank","noopener,noreferrer")};
render();
</script>
</body>
</html>
