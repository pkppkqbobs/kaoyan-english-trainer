<script>window.REVIEW_DATA={"date": "2026-11-15", "repo": "pkppkqbobs/kaoyan-english-trainer", "title": "文章复盘 · 8题", "meta": "2018 英语一 Text 2 · B→D改选证据、boast/boost与框词复盘 · 本篇问题 4 题 + 历史弱项 4 题 · 全部使用迁移语境", "progressLabel": "返回本篇进度", "storagePrefix": "kaoyan.article.v1.", "storageId": "2026-11-15-2018-text2", "ignoreStale": true, "reportLabel": "考研英语文章复盘", "reportTitle": "文章复盘", "exportStem": "article-review", "footer": "本轮结果被GitHub接收并经Actions核验后，才会进入后续间隔复习；未提交的浏览器作答只保存在本地。", "questions": [{"id": "r18t2-boost-confidence", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 40, "target": "boast / boost：支配关系与语义", "skill": "boast / boost：支配关系与语义", "q": "An apprentice knows how to repair clocks but doubts her ability. The instructor wants the next task to ___ her confidence; she is not being asked to brag about past work. Which verb fits?", "o": ["boast", "roast", "boost", "toast"], "a": 2, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "学徒会修钟表，却缺乏信心。老师希望下个任务提高她的信心，并非让她夸耀旧成绩。哪个动词合适？", "structure": "空格动词直接支配her confidence，要求表达提高；boast about才通常引出夸耀的对象。", "other": "apprentice学徒；brag夸耀。", "meaning": "boost confidence表示提高信心；boast与boost字形相近但不能互换。", "rest": "boast表示夸耀或拥有值得自豪之物，不表示提高信心；roast是烘烤，toast可烤面包或祝酒，都不符合此宾语关系。"}, "context_id": "clock-repair-apprentice-confidence-improvement-not-bragging"}, {"id": "with-archive-loading-c", "family": "with", "introduced": "2026-10-18", "published_on": "2026-10-18", "budget": 50, "target": "with + noun + participial phrase", "skill": "识别with复合结构的伴随状态", "q": "The archive reopened at noon, with several boxes waiting in the loading area. What does the with-clause do?", "o": ["It describes a state accompanying the archive's reopening.", "It gives the sole reason the archive reopened at noon.", "It reports an action that archive staff carried out.", "It is the direct object of reopened in the main clause."], "a": 0, "exp": {"trans": "档案馆中午重新开放，当时有几个箱子正等在装卸区。with结构补充了重新开放时伴随的状态。", "structure": "主干是The archive reopened at noon；with several boxes waiting in the loading area是with + 名词 + 现在分词结构，several boxes是waiting的逻辑主语。", "other": "archive 档案馆；reopen 重新开放；loading area 装卸区；accompany 伴随。", "meaning": "with复合结构常补充主句发生时的伴随状态。它不是reopened的直接宾语，也不自动表达原因或目的。", "rest": "句子没有说明这是档案馆重新开放的唯一原因；with短语描述箱子所处的状态，并未说工作人员另做了一项动作；reopened在这里是不及物动词，不需要直接宾语。"}, "context_id": "context:with-archive-loading-c"}, {"id": "r17t3-budding-project", "family": "budding-stage", "introduced": "2026-11-10", "published_on": "2026-11-10", "budget": 45, "target": "budding / fully developed", "skill": "budding / fully developed", "q": "A translation collective has completed its first small commission and is still learning how to work together. A reviewer calls it a budding enterprise. Which expectation fits?", "o": ["It has already reached a stable and fully developed operating scale.", "Its first commission proves that every future project must succeed.", "It is showing early promise while its organisation is still developing.", "It has permanently stopped operating before completing any project."], "a": 2, "origin_session": "2026-11-10-2017-text3", "exp": {"trans": "一个翻译合作团队刚完成首个小委托，成员仍在学习协作。评论者称它为budding enterprise。怎样理解适当？", "structure": "first small commission与still learning共同限定发展阶段；budding修饰enterprise，评价的是事业的初期发展。", "other": "collective合作团队；commission委托；enterprise事业、企业；promise潜力。", "meaning": "budding表示萌芽、开始显现潜力，不等于充分成熟；积极预期也不能推出每个项目必定成功。", "rest": "fully developed把初期推成成熟；every future...must夸大确定性；permanently stopped与已完成委托并继续学习不符。"}, "context_id": "new-translation-collective-first-commissions-not-established"}, {"id": "r18t2-role-bridge-kit", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "工具用途与讨论话题：动作、对象和主体", "skill": "工具用途与讨论话题：动作、对象和主体", "q": "A repair cooperative lends a \"bridge kit\", a spare wheel that riders return when their damaged wheel is ready. Skills clinics also let members exchange repair methods. What does the evidence establish about the bridge kit?", "o": ["It gives members a place to exchange methods of wheel repair.", "Temporary equipment keeps riders moving during wheel repairs.", "It records views on the methods taught at the repair clinics.", "A bridge-kit forum lets members debate which repairs are best."], "a": 1, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "维修合作社把备用车轮称为bridge kit，借给顾客直到原车轮修好；技能课另外提供交流维修方法的机会。关于备用车轮能确定什么？", "structure": "lends与return构成临时借用关系；when从句限定归还时间。Skills clinics是另一个承担交流功能的主体，不能把它的动作转给bridge kit。", "other": "cooperative合作社；spare备用的；clinic在此指技能指导课。", "meaning": "正确概括可用temporary equipment同义改写spare wheel；保留repair、methods等词却把借用设备换成讨论工具，是动作和角色偷换。", "rest": "place to exchange与forum把实体备用轮当成讨论场所；records views把交流或记录功能添加给车轮。提到维修这一共同话题不够。"}, "context_id": "repair-cooperative-temporary-wheel-versus-skills-discussion"}, {"id": "belief-negation-software-update-b", "family": "belief-negation-clause", "introduced": "2026-10-15", "published_on": "2026-10-15", "budget": 55, "target": "imagined that ... had not / 提取完整观点", "skill": "信念内容不能由后续结果倒推", "q": "Noor imagined that a software update had not changed her machine's output. Later measurements showed a substantial change. Which statement describes Noor's initial belief?", "o": ["She initially thought the update made no difference.", "She had decided to replace the machine entirely.", "She knew from the beginning that output had changed greatly.", "She was excessively enthusiastic about software updates."], "a": 0, "exp": {"trans": "Noor起初认为更新没有改变机器产出，后来的测量才发现变化明显。", "structure": "Noor imagined that...中that从句作宾语；had not changed是其核心否定谓语；Later measurements引出相反事实。", "other": "output 产出；substantial 显著的；measurement 测量；initial 初始的。", "meaning": "必须区分人物当时相信什么与后来实际发现了什么；不能只因出现update就推定其对软件痴迷。", "rest": "更换机器无依据；把后来证据当成最初已知事实颠倒时间；过分热衷更新是附加心理描述。"}, "context_id": "context:belief-negation-software-update-b"}, {"id": "r18t2-intimately-restoration", "family": "intimately-familiarity", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "intimately：深入熟悉与人际亲密", "skill": "intimately：深入熟悉与人际亲密", "q": "A conservator has studied one tapestry for years and knows its repairs intimately. She has never met the people who made it. What does intimately describe?", "o": ["Detailed familiarity with the object and its repairs.", "A close personal friendship with the original makers.", "A very quick look that reveals almost no information.", "An immediate discovery made without earlier experience."], "a": 0, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "修复人员研究一幅挂毯多年，深入熟悉其修补情况，却从未见过制作它的人。intimately描述什么？", "structure": "knows...intimately的宾语是its repairs；后句排除把这里的熟悉理解为与制作者有亲密人际关系。", "other": "conservator文物修复人员；tapestry挂毯。", "meaning": "intimately可表示深入、详细地熟悉事物；具体语境决定词义，不限定为亲密关系，也不等于immediately的即时。", "rest": "personal friendship换成人际关系；quick look反转深入程度；immediate discovery误把intimately当成immediately并忽略多年研究。"}, "context_id": "tapestry-conservator-detailed-object-knowledge-not-personal-intimacy"}, {"id": "r18t2-conscious-noise", "family": "conscious-awareness", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "be conscious of / be aware of", "skill": "be conscious of / be aware of", "q": "The editor is conscious of the noise from the next room and moves the recording session. Which paraphrase preserves conscious of?", "o": ["The editor deliberately creates all the noise in the next room.", "The editor is unconscious while the recording takes place.", "The editor is aware of the noise and adjusts the arrangement.", "The editor knows nothing about the noise during recording."], "a": 2, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "编辑意识到隔壁噪声，便调整录音安排。conscious of如何改写？", "structure": "be conscious of后接所察觉的对象；moves the session说明意识到噪声之后的调整，不说明他制造了噪声。", "other": "recording session录音场次；arrangement安排。", "meaning": "conscious of是意识到、察觉到，不只是生理清醒；aware of保留这一关系。", "rest": "creates偷换为制造噪声；unconscious方向相反；knows nothing也否定了已经意识到。"}, "context_id": "recording-editor-awareness-of-noise-not-source-of-noise"}, {"id": "paragraph-discourse-audit-method-before-cases", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-27", "target": "说明与例证的层级", "skill": "说明与例证的层级", "budget": 65, "q": "An energy guide first explains that meter logs locate periods of high demand. A paragraph about equipment inspections follows. The next two paragraphs describe a bakery and a warehouse that combined logs with inspections. What is the role of the inspections paragraph?", "o": ["It completes the methods that the later cases apply.", "It summarizes the outcomes reported in the later cases.", "It gives a third case after the bakery and warehouse.", "It withdraws the claim that meter logs can be useful."], "a": 0, "exp": {"trans": "能源指南先解释用电表日志定位高需求时段，再介绍设备检查；后面两个案例同时使用日志和检查。检查段是在补齐随后案例会应用的方法。", "structure": "first、follows、next交代段落顺序；combined logs with inspections说明两个案例同时依赖前面两种方法，不是只应用第一段的方法。", "other": "meter log 电表记录；equipment inspection 设备检查；high demand 高需求；apply 应用。", "meaning": "一个方法段结束，不代表下一段必须马上举例。要检查后面案例需要哪些方法说明，再分清并列方法与两则应用案例的层级。", "rest": "总结后文结果需要结果性内容，检查方法本身不能当作结果总结；它位于两案例前也不是第三案例；案例同时使用日志，并未撤回日志有用的判断。"}, "context_id": "context:paragraph-discourse-audit-method-before-cases"}], "retry": {"boast-boost-distinction": [{"id": "r18t2-boast-possession", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 50, "target": "boast的拥有义与boost的提升义", "skill": "boast的拥有义与boost的提升义", "q": "A brochure says the museum \"boasts a rare textile archive\". A new grant will \"boost access\" by paying for longer opening hours. What is the distinction?", "o": ["The museum has a valued collection; the grant improves access.", "The museum increases the collection; the grant praises access.", "The museum brags about visitors; the grant stores their records.", "The museum sells its old textiles; the grant cuts their price."], "a": 0, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "手册说博物馆boasts珍贵纺织档案；新资助通过延长开放时间boost access。两词有什么区别？", "structure": "boasts后直接接具有吸引力的收藏，采用拥有义；boost支配access，表示提高可接近程度。", "other": "textile纺织品；archive档案；grant资助。", "meaning": "boast不仅有夸耀义，还可表示拥有值得自豪之物；它仍不能泛译为增加。boost表示改善或提升。", "rest": "increases...praises把拥有与提升两种语义互换；brags about visitors改了原宾语；sells...cuts their price添加文中没有的出售和降价。"}, "context_id": "museum-prized-collection-possession-versus-expanded-access"}, {"id": "r18t2-associated-toast", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "未确认形近词联想：按语境区分", "skill": "未确认形近词联想：按语境区分", "q": "At a café, a faster oven is expected to ___ service. At dinner, the owner raises a glass for a ___ to the kitchen team. Which pair fits both sentences?", "o": ["boast / roast", "toast / boast", "roast / boost", "boost / toast"], "a": 3, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "咖啡馆的新烤箱预计能改善服务；晚餐时店主举杯向厨房团队祝酒。哪组词分别合适？", "structure": "第一个空格是支配service的动词，要求提升；a后接名词，raises a glass提供祝酒语境。", "other": "oven烤箱；raise a glass举杯。", "meaning": "boost可改善服务，a toast是祝酒。roast/toast在此作为教学辨析候选，不能据本题反推用户当时回忆的究竟是哪一个。", "rest": "boast不能表达提高服务；roast表示烤制，不等于提高；toast放在service前也不能表达改善。形近不代表能共享句法宾语。"}, "context_id": "cafe-service-improvement-and-dinner-glass-toast"}, {"id": "r18t2-beefup-sharpen", "family": "boast-boost-distinction", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "beef up / sharpen skills搭配", "skill": "beef up / sharpen skills搭配", "q": "A museum adds guards to beef up security. Its guides practise listening exercises to sharpen their skills. Which pair preserves the two meanings?", "o": ["Praise protection / announce new skills", "Strengthen protection / improve skills", "Define protection / share past skills", "Remove protection / limit new skills"], "a": 1, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "博物馆增加安保人员以加强保卫；讲解员做听力练习以磨炼技能。哪组含义正确？", "structure": "adds guards为beef up的增强义提供动作证据；practise...to sharpen说明练习用于提高技能。", "other": "guard安保人员；security保卫；listening exercise听力练习。", "meaning": "beef up与sharpen skills可在增强能力这一语境近义；不把beef或sharpen一律按食物或磨刀直译。", "rest": "Praise/announce只是称赞或宣布；Define/share只是定义或分享；Remove/limit反转了增强方向。"}, "context_id": "museum-security-strengthening-and-guide-skill-practice"}], "with": [{"id": "with-bread-cooling", "family": "with", "introduced": null, "budget": 60, "target": "with + 名词 + 分词", "skill": "with + 名词 + 后置成分", "q": "The bakery opened at six, with warm bread cooling on the counter.\nwith 后面的结构主要起什么作用？", "o": ["补充开门时伴随的状态", "引出老板的直接引语", "说明开门的唯一目的", "充当opened的直接宾语"], "a": 0, "exp": {"trans": "面包店六点开门，当时温热的面包正在柜台上晾凉。", "structure": "主干：The bakery（主语）+ opened（不及物谓语）+ at six（时间状语）。原始简单句Warm bread was cooling on the counter → 去掉was，用with引出：with warm bread cooling on the counter。warm bread是with结构的逻辑主语，cooling是与之构成主动关系的现在分词。", "other": "bakery 面包店；cool 晾凉、变凉；counter 柜台；warm 温热的。", "meaning": "with复合结构可以补充主句发生时的伴随状态；它不是新的独立主句。", "rest": "直接引语通常由say等动词引出，此处没有任何说话行为。目的常用to do或in order to，原句只描写伴随状态。opened在本句是不及物用法，with短语不是其直接宾语。"}, "context_id": "with-simultaneous-ing"}, {"id": "with-lights-dimming", "family": "with", "introduced": null, "target": "with + 名词 + 后置成分", "skill": "with + 名词 + 后置修饰", "q": "The audience waited quietly, with the lights gradually dimming before the film began. The with-structure mainly:", "o": ["adds a simultaneous background state", "states the purpose of waiting", "introduces an independent main clause", "means the audience waited together with the lights"], "a": 0, "budget": 55, "exp": {"trans": "观众安静地等待着，电影开始前，灯光正逐渐变暗。", "structure": "主干：The audience（主语）+ waited（谓语）+ quietly（状语）。原始简单句：The lights were gradually dimming before the film began. → 去掉were，用with引出：with the lights gradually dimming...。the lights是with结构的逻辑主语，dimming与lights构成主动关系。", "other": "audience 观众；gradually 逐渐地；dim 变暗；before the film began 电影开始前。", "meaning": "with + 名词 + 后置成分可补充主句发生 rganize which players rehearse in each room and slot."], "a": 3, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "指挥把乐手可到场的时间写在卡片上，放入房间与时间表以避免排练冲突；乐手在另一个会议上建议新曲目。卡片发挥什么作用？", "structure": "marks...places...to prevent给出动作与目的链；at a separate meeting把提出曲目的行为放在另一个活动中。", "other": "availability可到场情况；clash冲突；repertoire曲目。", "meaning": "卡片用于人员、地点与时间的安排；讨论曲目不因文中同时出现音乐相关词就成为卡片的功能。", "rest": "sharing opinions与debate改成讨论行为；record which new pieces误把时间可用性换成曲目偏好，均改变了动作对象。"}, "context_id": "rehearsal-availability-grid-versus-repertoire-meeting"}, {"id": "r18t2-role-route-evidence", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "改选证据强度：语义证据优于词面重合", "skill": "改选证据强度：语义证据优于词面重合", "q": "An orienteering club gives walkers a \"route card\" on which they mark completed checkpoints. At meetings, members exchange views about route difficulty. A reader first selects \"recording progress\", then prefers \"exchanging views on route cards\" for its repeated words. Which detail should control the choice?", "o": ["Walkers put checkpoint marks on their cards during the walk.", "The meetings discuss routes using a closely related noun.", "The two answer choices contain similar numbers of words.", "The later answer came to mind after reading the text again."], "a": 0, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "定向活动给行走者卡片，用来标记已通过的检查点；会议另讨论路线难度。读者因重复词而想把记录进度改成交流路线卡观点。应以哪条细节判断？", "structure": "on which引出卡片上的具体动作；at meetings转入另一场合。要核对谁在何处对什么做了什么，而非只看route重复。", "other": "orienteering定向活动；checkpoint检查点；progress进度。", "meaning": "检查点标记直接支持记录完成进度；会议存在并不证明卡片是交换观点的讨论对象。初选受支持，是因为具体证据，不是因为它更早出现。", "rest": "closely related noun只证明词汇相关；numbers of words是形式线索；later...again只是判断发生得晚，都没有推翻卡片用于记录这一语义证据。"}, "context_id": "route-card-checkpoint-recording-versus-route-discussion-and-revision"}, {"id": "r18t2-role-justified-revision", "family": "semantic-action-roles", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 60, "target": "正确改选也要有正确理由", "skill": "正确改选也要有正确理由", "q": "A notice says a library is launching a \"lending circle\". A reader initially expects book loans. The full definition says the circle meets to debate borrowing rules and issues no books itself. Which response and reason are warranted?", "o": ["Revise, since later sentences always replace earlier ones.", "Keep, since a familiar word fixes the purpose on its own.", "Revise, since the full definition identifies rule discussion.", "Keep, since initial answers are generally more reliable."], "a": 2, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "图书馆推出lending circle，读者起初以为是借书活动；完整定义说明这是讨论借阅规则的小组，本身不发书。哪种处理及理由成立？", "structure": "The full definition明确限定名称指什么；issues no books排除把它理解为放贷或发书服务。", "other": "notice通知；issue在此为发出、提供；warranted有依据的。", "meaning": "新语义证据可推翻基于名称的初步理解。本题确实应改选；不能把此前一次正确改错总结成永远相信初选。", "rest": "later sentences always虽选了修改，却用了错误的普遍规则；familiar word与initial answers都让词面或时间顺序压过清楚定义。"}, "context_id": "library-discussion-circle-definition-legitimately-revises-name-based-guess"}], "belief-negation-clause": [{"id": "belief-negation-online-bookings-a", "family": "belief-negation-clause", "introduced": "2026-10-15", "published_on": "2026-10-15", "budget": 55, "target": "assume that ... did not / 被批评的信念", "skill": "宾语从句与否定范围", "q": "A restaurant owner rebuked an apprentice for assuming that the online booking page did not influence walk-in customers. Surveys showed that many visitors discovered the restaurant through the page. What did the apprentice mistakenly believe?", "o": ["The owner had avoided creating an online booking page.", "Walk-in customers were unaffected by the booking page.", "Customers preferred online orders to meals at the restaurant.", "The owner placed excessive importance on online advertising."], "a": 1, "exp": {"trans": "老板批评学徒，因为学徒以为网上订位页面不影响未经预约直接到店的人；调查却显示不少访客就是经此页面了解餐厅。", "structure": "rebuked an apprentice为主干，for assuming that...说明批评原因，that后的did not influence是学徒持有的错误判断。", "other": "rebuke 责备；apprentice 学徒；walk-in customer 无预约上门顾客；reservation 预约。", "meaning": "assume/imagine that表示以为、认为；否定词位于从句中，决定被批评的是低估作用而非对网络的痴迷。", "rest": "老板未建网页和顾客点餐偏好均无证据；把老板说成过分重视广告，也没有回答学徒错误地否认网页对临时到店顾客的影响。"}, "context_id": "context:belief-negation-online-bookings-a"}], "intimately-familiarity": [{"id": "r18t2-intimately-factory", "family": "intimately-familiarity", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "intimately familiar with：贴近与细节", "skill": "intimately familiar with：贴近与细节", "q": "Rather than relying on annual summaries, a designer spends weeks beside the workers and becomes intimately familiar with each production stage. What is emphasized?", "o": ["The designer has developed private friendships with everyone.", "The designer has learned every stage without spending time.", "The designer has gained close and detailed process knowledge.", "The designer has stayed remote from the work being described."], "a": 2, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "设计师不只依赖年度总结，而是在工人身边观察数周，深入熟悉各个生产阶段。强调什么？", "structure": "Rather than构成间接概要与贴近观察的对比；familiar with后是生产阶段，不是私人交往。", "other": "production stage生产阶段；remote疏远的、远离的。", "meaning": "intimately familiar强调近距离、深入的了解；经历与细节是重点，不是保证所有人都成了朋友。", "rest": "private friendships偷换为人际关系；without spending time忽略数周投入；stayed remote与在工人身边相反。"}, "context_id": "designer-on-site-production-familiarity-versus-remote-summaries"}], "conscious-awareness": [{"id": "r18t2-conscious-choice", "family": "conscious-awareness", "introduced": "2026-11-15", "published_on": "2026-11-15", "budget": 45, "target": "conscious choice与conscious of的搭配区别", "skill": "conscious choice与conscious of的搭配区别", "q": "A shopper makes a conscious choice to repair a bag after comparing costs and waste. The choice was considered in advance. What does conscious mean here?", "o": ["Deliberate and made with awareness of the alternatives.", "Accidental and made without noticing any alternatives.", "Made instantly, with no comparison of possible options.", "Evidence that the bag was selected by another person."], "a": 0, "origin_session": "2026-11-15-2018-text2", "exp": {"trans": "购物者比较费用与废弃物后，有意识地选择修包，而且事先考虑过。这里conscious是什么意思？", "structure": "conscious修饰choice；considered in advance解释这是经过意识与考虑的选择。", "other": "alternative可选方案；deliberate有意的、经过考虑的。", "meaning": "conscious随搭配可指意识到或有意识、刻意的；conscious choice不同于be conscious of，但都不应机械译为清醒着。", "rest": "accidental与有意识的考虑相反；instantly...no comparison忽略事先比较；another person把选择主体换成他人，均未保留经过考虑的选择。"}, "context_id": "shopper-deliberate-repair-choice-versus-accident-and-wakefulness"}], "paragraph-order-discourse": [{"id": "paragraph-order-discourse-parallel-a", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "Not surprisingly / Equally unsurprisingly", "skill": "排序题并列递进标记", "budget": 50, "q": "段落甲结尾：Not surprisingly, nearly half of the applicants withdraw before the final interview.\n下面哪个段首与它的衔接最强？", "o": ["Equally unsurprisingly, few of the remaining applicants receive an offer.", "By contrast, the final interviews take place in the company's new building.", "For example, managers from several departments attend the final interview.", "In conclusion, a final interview is unnecessary for applicants who remain."], "a": 0, "exp": {"trans": "甲段说“不出所料，近一半申请者在终面前退出”。最强衔接是：“同样不足为奇的是，留下的人中也只有很少一部分收到录用。”", "structure": "Not surprisingly先给出一个“并不意外”的结果；Equally unsurprisingly显式要求前面已经有一个同类判断，再补第二个并列结果。两个副词短语构成明显篇章钩子。", "other": "withdraw 退出；final interview 终面；a small share 少部分；receive an offer 获得录用。", "meaning": "Equally / similarly / also 等段首词常要求前文存在可并列对象。排序题中这种平行措辞比泛泛的主题相似更可靠。", "rest": "换到面试地点没有形成真正对立；经理参会不是申请者退出的例子；也不能从退出比例推出剩余申请者无需面试。平行标记与申请者筛选链共同支持承接。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-parallel-a"}, {"id": "paragraph-order-discourse-conclusion-b", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "target": "concludes / 收束段识别", "skill": "排序题结论信号", "budget": 50, "q": "一篇先分析家电过早报废、后提出改进办法的文章，有一候选段写道：After examining the figures, Dr Patel sums up her proposal: shared repair services could help residents keep appliances longer. 段末又说：Whether enough households will join, however, remains an open question.\n这一段最适合放在哪里？", "o": ["全文开头，用来首次介绍Dr Patel", "问题分析展开之前", "全文结尾附近，作为总结和改革建议", "只能放在具体数据段之前"], "a": 2, "exp": {"trans": "考察数据后，Patel博士总结自己的建议：共享维修服务或许能让居民更长久地使用电器。但是否有足够多家庭参与，仍是未决问题。这段最适合放在结尾附近。", "structure": "After examining the figures回看前文数据；Dr Patel + sums up + her proposal明确给出总结动作。末句Whether...will join作主语，remains...为谓语部分，以未决问题收束。", "other": "sum up 总结；shared repair service 共享维修服务；appliance 家电；household 家庭；open question 未决问题。", "meaning": "总结建议与回顾数据、开放结尾合起来支持尾段位置；单独出现concludes或sum up并不能证明必为全文最后一段。", "rest": "首次介绍人物不能解释已分析过数据；在问题分析前放总结建议与给定结构不合；“只能放在数据段之前”更与After examining the figures相反。"}, "source_exam": "2011-english1", "source_part": "Part B", "context_id": "context:paragraph-order-discourse-conclusion-b"}, {"id": "paragraph-discourse-ticket-deposits", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-10-05", "budget": 50, "target": "段尾问题 / 原因解释", "skill": "排序题并列递进标记", "q": "前段：The theatre sold every seat at the advertised price. Yet the deposits in its bank account were smaller than the value of tickets sold. The manager began tracing the gap between bookings and payments.\n哪个后段最能推进这一问题？", "o": ["Audience surveys ranked music above scenery when asking about favourite parts of the performance.", "The booking agency deducted its service fees before forwarding the remaining money to the theatre.", "The theatre had used the same stage for years, although its audience changed with each production.", "Rehearsals ended later than planned, so actors sometimes travelled home together."], "a": 1, "exp": {"trans": "剧院按宣传价卖出了所有座位，但银行入账小于售票总额。经理追查订票与收到款项之间的差额。订票代理转款之前先扣除服务费，最直接解释这个差额。", "structure": "The theatre + sold + every seat。deposits + were smaller than + the value of tickets sold是金额比较。正确后段中The booking agency + deducted + service fees；before forwarding说明扣款发生在剧院收到钱之前。", "other": "deposit 入账款；advertised price 宣传价格；deduct 扣除；forward money 转款。", "meaning": "没有One reason或Equally等显眼连接词，也能由段尾的收款差额锁定后段的扣费机制。这是问题→原因，不是看见theatre或audience就接同主题段。证据来自金额和交易阶段，不是一个单词。", "rest": "Audience surveys解释演出偏好，未说明钱款差额；same stage介绍场地历史，未接收款链；rehearsals和共同回家是演出活动信息，不解释代理转款前少了什么。"}, "context_id": "context:paragraph-discourse-ticket-deposits"}, {"id": "sentence-link-course-participation-a", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 60, "target": "表面便利 vs 参与不足", "skill": "讽刺语气 + 对比过渡", "q": "前文：The online course called itself interactive, but students could do little more than click Next after each recorded lecture. The easiest part was operating the screen; the hardest was staying awake.\n【空缺】\n后文：What would genuine participation require? Students could challenge arguments and revise one another's work.\n哪句最适合？", "o": ["The simple controls already give learners an active role in shaping the course.", "A redesign could replace passive viewing with a real role in shaping discussion.", "Recorded lectures also let learners choose when to watch the same presentation.", "Adding subtitles would make the recorded lectures easier for learners to follow."], "a": 1, "exp": {"trans": "前文用带讽刺性的说法指出所谓互动课仍只让学生被动点下一页；正确句转向让学生真正贡献观点的另一种课程；后文追问真正参与需要什么。", "structure": "but建立宣称interactive与实际只能click Next的矛盾；the hardest was staying awake暗示被动乏味。正确句用replace passive viewing with a real role in shaping discussion提出另一模式，后文再具体说明质疑论点与互相修改。", "other": "interactive 互动的；lecture 讲座/课；challenge an argument 质疑论点；revise 修订。", "meaning": "看到操作很简单，不能自动判为作者赞扬。应结合转折、夸张和后文提问判断作者真正评价：被动消费不足，主动参与才是重点。", "rest": "操作简单不等于能参与建构讨论；自选观看时间和字幕提升观看便利，却没有补上后文要求的质疑论点、互评修改等主动参与。"}, "context_id": "context:sentence-link-course-participation-a"}, {"id": "sentence-link-museum-experiment-b", "family": "paragraph-order-discourse", "introduced": "2026-10-12", "published_on": "2026-10-12", "budget": 65, "target": "单向展示→反向参与→后文设问", "skill": "双向篇章钩子", "q": "前文：At the old science museum, visitors watched a machine demonstrate each experiment. The most demanding thing they could do was press the Start button.\n【空缺】\n后文：What counts as taking part in an experiment? Visitors must be able to change a variable and compare the results.\n哪一句最适合？", "o": ["Repairs to the building could give the passive displays a more attractive setting.", "Simpler controls could help more visitors watch the same machine demonstrations.", "More detailed labels could explain the inventors behind the museum's machines.", "A redesign could replace watching demonstrations with carrying out one's own tests."], "a": 3, "exp": {"trans": "旧科技馆由机器单向演示，观众几乎只能按开始按钮。正确句引出新展览如何扭转这种被动观看，让观众亲自试验；后文再问什么才是真正参与实验。", "structure": "前文visitors watched与could do ... press Start显示参与程度低；正确句replace watching demonstrations with carrying out one’s own tests对比观看与亲自实验，后文change a variable和compare the results说明这种参与如何实现。", "other": "demanding 费力的；demonstration 演示；variable 变量；carry out a test 进行试验。", "meaning": "最有力的证据是双向：反转被动的安排承接前文，主动测试又引出后文讨论。‘最难任务只是按按钮’在语境中揭示参与不足，不是对设备的夸赞。", "rest": "场馆外观、观看操作和发明者标签仍把参观者放在观看或接收信息的位置；只有亲自测试自然引出后文改变变量、比较结果的参与标准。"}, "context_id": "context:sentence-link-museum-experiment-b"}, {"id": "pb13-library-joint-grants-a", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-library-joint-grants-a", "target": "new funding mechanism / That consequence / topical two-group distractor", "skill": "制度改革先说明执行机制，再由That引出合作结果", "q": "A public library will stop funding children's and adult literacy programs through entirely separate budgets. Officials stress that the reform should strengthen both. [BLANK] That should produce more projects serving whole families, rather than two unrelated groups. Which fits?", "o": ["The new process will require both programs to design projects together.", "Regional libraries have published more reports about literacy this year.", "Some employees focus on adult readers, while others teach children.", "The board will create separate committees for each age group."], "a": 0, "exp": {"trans": "图书馆计划取消儿童和成人识字项目完全分立的预算。改革目标是同时加强两者。随后要解释两项目如何一起设计方案，这才能使服务整个家庭的合作项目增加。", "structure": "That回指空格中描述的具体做法；new process...design projects together才会自然导致projects serving whole families。两个研究群体的存在是话题背景，不是合作机制。", "other": "literacy 读写能力；entirely separate 完全分开的；joint project 联合项目；committee 委员会。", "meaning": "topic match≠discourse link：后句That should produce...是结果句，前句需要明确的行动或机制。如果只描述两个群体，读起来相关却没有形成因果链。", "rest": "发表报告不一定促进合作；成人/儿童分工只描述现状；继续成立独立委员会甚至背离整合改革的目标。"}}, {"id": "pb13-museum-team-proposals-b", "family": "paragraph-order-discourse", "introduced": "2026-10-19", "published_on": "2026-10-19", "budget": 60, "context_id": "context:pb13-museum-team-proposals-b", "target": "policy integration / mechanism / This change consequence", "skill": "空前改革目标与空后合作效果需要中间实施步骤", "q": "A museum plans to replace isolated conservation and education grants with a shared application process. Its directors say neither department will lose support. [BLANK] This change could generate exhibitions linking research and visitor experience. Which fits?", "o": ["The museum has recently seen a sharp increase in visitor attendance.", "Staff will evaluate proposals jointly and choose teams to collaborate.", "The departments have long published very different research reports.", "The museum will divide each grant into two fixed independent parts."], "a": 1, "exp": {"trans": "博物馆将把保护和教育研究的独立资助改成联合申请。管理层说两部门都不会失去支持。空格要解释联合评审并选择合作团队，才能顺接‘这一变化会产生连接研究与观众体验的展览’。", "structure": "空格前提供改革背景和意图；This change could generate...给出预期效果。中间需要能产生该效果的具体协作措施，而非笼统主题描述。", "other": "conservation 保护、文物修复；grant 资助；jointly 联合地；exhibition 展览。", "meaning": "要核实桥接是否构成‘政策→机制→结果’链条，不能因选项也谈博物馆或部门就草率接受。", "rest": "游客增加和以往报告差异只是主题信息；再把资金硬分成两部分反而违背联合申请改革。"}}, {"id": "pb17-seed-label-link", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "同关键词不等于篇章连接", "skill": "同关键词不等于篇章连接", "q": "Paragraph P: The seed collection has two packets called \"winter bean\". Records show that they came from different valleys and need different storage temperatures. Which paragraph should follow to address the problem just identified?", "o": ["Winter beans also appear in recipes collected from cooks.", "Each packet will keep its local name plus a unique code.", "The collection began when a gardener donated bean seeds.", "Beans become tender when heated for a sufficient period."], "a": 1, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "两个同名种子包来自不同山谷、需不同储温。哪段最适合接着解决刚提出的问题？", "structure": "two packets called同名与different来源/条件共同制造识别风险；后段需同时保留本地名和区分身份。", "other": "packet小包；storage储存；unique code唯一编码。", "meaning": "主题词bean重复不足以证明相邻；唯一编码回应同名异物的具体关系。", "rest": "recipes转到烹饪；collection began倒退背景；tender讨论烹煮，都没有处理同名种子识别问题。"}, "context_id": "seed-vault-homonymous-labels-require-identity-not-shared-theme"}, {"id": "pb17-chorus-relations", "family": "paragraph-order-discourse", "introduced": "2026-10-04", "published_on": "2026-11-12", "budget": 60, "target": "并列与递进的段落功能", "skill": "并列与递进的段落功能", "q": "P: Singers can practise difficult rhythms by clapping. Q: They can also hum the melody without words to check pitch. R: A rehearsal combines both exercises before restoring the lyrics. Which account of the paragraph roles is accurate?", "o": ["P and Q are rival results; R rejects both as unsuccessful.", "P explains a failure; Q supplies its cause; R changes topic.", "P and Q offer parallel methods; R combines their use.", "P is a conclusion; Q gives its premise; R introduces P."], "a": 2, "origin_session": "2026-11-12-2017-partb", "exp": {"trans": "P拍手练节奏，Q哼唱检查音高，R把两项合并排练再恢复歌词。段落作用是什么？", "structure": "also标出另一方法；both回收前两种练习；combines才是从方法列举转向组合应用的推进。", "other": "hum哼唱；pitch音高；lyrics歌词。", "meaning": "P/Q并列
